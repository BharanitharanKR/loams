[package]
name = "loams-meter"
description = "Loams Cloud's node metering agent (docs/platform/design/01-metering-and-billing.md): cgroup v2 meters, tenant resolution, a durable spool and the _meter stream sink."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "loams-meter"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["env"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# RFC 3339 windows in the CloudEvents envelope (PD2).
time = { workspace = true, features = ["serde"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
httpmock.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# The `platform/` workspace: the code imported from the former private
# ostrium-labs/loams-platform repository on 2026-10-19 (owner: "pull all code
# in loam-platform to the OSS repo"), starting with `loams-meter`, the node
# metering agent (docs/platform/design/01-metering-and-billing.md). It is
# separate from the engine workspace at the repository root, as `fabric/` is:
# its dependency set (reqwest 0.12, base64 0.22) predates the root's. Design 63
# (Loams Meter, D1135) moves the agent to crates/loams-meter-agent in the root
# workspace and removes this workspace (plan ME1, Task 0b).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["The Loams Authors"]
publish = false

# Versions followed the engine workspace's when the repository was split out
# (2026-09-29); engine crates, if needed, come in as path dependencies on
# ../crates.
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
httpmock = { version = "0.8.3", default-features = false, features = ["remote"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["std", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.dev]
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# cargo-deny policy for the `platform/` workspace. The licence allow-list is
# the root deny.toml's (CONTRIBUTING.md "Dependency licenses"); the root's
# advisory ignores, git sources and engine-specific notes are left out because
# nothing here reaches them. Keep the allow-list in step with the root.
[graph]
all-features = true

[licenses]
# Permissive licenses only. AGPL/GPL/LGPL/BUSL-1.1/SSPL/ELv2 and proprietary licenses are not allowed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # Boost Software License 1.0 (xxhash-rust), not the Business Source License
    "BSL-1.0",
    "bzip2-1.0.6",
    "0BSD",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# stringmetrics (via httpmock, dev tooling in loams-meter's tests) states its
# license only as a LICENSE file: Apache-2.0.
[[licenses.clarify]]
crate = "stringmetrics"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0fb72a18 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Only fail on unmaintained crates we depend on directly; transitive ones are tracked upstream.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

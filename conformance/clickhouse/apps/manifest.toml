images = ["docker.io/clickhouse/clickstack-otel-collector:2.40.0@sha256:0e7dc29f8f6074afd106b96d53e5b98f1150e8882d926a20c03c6f680bd929ec"]
licence = "MIT"
clickhouse_protocol = "http"
migrations_protocol = "native"
clickhouse_min = "26.8"
driver = "hyperdx/driver.sh"
suite = ""
runtime_minutes = 10

[[app]]
# OpenLIT (Q1185's "one more" in place of PostHog, ruling R5.1): LLM

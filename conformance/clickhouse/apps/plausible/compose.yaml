# HE0 (plan HE1 Task 5): Plausible Community Edition v3.2.1 (AGPL-3.0),
# unmodified containers only: never vendored, linked or redistributed
# (§75 §18). Its clickhouse-server is the pinned oracle with query_log and
# part_log on (Plausible CE's own logs.xml turns them off). Driven by
# scripts/house/apps.sh plausible up|drive|dump|down. Every image is pinned
# by digest; host ports bind to 127.0.0.1.
name: he0-plausible

services:
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1@sha256:33e60bfb40f2df5da00f8753b76fad04f67dba3abe6d73eb516e440e3fb62985
    labels: { io.loams.licence: "AGPL-3.0-only" }
    # The command Plausible CE's compose runs: create, migrate, run.
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    # Postgres's first start restarts the server once after initdb, which can
    # break createdb; Plausible CE's compose restarts it the same way.
    restart: on-failure
    environment:
      TMPDIR: /var/lib/plausible/tmp
      BASE_URL: http://127.0.0.1:${HE0_PLAUSIBLE_PORT:-3400}
      SECRET_KEY_BASE: he0-not-a-secret-he0-not-a-secret-he0-not-a-secret-he0-not-a-secret
      TOTP_VAULT_KEY: aGUwLW5vdC1hLXNlY3JldC1oZTAtbm90LWEtc2VjcmU=
      HTTP_PORT: "8000"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/plausible_db
      CLICKHOUSE_DATABASE_URL: http://clickhouse:8123/plausible_events_db
      DISABLE_REGISTRATION: "false"
    ports: ["127.0.0.1:${HE0_PLAUSIBLE_PORT:-3400}:8000"]
    volumes: [plausible-data:/var/lib/plausible]
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  clickhouse:
    image: ${HE0_CLICKHOUSE_IMAGE:-docker.io/clickhouse/clickhouse-server:26.9.2.8@sha256:7b9a0b6e9ab7ef79db5c4f8a9808f880258704eb7b4af9309f9029c16e727a80}
    labels: { io.loams.licence: "Apache-2.0" }
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ../clickhouse/he0-logs.xml:/etc/clickhouse-server/config.d/he0-logs.xml:ro
      - ../clickhouse/he0-users.xml:/etc/clickhouse-server/users.d/he0-users.xml:ro
      - plausible-ch-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # Over HTTP /ping, which does not reach query_log.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  postgres:
    image: docker.io/library/postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    labels: { io.loams.licence: "PostgreSQL" }
    environment:
      POSTGRES_PASSWORD: postgres
    volumes: [plausible-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  plausible-data:
  plausible-ch-data:
  plausible-db-data:

# HE0 (plan HE1 Task 5): Umami 3.4.0 (MIT) with its optional ClickHouse store,
# unmodified containers only. Umami's image does not create its ClickHouse
# schema; its own test stack mounts db/clickhouse/schema.sql into the server's
# init directory. Here `umami-schema` fetches that file at the release's
# commit, checks its sha256 and hands it to the server through a volume, so no
# Umami source is committed. Driven by scripts/house/apps.sh umami
# up|drive|dump|down. Every image is pinned by digest; host ports bind to
# 127.0.0.1.
name: he0-umami

services:
  umami:
    image: ghcr.io/umami-software/umami:3.4.0@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    labels: { io.loams.licence: "MIT" }
    init: true
    environment:
      DATABASE_URL: postgresql://umami:umami@postgres:5432/umami
      CLICKHOUSE_URL: http://umami:umami@clickhouse:8123/umami
      APP_SECRET: he0-not-a-secret
      # The driver's user agent would be classified as a bot and dropped.
      DISABLE_BOT_CHECK: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    ports: ["127.0.0.1:${HE0_UMAMI_PORT:-3300}:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 90

  umami-schema:
    image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    labels: { io.loams.licence: "curl" }
    user: "0"
    # Public resolvers: a bridge network's resolver may not reach the host's
    # stub resolver (seen on podman with systemd-resolved).
    dns: ["1.1.1.1", "9.9.9.9"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        curl -fsSL -o /init/01-schema.sql \
          https://raw.githubusercontent.com/umami-software/umami/ec0ff50388c264ed8ce46f00967e92f7e71476ae/db/clickhouse/schema.sql
        echo "f7b54f5ab40ef50f4837627858264525b14d295543c8ba320e35fbb20d50d0d2  /init/01-schema.sql" | sha256sum -c -
        chmod 644 /init/01-schema.sql
    volumes: [umami-init:/init]

  clickhouse:
    image: ${HE0_CLICKHOUSE_IMAGE:-docker.io/clickhouse/clickhouse-server:26.9.2.8@sha256:7b9a0b6e9ab7ef79db5c4f8a9808f880258704eb7b4af9309f9029c16e727a80}
    labels: { io.loams.licence: "Apache-2.0" }
    environment:
      CLICKHOUSE_DB: umami
      CLICKHOUSE_USER: umami
      CLICKHOUSE_PASSWORD: umami
    volumes:
      - ../clickhouse/he0-logs.xml:/etc/clickhouse-server/config.d/he0-logs.xml:ro
      - ../clickhouse/he0-users.xml:/etc/clickhouse-server/users.d/he0-users.xml:ro
      - ./umami-merge-tree.xml:/etc/clickhouse-server/config.d/umami-merge-tree.xml:ro
      - umami-init:/docker-entrypoint-initdb.d:ro
      - umami-ch-data:/var/lib/clickhouse
    depends_on:
      umami-schema: { condition: service_completed_successfully }
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # Healthy once schema.sql is applied (session_link is its last table).
      # Tagged so the dump leaves the probe out.
      test:
        - CMD-SHELL
        - clickhouse-client --user umami --password umami --log_comment he0-harness --query "SELECT throwIf(count() = 0) FROM system.tables WHERE database = 'umami' AND name = 'session_link'"
      interval: 3s
      timeout: 5s
      retries: 60

  postgres:
    image: docker.io/library/postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    labels: { io.loams.licence: "PostgreSQL" }
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes: [umami-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  umami-init:
  umami-ch-data:
  umami-db-data:

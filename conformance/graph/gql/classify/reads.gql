#! engine=read
MATCH (n) RETURN n

#! engine=read
RETURN 1 AS one

#! engine=read
MATCH (a:Person)-[:KNOWS]->(b) RETURN a.name, b.name ORDER BY a.name LIMIT 5

#! engine=read
MATCH (n) RETURN count(n) AS c

#! engine=read
MATCH (n:Person) WHERE n.name = 'INSERT' RETURN n.name

#! engine=read
MATCH (n:Person) WHERE n.name = 'x' RETURN n.name AS `SET`

#! engine=read
/* INSERT (:X) */ MATCH (n) RETURN n

#! engine=read
-- DETACH DELETE n
MATCH (n) RETURN n

#! engine=read
MATCH (n) FILTER n.age > 3 RETURN n

#! engine=read
MATCH p = (a:Person)-[:KNOWS*1..3]->(b) RETURN p

#! engine=read
MATCH p = (a:Person)-[:KNOWS*1..10]->(b) RETURN p

#! engine=read
EXPLAIN MATCH (n) RETURN n

#! engine=write
CALL grafeo.pagerank()

#! engine=write
CALL grafeo.labels()

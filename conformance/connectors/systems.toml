# The real system behind every connector's suites (CN2 plan Task 6, owner
# ruling OR-2). `loams-flow-conformance` reads this file: a harness may only
# run against the services listed for its manifest, each service must be one
# of the manifest's `systems`, and a Loams module never stands in for an
# external system (it may appear only under `extra_targets`, tested after
# the real one, and never counted toward `preview`).
#
# Service kinds (`ServiceKind` in the kit):
#   container  a real system's image: a service of deploy/fabric/compose.yaml
#   emulator   the vendor's (or a widely used) emulator, also a compose service
#   fixture    exchanges recorded from the real system (`recorded_from`) under
#              conformance/connectors/fixtures/<id>/ by `FixtureProxy`
#   nightly    a real account, reached only by the scheduled
#              `connectors-nightly` job; `env` names its repository secrets
#
# Every P2 manifest has an entry (test `every_p2_preview_manifest_has_a_harness`).
# `family` is the crate `fabric/crates/loams-connector-<family>` (OR-6); `sdk`
# is the SDK's own codecs (Task 5) and `fallback` the OR-4 fallback runtimes
# (Task 22). `harness` is set by the family task that makes the manifest
# `preview`: the harness's Rust path inside that crate. The CN1 ★ manifests
# (P1) run on FL1's `connectors` profile and gain entries when Task 8 ports
# them onto the SDK.

[loams_modules]
systems = [
  "Loams collections (Elasticsearch API)",
  "Loams collections (Qdrant API)",
  "Loams House",
  "Loams Postgres",
  "Loams Fabric (Iggy)",
  "Grafeo",
]
compose_prefix = "loams-"


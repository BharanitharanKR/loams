# The loams.live.v1 protos (R1 plan Task 7), the app protos (design §37 §8,
# AP0) and the application packages of the unified Connect API (design §44
# §7, API1 Task 1, Task 2 and Task 3). `buf lint` runs the STANDARD rules. `buf
# breaking` is enforced for the app packages (CI job `app-protos`);
# loams.live.v1 is ignored, as breaking changes are not enforced in R1 (the
# API is unstable).
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  ignore_only:
    # Watch streams `Transition`, the protocol's unit (design §20 §7.1),
    # rather than a `WatchResponse` wrapper (plan row T7-4).
    #
    # `loams.collection.v1` is here for the same reason: `CreateCollection`
    # and `GetCollection` answer `CollectionInfo` and `Scan` answers
    # `ScanPlan` (design §44 §5.1), because a collection's own document is
    # the answer and `ListCollections` embeds the same `CollectionInfo`, so a
    # `…Response` wrapper would exist only to be unwrapped (API1 Task 2).
    RPC_RESPONSE_STANDARD_NAME:
      - proto/loams/live/v1/live.proto
      - proto/loams/collection/v1/collection.proto
      - proto/loams/collection/v1/document.proto
      # `loams.graph.v1` (GR1 Task 2, design §48 §8.2): CreateGraph, GetGraph
      # and UpdateGraph answer the graph's own `Graph`, GetEngineInfo answers
      # `EngineInfo`, GetSchema `GraphSchema` and Explain `Plan`; the four
      # slow RPCs answer `loams.operations.v1.Operation` and ExecuteStream
      # streams `ResultChunk`.
      - proto/loams/graph/v1/graph.proto
      # `loams.house.v1` (HS1 Task 8, design §49 §18.2): RestoreTable answers
      # `loams.operations.v1.Operation`, as the graph's slow RPCs do.
      - proto/loams/house/v1/house.proto
      # `loams.memory.v1` (MM1 Task 1, design §52 §9.1): the RPCs answer the
      # resource itself (`Store`, `Space`, `Fact`, `Entity`, `Episode`,
      # `Block`, `Profile`, `Erasure`), the slow ones
      # `loams.operations.v1.Operation`, and WatchSpace streams `SpaceEvent`,
      # as §9.1 writes them (MM1 ruling R1.3).
      - proto/loams/memory/v1/memory.proto
    # For the same reason: `CreateCollection` and `GetCollection` both answer
    # `CollectionInfo`, the collection's own document, and `ListCollections`
    # embeds it. A per-RPC response message would make every caller unwrap
    # (API1 Task 2).
    #
    # `document.proto` is here for the same reason one file over: it is the
    # other file of `loams.collection.v1`, so the ignore is per file rather
    # than per package. `DeleteByFilter` and `PatchByFilter` both answer
    # `FilterWriteResponse`, because every number in it is the same question
    # either way — how much the filter matched, how much this call wrote, and
    # the state it wrote at. Two per-RPC response messages would hold identical
    # fields and differ only in their names, and a caller branching on a partial
    # write would have to know which of the two it is reading (API1 Task 3).
    RPC_REQUEST_RESPONSE_UNIQUE:
      - proto/loams/collection/v1/collection.proto
      - proto/loams/collection/v1/document.proto
      # `loams.graph.v1`: `Graph` and `loams.operations.v1.Operation` each
      # answer several RPCs (see above, §48 §8.2).
      - proto/loams/graph/v1/graph.proto
      # `loams.house.v1`: `loams.operations.v1.Operation` answers RestoreTable
      # here and other packages' slow RPCs.
      - proto/loams/house/v1/house.proto
      # `loams.memory.v1`: `Store`, `Space`, `Fact` and `Operation` each answer
      # several RPCs (see above, §52 §9.1).
      - proto/loams/memory/v1/memory.proto
# `buf breaking` runs twice in CI (`app-protos`): against `main`, and against
# the previous release's tag (design §54 §13.2, D939). A package listed under
# `ignore` below is `unstable`. It leaves the list only by a deliberate change
# to this file, in its own pull request that names the package's GA; from then
# on it is additive-only, against both, and the supported SDKs keep every
# public symbol it had at the previous release
# (`sdks/fixtures/removed_symbols.py`).
breaking:
  use:
    - FILE
  ignore:
    - proto/loams/live
    # `loams.graph.v1` is `unstable: true` until GR1e (design §48 §8.1): the
    # SDKs and `buf breaking` treat it as experimental, and GR1 Task 39
    # removes this line when the package is frozen at GA.
    - proto/loams/graph
    # `loams.postgres.v1` is `unstable: true` until Loams Postgres GA (PG2
    # Task 1 ruling R1.6); PG2 Task 60 removes this line and the option.
    - proto/loams/postgres
    # `loams.house.v1` is `unstable: true` until HS1's GA (Task 38), which
    # removes this line; until then its fields are only added, never changed.
    - proto/loams/house
    # `loams.repos.v1` (Loams Git, GT1 Task 12) is `unstable: true` until GT1
    # GA, which removes this line and the option.
    - proto/loams/repos
    # `loams.agentd.v1` (Loams Studio, SD1 Task 4, design §53 §6.1) is
    # `unstable: true` until SD1 Task 32, which removes this line; until then
    # the daemon and its clients ship together.
    - proto/loams/agentd
    # `loams.memory.v1` (Loams Memory, MM1 Task 1, design §52 §9.1) is
    # `unstable: true` until MM1 Task 56, which removes this line and the
    # option.
    - proto/loams/memory

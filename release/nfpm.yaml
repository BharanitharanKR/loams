# nFPM configuration for the three Linux package formats Loams ships.
#
# One file, three formats: .deb (Debian, Ubuntu), .rpm (Fedora, RHEL, openSUSE)
# and .pkg.tar.zst (Arch, CachyOS). scripts/release/build-artifacts.py runs
# `nfpm package -p <format> -f release/nfpm.yaml` and injects the `deb.signature`
# and `rpm.signature` blocks itself, because signing is conditional on a key that
# does not exist yet. Do not put a signing key path in this file.
#
# `${...}` values come from the environment build-artifacts.py sets; see
# `ENVIRONMENT` in that script for what each one is. nfpm expands them itself, so
# this file stays the single place a packager field lives.
#
# Why nFPM and not cargo-dist: cargo-dist 0.33.0 (D292) builds archives, shell
# and PowerShell installers, npm, Homebrew and MSI, and nothing else -- its
# documented installer list has no deb, no rpm and no Arch package (D627). nFPM
# is the packager half of GoReleaser, is MIT licensed, ships as one static
# binary, and produces all three formats from this single file.
#
# The Arch package is the CachyOS package. CachyOS is Arch-based: it installs
# with `pacman` and reads `.pkg.tar.zst`. It has no use for an .rpm, and an .rpm
# offered to a CachyOS machine silently installs nothing.
name: loams
arch: ${LOAMS_PACKAGE_ARCH}
platform: ${LOAMS_PACKAGE_PLATFORM}
# The workspace version. `version_schema: semver` is what maps 0.1.0 onto
# rpm 0.1.0-1, deb 0.1.0 and Arch pkgver 0.1.0-1; `release` is the packaging
# revision, bumped only when the package itself changes and the version does not.
version: ${LOAMS_VERSION}
version_schema: semver
release: ${LOAMS_PACKAGE_RELEASE}
# No `epoch`, and no `mtime` placeholder: nFPM decodes both as typed values
# before it expands `${...}`, so a placeholder in either field fails the build.
# build-artifacts.py injects `mtime` as a literal timestamp taken from the
# release commit, never from the build machine's clock, which is what makes an
# unsigned package byte-identical across two builds of the same commit
# (verified 2026-10-04: identical sha256 for the .deb, .rpm and .pkg.tar.zst).
# A *signed* .deb is not byte-identical, because a GPG signature embeds its own
# creation time; only the _gpgorigin member differs. See
# docs/release/packaging.md#reproducibility.

section: database
priority: optional
vendor: ostrium-labs
maintainer: The Loams Authors <maintainers@loams.dev>
homepage: https://loams.dev
license: Apache-2.0
description: |
  The Loams server: the native HTTP API, the Qdrant and Elasticsearch gateways,
  and the dev, standalone, cluster, warm and durable commands.
  .
  This package installs the `loams` binary and `git-remote-loams` (git's
  remote helper for `loams::` URLs, so `git clone`, `fetch` and `push` reach a
  Loams Git repository on a bucket) under /usr/bin, the built web console under
  /usr/share/loams/console, and the systemd units loams.service and
  loams@.service.

# The shared library set of a x86_64-unknown-linux-gnu Rust binary. Verified
# 2026-10-04 with `readelf -d` on a `cargo build --release -p loams --bin loams`
# of this tree (rust-toolchain.toml, 1.97.1), whose DT_NEEDED entries are exactly:
#
#   libgcc_s.so.1  libc.so.6  libm.so.6  ld-linux-x86-64.so.2
#
# The server's reqwest is `default-features = false` (Cargo.toml), so it links no
# TLS or proxy library -- that is the reason the list this short.
#
# libm.so.6 is NOT declared separately, because every target's glibc package
# already ships it: `libc6` on Debian and Ubuntu (glibc has carried libm since
# 2.34), `glibc` on Fedora/RHEL/openSUSE, and `glibc` on Arch and CachyOS.
# Verified on Arch-family by `pacman -Qo /usr/lib/libm.so.6` -> "owned by glibc".
# There is no `libm` package on Debian to name, so declaring it would produce a
# dependency that does not exist.
depends:
  - libgcc-s1
  - libc6

# nFPM maps the same list onto each packager's own vocabulary:
#   deb        libgcc-s1, libc6                (already in that vocabulary)
#   rpm        gcc, glibc
#   archlinux  gcc-libs, glibc
# build-artifacts.py checks the mapping against the JSON schema nFPM ships, so a
# dependency renamed upstream fails the build rather than the install.

deb:
  # The archive inside the .deb. xz needs no extra package on any supported
  # Debian or Ubuntu, and dpkg has read xz since Debian 9.
  compression: xz

rpm:
  compression: xz
  group: Applications/Databases

archlinux:
  pkgbase: loams
  # Without this, `pacman -Si loams` reports "Packager: Unknown Packager".
  packager: The Loams Authors <maintainers@loams.dev>

contents:
  # The binary itself.
  - src: staging/usr/bin/loams
    dst: /usr/bin/loams
    file_info:
      mode: 0755

  # git's remote helper for `loams::<store-url>/ns/<ns>/repos/<repo>` URLs
  # (crates/loams-git-remote). git finds a helper by name on PATH, so it goes
  # next to `loams` in /usr/bin. Its DT_NEEDED set is the same four libraries
  # as the server's, so the `depends` list above covers it.
  - src: staging/usr/bin/git-remote-loams
    dst: /usr/bin/git-remote-loams
    file_info:
      mode: 0755

  # The built web console (web/apps/console/dist, the `pnpm build` output),
  # which the engine serves at /ui/ from here (from 0.1.2), same-origin with
  # its API: the assets the release built, byte for byte.
  - src: staging/usr/share/loams/console
    dst: /usr/share/loams/console
    file_info:
      mode: 0644

  # Licence and notices, where each packaging convention looks for them.
  - src: staging/usr/share/doc/loams/LICENSE
    dst: /usr/share/doc/loams/LICENSE
    file_info:
      mode: 0644
  - src: staging/usr/share/doc/loams/NOTICE
    dst: /usr/share/doc/loams/NOTICE
    file_info:
      mode: 0644
  - src: staging/usr/share/doc/loams/README.md
    dst: /usr/share/doc/loams/README.md
    file_info:
      mode: 0644

  # systemd units. /usr/lib/systemd/system is the location Debian, Ubuntu,
  # Fedora, RHEL, openSUSE, Arch and CachyOS all read (Arch and CachyOS also
  # read /etc, but a packaged unit belongs under /usr).
  - src: staging/usr/lib/systemd/system/loams.service
    dst: /usr/lib/systemd/system/loams.service
    file_info:
      mode: 0644
  - src: staging/usr/lib/systemd/system/loams@.service
    dst: /usr/lib/systemd/system/loams@.service
    file_info:
      mode: 0644
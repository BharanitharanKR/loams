# TypeScript for @loams/proto (design §37 §8.4, AP0 Task 6): protoc-gen-es v2
# writes the messages and service descriptors of the app packages, which
# @connectrpc/connect v2 turns into clients (`createClient(Service, t)`).
# Run `pnpm --filter @loams/proto generate` in web/ (it pins buf and the
# plugin); CI regenerates and fails on a diff. The generated code is
# committed. The Swift and Kotlin templates beside this file are run by
# ostrium-labs/loams-mobile against a pinned ref of this repository.
version: v2
inputs:
  - directory: proto
    paths:
      # protoc-gen-es emits an import for loams.options.v1 because
      # instance.proto now annotates its service with it, so the package has to
      # be generated whether or not a client ever sends one of its messages.
      - proto/loams/options/v1
      - proto/loams/instance/v1
      - proto/loams/devices/v1
      - proto/loams/approvals/v1
      - proto/loams/operations/v1
      - proto/loams/notifications/v1
      - proto/loams/errors/v1
      # Data Studio (AP1e): the collection data plane clients.
      - proto/loams/collection/v1
      # Loams Live (AP1e): the Live page's watch/query/mutate client.
      - proto/loams/live/v1
      # Loams Graph (GR1 Task 8): the Graph page's admin and GQL clients.
      - proto/loams/graph/v1
      - proto/loams/sql/v1
      - proto/loams/stream/v1
      # Loams House (HS1 Task 8): the Analytics page's client (§49 §18.3).
      - proto/loams/house/v1
      # The console API on Connect (API2 Tasks 6 and 7): sessions, setup and
      # consent, and the org, projects, agents, keys and audit that replace
      # api/console/openapi.json.
      - proto/loams/auth/v1
      - proto/loams/admin/v1
      # Loams Studio (SD1 Task 4, design §53 §6.1): the daemon's Connect
      # surface, read through connect-query over the agentd transport. It is
      # generated for the console only; no SDK lists it (Q816).
      - proto/loams/agentd/v1
plugins:
  - local: web/packages/proto/node_modules/.bin/protoc-gen-es
    out: web/packages/proto/src/gen
    include_imports: false
    opt:
      - target=ts
      - import_extension=js
clean: true

# The console's plugin catalog, the `oss` set (design §37 §5.3, §5.8; D423).
#
# cordis v4 loader entries: id, name, config, group, disabled, inject. Edition
# and bundle patch files (`- id:` replaces a row's config, `- insert:` adds
# rows) are applied after this file. No YAML tags (so no `!!js`): the loader
# refuses them.

# Core: the layout and router, typed Connect clients, the session.
- id: shell
  name: '@loams/plugin-shell'
- id: rpc
  name: '@loams/plugin-rpc'
- id: identity
  name: '@loams/plugin-identity'

# The console's own pages: sign-in, the org, its projects and agents, and the
# audit log, on loams.auth.v1 and loams.admin.v1 (API2 Task 10). Each injects
# the `rpc.*` clients it reads, so it appears only where the instance serves
# the package (AP1a Ruling 6).
- id: account
  name: '@loams/plugin-account'
- id: org
  name: '@loams/plugin-org'
- id: projects
  name: '@loams/plugin-projects'
- id: agents
  name: '@loams/plugin-agents'
- id: audit
  name: '@loams/plugin-audit'

# First-party pages.
- id: stack-status
  name: '@loams/plugin-stack-status'
- id: namespaces
  name: '@loams/plugin-namespaces'
- id: approvals
  name: '@loams/plugin-approvals'
  config:
    notify: false
- id: deployments
  name: '@loams/plugin-deployments'

# Loams Studio (design §53, SD1 Task 15): `modes: [studio]`, so it loads the first
# time Studio mode is entered. In a browser Studio stays behind the instance
# feature `studio` (start.ts) until SD1 Task 32; desktop.yml adds the bridge.
- id: studio
  name: '@loams/plugin-studio'
  inject: [router, slots, mode, platform, flags]

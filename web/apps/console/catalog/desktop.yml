# The desktop edition's catalog patch (AP1e), applied after base.yml by
# src/cordis/desktop.ts. Each desktop plugin task appends its own row here
# and its module to src/cordis/desktop.ts. Desktop plugins declare
# `editions: ['desktop']` and `inject: ['desktop']`, so a browser build never
# loads them.
#
- insert:
    - id: desktop-servers
      name: '@loams/plugin-desktop-servers'
    - id: data-studio
      name: '@loams/plugin-data-studio'
    - id: factory
      name: '@loams/plugin-factory'
    - id: durable
      name: '@loams/plugin-durable'
    - id: connectors
      name: '@loams/plugin-connectors'
    - id: graph
      name: '@loams/plugin-graph'
    - id: jobs
      name: '@loams/plugin-jobs'
    - id: house
      name: '@loams/plugin-house'
    - id: streams
      name: '@loams/plugin-streams'
    - id: overview
      name: '@loams/plugin-overview'
    - id: desktop-settings
      name: '@loams/plugin-desktop-settings'
    - id: live
      name: '@loams/plugin-live'
    - id: agent
      name: '@loams/plugin-agent'
    - id: postgres
      name: '@loams/plugin-postgres'
    - id: wesql
      name: '@loams/plugin-wesql'
    - id: sql
      name: '@loams/plugin-sql'
    - id: desktop-agentd
      name: '@loams/plugin-desktop-agentd'

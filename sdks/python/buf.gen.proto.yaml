# The Python stubs for the `loams` PyPI package (design §44 §9 row 2, §10.1
# point 2): two remote plugins, both pinned to an exact version.
#
# The pins live here rather than in a dependency manifest because these are
# protoc plugins executed by the BSR, not libraries the package imports. The
# matching runtime pins are in `sdks/templates/python/template.env`, and
# `scripts/sdk/check-pins.sh` fails if a version here moves without the lock
# moving with it.
#
# Python's generated code is **not committed** (§44 §10.1 point 3: PyPI builds
# it into the package), so nothing in CI diffs this directory;
# `scripts/sdk/drift.sh` regenerates into a scratch directory and checks the
# facade instead. The Go mirror is the one that commits generated code.
#
# buf remote plugins on buf.build are rate-limited without a token, so a
# transient BSR failure does not fail the job — the same call AP0 made for the
# Swift and Kotlin templates (its ruling E7).
#
# **Order matters.** This template's `out` is `sdks/python/src`, which is the
# `loams` package root, so `clean: true` also removes `loams/_gen` where
# `buf.gen.yaml` writes the facade. `scripts/sdk/gen.sh python` therefore runs
# this template first and the facade second; CI's drift check goes through the
# same script. Running this template on its own deletes the facade, which is
# visible in `git status` and regenerated by the next `gen.sh`.
version: v2
inputs:
  - directory: proto
    paths:
      # loams/options/v1 because every annotated service references it, and
      # protoc-gen-python writes an import for whatever a descriptor references.
      - proto/loams/options/v1
      - proto/loams/errors/v1
      - proto/loams/instance/v1
      - proto/loams/devices/v1
      - proto/loams/approvals/v1
      - proto/loams/operations/v1
      - proto/loams/notifications/v1
      - proto/loams/live/v1
      # The console API (API2 Tasks 6 and 7), which the facade's `loams.auth`
      # and `loams.admin.*` modules bind.
      - proto/loams/auth/v1
      - proto/loams/admin/v1
      # The app data planes (SDKP): the builders decode into these messages
      # today, and the `namespaces`, `collections`, `documents`, `search`,
      # `vector` and `graph` modules bind them once P0a annotates them.
      - proto/loams/collection/v1
      - proto/loams/graph/v1
      # SDKP Part C: the `sql` and `streams` modules.
      - proto/loams/sql/v1
      - proto/loams/stream/v1
plugins:
  # `protoc --python_out`: the messages and service descriptors. It writes
  # `loams/<package path>/<file>_pb2.py`.
  - remote: buf.build/protocolbuffers/python:v35.0
    out: sdks/python/src
  # `protoc --connectrpc_out`: the Connect clients and server base classes.
  # connectrpc/connect-py 0.12.1, Apache-2.0. The distribution is
  # `protoc-gen-connectrpc`; the PyPI *runtime* package is `connectrpc` (named
  # `connect-python` up to 0.9.0) — see the ruling in
  # docs/plans/2026-10-02-sdk1-generation-pipeline.md. The BSR plugin moved with
  # the rename: `buf.build/connectrpc/python` stops at v0.10.1 and v0.11.0 on is
  # `buf.build/connectrpc/py`.
  #
  # **`protobuf=google` is load-bearing, and was found by running both plugins.**
  # connectrpc's generator defaults to `protobuf-py`, its own pure-Python
  # protobuf runtime, and then imports `from . import instance_pb` — the `*_pb.py`
  # naming of the legacy `protoc-gen-py`. `protoc-gen-python` writes
  # `*_pb2.py`, so the default pairing does not compose: the generated client
  # imports a module that does not exist. With `protobuf=google` the generator
  # emits `from .instance_pb2 import ...` and routes its codecs through
  # `connectrpc.compat.google_protobuf_codecs`, which is what pairs with the
  # maintained `protobuf` distribution. Verified by running both plugins over
  # `proto/` and importing the result against connectrpc 0.12.1 and protobuf
  # 7.36.2.
  - remote: buf.build/connectrpc/py:v0.12.1
    out: sdks/python/src
    opt:
      - protobuf=google
# NOT `clean: true`. This template's `out` is `sdks/python/src`, which also
# holds the hand-written runtime (`loams.py`, `aio.py`, `runtime/*.py` and the
# package `__init__.py` files). buf's `clean: true` empties the entire `out`
# directory, so it deleted hand-written code on every run. `sdks/rust/
# buf.gen.yaml` and `sdks/go/buf.gen.go.yaml` already use `clean: false`.
clean: false
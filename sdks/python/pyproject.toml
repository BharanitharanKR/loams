[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "loams"
version = "0.1.0"
description = "The Loams SDK for Python: one Loams object with namespaced modules over the unified Connect API, generated from proto/."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ostrium Labs" }]
keywords = ["loams", "connect", "grpc", "sdk", "vector", "database"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "connectrpc==0.12.1",
  "protobuf==7.36.2",
]

[project.optional-dependencies]
# Design §44 §7.5: bulk ingest and bulk results go over Arrow Flight SQL through
# ADBC, so the extra pulls the driver. The extras are declared now and the code
# that uses them lands with the write RPCs (API1 Tasks 3 and 4); see README.md
# "What is not here yet".
flight = ["adbc-driver-flightsql>=1.0.0"]
arrow = ["pyarrow>=17.0.0"]
polars = ["polars>=1.0.0"]

[project.urls]
Homepage = "https://loams.dev"
Repository = "https://github.com/ostrium-labs/loams"
Issues = "https://github.com/ostrium-labs/loams/issues"
"SDK plan" = "https://github.com/ostrium-labs/loams/blob/dev/docs/plans/2026-10-02-sdk2-languages.md"

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==9.0.3",
  # 1.2.0 caps pytest at <9, so it cannot resolve alongside the bump above;
  # 1.4.0 is the first release that accepts pytest 9.
  "pytest-asyncio==1.4.0",
  # The stubs are generated by protoc; grpcio-tools pins the protoc that CI uses
  # so a regeneration is a dependency bump rather than whatever is on PATH.
  "grpcio-tools==1.84.0",
  # The generator behind `buf.build/connectrpc/py:v0.12.1` (scripts/sdk/pins.lock),
  # pinned to the same release so the plugin can also be run locally.
  "protoc-gen-connectrpc==0.12.1",
  # Stubs for the protobuf runtime: mypy --strict rejects google.protobuf without
  # them, and connectrpc returns protobuf messages from every generated stub.
  "types-protobuf",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loams"]

[tool.hatch.build.targets.sdist]
include = ["src/loams", "tests", "tools", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/loams", "tests", "examples", "tools"]
mypy_path = "src"

# The generated protobuf stubs are protoc's output verbatim. They carry no
# annotations of their own beyond the `.pyi` protoc ships alongside them, which
# is where the types come from; `disallow_untyped_defs` cannot apply to them
# because they have no defs to annotate. Excluding the directory keeps
# `--strict` honest about the code this SDK owns rather than silencing it.
[[tool.mypy.overrides]]
module = [
  "loams.admin.*",
  "loams.approvals.*",
  "loams.auth.*",
  "loams.devices.*",
  "loams.errors.*",
  "loams.instance.*",
  "loams.live.*",
  "loams.notifications.*",
  "loams.operations.*",
  "loams.options.*",
]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

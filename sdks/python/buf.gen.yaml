# The Python SDK facade of design §44 §7.3 (D606): protoc-gen-loams-facade
# reads the `loams.options.v1` annotations off the descriptors and writes the
# `loams` package's generated facade — one `Protocol` per annotated service
# (async and sync, because the Python SDK has both clients), one method per
# `FacadeOptions` call, the binding table the hand-written runtime dispatches
# through, and the `Reason` literal generated from `docs/api/reasons.md`.
#
# The stubs are not generated here: `sdks/python/buf.gen.proto.yaml` writes them
# with the pinned remote plugins, and the facade imports their types. Running
# the stubs into the SDK as well would be a second copy of the same protos under
# a second package name, and §44 §10.1 point 2 names one generated package per
# language.
#
# Run `scripts/sdk/gen.sh python`, which builds the plugin, substitutes the path
# into a copy of this template and runs buf on that. buf does not expand
# environment variables in a `local:` plugin path, and the path cannot be
# committed either: the repository's cargo config sends build output outside the
# tree. CI regenerates and fails on a diff.
#
# The package map is what tells the generator where each proto package's
# generated messages live. Those paths are not a guess: running the pinned
# plugins (`protoc-gen-python` and `protoc-gen-connectrpc` 0.12.1) over `proto/`
# writes `loams/<package path>/<file>_pb2.py`, which is what the six entries
# below name. Without an entry for an annotated package, generation fails rather
# than emitting imports that do not resolve.
version: v2
inputs:
  # The whole proto module, as one image, so the plugin is invoked once with
  # every file: the facade is one aggregate file, not one file per proto.
  # `loams.options.v1` is included because the annotations it declares are what
  # the plugin reads, not because a client sends any of them.
  - directory: proto
plugins:
  # Substituted by scripts/sdk/gen.sh. The default is the plain cargo layout.
  - local: ${LOAMS_FACADE_PLUGIN}
    out: sdks/python/src/loams/_gen
    # buf's default strategy is `directory`, which would invoke the plugin once
    # per proto directory and drop all but the last `facade.py`. The facade is
    # one aggregate file over the whole module, so it needs every file at once.
    strategy: all
    opt:
      - lang=python
      - reasons=docs/api/reasons.md
      # The proto revision this SDK declares (§44 §10.3). Pre-1.0, so it is the
      # API major rather than a release tag; `loams.system.version()` checks it
      # against `GetInstance.api_versions`.
      - proto_rev=v1
      - package=loams.instance.v1=loams.instance.v1.instance_pb2
      - package=loams.devices.v1=loams.devices.v1.devices_pb2
      - package=loams.approvals.v1=loams.approvals.v1.approvals_pb2
      - package=loams.operations.v1=loams.operations.v1.operations_pb2
      - package=loams.notifications.v1=loams.notifications.v1.notifications_pb2
      - package=loams.live.v1=loams.live.v1.live_pb2
      - package=loams.auth.v1=loams.auth.v1.auth_pb2
      # Six files: the facade imports each message from its own file's
      # module, next to this one.
      - package=loams.admin.v1=loams.admin.v1.org_pb2
      - package=loams.collection.v1=loams.collection.v1.collection_pb2
      - package=loams.graph.v1=loams.graph.v1.graph_pb2
      - package=loams.sql.v1=loams.sql.v1.sql_pb2
      - package=loams.stream.v1=loams.stream.v1.stream_pb2
clean: true
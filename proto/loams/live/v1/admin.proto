// The Loams Live admin API (design §45 §6.3, D689; LV1 plan Task 10):
// deploying functions and schemas, listing deployments, rollback, index
// status, function logs, and the app directory (Task 13). Backups (Tasks
// 29–30) join it later.
//
// Platform principals only, never an app's end users (§45 §5.3). The
// server puts the service behind the engine's authentication layer
// (`LOAMS_AUTH_MODE`); per-app authorization is LV1 Task 15. It is a
// separate file in the `loams.live.v1` package (LV1 plan Ruling 6), so the
// facade maps it to its own module, `loams.live.admin`.
syntax = "proto3";

package loams.live.v1;

import "loams/live/v1/live.proto";
import "loams/options/v1/options.proto";

service LiveAdminService {
  // Unstable like the rest of the package (§44 §10.3).
  option (loams.options.v1.module) = {
    name: "live.admin"
    summary: "Live administration: apps, deploy, roll back, index status and function logs."
    unstable: true
  };

  // Deploys a function bundle and a schema (§45 §3.3). The deployment
  // activates by compare-and-swap against `expected_active`; a mismatch is
  // FAILED_PRECONDITION, reason `live_deploy_conflict`. The call returns
  // when the deployment is active or failed, which takes as long as its
  // validation scans and index backfills.
  rpc Deploy(DeployRequest) returns (DeployResponse) {
    option (loams.options.v1.facade) = { name: "deploy" };
  }
  // The app's deployments, newest first.
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse) {
    option (loams.options.v1.facade) = {
      name: "listDeployments"
      retry_safe: true
      pagination: "deployments:next_page_token"
    };
  }
  // One deployment, with its schema and its functions.
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse) {
    option (loams.options.v1.facade) = { name: "getDeployment" retry_safe: true };
  }
  // Activates an existing deployment: a rollback, or a roll forward. It
  // takes the deploy's path with the stored bundle and schema, so the
  // deployment's schema is applied again (§45 §3.3).
  rpc ActivateDeployment(ActivateDeploymentRequest) returns (ActivateDeploymentResponse) {
    option (loams.options.v1.facade) = { name: "activateDeployment" };
  }
  // The state of an index and its backfill's progress (§45 §4.2).
  rpc GetIndexStatus(GetIndexStatusRequest) returns (GetIndexStatusResponse) {
    option (loams.options.v1.facade) = { name: "getIndexStatus" retry_safe: true };
  }
  // The functions' `console.*` output on this node (§45 §3.3): the lines
  // the node still holds, then, with `follow`, new lines as they come.
  rpc TailLogs(TailLogsRequest) returns (stream TailLogsResponse) {
    option (loams.options.v1.facade) = { name: "tailLogs" };
  }

  // Creates an app (design §45 §7, D690): its dedicated keyspace
  // `loams_live_a<id>` first, then its directory record. A taken name is
  // FAILED_PRECONDITION, reason `live_app_exists`; more apps than the
  // cluster allows is RESOURCE_EXHAUSTED.
  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse) {
    option (loams.options.v1.facade) = { name: "createApp" };
  }
  // The cluster's apps, by id.
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse) {
    option (loams.options.v1.facade) = {
      name: "listApps"
      retry_safe: true
      pagination: "apps:next_page_token"
    };
  }
  // One app, by name.
  rpc GetApp(GetAppRequest) returns (GetAppResponse) {
    option (loams.options.v1.facade) = { name: "getApp" retry_safe: true };
  }
  // Changes an app's settings, or disables and enables it. Fields left out
  // are kept.
  rpc UpdateApp(UpdateAppRequest) returns (UpdateAppResponse) {
    option (loams.options.v1.facade) = { name: "updateApp" };
  }
  // Deletes an app softly: it is `APP_STATE_DELETING` (every call refused)
  // and its data is purged after the retention, 7 days by default.
  rpc DeleteApp(DeleteAppRequest) returns (DeleteAppResponse) {
    option (loams.options.v1.facade) = { name: "deleteApp" };
  }
}

// A deployment as the admin API shows it (the catalog's record without the
// schema, which `GetDeployment` returns).
message Deployment {
  // A ULID.
  string id = 1;
  // The bundle's SHA-256, lowercase hex.
  string bundle_sha256 = 2;
  // The TSO physical time of the deploy's first transaction, in ms.
  uint64 created_at_ms = 3;
  // The principal that deployed it (an id, never a credential).
  string created_by = 4;
  string message = 5;
  // The deployment that was active when this one was deployed; empty for
  // the app's first.
  string parent = 6;
  DeploymentState state = 7;
  // Why it failed, when `state` is `DEPLOYMENT_STATE_FAILED`.
  string failure_reason = 8;
}

// Where a deployment is in its life (design §45 §3.3). The catalog's
// records store it too.
enum DeploymentState {
  DEPLOYMENT_STATE_UNSPECIFIED = 0;
  // Its record is written; its schema is not applied yet.
  DEPLOYMENT_STATE_PENDING = 1;
  // A stricter validator scans existing data (LV1 plan Task 8): it is
  // enforced on new writes, and the table's documents are checked.
  DEPLOYMENT_STATE_VALIDATING = 2;
  // A new index is backfilled (LV1 plan Task 9).
  DEPLOYMENT_STATE_BACKFILLING = 3;
  // The pointer names it: new calls run its functions.
  DEPLOYMENT_STATE_ACTIVE = 4;
  // A later deployment replaced it.
  DEPLOYMENT_STATE_SUPERSEDED = 5;
  // It never became active; `failure_reason` says why.
  DEPLOYMENT_STATE_FAILED = 6;
  // It is active, but its isolated workers crashed five times within a
  // minute (design §45 §3.1). Calls are still served.
  DEPLOYMENT_STATE_DEGRADED = 7;
}

// A function a deployment exports (§45 §3.4).
message FunctionInfo {
  // `module:export`.
  string path = 1;
  FunctionKind kind = 2;
  FunctionVisibility visibility = 3;
  // The arguments' validator; absent: any arguments.
  Validator args = 4;
}

enum FunctionKind {
  FUNCTION_KIND_UNSPECIFIED = 0;
  FUNCTION_KIND_QUERY = 1;
  FUNCTION_KIND_MUTATION = 2;
}

// Who may call a function (D699).
enum FunctionVisibility {
  FUNCTION_VISIBILITY_UNSPECIFIED = 0;
  // `query`, `mutation`: end users and platform principals.
  FUNCTION_VISIBILITY_PUBLIC = 1;
  // `internalQuery`, `internalMutation`: platform principals only.
  FUNCTION_VISIBILITY_INTERNAL = 2;
}

message DeployRequest {
  // One ES module (§20 §6).
  bytes bundle = 1;
  Schema schema = 2;
  // The deployment the client built against: the active one when it read
  // the app. Absent means the app has no active deployment.
  optional string expected_active = 3;
  // A note for the record, such as a commit message.
  string message = 4;
  // Validate the bundle and plan the schema changes, writing nothing.
  bool dry_run = 5;
}

message DeployResponse {
  // The new deployment (in a dry run, the record it would write, still
  // `DEPLOYMENT_STATE_PENDING`).
  Deployment deployment = 1;
  SchemaChanges changes = 2;
}

// What applying a schema changed (or, in a dry run, would change).
message SchemaChanges {
  // The tables it created.
  repeated string tables_created = 1;
  // The existing tables whose validator it changed.
  repeated string validators_changed = 2;
  // Of those, the ones whose documents it checked against a stricter
  // validator first.
  repeated string tables_validated = 3;
  // The indexes of existing tables it added (backfilled first).
  repeated IndexRef indexes_added = 4;
  // The indexes of existing tables it dropped.
  repeated IndexRef indexes_dropped = 5;
}

message IndexRef {
  string table = 1;
  string index = 2;
}

message ListDeploymentsRequest {
  // AIP-158 page size: 100 when 0, at most 1 000.
  int32 page_size = 1;
  // The `next_page_token` of the previous page; empty starts at the newest.
  string page_token = 2;
}

message ListDeploymentsResponse {
  // Newest first.
  repeated Deployment deployments = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetDeploymentRequest {
  string id = 1;
}

message GetDeploymentResponse {
  Deployment deployment = 1;
  // The schema it declares.
  Schema schema = 2;
  // The functions its bundle exports, by path. Empty for a deployment made
  // before the server recorded them (LV1 Task 10).
  repeated FunctionInfo functions = 3;
}

message ActivateDeploymentRequest {
  string id = 1;
  // The active deployment the client saw. Absent means the app has none.
  optional string expected_active = 2;
}

message ActivateDeploymentResponse {
  // The deployment, now active.
  Deployment deployment = 1;
  SchemaChanges changes = 2;
}

message GetIndexStatusRequest {
  string table = 1;
  string index = 2;
}

message GetIndexStatusResponse {
  IndexState state = 1;
  // Documents the backfill has written entries for (every document, once
  // the index is ready).
  uint64 done = 2;
  // The table's documents now.
  uint64 total_estimate = 3;
}

// Where a user index is in its life (LV1 plan Task 9, design §45 §4.2). The
// catalog's index definitions store it too.
enum IndexState {
  // In a catalog record: ready (an index defined before Task 9). The admin
  // API never answers it.
  INDEX_STATE_UNSPECIFIED = 0;
  // Every write maintains it and a backfill job writes the entries of the
  // documents already there; no query reads it.
  INDEX_STATE_BACKFILLING = 1;
  // Queries read it; every write maintains it.
  INDEX_STATE_READY = 2;
  // No write maintains it and no query reads it; its entries are being
  // deleted, then the definition goes.
  INDEX_STATE_DROPPING = 3;
}

message TailLogsRequest {
  // Keep the stream open and send new lines as functions write them.
  bool follow = 1;
  // Only lines written at or after this Unix time, in ms.
  optional uint64 since_ms = 2;
  // Only lines of this function (`module:export`).
  optional string function = 3;
}

message TailLogsResponse {
  // Oldest first. Empty while following: a heartbeat every 15 s.
  repeated LogEntry entries = 1;
  // Lines this stream missed before these entries: the node's buffer
  // (10 000 lines per app) overwrote them before the stream read them.
  uint64 skipped = 2;
}

// One line a function wrote with `console.*`, or the error a call ended
// with. A line holds only what the function wrote (cut to 4 KiB); the
// server adds no arguments, results, documents or credentials.
message LogEntry {
  // Unix time, in ms, at which the server recorded the line.
  uint64 ts_ms = 1;
  // The call's request id, as the `loams-request-id` response header of
  // `Query` and `Mutate` names it. A subscription's evaluation has its own.
  string request_id = 2;
  // `module:export`.
  string function = 3;
  // The deployment that ran the call (a ULID); empty for a built-in.
  string deployment = 4;
  LogLevel level = 5;
  string line = 6;
  // The line was longer than the per-line limit and was cut.
  bool truncated = 7;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_LOG = 2;
  LOG_LEVEL_INFO = 3;
  LOG_LEVEL_WARN = 4;
  // `console.error`, and the error a call ended with.
  LOG_LEVEL_ERROR = 5;
}

// One Live app of the cluster (design §45 §7, D690).
message App {
  // Cluster-unique and permanent.
  uint32 id = 1;
  // Unique among the cluster's apps; the `loams-live-app` header names it.
  string name = 2;
  // The org and environment the app belongs to (Q639: one app per
  // environment); free text until the authorization of LV1 Task 15.
  string namespace = 3;
  // Where its data lives: `loams_live_a<id>`, or the server's own keyspace
  // for its default app (`--live-app`).
  string keyspace = 4;
  AppState state = 5;
  // When a deleted app's data is purged (Unix ms); 0 unless deleting.
  uint64 purge_after_ms = 6;
  AppLimits limits = 7;
  repeated TrustedIssuer issuers = 8;
  // The browser origins allowed to call the app (CORS, LV1 Task 18).
  repeated string allowed_origins = 9;
  // Whether calls without a credential are accepted (LV1 Task 16).
  bool allow_anonymous = 10;
  // Unix ms.
  uint64 created_at_ms = 11;
}

enum AppState {
  APP_STATE_UNSPECIFIED = 0;
  // Calls are served.
  APP_STATE_ACTIVE = 1;
  // Every call is FAILED_PRECONDITION, reason `live_app_disabled`.
  APP_STATE_DISABLED = 2;
  // Deleted: refused as disabled, and purged at `purge_after_ms`.
  APP_STATE_DELETING = 3;
}

// Per-app limits. Each one only tightens the server's own; absent means
// the server's.
message AppLimits {
  // JavaScript CPU time of one call, in ms.
  optional uint64 max_js_cpu_ms = 1;
  // The wall-clock deadline of one mutation, in ms.
  optional uint64 mutation_deadline_ms = 2;
  // The value one call returns, in bytes.
  optional uint64 max_result_bytes = 3;
  // Documents one function scans.
  optional uint64 max_scanned_docs = 4;
  // Documents one mutation writes.
  optional uint64 max_written_docs = 5;
  // Bytes one mutation writes.
  optional uint64 max_written_bytes = 6;
}

// An OIDC issuer whose tokens identify the app's end users (design §45
// §5.3; used from LV1 Task 16).
message TrustedIssuer {
  // The issuer URL, as the tokens' `iss` names it.
  string issuer = 1;
  // The `aud` values accepted; at least one.
  repeated string audiences = 2;
  // The JWKS URL; absent means OIDC discovery.
  optional string jwks_uri = 3;
}

message CreateAppRequest {
  string name = 1;
  string namespace = 2;
  AppLimits limits = 3;
  repeated TrustedIssuer issuers = 4;
  repeated string allowed_origins = 5;
  bool allow_anonymous = 6;
}

message CreateAppResponse {
  App app = 1;
}

message ListAppsRequest {
  // AIP-158 page size: 100 when 0, at most 1 000.
  int32 page_size = 1;
  // The `next_page_token` of the previous page; empty starts at the first.
  string page_token = 2;
}

message ListAppsResponse {
  // By id. Deleted apps are listed until they are purged.
  repeated App apps = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetAppRequest {
  string name = 1;
}

message GetAppResponse {
  App app = 1;
}

message UpdateAppRequest {
  string name = 1;
  // `APP_STATE_ACTIVE` or `APP_STATE_DISABLED`; a deleted app cannot
  // change state.
  optional AppState state = 2;
  // Replaces the limits.
  AppLimits limits = 3;
  // Replaces the issuers.
  TrustedIssuers issuers = 4;
  // Replaces the allowed origins.
  AllowedOrigins allowed_origins = 5;
  optional bool allow_anonymous = 6;
}

// A list that replaces the app's issuers (empty removes them all).
message TrustedIssuers {
  repeated TrustedIssuer issuers = 1;
}

// A list that replaces the app's allowed origins (empty removes them all).
message AllowedOrigins {
  repeated string origins = 1;
}

message UpdateAppResponse {
  App app = 1;
}

message DeleteAppRequest {
  string name = 1;
}

message DeleteAppResponse {
  // The app, now `APP_STATE_DELETING`.
  App app = 1;
}

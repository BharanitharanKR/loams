// The Loams Live catalog records (design §20 §4.1–§4.3; R1 plan Task 8).
// Internal: stored in TiKV by the server under the catalog prefix `0x01`
// and never sent to clients, so the TypeScript client does not generate it.
syntax = "proto3";

package loams.live.v1;

// `DeploymentState`, `IndexState` and `FunctionInfo` are the admin API's
// (LV1 plan Task 10): the records store what the API shows.
import "loams/live/v1/admin.proto";
import "loams/live/v1/live.proto";

// A table: the value of its catalog record `0x01 ‖ 0x02 ‖ id:u32 BE`. The
// built-in indexes `by_id` (id 0, the document key itself) and
// `by_creation_time` (id 1) are implicit and not listed.
message TableDef {
  // The encoding version; 1 in R1.
  uint32 format = 1;
  // The table id, the `table_id:u32` of its document and index keys.
  uint32 id = 2;
  string name = 3;
  // The user indexes, in definition order.
  repeated IndexDef indexes = 4;
  // The id the next user index gets; ids are never reused, so the entries
  // of a removed index can never be read as another index's.
  uint32 next_index_id = 5;
  // The validator every write to the table must match (design §45 §4.1;
  // LV1 plan Task 8), as the active deployment's schema declares it.
  // Absent: none.
  Validator validator = 6;
  // A stricter validator a deploy is checking the table's documents
  // against: until that deploy activates or fails, every write must match
  // it as well as `validator`. Absent: none.
  EnforcingValidator enforcing = 7;
}

// A validator being enforced ahead of its deploy (LV1 plan Task 8).
message EnforcingValidator {
  Validator validator = 1;
  // The deployment whose deploy is checking it (16 bytes).
  bytes deployment = 2;
}

// A leased, checkpointed scan of one table's documents (LV1 plan Task 8):
// the value of catalog record `0x01 ‖ 0x07 ‖ table_id:u32 BE ‖ kind:u8`.
// Every batch is one transaction that reads this record, checks the lease,
// visits the documents after `checkpoint` and writes the record back.
message TableJobRecord {
  // The encoding version; 1 in LV1.
  uint32 format = 1;
  TableJobKind kind = 2;
  uint32 table_id = 3;
  // The deployment the job works for (16 bytes).
  bytes deployment = 4;
  // Who holds the lease, and until when (TSO physical time, ms). Another
  // owner may take the job over once the lease has expired.
  string owner = 5;
  uint64 lease_expires_ms = 6;
  // The last document key done; empty before the first batch.
  bytes checkpoint = 7;
  // Documents visited so far.
  uint64 scanned = 8;
  // The scan reached the end of the table.
  bool done = 9;
  // What the job found (a validation: the offending documents), at most
  // 100.
  repeated JobFinding findings = 10;
}

enum TableJobKind {
  TABLE_JOB_KIND_UNSPECIFIED = 0;
  // A validation scan of a stricter validator (LV1 plan Task 8).
  TABLE_JOB_KIND_VALIDATE = 1;
  // The backfill of the table's new indexes (LV1 plan Task 9).
  TABLE_JOB_KIND_BACKFILL = 2;
}

// One document a table job found.
message JobFinding {
  // The document id, 16 bytes.
  bytes doc_id = 1;
  // What is wrong, without values (field paths and types).
  string detail = 2;
}

// A user index of a table. `_creationTime` and then `_id` are appended to
// every index, so entries are unique and stably ordered.
message IndexDef {
  // The index id, from 2 (0 and 1 are the built-in indexes).
  uint32 id = 1;
  string name = 2;
  // The indexed top-level fields, at most 16.
  repeated string fields = 3;
  // Where the index is in its life (LV1 plan Task 9). Unspecified: ready
  // (an index defined before Task 9).
  IndexState state = 4;
  // The deployment whose deploy is backfilling it (16 bytes), while
  // `state` is `INDEX_STATE_BACKFILLING`.
  bytes deployment = 5;
}

// The app's own settings: the value of its catalog record `0x01 ‖ 0x05`
// (R1 plan row T10-1), written when the app's runner first opens.
message AppDef {
  // The encoding version; 1 in R1.
  uint32 format = 1;
  // The journal shard count, 1 to 1 024 (16 by default). It changes only
  // while the journal is empty (no head, entry or checkpoint); R2 migrates
  // a non-empty journal.
  uint32 journal_shards = 2;
}

// One deployment of the app (design §45 §3.3, D683; LV1 plan Task 6): the
// value of its catalog record `0x01 ‖ 0x06 ‖ id[16]`. Immutable but for
// `state` and `failure_reason`. The bundle itself is an object of the
// bundle store at `live/<app>/deployments/<id>.js` (R1 plan Ruling 10),
// checked against `bundle_sha256` whenever a node loads it. The active
// deployment is the pointer record `0x01 ‖ 0x03`, whose value is the
// active id's 16 bytes.
message DeploymentRecord {
  // The encoding version; 1 in LV1.
  uint32 format = 1;
  // The deployment's ULID, 16 bytes (big-endian, so ids sort by time).
  bytes id = 2;
  // SHA-256 of the bundle, 32 bytes.
  bytes bundle_sha256 = 3;
  // The schema the deployment declares (additive table creation in Task 6,
  // validators in Task 8, index changes in Task 9).
  Schema schema = 4;
  // The TSO physical time of the deploy's first transaction, in ms.
  uint64 created_at_ms = 5;
  // The principal that deployed it.
  string created_by = 6;
  string message = 7;
  // The deployment that was active when this one was deployed (16 bytes);
  // empty for the app's first deployment.
  bytes parent = 8;
  DeploymentState state = 9;
  // Why the deployment failed, when `state` is `DEPLOYMENT_STATE_FAILED`.
  string failure_reason = 10;
  // The functions its bundle exports (LV1 plan Task 10), by path; empty in
  // a record written before Task 10.
  repeated FunctionInfo functions = 11;
}

// The Loams Live sync API (design §20 §7, D121).
//
// A server stream (`Watch`) plus unary calls, never bidi: browsers cannot
// stream full duplex over fetch, and connect-rust sends no response on
// HTTP/1.1 until the request body ends. So one design works on HTTP/1.1 and
// HTTP/2, over Connect, gRPC and gRPC-Web.
//
// The server binds loopback only (D111) until LV1 moves Live to the main
// port (Task 12); the listener sits behind the engine's authentication
// layer (`LOAMS_AUTH_MODE`, off by default on loopback). Deploying and the
// other admin calls are `LiveAdminService` (admin.proto).
//
// `Query` and `Mutate` answer with a `loams-request-id` header: the id their
// function's console lines carry in `LiveAdminService.TailLogs`.
syntax = "proto3";

package loams.live.v1;

import "loams/live/v1/value.proto";
import "loams/options/v1/options.proto";

service LiveService {
  // The live package's wire contract may still change (R1), so an SDK marks
  // the modules experimental and `buf breaking` skips the package (§44
  // §10.3). SDK2 Task 0 set `unstable` when the TypeScript SDK first needed a
  // typed client for the unavailable-service path: the flag is what
  // `GetInstance.services[].unstable` already reported for this package, and
  // `protoc-gen-es` writes neither the flag nor the module name into its
  // output, so annotating the service did not change the generated stubs.
  option (loams.options.v1.module) = {
    name: "live"
    summary: "Live sync: watch a query set over a server stream."
    unstable: true
  };

  // Opens a session. The first Transition starts from the zero version and
  // carries every query's result; later ones carry only changed queries.
  // Heartbeats are empty Transitions every 15 s.
  //
  // buf lint: the response is `Transition`, not `WatchResponse`, because it
  // is the protocol's unit (§20 §7.1); RPC_RESPONSE_STANDARD_NAME is
  // excepted for this file in buf.yaml.
  rpc Watch(WatchRequest) returns (stream Transition) {
    option (loams.options.v1.facade) = { name: "watch" };
  }
  // Adds and removes queries in an open session. The next Transition
  // reflects the change.
  rpc ModifyQuerySet(ModifyQuerySetRequest) returns (ModifyQuerySetResponse) {
    option (loams.options.v1.facade) = { name: "modifyQuerySet" };
  }
  // A one-shot query, at the latest tick or at a given timestamp.
  //
  // Exposed on `loams.tables`, not on `loams.live`: §44 §7.2 splits the
  // service into the session half (watch, modify) and the table half (query,
  // mutate), and both are facade names for these RPCs.
  rpc Query(QueryRequest) returns (QueryResponse) {
    option (loams.options.v1.facade) = { module: "tables" name: "query" };
  }
  // Runs a mutation; returns its commit timestamp and result.
  rpc Mutate(MutateRequest) returns (MutateResponse) {
    option (loams.options.v1.facade) = { module: "tables" name: "mutate" };
  }
  // Deploying moved to `LiveAdminService.Deploy` (admin.proto; design §45
  // §6.3, D689; LV1 plan Task 10).
}

// A session's state: (query-set version, identity version, ts). A client
// applies a Transition only if its `start` equals the client's current
// version; a gap means it resumes. The zero version is {0, 0, 0}.
message StateVersion {
  uint64 query_set = 1;
  uint64 identity = 2;
  // The TSO timestamp every query of the session was evaluated at.
  uint64 ts = 3;
}

message WatchRequest {
  oneof start {
    // A new session with this query set.
    QuerySet initial = 1;
    // A reconnect: rerun the set at a tick at or after `last_version.ts`
    // and send full results.
    Resume resume = 2;
  }
}

message Resume {
  StateVersion last_version = 1;
  QuerySet query_set = 2;
}

message QuerySet {
  uint64 version = 1;
  repeated QuerySpec queries = 2;
}

message QuerySpec {
  // Chosen by the client, unique within its session.
  uint32 query_id = 1;
  // "module:export", or a built-in such as "_system:query".
  string function = 2;
  Value args = 3;
}

message ModifyQuerySetRequest {
  string session_id = 1;
  // Must equal the session's current query-set version, else
  // FailedPrecondition.
  uint64 base_version = 2;
  uint64 new_version = 3;
  repeated QuerySetChange changes = 4;
}

message QuerySetChange {
  oneof change {
    QuerySpec add = 1;
    // The query id to remove.
    uint32 remove = 2;
  }
}

message ModifyQuerySetResponse {}

// One step of a session, from `start` to `end`.
message Transition {
  string session_id = 1;
  // Must equal the client's current version.
  StateVersion start = 2;
  StateVersion end = 3;
  // Per query id: a value, an error, or removed.
  repeated QueryUpdate updates = 4;
  // Chunked: more Transition messages with the same `end` follow, and the
  // client applies them together.
  bool more = 5;
}

message QueryUpdate {
  uint32 query_id = 1;
  oneof update {
    Value value = 2;
    LiveError error = 3;
    Removed removed = 4;
  }
}

// The query left the query set.
message Removed {}

message QueryRequest {
  string function = 1;
  Value args = 2;
  // A TSO timestamp to read at; the latest tick when unset.
  optional uint64 ts = 3;
}

message QueryResponse {
  // The timestamp the query was evaluated at.
  uint64 ts = 1;
  Value result = 2;
}

message MutateRequest {
  string function = 1;
  Value args = 2;
  // A retried call with the same key returns the recorded commit timestamp
  // and result instead of running again (§20 §5.1).
  optional string idempotency_key = 3;
}

message MutateResponse {
  uint64 commit_ts = 1;
  Value result = 2;
}

// A deployed schema: tables, their indexes and their validators.
message Schema {
  repeated TableSchema tables = 1;
}

message TableSchema {
  string name = 1;
  // User indexes; `by_id` and `by_creation_time` are implicit.
  repeated IndexSchema indexes = 2;
  // The validator every write to the table must match (design §45 §4.1,
  // D684): a `v.object(…)`, or a `v.union(…)` of them, over the document's
  // own fields (not `_id` or `_creationTime`). Absent: any document.
  Validator validator = 3;
  // Whether a deploy that makes the validator stricter checks the table's
  // existing documents first (absent: true). With `false` the new validator
  // applies at once to new writes only, as Convex's `schemaValidation`.
  optional bool schema_validation = 4;
}

message IndexSchema {
  string name = 1;
  // Up to 16 field names; `_creationTime` and `_id` are appended.
  repeated string fields = 2;
}

// A validator (design §45 §4.1, D684): the `v.*` vocabulary of
// `loams:server`. Values match strictly: `int64` takes only an int64 and
// `float64` only a double; an object has exactly its fields, except that an
// `optional` field may be missing.
message Validator {
  // Exactly one is set; a Validator with none set is invalid.
  oneof kind {
    // `v.null()`, `v.int64()`, `v.float64()`, `v.boolean()`, `v.string()`,
    // `v.bytes()` or `v.any()`.
    ValidatorPrimitive primitive = 1;
    // `v.array(element)`: every element matches.
    Validator array = 2;
    // `v.object(fields)`.
    ValidatorObject object = 3;
    // `v.literal(value)`: exactly this scalar (null, boolean, int64, a
    // finite double or a string).
    Value literal = 4;
    // `v.union(...members)`: at least one member matches.
    ValidatorUnion union = 5;
    // `v.optional(inner)`: an object field that may be missing; only valid
    // as a field of `object`.
    Validator optional = 6;
    // `v.id(table)`: a document id (its text form) of the named table.
    string id = 7;
  }
}

enum ValidatorPrimitive {
  VALIDATOR_PRIMITIVE_UNSPECIFIED = 0;
  VALIDATOR_PRIMITIVE_NULL = 1;
  VALIDATOR_PRIMITIVE_INT64 = 2;
  VALIDATOR_PRIMITIVE_FLOAT64 = 3;
  VALIDATOR_PRIMITIVE_BOOLEAN = 4;
  VALIDATOR_PRIMITIVE_STRING = 5;
  VALIDATOR_PRIMITIVE_BYTES = 6;
  VALIDATOR_PRIMITIVE_ANY = 7;
}

message ValidatorObject {
  map<string, Validator> fields = 1;
}

message ValidatorUnion {
  // At least one.
  repeated Validator members = 1;
}

// An error for one query in a Transition. Call errors use the Connect error
// codes; this carries the same meaning inside a stream that stays open.
message LiveError {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The arguments or a value are invalid.
  ERROR_CODE_INVALID_ARGUMENT = 1;
  // The function, table or document does not exist.
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_FAILED_PRECONDITION = 3;
  // A limit (design §20 §4.1, §5.1) was exceeded; the message names it.
  ERROR_CODE_RESOURCE_EXHAUSTED = 4;
  // The function threw.
  ERROR_CODE_FUNCTION_ERROR = 5;
  // The function ran past its CPU limit.
  ERROR_CODE_FUNCTION_TIMEOUT = 6;
  // The function ran past its memory limit.
  ERROR_CODE_FUNCTION_OUT_OF_MEMORY = 7;
  ERROR_CODE_UNAVAILABLE = 8;
  ERROR_CODE_INTERNAL = 9;
}

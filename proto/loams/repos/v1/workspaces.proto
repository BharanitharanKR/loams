syntax = "proto3";

// Loams Git: `WorkspaceService`, server-side workspaces (design §36 §19.4,
// §19.10, D826, D827, D836; plan GT1 Task 25). A workspace is a chain of
// complete snapshots of one person's (or agent's) work in a repository:
// HEAD, the index, the worktree as trees, local branches, conflicts and the
// workspace packs holding the objects it made. Snapshot `n + 1` is written
// only if no snapshot `n + 1` exists, so two writers of one workspace never
// both save: the loser is fenced (`workspace_fenced`). See `repos.proto`
// for the package's rules.
//
// Every request names its repository as `RepoService` does (`namespace`,
// `name`) and the workspace by `workspace` ("w" + 26 lowercase ULID
// characters). Object ids are 40 lowercase hex digits.
//
// Access (GT-Q13's default, Q750): whoever may read the repository (the org
// role `member`) reads its workspaces; a server started with workspace
// reads limited to owners lets only the owner and org admins read one.
// Writing a workspace (saving, deleting, restoring salvage) needs its owner,
// an org admin, or the operator (`permission_denied`). A workspace's reads
// carry no `consistency_token`: the snapshot number orders them.
//
// Agents that do not mount a workspace read, edit, diff and rebase it with
// `ReadFiles`, `ApplyEdits`, `Diff` and `Rebase` (§36 §19.11, GT1 Task 26).
//
// Reasons: `workspace_not_found`, `workspace_fenced` (aborted),
// `workspace_name_taken` (already_exists), `object_missing`
// (failed_precondition), `fork_too_deep`, `idempotency_key_reused`,
// `env_unsealed`, `failed_precondition`, `permission_denied`,
// `invalid_argument` and `internal`.
package loams.repos.v1;

import "google/protobuf/timestamp.proto";
import "loams/options/v1/options.proto";
import "loams/repos/v1/objects.proto";
import "loams/repos/v1/repos.proto";

// Workspaces: create, fork, save, watch, delete, and the salvage of fenced
// writers.
service WorkspaceService {
  option (loams.options.v1.module) = {
    name: "repos"
    summary: "Loams Git: server-side workspaces, saved as create-only snapshots."
    unstable: true
  };

  // Writes snapshot 0 of a new workspace at `track`'s tip (or `at`): no
  // data is copied. A named workspace takes its name for its owner (the
  // caller) first; a name the owner holds for another workspace is
  // `workspace_name_taken`. A retry with the same `idempotency_key`
  // answers the same workspace; the key with another request is
  // `idempotency_key_reused`.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  // The workspace's latest snapshot.
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // An owner's named workspaces by name, or every workspace by id.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Writes snapshot 0 of a new workspace, owned by the caller, as a copy of
  // a snapshot of another: its packs are shared, not copied. A workspace
  // is forked at most 8 deep (`fork_too_deep`).
  rpc ForkWorkspace(ForkWorkspaceRequest) returns (ForkWorkspaceResponse);
  // Writes a final snapshot labelled `deleted`; the workspace is then not
  // found, and its objects are purged after a grace period unless a fork
  // still names its packs. Deleting a deleted workspace answers the same.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);
  // The workspace's retained snapshots, oldest first.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Appends snapshot `n`, whose objects were uploaded first
  // (`ObjectService.PutWorkspacePack`). Its trees, `head` and
  // `snapshot_commit` must exist in the repository or the packs it names,
  // and its new trees must name only objects that exist (`object_missing`).
  // Fenced on `n`: when another snapshot holds `n` the save is
  // `workspace_fenced`, and the offered state is kept as salvage under its
  // `writer` (metadata `salvage`). A retry of the same save answers it.
  rpc SaveSnapshot(SaveSnapshotRequest) returns (SaveSnapshotResponse);
  // The latest snapshot, then each snapshot saved after it, and a
  // heartbeat every 15 s while nothing else is sent.
  rpc WatchWorkspace(WatchWorkspaceRequest) returns (stream WatchWorkspaceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The unsaved states of writers that were fenced, kept for 30 days.
  rpc ListSalvage(ListSalvageRequest) returns (ListSalvageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replays a salvaged state as edits on the latest snapshot, as a new
  // snapshot: paths the latest snapshot did not change take the salvaged
  // entry, and paths both changed keep the latest entry and are recorded as
  // conflicts.
  rpc RestoreSalvage(RestoreSalvageRequest) returns (RestoreSalvageResponse);
  // Files of a snapshot's worktree (the latest, or `n`), in the order
  // asked, at most 1,000 paths. A file's contents arrive in messages of at
  // most 1 MiB, each naming the path and where its `data` starts. Files
  // under `env/` are rendered for the caller: values it may not read show
  // as `<redacted>` (until env sealing is served, every value).
  rpc ReadFiles(ReadFilesRequest) returns (stream ReadFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Writes, deletes and renames files of the worktree (and the index, with
  // `stage`) as one new snapshot, `expect_n + 1`, whose new objects the
  // server stores as one workspace pack. Fenced on `expect_n`: when another
  // snapshot holds `expect_n + 1` the call is `workspace_fenced`, unless it
  // is this call's retry. At most 10,000 edits. A write under `env/` is
  // refused (`env_unsealed`) until the server seals env files.
  rpc ApplyEdits(ApplyEditsRequest) returns (ApplyEditsResponse);
  // A snapshot's worktree (the latest, or `n`) against HEAD, the base, the
  // index or a commit, as `git diff --no-renames --no-indent-heuristic`
  // prints it: one file after another, a long patch spanning messages.
  rpc Diff(DiffRequest) returns (stream DiffResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Moves the workspace's changes onto `track`'s tip (or `onto`) as a new
  // snapshot, merging only the paths both sides changed; what does not
  // merge cleanly is written with conflict markers and recorded in the
  // snapshot's conflicts. A workspace with unresolved conflicts or local
  // commits is refused (`failed_precondition`, metadata `condition`
  // `conflicts` or `local_commits`). Rebasing onto the base the workspace has answers its latest
  // snapshot.
  rpc Rebase(RebaseRequest) returns (RebaseResponse);
}

// How a path differs among HEAD, the index and the worktree.
enum WorkspaceChangeKind {
  WORKSPACE_CHANGE_KIND_UNSPECIFIED = 0;
  WORKSPACE_CHANGE_KIND_MODIFIED = 1;
  WORKSPACE_CHANGE_KIND_ADDED = 2;
  WORKSPACE_CHANGE_KIND_DELETED = 3;
  WORKSPACE_CHANGE_KIND_UNTRACKED = 4;
  WORKSPACE_CHANGE_KIND_TYPE_CHANGED = 5;
}

// One changed path of the status hint.
message WorkspaceChange {
  string path = 1;
  WorkspaceChangeKind kind = 2;
  // The index differs from HEAD at this path.
  bool staged = 3;
}

// A workspace-local branch or lightweight tag.
message LocalRef {
  string name = 1;
  string oid = 2;
  string upstream = 3;
}

// A path with unresolved changes: the base, ours and theirs (each empty
// when that side has no entry).
message WorkspaceConflict {
  string path = 1;
  string base = 2;
  string ours = 3;
  string theirs = 4;
  uint32 mode = 5;
}

// The writer this snapshot took the workspace over from.
message Takeover {
  string from_mount = 1;
  uint64 from_n = 2;
  string reason = 3;
}

// The snapshot a forked workspace was copied from.
message WorkspaceFork {
  string workspace = 1;
  uint64 n = 2;
}

// One snapshot of a workspace (§36 §19.4.2).
message Snapshot {
  string workspace = 1;
  uint64 n = 2;
  // The workspace's owner and name ("" for an unnamed workspace).
  string owner = 3;
  string workspace_name = 4;
  // What `pull` rebases onto, as "refs/heads/main".
  string track = 5;
  // The commit last rebased onto (empty when unborn), and the repository
  // seq it was read at.
  string base = 6;
  uint64 base_seq = 7;
  // HEAD (empty when unborn), and the branch it names (empty: detached).
  string head = 8;
  string head_ref = 9;
  repeated LocalRef refs = 10;
  string index_tree = 11;
  string worktree_tree = 12;
  // The commit of the worktree (D835): tree `worktree_tree`, parent `head`,
  // by `Loams Snapshot <snapshot@loams.invalid>` at `created_at` in whole
  // seconds, message "loams snapshot <workspace>@<n>\n".
  string snapshot_commit = 13;
  // The status hint; past 10,000 paths it is empty and `changed_overflow`
  // is set.
  repeated WorkspaceChange changed = 14;
  bool changed_overflow = 15;
  // The workspace packs holding the objects the workspace made.
  repeated PackRef packs = 16;
  // The mount that wrote it ("m" + 26 lowercase ULID characters), or "".
  string writer = 17;
  // Who saved it.
  string principal = 18;
  google.protobuf.Timestamp created_at = 19;
  // A named snapshot's label; "deleted" on the final snapshot of a deleted
  // workspace.
  string label = 20;
  Takeover takeover = 21;
  // Set on every snapshot of a forked workspace.
  WorkspaceFork fork = 22;
  repeated WorkspaceConflict conflicts = 23;
}

message CreateWorkspaceRequest {
  string namespace = 1;
  string name = 2;
  // The branch the workspace follows; empty is the repository's default
  // branch.
  string track = 3;
  // The commit to start at; empty is `track`'s tip (or nothing, when it
  // does not exist yet).
  string at = 4;
  // A name, unique per owner; empty for an unnamed (agent) workspace.
  string workspace_name = 5;
  // The mount that will write it, when known.
  string writer = 6;
  string idempotency_key = 15;
}

message CreateWorkspaceResponse {
  // Snapshot 0.
  Snapshot snapshot = 1;
}

message GetWorkspaceRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
}

message GetWorkspaceResponse {
  // The latest snapshot.
  Snapshot snapshot = 1;
}

message ListWorkspacesRequest {
  string namespace = 1;
  string name = 2;
  // An owner's named workspaces; empty lists every workspace, by id.
  string owner = 3;
  int32 page_size = 4;
  string page_token = 5;
}

// One workspace in a listing.
message WorkspaceSummary {
  string workspace = 1;
  // Set when listing an owner's workspaces.
  string workspace_name = 2;
  string owner = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListWorkspacesResponse {
  repeated WorkspaceSummary workspaces = 1;
  string next_page_token = 2;
}

message ForkWorkspaceRequest {
  string namespace = 1;
  string name = 2;
  // The workspace forked.
  string workspace = 3;
  // The snapshot copied; unset is the latest.
  optional uint64 n = 4;
  string workspace_name = 5;
  string writer = 6;
  string idempotency_key = 15;
}

message ForkWorkspaceResponse {
  // The new workspace's snapshot 0.
  Snapshot snapshot = 1;
}

message DeleteWorkspaceRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  string idempotency_key = 15;
}

message DeleteWorkspaceResponse {
  // The final snapshot, labelled "deleted".
  Snapshot snapshot = 1;
}

message ListSnapshotsRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  int32 page_size = 4;
  string page_token = 5;
}

// One snapshot in a listing.
message SnapshotSummary {
  uint64 n = 1;
  google.protobuf.Timestamp created_at = 2;
  string label = 3;
  string writer = 4;
  string principal = 5;
  string snapshot_commit = 6;
}

message ListSnapshotsResponse {
  repeated SnapshotSummary snapshots = 1;
  string next_page_token = 2;
}

message GetSnapshotRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  uint64 n = 4;
}

message GetSnapshotResponse {
  Snapshot snapshot = 1;
}

message SaveSnapshotRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  // The snapshot to append, numbered one past the snapshot it was built
  // on. Its `workspace`, `owner`, `workspace_name`, `principal` and `fork`
  // are the server's and are ignored; `created_at` and `snapshot_commit`
  // are the client's, and the commit must be this snapshot's.
  Snapshot snapshot = 4;
  string idempotency_key = 15;
}

message SaveSnapshotResponse {
  Snapshot snapshot = 1;
}

message WatchWorkspaceRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  // Starts after this snapshot instead of with the latest one.
  optional uint64 after_n = 4;
}

message WatchWorkspaceResponse {
  oneof event {
    Snapshot snapshot = 1;
    // Every 15 s while nothing else is sent.
    Heartbeat heartbeat = 2;
  }
}

message ListSalvageRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  int32 page_size = 4;
  string page_token = 5;
}

// One fenced writer's unsaved state.
message Salvage {
  // The fenced mount.
  string mount = 1;
  // The record's id (26 lowercase ULID characters).
  string salvage = 2;
  // The snapshot number the writer could not save.
  uint64 n = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListSalvageResponse {
  repeated Salvage salvage = 1;
  string next_page_token = 2;
}

message RestoreSalvageRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  string mount = 4;
  string salvage = 5;
  // The mount writing the restored snapshot, when known.
  string writer = 6;
  string idempotency_key = 15;
}

message RestoreSalvageResponse {
  // The new snapshot.
  Snapshot snapshot = 1;
  // The paths both sides changed, now among the snapshot's conflicts.
  repeated string conflicts = 2;
}

message ReadFilesRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  // The snapshot read; unset is the latest.
  optional uint64 n = 4;
  // Repository paths, "/"-separated.
  repeated string paths = 5;
}

// One file, or the next part of one.
message ReadFilesResponse {
  string path = 1;
  // Whether anything is at the path; the fields below are empty when not.
  bool found = 2;
  // git's mode: 100644, 100755, 120000 (a symlink, whose contents are its
  // target), 160000 (a submodule) or 40000 (a directory; no contents).
  uint32 mode = 3;
  string oid = 4;
  // The contents' length in bytes, as shown (an env file's rendered
  // length).
  uint64 size = 5;
  // Where `data` starts in the contents.
  uint64 offset = 6;
  bytes data = 7;
  // An env file whose values were withheld.
  bool redacted = 8;
}

// The kinds of file `ApplyEdits` writes.
enum WorkspaceFileMode {
  // A regular file.
  WORKSPACE_FILE_MODE_UNSPECIFIED = 0;
  WORKSPACE_FILE_MODE_REGULAR = 1;
  WORKSPACE_FILE_MODE_EXECUTABLE = 2;
  // A symbolic link; the contents are its target.
  WORKSPACE_FILE_MODE_SYMLINK = 3;
}

// Writes a file, replacing what is at the path (a directory too).
message FileWrite {
  string path = 1;
  bytes content = 2;
  WorkspaceFileMode mode = 3;
}

// Deletes a file, or a directory and everything below it.
message FileDelete {
  string path = 1;
}

// Moves a file to a new path, replacing what is there.
message FileRename {
  string old_path = 1;
  string new_path = 2;
}

// One edit; edits apply in order.
message WorkspaceEdit {
  oneof edit {
    FileWrite write = 1;
    FileDelete delete = 2;
    FileRename rename = 3;
  }
}

message ApplyEditsRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  // The snapshot the edits apply to; the new one is `expect_n + 1`.
  uint64 expect_n = 4;
  repeated WorkspaceEdit edits = 5;
  // Also stage the edits (as `git add` of every path they touch), which
  // resolves conflicts at those paths.
  bool stage = 6;
  // The mount writing the new snapshot, when known.
  string writer = 7;
  string idempotency_key = 15;
}

message ApplyEditsResponse {
  Snapshot snapshot = 1;
}

// What `Diff` compares the worktree with.
enum DiffAgainst {
  // HEAD.
  DIFF_AGAINST_UNSPECIFIED = 0;
  // HEAD's tree (the empty tree when unborn): `git diff HEAD`.
  DIFF_AGAINST_HEAD = 1;
  // The commit the workspace was last rebased onto.
  DIFF_AGAINST_BASE = 2;
  // The index: `git diff`.
  DIFF_AGAINST_INDEX = 3;
  // `commit`.
  DIFF_AGAINST_COMMIT = 4;
}

message DiffRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  // The snapshot diffed; unset is the latest.
  optional uint64 n = 4;
  DiffAgainst against = 5;
  // The commit, with `DIFF_AGAINST_COMMIT`.
  string commit = 6;
  // Literal paths (a path matches itself and what is below it); empty is
  // every path.
  repeated string paths = 7;
}

// One file's patch, or the next part of one.
message DiffResponse {
  string path = 1;
  bytes patch = 2;
}

message RebaseRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  // The commit to rebase onto; empty is `track`'s tip.
  string onto = 4;
  // The mount writing the new snapshot, when known.
  string writer = 5;
  string idempotency_key = 15;
}

message RebaseResponse {
  Snapshot snapshot = 1;
  // The paths that did not merge cleanly, now among the snapshot's
  // conflicts.
  repeated string conflicts = 2;
}

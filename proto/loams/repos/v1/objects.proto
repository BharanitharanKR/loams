syntax = "proto3";

// Loams Git: `ObjectService`, lazy object reads for workspaces and their
// clients (design §36 §19.5, §19.8, §19.10, D829, D830, D833; plan GT1
// Tasks 18, 20, 21 and 24). This file holds the object reads, the history
// queries `Log`, `DiffStat`, `Blame` and `Grep`, and the upload
// `PutWorkspacePack`. See `repos.proto` for the package's rules.
//
// Every request names its repository as `RepoService` does (`namespace`,
// `name`). `workspace` is optional: when set, the workspace's packs are read
// after the repository's, and objects only in them are readable only this
// way (`workspace_not_found` for a workspace the repository does not have).
// Object ids are 40 lowercase hex digits. A read given a
// `consistency_token` reads at least that seq, and every answer carries the
// token of the seq it read.
package loams.repos.v1;

import "loams/options/v1/options.proto";

// Batched, lazy reads of objects and trees.
service ObjectService {
  option (loams.options.v1.module) = {
    name: "repos"
    summary: "Loams Git: lazy object and tree reads for workspaces and their clients."
    unstable: true
  };

  // Up to 1,024 objects, streamed in pack order (not request order): each
  // object as one or more chunks, then one `missing` message per object the
  // repository does not hold. More than 1,024 ids is `invalid_argument`.
  rpc GetObjects(GetObjectsRequest) returns (stream GetObjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // A tree and its subtrees to `depth`, each entry with its size, so a
  // client lists and stats files without fetching them.
  rpc GetTrees(GetTreesRequest) returns (GetTreesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Which of up to 1,024 objects the repository (and the workspace) holds.
  rpc HasObjects(HasObjectsRequest) returns (HasObjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The commits `revs` reach, in `git log`'s order and with its default
  // history simplification for `paths`, one commit per message. The shim
  // formats them as git does. Walks the commit graph, which the first call
  // at a new seq extends (§19.8).
  rpc Log(LogRequest) returns (stream LogResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Per-file added and removed lines between two trees, as
  // `git diff --numstat --no-renames` counts them.
  rpc DiffStat(DiffStatRequest) returns (DiffStatResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Which commit wrote each line of a file, as `git blame --porcelain`
  // attributes them (renames followed). Computed once per file and commit
  // and stored. A file whose history the server cannot walk answers
  // `not_implemented`, and the shim runs git.
  rpc Blame(BlameRequest) returns (BlameResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // `git grep` over a commit's or tree's regular files: one message per file
  // with a match, in path order. Stops after 30 s or 10,000 matching lines
  // (files, with `files_only`), and says which.
  rpc Grep(GrepRequest) returns (stream GrepResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Uploads the objects a workspace made as one pack bundle (`.lpk`: the
  // pack, its version 2 idx, and the 32-byte footer; §36 §4.3) and stores
  // it create-only under the workspace, named by its checksum (§19.5.2).
  // The first message names the repository and the workspace; every
  // message carries the bundle's next bytes. Before anything is stored,
  // every object must hash to the id the idx gives it and parse as its
  // kind, the idx must name every entry of the pack once, no delta may
  // have its base outside the pack, and the bundle is at most 2 GiB
  // (`invalid_argument` otherwise). Writing needs the workspace's owner or
  // an org admin (`permission_denied`). Storing a pack again answers the
  // same `pack` with `existed` set. The snapshot that names the pack is the
  // commit point; a pack no snapshot names is collected after an hour.
  rpc PutWorkspacePack(stream PutWorkspacePackRequest) returns (PutWorkspacePackResponse);
}

// An object's kind.
enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_COMMIT = 1;
  OBJECT_KIND_TREE = 2;
  OBJECT_KIND_BLOB = 3;
  OBJECT_KIND_TAG = 4;
}

message GetObjectsRequest {
  string namespace = 1;
  string name = 2;
  // A workspace id ("w" + 26 lowercase ULID characters), or empty.
  string workspace = 3;
  // At most 1,024; duplicates are answered once.
  repeated string oids = 4;
  string consistency_token = 14;
}

// One chunk of one object, or one missing object. An object larger than
// 1 MiB comes in several chunks, in order, with the same `oid`; the last
// one ends at `size`.
message GetObjectsResponse {
  string oid = 1;
  ObjectKind kind = 2;
  // The object's whole size.
  uint64 size = 3;
  // Where `data` starts in the object.
  uint64 offset = 4;
  bytes data = 5;
  // Neither the repository nor the workspace holds `oid`.
  bool missing = 6;
  string consistency_token = 14;
}

message GetTreesRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  // A tree, or a commit or tag (peeled to its tree).
  string root = 4;
  // Levels below the root: 0 is the root alone; unset is 2; at most 8.
  optional uint32 depth = 5;
  string consistency_token = 14;
}

message GetTreesResponse {
  // Breadth first from the root, each tree once.
  repeated Tree trees = 1;
  // The walk stopped at 1,024 trees before `depth`.
  bool truncated = 2;
  string consistency_token = 14;
}

// A tree with its entries' sizes.
message Tree {
  string oid = 1;
  repeated TreeEntry entries = 2;
}

message TreeEntry {
  bytes name = 1;
  // git's mode bits: 0o100644, 0o100755, 0o120000, 0o40000 or 0o160000.
  uint32 mode = 2;
  string oid = 3;
  // Set for blobs and symlinks; unset for trees and submodules.
  optional uint64 size = 4;
}

message HasObjectsRequest {
  string namespace = 1;
  string name = 2;
  string workspace = 3;
  // At most 1,024.
  repeated string oids = 4;
  string consistency_token = 14;
}

message HasObjectsResponse {
  // Bit `i % 8` (least significant first) of byte `i / 8` is set when
  // object `i` of the request is held.
  bytes present = 1;
  string consistency_token = 14;
}

// What a `LogCommit` carries besides its id, tree and parents.
enum LogField {
  LOG_FIELD_UNSPECIFIED = 0;
  // `author` and `committer`.
  LOG_FIELD_SIGNATURES = 1;
  LOG_FIELD_MESSAGE = 2;
  // `changed`: the paths changed against the first parent.
  LOG_FIELD_CHANGED = 3;
}

message LogRequest {
  string namespace = 1;
  string name = 2;
  // Each `X` (a ref name, a short name as git resolves it, `HEAD` or 40
  // hex digits), `^X` (excluded), or `A..B` (`A` excluded; an empty side
  // is `HEAD`). `A...B` is refused. Empty is `HEAD`; at most 64.
  repeated string revs = 3;
  // Literal paths (a file or a directory, matching everything below it);
  // globs and pathspec magic are `invalid_argument`. At most 64.
  repeated string paths = 4;
  // The most commits answered; unset is all.
  optional uint32 limit = 5;
  // Empty is signatures and message.
  repeated LogField fields = 6;
  string consistency_token = 14;
}

message LogResponse {
  LogCommit commit = 1;
  string consistency_token = 14;
}

message LogCommit {
  string oid = 1;
  string tree = 2;
  // The true parents, in order (never the simplified ones).
  repeated string parents = 3;
  Signature author = 4;
  Signature committer = 5;
  // The message as stored, after the headers.
  bytes message = 6;
  // With `LOG_FIELD_CHANGED`: against the first parent (the empty tree for
  // a root), restricted to `paths`.
  repeated ChangedPath changed = 7;
}

message Signature {
  bytes name = 1;
  bytes email = 2;
  // Seconds since the epoch.
  int64 time = 3;
  // As stored, for example "+0530".
  string tz = 4;
}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_ADDED = 1;
  CHANGE_KIND_DELETED = 2;
  CHANGE_KIND_MODIFIED = 3;
  // Between a file, a symlink and a submodule.
  CHANGE_KIND_TYPE_CHANGED = 4;
}

message ChangedPath {
  bytes path = 1;
  ChangeKind kind = 2;
  // Unset when added.
  optional uint32 old_mode = 3;
  string old_oid = 4;
  // Unset when deleted.
  optional uint32 new_mode = 5;
  string new_oid = 6;
}

message DiffStatRequest {
  string namespace = 1;
  string name = 2;
  // A workspace whose packs are read after the repository's, or empty.
  string workspace = 3;
  // Revisions as `LogRequest.revs` names them (a commit, tag or tree).
  string from_rev = 4;
  string to_rev = 5;
  // Literal paths, as `LogRequest.paths`.
  repeated string paths = 6;
  string consistency_token = 14;
}

message DiffStatResponse {
  // In git's order.
  repeated FileStat files = 1;
  string consistency_token = 14;
}

message FileStat {
  ChangedPath change = 1;
  // Both unset for a binary file (`-` in `--numstat`).
  optional uint64 added = 2;
  optional uint64 removed = 3;
}

message BlameRequest {
  string namespace = 1;
  string name = 2;
  // A revision as `LogRequest.revs` names one (a tag is peeled to its
  // commit); empty is `HEAD`.
  string rev = 3;
  // The file's path.
  string path = 4;
  // Lines, 1-based and inclusive (`git blame -L a,b`); both unset is the
  // whole file. An end past the last line is cut to it; a start past it is
  // `invalid_argument`.
  optional uint32 start_line = 5;
  optional uint32 end_line = 6;
  string consistency_token = 14;
}

message BlameResponse {
  // The commit blamed at, and the file's blob there (read it with
  // `GetObjects` for the lines' text).
  string commit = 1;
  string blob = 2;
  // Lines in the file.
  uint32 lines = 3;
  // The runs of the asked lines, in order.
  repeated BlameHunk hunks = 4;
  // Every commit a run names, in the order they first appear.
  repeated BlameCommit commits = 5;
  string consistency_token = 14;
}

message BlameHunk {
  // The run's first line in the file, and in the commit that wrote it
  // (both 1-based), and its length.
  uint32 start_line = 1;
  uint32 source_line = 2;
  uint32 lines = 3;
  string commit = 4;
  // The path in `commit`, when the file was renamed since; else empty.
  bytes source_path = 5;
  // The parent `commit` was compared against and the path there
  // (porcelain's `previous`); empty when `commit` added the file.
  string previous = 6;
  bytes previous_path = 7;
}

message BlameCommit {
  string oid = 1;
  Signature author = 2;
  Signature committer = 3;
  // The subject: the message's first paragraph on one line.
  bytes summary = 4;
  // A root commit (porcelain's `boundary`).
  bool boundary = 5;
}

message GrepRequest {
  string namespace = 1;
  string name = 2;
  // A workspace whose packs are read after the repository's, or empty.
  string workspace = 3;
  // A commit, tag or tree, as `DiffStatRequest` names them; empty is `HEAD`.
  string rev = 4;
  // Patterns (`-e`), any of which matches; at least one, at most 64.
  // POSIX basic expressions by default; back-references, and patterns that
  // match an empty line, are `invalid_argument`.
  repeated string patterns = 5;
  // Literal paths, as `LogRequest.paths`.
  repeated string paths = 6;
  bool ignore_case = 7;       // -i
  bool word = 8;              // -w
  bool fixed_strings = 9;     // -F
  bool extended = 10;         // -E
  bool files_only = 11;       // -l
  // The most matching lines (files, with `files_only`); unset or over
  // 10,000 is 10,000.
  optional uint32 max_matches = 12;
  string consistency_token = 14;
}

message GrepResponse {
  // A file with a match; unset on the last message.
  GrepFile file = 1;
  // On the last message: the search stopped at the match limit, or at the
  // deadline. Files after it were not searched.
  bool truncated = 2;
  bool deadline_exceeded = 3;
  // Whether this is the last message.
  bool done = 4;
  string consistency_token = 14;
}

message GrepFile {
  bytes path = 1;
  string blob = 2;
  // A NUL in the first 8,000 bytes: git prints `Binary file <path> matches`
  // and `lines` is empty.
  bool binary = 3;
  // Empty with `files_only`.
  repeated GrepLine lines = 4;
}

message GrepLine {
  // 1-based.
  uint64 number = 1;
  // Without its newline.
  bytes line = 2;
}

message PutWorkspacePackRequest {
  // Set on the first message; ignored on the others.
  string namespace = 1;
  string name = 2;
  // The workspace ("w" + 26 lowercase ULID characters); required.
  string workspace = 3;
  // The bundle's next bytes.
  bytes data = 4;
  // Accepted for the package's rules; the upload is idempotent on its
  // content, so a retry needs no key.
  string idempotency_key = 15;
}

message PutWorkspacePackResponse {
  // The stored pack, as a snapshot's `packs` names it.
  PackRef pack = 1;
  // The workspace already held this pack.
  bool existed = 2;
}

// A pack bundle in a repository's or workspace's pack set.
message PackRef {
  // The pack's SHA-1 trailer, 40 lowercase hex digits: its name.
  string checksum = 1;
  uint64 object_count = 2;
  // Bytes of the pack section, which starts at offset 0.
  uint64 pack_len = 3;
  // Where the idx section starts, and its bytes.
  uint64 idx_offset = 4;
  uint64 idx_len = 5;
}

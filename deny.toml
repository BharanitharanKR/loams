# cargo-deny policy. See CONTRIBUTING.md "Dependency licenses".
[graph]
all-features = true

[licenses]
# Permissive licenses only. AGPL/GPL/LGPL/BUSL-1.1/SSPL/ELv2 and proprietary licenses are not allowed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # Boost Software License 1.0 (xxhash-rust), not the Business Source License
    "BSL-1.0",
    # libbz2-rs-sys, via datafusion-datasource
    "bzip2-1.0.6",
    # BSD Zero Clause (tslib, via echarts in the console). Owner, 2026-10-13
    # (SD1 ruling T2-6): allowed everywhere, for crates and npm alike.
    "0BSD",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# The desktop agent daemon (design §50 §4.1, DD1 plan T0-4, T0-10a): the code
# moved from the zeron fork into crates/loams-agentd* is MIT, except
# loams-agentd-link (Apache-2.0, Loams-authored). Its new dependencies need no
# entry beyond the list above: CC0-1.0 (notify), MPL-2.0 (nucleo-matcher) and
# MPL-2.0+ (im, bitmaps and sized-chunks, through loro; the `+` is satisfied
# by MPL-2.0, so no [[licenses.clarify]] is needed). `cargo deny check
# licenses` passed on 2026-10-10 with no change here.

# stringmetrics (via httpmock, dev tooling in loams-console-mock) states its
# license only as a LICENSE file: Apache-2.0.
[[licenses.clarify]]
crate = "stringmetrics"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0fb72a18 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

# Known findings with no entry below, because the advisory database cargo-deny
# reads does not fail on them (GitHub's advisory database reports them, so they
# show as Dependabot alerts). Revisit both by 2026-11-30.
#
# * thrift 0.17.0, GHSA-2f9f-gq7v-9h6m (allocation of an excessive size; fixed in
#   0.23.0). Only parquet 58.4.0 brings it, which asks for thrift `^0.17`, and only
#   loams-graph uses parquet: portable snapshots (snapshot/portable.rs) that Loams
#   writes under the graph's own store prefix and reads back on restore. parquet
#   59 drops thrift, but it needs arrow 59 while the workspace (and DataFusion) is
#   on arrow 58; lifted with the workspace's move to arrow 59 or later.
# * rand 0.7.3, GHSA-cq8v-f236-94qc / RUSTSEC-2026-0097 (unsound with a custom
#   logger that calls thread_rng). No 0.7.x release is fixed. It comes only through
#   qdrant-edge 0.8.0 > permutation_iterator 0.1.2 (loams-hnsw), which asks for
#   rand `^0.7`, and it is built without its `log` feature, which the advisory
#   needs, so it is not reachable. Lifted when qdrant-edge drops permutation_iterator.
[advisories]
yanked = "deny"
# Only fail on unmaintained crates we depend on directly; transitive ones are tracked upstream.
unmaintained = "workspace"
ignore = [
    # No fixed rsa release exists (the Marvin timing attack). It is reached
    # only through sqlx-mysql, which uses it for the RSA password exchange of
    # caching_sha2_password/sha256_password on a non-TLS connection.
    { id = "RUSTSEC-2023-0071", reason = "rsa via sqlx-mysql: used only for RSA password exchange on non-TLS MySQL connections; Loams connects to TiDB over TLS or the cluster network with mysql_native_password (§21 §11.2)" },
    # zip yanked every 7.x and 8.x release; the only unyanked one, 9.0.3
    # (2026-10-13), is under the 14-day age rule and a major bump for
    # loams-agentd-harness. No RUSTSEC advisory names 7.2.0. Remove this entry
    # with the bump to 9.x, after 2026-10-27.
    { crate = "zip@7.2.0", reason = "yanked upstream with its whole major line; the replacement 9.0.3 is under 14 days old (revisit 2026-10-27)" },
    # zip 7.2.0 extract() advisories (fixed in zip >= 9.0.0): Loams uses its own
    # extractor, so none is reachable. Remove with the zip 9.x bump, after 2026-10-30.
    { id = "RUSTSEC-2026-0367", reason = "zip SUID/SGID bit preservation: not reachable. Loams never calls ZipArchive::extract or ZipStreamReader::extract: archive_install.rs extracts entry by entry, rejects link and special-file entries, confines paths with enclosed_name, and never applies archive permission bits; remove with the zip 9.x bump on or after 2026-10-30 (zip 9.0.4 turns 14 days old)" },
    { id = "RUSTSEC-2026-0368", reason = "zip symlink target escape in extract: not reachable. Loams never calls ZipArchive::extract or ZipStreamReader::extract: archive_install.rs extracts entry by entry, rejects link and special-file entries, confines paths with enclosed_name, and never applies archive permission bits; remove with the zip 9.x bump on or after 2026-10-30 (zip 9.0.4 turns 14 days old)" },
    { id = "RUSTSEC-2026-0369", reason = "zip permissions applied through symlinks in extract: not reachable. Loams never calls ZipArchive::extract or ZipStreamReader::extract: archive_install.rs extracts entry by entry, rejects link and special-file entries, confines paths with enclosed_name, and never applies archive permission bits; remove with the zip 9.x bump on or after 2026-10-30 (zip 9.0.4 turns 14 days old)" },
    # webpki-roots 0.26.11 is a shim with no roots of its own: it re-exports
    # webpki-roots 1.x, which is at 1.0.10 (emSign removed) in this lock. Reached
    # through sqlx-core 0.8 and tokio-tungstenite 0.24; remove when they move to 1.x.
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11 re-exports webpki-roots 1.0.10, which drops the distrusted emSign roots; the 0.26 shim carries no certificates" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# tikv-client is pinned by rev to Loams's fork, branch `loam` (R1 plan rows R4
# and F1). Resonate is pinned by rev to the fork's loam/0.10.1 (D1 plan Task
# 1, D140). Grafeo is pinned by rev to Loams's fork, a release tag
# `v0.5.43-loams.<n>` on branch `loams/v0.5.43-patches` (patch queue in the
# fork's PATCHES.md).
# network_partitions (Leiden, MIT) is pinned by rev to Microsoft's
# graspologic-native tag v1.3.1; it is not on crates.io (GR1 Task 22, R22.3).
# The Neon fork is not allowed here: only crates/loams-wal-decoder, a
# workspace of its own with its own deny.toml, may use it, and
# scripts/pg2/check-decoder-deny.py fails if this lockfile names it.
allow-git = ["https://github.com/ostrium-labs/client-rust", "https://github.com/ostrium-labs/resonate", "https://github.com/ostrium-labs/grafeo", "https://github.com/microsoft/graspologic-native"]

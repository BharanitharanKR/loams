# Azure Event Hubs — a target profile on the native Kafka family (CN2 OR-22,
# Task 9). Event Hubs speaks the Kafka protocol on its Kafka endpoint, so
# `loams-connector-kafka` serves it, with no Azure-specific SDK: SASL PLAIN,
# the username `$ConnectionString` and the namespace's connection string as
# the password (a secret the instance names in `sasl.password`), TLS on 9093.
# Kafka consumer groups are Event Hubs consumer groups (`group_id`).
#
# Its suite runs against Event Hubs itself (OR-2): the emulator (Microsoft
# EULA, a `ci-service`, OR-3; SASL_PLAINTEXT on 9092, so the CI instance sets
# `security_protocol: sasl_plaintext`) in PR CI, and a real namespace nightly.
#
# narrows (R0.19): `sink.transactional` — the emulator has no Kafka
# transactions and the cloud offers them only in preview on Premium and
# Dedicated, so the sink is `effectively_once` through the idempotent
# producer and the factory refuses `delivery: exactly_once`. With the
# transactions goes the compacted `__loams_checkpoints` topic, which only
# the transactional sink uses (Event Hubs has no log compaction on the
# emulator either). The manifest that names this profile carries a
# `narrows: sink.transactional …` note (R7.3).
apiVersion: loams.flow/v1
kind: Profile
id: azure-event-hubs
profile_kind: target
module: kafka
system:
  name: Azure Event Hubs
  service: { compose: eventhubs }
defaults:
  security_protocol: sasl_ssl
  sasl:
    mechanism: plain
    username: $ConnectionString
narrows:
  - sink.transactional

# Salesforce — an HTTP-API profile (CN2 OR-11, Task 20): REST and Bulk API
# 2.0 natively; CDC stays on the Camel `salesforce` fallback until Task 23
# (OR-4, the manifest's `runtime.fallback`). Written from Salesforce's public
# references (API version 62.0):
#   REST query (nextRecordsUrl):
#     https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_query.htm
#   Bulk API 2.0 query jobs (create, poll, CSV results with Sforce-Locator):
#     https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/queries.htm
#     https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/query_get_job_results.htm
#   sObject Collections upsert (by external id, 200 records a request):
#     https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_composite_sobjects_collections_upsert.htm
#   OAuth 2.0 refresh-token flow:
#     https://help.salesforce.com/s/articleView?id=xcloud.remoteaccess_oauth_refresh_token_flow.htm
# `instance_url` is the org's My Domain URL; `soql` the query of `query` and
# `bulk_query`; `sobject` and `external_id_field` the upsert target. No
# generated DTOs: the engine is JSON (CSV for Bulk results).
apiVersion: loams.flow/v1
kind: Profile
id: salesforce
profile_kind: http-api
module: http
system:
  name: Salesforce
  service: { fixture: conformance/connectors/fixtures/salesforce }
defaults: {}
narrows: []
http:
  base_url: "{config.instance_url}/services/data/v62.0"
  auth:
    scheme: oauth2
    token_url: "https://login.salesforce.com/services/oauth2/token"
  headers: { Accept: application/json }
  resources:
    query:
      list:
        method: GET
        path: "/query"
        items: "/records"
        next_url: "/nextRecordsUrl"
        key: "/Id"
        query: { q: "{config.soql}" }
    bulk_query:
      async_job:
        create:
          method: POST
          path: "/jobs/query"
          body: { operation: query, query: "{config.soql}", contentType: CSV }
        id: "/id"
        poll:
          method: GET
          path: "/jobs/query/{id}"
          state: "/state"
          done: [JobComplete]
          failed: [Failed, Aborted]
          interval_ms: 2000
        results:
          method: GET
          path: "/jobs/query/{id}/results"
          format: csv
          cursor: { next: Sforce-Locator, param: locator, from: header }
          key: "/Id"
          query: { maxRecords: "50000" }
    records:
      upsert:
        method: PATCH
        path: "/composite/sobjects/{config.sobject}/{config.external_id_field}"
        batch: 200
        key: "/{config.external_id_field}"
        body: "/records"
        envelope: { allOrNone: false }
  rate_limit:
    requests: 25
    per_seconds: 1
    honour_headers: ["Retry-After"]

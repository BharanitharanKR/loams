# Stripe — an HTTP-API profile (CN2 OR-11, Task 20). Written from Stripe's
# public API reference:
#   Customers: https://docs.stripe.com/api/customers
#   Pagination (starting_after, has_more): https://docs.stripe.com/api/pagination
#   Idempotent requests: https://docs.stripe.com/api/idempotent_requests
#   Form-encoded bodies: https://docs.stripe.com/api/expanding_objects (and every POST's curl example)
#   Webhook signatures (Stripe-Signature, v1): https://docs.stripe.com/webhooks#verify-manually
# PR CI runs against stripe-mock (the vendor's emulator, `connectors-p2`); the
# nightly job uses a test-mode key (OR-3). Writes carry `Idempotency-Key`, so
# a retry creates nothing twice (effectively once).
apiVersion: loams.flow/v1
kind: Profile
id: stripe
profile_kind: http-api
module: http
system:
  name: Stripe
  service: { compose: stripe-mock }
defaults: {}
narrows: []
http:
  base_url: "https://api.stripe.com"
  auth: { scheme: bearer }
  resources:
    customers:
      list:
        method: GET
        path: "/v1/customers"
        items: "/data"
        cursor: { next: "/id", param: starting_after, from: last_item, more: "/has_more" }
        key: "/id"
        query: { limit: "100" }
      create:
        method: POST
        path: "/v1/customers"
        encoding: form
        idempotency_key: true
    charges:
      list:
        method: GET
        path: "/v1/charges"
        items: "/data"
        cursor: { next: "/id", param: starting_after, from: last_item, more: "/has_more" }
        key: "/id"
        query: { limit: "100" }
  rate_limit:
    requests: 100
    per_seconds: 1
    honour_headers: ["Retry-After"]
  webhook: { scheme: stripe, header: Stripe-Signature }

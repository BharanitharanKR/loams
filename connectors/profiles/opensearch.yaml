# OpenSearch — a target profile on the native search family (CN2 OR-2, Task 15).
# OpenSearch speaks Elasticsearch's REST API for `_bulk` and `_search`, so
# `loams-connector-search` serves it; its own manifest (Task 2) names this
# profile, and its suite runs against OpenSearch itself (3.9.0, Apache-2.0,
# the `connectors-p2` stack), never against Elasticsearch. Amazon OpenSearch
# Service (SigV4, the manifest's `iam`) runs in the nightly job.
#
# What differs is set as defaults, not narrowed, because no capability is
# lost (ruling R15.4):
#   api: opensearch       the point-in-time API is OpenSearch's own (since
#                         2.4): POST /<index>/_search/point_in_time, `pit_id`
#                         in the answer, DELETE /_search/point_in_time with a
#                         `pit_id` list.
#   source.tiebreaker     `_id`, because OpenSearch documents no `_shard_doc`
#                         sort; unverified on 3.x until the suite runs.
apiVersion: loams.flow/v1
kind: Profile
id: opensearch
profile_kind: target
module: search
system:
  name: OpenSearch
  service: { compose: opensearch }
defaults:
  api: opensearch
  source:
    tiebreaker: _id
narrows: []

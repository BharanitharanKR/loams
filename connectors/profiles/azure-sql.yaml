# Azure SQL Database — a target profile on the native SQL Server family (CN2
# OR-2, Task 12). Azure SQL speaks TDS, so `loams-connector-sqlserver` serves
# it with the same batch source, change-table CDC source and exactly-once
# MERGE sink. Azure SQL has no image: its suites run nightly against a real
# database (OR-3, OR-23); SQL Server Developer in compose is an extra target,
# never the system under test. The default login is a Microsoft Entra ID
# service principal (`auth: entra`), whose client secret the instance names
# by secret; the profile carries none. TDS 8.0 `strict` encryption is the
# only mode: Azure SQL refuses an unencrypted login.
apiVersion: loams.flow/v1
kind: Profile
id: azure-sql
profile_kind: target
module: sqlserver
system:
  name: Azure SQL Database
  service: { nightly: [LOAMS_AZURE_SQL_URL] }
defaults: { auth: entra, encrypt: strict, port: 1433 }
narrows: []

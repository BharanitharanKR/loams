# Splunk — an HTTP-API profile (CN2 OR-11, Task 20): a HEC sink with indexer
# acknowledgement, and a search-export source. Written from Splunk's public
# documentation:
#   HEC endpoints (/services/collector/event, /services/collector/ack):
#     https://docs.splunk.com/Documentation/Splunk/latest/Data/HECRESTendpoints
#   Indexer acknowledgement (X-Splunk-Request-Channel, ackId, {"acks": …}):
#     https://docs.splunk.com/Documentation/Splunk/latest/Data/AboutHECIDXAck
#   HEC token auth (`Authorization: Splunk <token>`):
#     https://docs.splunk.com/Documentation/Splunk/latest/Data/FormateventsforHTTPEventCollector
#   Search export (one JSON result per line):
#     https://docs.splunk.com/Documentation/Splunk/latest/RESTREF/RESTsearch#search.2Fv2.2Fjobs.2Fexport
# HEC (port 8088) and the management API (8089) are different origins, so an
# instance sets `server_url` to the one its resource uses; `auth.api_key`
# names the HEC token's secret (events) or a session key's (search). A batch
# counts as written only once Splunk acknowledges it as indexed; an
# unacknowledged batch is resent, so the sink is at least once (HEC does not
# deduplicate; R20.8). PR CI runs against Splunk Enterprise (`ci-service`,
# OR-3).
apiVersion: loams.flow/v1
kind: Profile
id: splunk
profile_kind: http-api
module: http
system:
  name: Splunk Enterprise
  service: { compose: splunk }
defaults:
  earliest_time: "-24h"
  search: "search index=main"
narrows: []
http:
  base_url: "{config.server_url}"
  auth: { scheme: header, header: Authorization, prefix: "Splunk " }
  resources:
    events:
      create:
        method: POST
        path: "/services/collector/event"
        batch: 100
        encoding: ndjson
        wrap: "/event"
        ack:
          path: "/services/collector/ack"
          id: "/ackId"
          request: "/acks"
          status: "/acks"
          channel_header: X-Splunk-Request-Channel
          interval_ms: 500
          timeout_ms: 120000
    search:
      list:
        method: GET
        path: "/services/search/v2/jobs/export"
        format: ndjson
        items: "/result"
        event: log
        query:
          search: "{config.search}"
          earliest_time: "{config.earliest_time}"
          output_mode: json

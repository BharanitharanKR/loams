# GitLab — an HTTP-API profile (CN2 OR-11, Task 20). Written from GitLab's
# public REST API v4 reference:
#   Issues: https://docs.gitlab.com/api/issues/
#   Pagination (Link headers): https://docs.gitlab.com/api/rest/#pagination
#   Personal/project access tokens (PRIVATE-TOKEN): https://docs.gitlab.com/api/rest/authentication/
#   Rate-limit headers: https://docs.gitlab.com/user/gitlab_com/#rate-limits-on-gitlabcom
#   Webhook secret token (X-Gitlab-Token): https://docs.gitlab.com/user/project/integrations/webhooks/
# `project` is the numeric id or the `group/project` path (the engine encodes
# it into the URL path; give it unencoded). A
# self-managed instance sets `base_url` (`https://gitlab.example/api/v4`).
apiVersion: loams.flow/v1
kind: Profile
id: gitlab
profile_kind: http-api
module: http
system:
  name: GitLab
  service: { fixture: conformance/connectors/fixtures/gitlab }
defaults: {}
narrows: []
http:
  base_url: "https://gitlab.com/api/v4"
  auth: { scheme: header, header: PRIVATE-TOKEN }
  resources:
    issues:
      list:
        method: GET
        path: "/projects/{config.project}/issues"
        key: "/id"
        query: { per_page: "100", scope: all, order_by: updated_at, sort: asc }
      create:
        method: POST
        path: "/projects/{config.project}/issues"
  rate_limit:
    requests: 2000
    per_seconds: 60
    honour_headers: ["Retry-After", "RateLimit-Remaining", "RateLimit-Reset"]
  webhook: { scheme: token, header: X-Gitlab-Token }

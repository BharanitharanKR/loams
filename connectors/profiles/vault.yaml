# Vault — an HTTP-API profile (CN2 OR-11, Task 20) for a user's own Vault or
# OpenBao server, over the KV version 2 secrets engine. This is a connector to
# an external system, NOT Loams' own secret store (CN1 Task 3's SecretStore,
# OR-21's KubeSecretStore): data moved through it is data, and the manifest
# says so. Written from the public API references:
#   OpenBao KV v2: https://openbao.org/api-docs/secret/kv/kv-v2/
#   HashiCorp Vault KV v2: https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2
#   Token header (X-Vault-Token): https://developer.hashicorp.com/vault/api-docs#authentication
#   LIST as GET ?list=true: https://developer.hashicorp.com/vault/api-docs#api-operations
# PR CI runs against OpenBao (MPL-2.0, `connectors-p2`); HashiCorp Vault
# (BUSL) is never run. `address` is the server URL; `mount` the KV v2 mount
# (default `secret`). A written item is `{ "path": …, "data": { … } }`; a
# write is idempotent by `path` (a rewrite stores a new version of the same
# secret). The source lists the mount's top-level keys.
apiVersion: loams.flow/v1
kind: Profile
id: vault
profile_kind: http-api
module: http
system:
  name: OpenBao
  service: { compose: openbao }
defaults:
  mount: secret
narrows: []
http:
  base_url: "{config.address}"
  auth: { scheme: header, header: X-Vault-Token }
  resources:
    keys:
      list:
        method: GET
        path: "/v1/{config.mount}/metadata/"
        items: "/data/keys"
        query: { list: "true" }
    kv:
      upsert:
        method: POST
        path: "/v1/{config.mount}/data/{item:/path}"
        key: "/path"
        select: "/data"
        wrap: "/data"

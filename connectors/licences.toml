# ----------------------------------------------------------------------------------------
# Appendix A.18's Loams applications. These are `kind = "service"`: Loams neither
# ships nor links any of them, and reaches each over its public HTTP API, which is
# D359's carve-out. They are listed so that D359's "every runtime component and
# driver is named" is literally true for every manifest in the registry, not so
# that the gate can license-check code it does not contain.
# ----------------------------------------------------------------------------------------

[components.zulip]
name = "Zulip"
spdx = "Apache-2.0"
kind = "service"
# A self-hosted Zulip realm, reached at its /api/v1 REST prefix (never /json/). Apache-2.0, and
# in any case an HTTP surface rather than a dependency (D359, D628, CN1 Task 15).
used_by = ["zulip"]
source = "https://zulip.com/api/"

[components.itsplane]
name = "ItsPlane"
spdx = "AGPL-3.0"
kind = "service"
# ItsPlane's upstream is **AGPL-3.0**, and it is deliberately NOT in [deny]. The deny list gates
# what Loams ships or links; this connector ships and links neither, and reaches ItsPlane only
# over its public HTTP API with an `x-api-key` header. That is the same position D359 takes for
# a SaaS service reached through its public API, and it is why the AGPL identifier appears here
# as an identifier and nowhere else: no AGPL text is vendored, and scripts/spec/provenance.sh
# passes. The gate's negative test proves the distinction is live — an AGPL row of
# kind = "library" is refused, this AGPL row of kind = "service" is accepted.
#
# This is ItsPlane, the self-hosted tracker in ostrium-labs/loams-plugins, not plane.so;
# CN1 "Rulings made during execution" row 12 records that identification.
used_by = ["itsplane"]
source = "https://github.com/ostrium-labs/loams-plugins/tree/main/packages/plugin-itsaplan-adapter"

[components.forgejo]
name = "Forgejo"
spdx = "MIT"
kind = "service"
# A self-hosted Forgejo server, reached at its /api/v1 REST prefix (not /api/forgejo/v1). MIT,
# and again an HTTP surface rather than a dependency (D359, D628, CN1 Task 15).
#
# One provisioning fact belongs here because it is not a code question: Forgejo derives a token's
# scope from the HTTP method its calls make, so the read scopes and `write:issue` cannot share a
# token. The manifest's `secrets` therefore names two credentials, and the write token must be
# minted before the sink can run.
used_by = ["forgejo"]
source = "https://codeberg.org/forgejo/forgejo"

# ----------------------------------------------------------------------------------------
# D359's carve-outs, in prose. The gate reads [deny] and [components]; this stanza is for the
# humans who ask why a component is or is not listed.
# ----------------------------------------------------------------------------------------

[notes]
saas_public_api = "A SaaS service that Loams reaches through its public API is not a licence question (D359): the gateway is Loams's own Apache-2.0 OpenAPI-generated connector, and the service's terms, not its source licence, are the operator's concern. That is why the A.9-A.12 SaaS rows have no component entry here, and why airbyte's ELv2 platform is a product decision rather than a gate failure."
airbyte = "Airbyte is not a runtime (D359): its platform is ELv2 and its connectors carry mixed licences, so CN1 reads its open connectors as API references only. Appendix A keeps the row, flagged, with runtime openapi."
redpanda_connect = "Redpanda Connect is not a runtime (D359): Apache-2.0 core plus the Redpanda Community License on part of its connectors, which is exactly the kind of mixed licence the gate refuses. Appendix A's `Redpanda` row is Kafka-protocol and runs through Camel's kafka component."
kafka_connect = "Kafka Connect is not a runtime in CN1 (D354, §32 Q331): it arrives only through Iggy's Kafka gateway once Iggy supports consumer groups with offsets. The Appendix A row is a P3 stub."
mysql_connector_j = "MySQL Connector/J is GPL-2.0 with the FOSS classpath exception and is neither shipped nor loaded by CN1 (CN1 Ruling 8): the operator mounts the JDBC driver directory and chooses. It is listed with its SPDX id so the gate can refuse or accept it explicitly, and no part of it is copied here."
test_services = "The services of the `connectors` compose profile (rustfs, lakekeeper, opensearch, valkey, floci) exist only for the contract tests of §33 §9 and the CN1 exit gate; they are not part of a Loams image."
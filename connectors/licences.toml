# ----------------------------------------------------------------------------------------
# D359's carve-outs, in prose. The gate reads [deny] and [components]; this stanza is for the
# humans who ask why a component is or is not listed.
# ----------------------------------------------------------------------------------------

[notes]
saas_public_api = "A SaaS service that Loams reaches through its public API is not a licence question (D359): the gateway is Loams's own Apache-2.0 OpenAPI-generated connector, and the service's terms, not its source licence, are the operator's concern. That is why the A.9-A.12 SaaS rows have no component entry here, and why airbyte's ELv2 platform is a product decision rather than a gate failure."
airbyte = "Airbyte is not a runtime (D359): its platform is ELv2 and its connectors carry mixed licences, so CN1 reads its open connectors as API references only. Appendix A keeps the row, flagged, with runtime openapi."
redpanda_connect = "Redpanda Connect is not a runtime (D359): Apache-2.0 core plus the Redpanda Community License on part of its connectors, which is exactly the kind of mixed licence the gate refuses. Appendix A's `Redpanda` row is Kafka-protocol and runs through Camel's kafka component."
kafka_connect = "Kafka Connect is not a runtime in CN1 (D354, §32 Q331): it arrives only through Iggy's Kafka gateway once Iggy supports consumer groups with offsets. The Appendix A row is a P3 stub."
mysql_connector_j = "MySQL Connector/J is GPL-2.0 with the FOSS classpath exception and is neither shipped nor loaded by CN1 (CN1 Ruling 8): the operator mounts the JDBC driver directory and chooses. It is listed with its SPDX id so the gate can refuse or accept it explicitly, and no part of it is copied here."
test_services = "The services of the `connectors` compose profile (rustfs, lakekeeper, opensearch, valkey, floci) exist only for the contract tests of §33 §9 and the CN1 exit gate; they are not part of a Loams image."
# Loams connector licence gate input (design §33 D359; CN1 Task 2).
#
# D359: every manifest names the licence of its runtime component and of every library or
# driver it loads, and CI refuses AGPL, BSL, SSPL, ELv2 and unlicensed dependencies (D11) for
# anything Loams ships or runs by default. This file is the gate's input: it lists each
# component with its SPDX id, so the gate can refuse a flagged one without parsing manifests.
# The gate's test is CN1 Task 2's `licence_gate_refuses_flagged`, which asserts that the ids
# under [deny] are refused; `scripts/connectors/gen_registry.py --check` reads the same file and
# fails when a component's spdx is refused, missing a source, or not an SPDX id.
#
# kinds: runtime (a runtime Loams supervises), driver (a driver or shared library loaded from a
# mounted directory or an allowlist), library (a Rust crate compiled into loams-flow),
# service (a service the test stack or a companion runs).
#
# Names: Loams, loams-*, io.loams.dev.* (owner rulings, 2026-10-01).

[deny]
# The ids CN1's licence gate refuses, in the order CN1's Global Constraints lists them:
# "CI refuses AGPL, BSL, SSPL, ELv2, NOASSERTION and unknown ids for anything in the image or
# the default compose" (D359). `unknown` is the literal id an unclassified component carries,
# and it is refused like a real id.
ids = [
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "BUSL-1.1",
  "SSPL-1.0",
  "Elastic-2.0",
  "NOASSERTION",
  "unknown",
]


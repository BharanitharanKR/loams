# process (since D741 and GR1 Task 1, `crates/loams-graph` in the engine workspace, linked by
# `loams` behind the `graph` feature), so these are compiled in and are not loaded from a mounted
# directory the way the JDBC drivers below are.
#
# They are named one per crate rather than as a single "grafeo" row because D359 asks for every
# library a shipped connector loads, and because the split is where the risk is recorded: D634(f)
# rules that Grafeo is a *test target* for GQL, not a foundation. Its 23 701 crates.io downloads
# are two orders of magnitude behind `neo4rs` and its performance claims are self-reported, so
# if Grafeo proves unmaintained the standard still stands and only the reference engine changes.
# No crate here is in [deny], and none needs to be: Apache-2.0 is not a refused id.
[components.grafeo]
name = "grafeo"
spdx = "Apache-2.0"
kind = "library"
# The facade crate Loams depends on, at 0.5.43 (D634).
used_by = ["grafeo"]
source = "https://crates.io/crates/grafeo"


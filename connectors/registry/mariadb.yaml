# MariaDB — P2 (§33 Appendix A.2), CN2 Task 11 (plan ruling R11.9).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the MySQL family `loams_connector_mysql` under the target
# profile `mariadb` (OR-2): the same batch source, binlog CDC with the DBLog
# snapshot and exactly-once upsert sink as `mysql`, with MariaDB's own GTIDs
# (domain-server-sequence, resumed through @slave_connect_state) and GTID events
# read by the family (R0.7). Debezium's MariaDB connector is the CDC fallback.
# The suite runs against MariaDB 11.8 LTS (compose `mariadb`), never against
# MySQL; the row stays `planned` until it is green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: mariadb
name: MariaDB
specVersion: 0.3.0
category: relational
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_mysql::MysqlFactory
  version: "mysql_common 0.37.3"
  profile: mariadb
  fallback:
    kind: debezium
    ref: io.debezium.connector.mariadb.MariaDbConnector
    directions: [source]
    replaced_by: CN2 Task 11
licence:
  component: Apache-2.0
  dependencies:
    mysql_common: Apache-2.0              # MIT OR Apache-2.0 (its Cargo.toml)
capabilities:
  source:
    streaming: true
    batch: true
    cdc: true                     # the row binlog; MariaDB logs v1 row events
    webhook: false
    resumable: true
    position: MariaDB's GTID list (the last GTID of each domain), with the schema history, for CDC; the last key delivered per table for batch reads
  sink:
    streaming: true
    batch: true
    transactional: true
    upsert: true
    delete: true
    idempotent: true
  delivery: { source: at_least_once, sink: exactly_once }
  ordering: per_key
  formats: [cloudevents-binary, cloudevents-structured, json, arrow]
  schema: { registry: none, evolution: backward }
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [basic]                     # client certificates (mtls) are not built
config:
  $ref: schemas/mariadb.config.json
secrets: [password]
envelope:
  emits: io.loams.dev.flow.mariadb.rows.v1
  consumes: "*"
  passthrough: false
  stable_ids: true                # CDC ids <domain>-<server>-<sequence>/<ordinal>
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, exactly-once, cdc, bulk, schema-evolution, backpressure, auth]
docs: docs/guides/connectors/mariadb.md
notes:
  - "types: `json` is an alias for longtext with a check constraint on MariaDB, so it maps as text"
  - "cdc: compressed binlog events (log_bin_compress = ON) are refused: turn it off. binlog_row_metadata defaults to MINIMAL, so the schema history names the columns (R11.5)"
  - "auth: Appendix A's mtls is not built; ed25519 and parsec are refused by name"

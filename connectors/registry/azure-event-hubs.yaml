# Azure Event Hubs — P2 (§33 Appendix A.1), CN2 Task 9. Hand-written by CN2
# Task 2's registry follow-up (R9.7), replacing the generated stub.
# Runtime: native Rust, loams-connector-kafka through the namespace's Kafka
# endpoint (OR-22), under the `azure-event-hubs` target profile: SASL PLAIN,
# the username `$ConnectionString`, TLS on 9093. No Azure SDK is involved.
# The profile narrows sink.transactional (R0.19), so the sink is
# effectively_once through the idempotent producer and `delivery: exactly_once`
# is refused (R9.10). The suites run against the Event Hubs emulator in CI
# (Microsoft EULA, a ci-service, OR-3) and a real namespace nightly. Status
# stays `planned` until they are green (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: azure-event-hubs
name: Azure Event Hubs
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_kafka::kafka
  version: "rdkafka 0.39.0 / librdkafka (built from source)"
  profile: azure-event-hubs
licence:
  component: Apache-2.0
  dependencies:
    librdkafka: BSD-2-Clause
    rdkafka: MIT
capabilities:
  source:
    streaming: true
    batch: false
    cdc: false
    webhook: false
    resumable: true                # offsets committed to the Event Hubs consumer group (R9.3)
    position: kafka-offsets
  sink:
    streaming: true
    batch: true
    transactional: false           # narrowed by the profile (R0.19)
    upsert: false
    delete: false
    idempotent: true               # the idempotent producer, enable.idempotence=true with acks=all
  delivery: { source: at_least_once, sink: effectively_once }
  ordering: per_partition
  formats: [cloudevents-binary, cloudevents-structured, json, bytes]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: push-with-ack
auth: [sasl-plain]                 # the namespace connection string as the SASL PLAIN password; Entra ID (OAUTHBEARER) is not built (R9.6)
config:
  $ref: schemas/azure-event-hubs.config.json
secrets: [sasl.password, tls.key_pem]
envelope:
  emits: io.loams.dev.flow.azure-event-hubs.record.v1
  consumes: "*"
  passthrough: true
  stable_ids: true                 # a record without ce_ headers gets <topic>/<partition>/<offset>
limits: { max_record_bytes: 1000000 }
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
docs: docs/guides/connectors/azure-event-hubs.md
notes:
  - 'narrows: delivery.sink is effectively_once through the idempotent producer, never exactly_once: the Event Hubs emulator has no Kafka transactions and the cloud offers them only in preview on Premium and Dedicated (CN2 R0.19); if Task 9 finds enable.idempotence refused, the sink narrows to at_least_once'
  - 'narrows: sink.transactional (profile azure-event-hubs): no Kafka transactions on the emulator, and only in preview on Premium and Dedicated in the cloud, so no transactional sink and no __loams_checkpoints topic (CN2 R0.19, R7.3, R9.7)'
  - "Topics (event hubs) and consumer groups are managed in Azure, not through the Kafka admin API."

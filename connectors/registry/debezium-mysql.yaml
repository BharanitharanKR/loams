# Debezium-MySQL — ★ connector 5 of §33 §8; CN1 plan Task 8.
# Runtime: Debezium Server 3.7 unmodified (design §33 §5, D354), one container
# per CDC instance (CN1 Ruling 6), HTTP sink posting CloudEvents to
# loams-fabric ingest (§33 §7, D357).  Source only, like debezium-postgres.
apiVersion: loams.flow/v1
kind: Connector
id: debezium-mysql
name: Debezium-MySQL
specVersion: 1.1.0
category: cdc
priority: P1
starred: true
status: preview
runtime:
  kind: debezium
  ref: io.debezium.connector.mysql.MySqlConnector
  version: "3.7.0.Final"
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: true
    batch: true                   # snapshot.mode=initial and incremental snapshots (CN1 Task 8)
    cdc: true
    webhook: false
    resumable: true
    position: the binlog file and position
    # §33 §6 / CN1 Task 8: MySQL's position is the binlog file:pos, with gtid
    # added to loamslsn when the server reports one.
  delivery: { source: at_least_once, sink: at_least_once }
    # Debezium commits its offsets after the HTTP sink's 2xx (§33 §7), which is
    # at-least-once; at_most_once is not claimed because ingest dedupes by
    # source + id (D355).
  ordering: per_partition
    # Transaction order inside a binlog coordinate, as for Postgres; per_partition
    # rather than total because several binlog coordinates can be in flight.
  formats: [cloudevents-binary, cloudevents-structured, json]
  schema: { registry: none, evolution: backward_transitive }
    # backward_transitive for Debezium's schema-change events (§33 §7).
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [basic, mtls]               # §33 Appendix A.7
config:
  $ref: schemas/debezium-mysql.config.json
secrets: [password, tls.key_pem]
envelope:
  emits: io.loams.dev.flow.debezium-mysql.change.v1
  consumes: "*"
  passthrough: true               # §33 §6's pass-through rule
limits: { max_record_bytes: 16777216 }
conformance: [contract, kill-restart, cdc]
docs: docs/guides/connectors/debezium-mysql.md
notes:
  - "fallback-only: Debezium Server CDC, the opt-in fallback of `mysql`'s native CDC (OR-4, OR-8); replaced_by: CN2 Task 11"

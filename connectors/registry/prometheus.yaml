# Prometheus — P2 (§33 Appendix A.13), CN2 Task 21 (plan rulings R21.7, R21.12).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the protocols family `loams_connector_protocols::prometheus`,
# remote write 1.0 in both directions (snappy-compressed WriteRequest protobuf).
# The source is a push receiver mounted on ingest's route, not a pull Source
# (R21.7); the sink is a remote-write client. Tested against Prometheus v3.15.0 in
# `connectors-p2` as receiver and sender; the row stays `planned` until that suite
# is green (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: prometheus
name: Prometheus
specVersion: 0.3.0
category: observability
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_protocols::prometheus
  version: "Prometheus remote write 1.0"
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: true               # a remote-write receiver; it answers 204 only after the Fabric acknowledged
    batch: false
    cdc: false
    webhook: false
    resumable: false              # the sender resends what was not acknowledged
    position: ""
  sink:
    streaming: true
    batch: true                   # up to `batch` series per request
    transactional: false
    upsert: false
    delete: false
    idempotent: true              # Prometheus accepts an identical sample twice
  delivery: { source: at_least_once, sink: effectively_once }
  ordering: none
  formats: [cloudevents-binary, cloudevents-structured, json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: push-with-ack
auth: [basic, key]                # the sink's; the receiver is loopback-only until Q30 (OR-17)
config:
  $ref: schemas/prometheus.config.json
secrets: [basic.password, bearer]
envelope:
  emits: io.loams.dev.flow.prometheus.metric.v1
  consumes: "*"
  passthrough: false
  stable_ids: true                # a digest of the series' labels and samples
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
docs: docs/guides/connectors/prometheus.md
notes:
  - "source: the receiver is POST /v1/namespaces/{ns}/fabric/prometheus/{instance}/write on ingest's listener; 503/429 on transient or throttled Fabric errors, 400 for a body that is not remote write 1.0, 415 for 2.0 (R21.7)"
  - "sink: an out-of-order sample is a 400 and goes to the DLQ"

# Delta Lake — P2 (§33 Appendix A.4), CN2 Task 17 (plan rulings R17.2, R17.6).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust in both directions (OR-18), the lakehouse family
# `loams_connector_lakehouse::delta`, on deltalake 1.1.0 without its datafusion
# feature (R0.14). Storage is S3 and its targets through object_store 0.13.2 with
# the egress-checked client (R17.5), or a local directory. The sink is a
# TransactionalSink: one Delta commit per batch carries the `txn` action and the
# Fabric checkpoint. The source reads the JSON log itself, so the change data feed
# needs no datafusion. Tested on real tables on a local directory in every build,
# RustFS when a job provides it, and S3 nightly; the row stays `planned` until
# its suite is green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: delta-lake
name: Delta Lake
specVersion: 0.3.0
category: lakehouse
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_lakehouse::delta
  version: "deltalake-core 1.1.0 / object_store 0.13.2"
licence:
  component: Apache-2.0
  dependencies:
    deltalake: Apache-2.0
    buoyant_kernel: Apache-2.0
    object_store: Apache-2.0
    parquet: Apache-2.0
capabilities:
  source:
    streaming: true               # polls the log for new versions
    batch: true                   # the latest snapshot first
    cdc: true                     # `source.mode: cdf`, the change data feed by the protocol's rules (R17.6)
    webhook: false
    resumable: true
    position: the table version, the data file within it and the row within that file
  sink:
    streaming: false
    batch: true
    transactional: true           # one commit per batch with txn(appId, seq) and the checkpoint in commitInfo
    upsert: false                 # merge needs deltalake's datafusion feature (R17.6)
    delete: false
    idempotent: false
  delivery: { source: at_least_once, sink: exactly_once }
  ordering: total                 # one split: versions in commit order, rows in file order
  formats: [cloudevents-binary, cloudevents-structured, json, arrow, parquet]
  schema: { registry: none, evolution: none }   # a column the table lacks pauses the instance (R17.6)
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [iam]                       # S3 credentials by secret name, or the default chain
config:
  $ref: schemas/delta-lake.config.json
secrets: [storage.auth.access_key_id, storage.auth.secret_access_key, storage.auth.session_token]
envelope:
  emits: io.loams.dev.flow.delta-lake.rows.v1
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, bulk, cdc, backpressure, exactly-once, auth]
docs: docs/guides/connectors/delta-lake.md
notes:
  - "events: `source.mode: versions` emits `rows`; `source.mode: cdf` emits `change` (io.loams.dev.flow.delta-lake.change.v1) with `_change_type`, `_commit_version` and `_commit_timestamp` (R17.6)"
  - "source: tables with deletion vectors are refused, and a data file above `source.max_file_bytes` (512 MiB) stops the instance (R17.6)"
  - "sink: `append` only; `merge` is refused at start (R17.6). The store must support conditional writes (If-None-Match: *), as AWS S3 and RustFS do (R17.5)"
  - "auth: Appendix A's sa (GCS, ADLS) is not built; storage is S3-compatible or local"

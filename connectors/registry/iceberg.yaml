# Iceberg — ★ connector 7 of §33 §8; CN1 plan Task 9.
# Runtime: native Rust, loams_flow::connectors::iceberg for the source
# (iceberg-rust 0.10 incremental snapshot scans) and Iggy's `iceberg_sink` for
# raw topics with Lakekeeper (§33 §8 row 7, CN1 Task 9).  For a Fabric table the
# sink is Fluss tiering and nothing runs, which this manifest's sink capability
# still covers.
apiVersion: loams.flow/v1
kind: Connector
id: iceberg
name: Iceberg
specVersion: 1.1.0
category: lakehouse
priority: P1
starred: true
status: preview
runtime:
  kind: native
  ref: loams_flow::connectors::iceberg
  version: "iceberg-rust 0.10"
  # CN2 OR-8: the raw-topic sink is native (CN2 Task 17); Iggy's `iceberg_sink` with
  # Lakekeeper, CN1's (CN1 Task 9), is its declared fallback (OR-4).
  fallback:
    kind: iggy
    ref: iceberg                  # iceberg_sink (CN2 R2.3)
    directions: [sink]
    replaced_by: CN2 Task 17
licence:
  component: Apache-2.0
  dependencies:
    iceberg-rust: Apache-2.0         # the incremental snapshot scanner
    parquet: Apache-2.0             # Iceberg's data files
    arrow: Apache-2.0               # the Arrow batch events CN1 emits (Ruling 3)
capabilities:
  source:
    streaming: false              # §33 §8 row 7 describes incremental snapshot scans, not a tail
    batch: true
    cdc: false
    webhook: false
    resumable: true
    position: the last snapshot id
    # CN1 Task 9 and §33 §6: the as-of position is the last snapshot id, so a
    # re-read of the same scan produces the same event ids.
  sink:
    streaming: false
    batch: true
    transactional: true           # an Iceberg commit is atomic; a failed append leaves the table as it was
    upsert: false                 # CN1 commits append-only and overwrite snapshots; no MERGE is declared
    delete: false
    idempotent: false             # a retried batch appends again unless the snapshot cursor advanced
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: per_key               # D356: bulk is partitioned by a declared key
  formats: [cloudevents-binary, cloudevents-structured, json, arrow, parquet]
    # arrow and parquet: Iceberg's data files are Parquet and CN1 emits them as
    # Arrow batch events (Ruling 3, CN1 Task 9).
  schema: { registry: none, evolution: backward }
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [iam, sa, oauth2, key]
    # §33 Appendix A.4 (iam, sa, oauth2); key added for the static object-store
    # credentials the config schema names under `s3` (CN1 Ruling 9, RustFS in CI).
config:
  $ref: schemas/iceberg.config.json
secrets: [s3.access_key_id, s3.secret_access_key]
envelope:
  emits: io.loams.dev.flow.iceberg.rows.v1
    # Ruling 2's event list names `rows` for Iceberg.
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, bulk]
docs: docs/guides/connectors/iceberg.md
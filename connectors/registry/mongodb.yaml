# MongoDB — P2 (§33 Appendix A.3), CN2 Task 16 (plan ruling R16.12).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the MongoDB family `loams_connector_mongodb::mongodb`,
# with its own wire-protocol client (OP_MSG, BSON, SCRAM-SHA-256; R16.1); every
# connection is egress-checked after DNS. Batch reads at one cluster time,
# change-stream CDC with a snapshot handoff, and an exactly-once sink (one
# multi-document transaction per batch with _loams_checkpoints, R16.9). Iggy's
# mongodb_sink is the sink's fallback, and `debezium-mongodb` the CDC fallback
# (OR-4). MongoDB is SSPL, so the suites run in PR CI against `mongo:8.0.30` as
# a ci-service image Loams never ships (OR-3); the row stays `planned` until
# they are green (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: mongodb
name: MongoDB
specVersion: 0.3.0
category: nosql
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_mongodb::mongodb
  version: "MongoDB wire protocol (OP_MSG), MongoDB 6.0+; tested on 8.0"
  fallback:
    kind: iggy
    ref: mongodb                  # mongodb_sink
    directions: [sink]
    replaced_by: CN2 Task 16
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: true               # mode: cdc, a change stream
    batch: true                   # mode: batch, snapshot reads in _id ranges
    cdc: true                     # needs a replica set or a sharded cluster
    webhook: false
    resumable: true
    position: mongodb-resume-token (CDC, advanced by postBatchResumeToken on a quiet database); the cluster time and the last _id delivered per split (batch)
  sink:
    streaming: true
    batch: true
    transactional: true           # one transaction per batch with the checkpoint in _loams_checkpoints, fenced by the lease epoch (R16.9)
    upsert: true                  # write: upsert replaces by `key`
    delete: true                  # loamsop = d deletes by `key`
    idempotent: true              # the upsert by key dedupes a replayed batch
  delivery: { source: at_least_once, sink: exactly_once }
    # Source: a snapshot that outlives the server's snapshot history is read at
    # a newer time, so its documents may also arrive as changes (R16.7, R16.8).
    # Sink: exactly once with `transactional: true` on a replica set; on a
    # standalone server effectively once for `upsert`, at least once for `insert`.
  ordering: per_key               # changes in stream order; ordered writes per key
  formats: [cloudevents-binary, cloudevents-structured, json, arrow]
  schema: { registry: none, evolution: backward }
    # `evolution: additive` by default: a new field is a schema-change event and
    # later batches carry the column; a value no column holds pauses (R16.6).
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [basic, mtls]               # basic: SCRAM-SHA-256; mtls: MONGODB-X509 with tls.cert and tls.key
config:
  $ref: schemas/mongodb.config.json
secrets: [password, tls.cert, tls.key]
envelope:
  emits: io.loams.dev.flow.mongodb.document.v1
  consumes: "*"
  passthrough: false
  stable_ids: true                # change ids are <db>.<collection>/<resume token>
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, bulk, cdc, schema-evolution, backpressure, exactly-once, auth]
docs: docs/guides/connectors/mongodb.md
notes:
  - "events: batch reads emit `document` (Arrow); CDC emits `change` (io.loams.dev.flow.mongodb.change.v1, relaxed Extended JSON) and `schema-change`, with ids <db>.<collection>/<resume token> that ingest deduplicates (R16.3)"
  - "cdc: a standalone server is refused; the user needs changeStream and find on the database, and find on local.oplog.rs for the oplog-window metric (R16.5)"
  - "topology: reads and writes go to the primary; a secondary seed is followed to the primary its hello names, egress-checked too (R16.2)"

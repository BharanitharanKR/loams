# SFTP — P2 (§33 Appendix A.5), CN2 Task 13.
# Runtime: native Rust, loams_connector_objects::sftp, over SSH 2 and SFTP v3
# (russh 0.63.3 with ring, russh-sftp 3.0.1), connected through the SDK's
# egress-checked net::connect. The sink is plain and at least once: one file
# per Fabric batch, written as `.<name>.tmp` and published by RENAME (R13.6).
# Tested against atmoz/sftp (OpenSSH) in PR CI.
apiVersion: loams.flow/v1
kind: Connector
id: sftp
name: SFTP
specVersion: 0.3.0
category: object-storage
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_objects::sftp
  version: "russh 0.63.3 / russh-sftp 3.0.1"
licence:
  component: Apache-2.0
  dependencies:
    russh: Apache-2.0
    russh-sftp: Apache-2.0
capabilities:
  source:
    streaming: false             # polling: the directory is listed and sorted by path
    batch: true                   # a listing per prefix, read after a high-water key
    cdc: false
    webhook: false
    resumable: true
    position: the high-water path per directory, plus the path and next row of a partly emitted file
  sink:
    streaming: false
    batch: true
    transactional: false
    upsert: false
    delete: false
    idempotent: false             # one file per batch; a replayed batch writes a new file
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: per_key               # keys are read in lexicographic order within a prefix
  formats: [cloudevents-binary, cloudevents-structured, json, bytes, csv, ndjson, parquet, arrow]
  schema: { registry: none, evolution: backward }   # a new Arrow schema rolls the file
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [ssh, basic]
config:
  $ref: schemas/sftp.config.json
secrets: [auth.password, auth.private_key, auth.private_key_passphrase]
envelope:
  emits: io.loams.dev.flow.sftp.object.v1
  consumes: "*"
  passthrough: false
  stable_ids: true                # "<host>/<path>@<mtime>-<size>" survives a re-read
limits: { max_record_bytes: 67108864, batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, bulk, schema-evolution, backpressure, auth]
docs: docs/guides/connectors/sftp.md
notes:
  - "auth: client keys are Ed25519 or ECDSA only; RSA needs the `rsa` crate, which carries RUSTSEC-2023-0071 with no fix (CN2 R13.6). `host_key` is required and any other server key is refused"
  - "sink: at_least_once, because SFTP has no metadata to carry a checkpoint; RENAME refuses an existing destination, so no reader sees a partial file (CN2 R13.6)"
  - "source: ids are `<host>/<path>@<mtime>-<size>`; dot files are skipped, and a file written later below the high-water path is not seen"
  - "source: ids are stable, so ingest's (source, id) dedup collapses a re-read; the source declares at_least_once because a decoded object resumed mid-object may be cut into different row ranges"

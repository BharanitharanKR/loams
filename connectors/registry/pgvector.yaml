# pgvector — P2 (§33 Appendix A.3), CN2 Task 10 (plan ruling R10.9).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the Postgres family `loams_connector_postgres` under
# the target profile `pgvector` (OR-2): PostgreSQL with the `vector`
# extension. Everything `postgresql` declares applies; `vector(n)` maps to
# Arrow FixedSizeList<Float32>(n) on the bulk path and back through the sink
# (R10.4). The suite runs against the official `pgvector/pgvector` image; the
# row stays `planned` until it is green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: pgvector
name: pgvector
specVersion: 0.3.0
category: vector
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_postgres::PostgresFactory
  version: "tokio-postgres 0.7.18 / pg_walstream 0.9.0"
  profile: pgvector
licence:
  component: Apache-2.0
  dependencies:
    tokio-postgres: MIT
    postgres-protocol: Apache-2.0          # MIT OR Apache-2.0 (licences.toml)
    pg_walstream: BSD-3-Clause
capabilities:
  source:
    streaming: true
    batch: true
    cdc: true                     # pgoutput, as on PostgreSQL
    webhook: false
    resumable: true
    position: pg-lsn (the end LSN of the last whole transaction delivered) for CDC, the last key delivered per table for batch reads
  sink:
    streaming: true
    batch: true
    transactional: true
    upsert: true
    delete: true
    idempotent: true
  delivery: { source: at_least_once, sink: exactly_once }
  ordering: per_key
  formats: [cloudevents-binary, cloudevents-structured, json, arrow]
  schema: { registry: none, evolution: backward }
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [basic]
config:
  $ref: schemas/pgvector.config.json
secrets: [password]
envelope:
  emits: io.loams.dev.flow.pgvector.rows.v1
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, exactly-once, cdc, bulk, schema-evolution, backpressure, auth]
docs: docs/guides/connectors/pgvector.md
notes:
  - "types: `vector(n)` is FixedSizeList<Float32>(n) and `vector` is List<Float32> in Arrow, an array of numbers in JSON; halfvec and sparsevec are not mapped and pause the instance (R10.4)"

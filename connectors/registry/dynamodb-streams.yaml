# DynamoDB Streams — P2 (§33 Appendix A.2), CN2 Task 14 and OR-9 (native
# CDC). Installed from the family crate
# by the CN2 registry follow-up (ruling R14.1).
# Runtime: native Rust, loams-connector-kv over aws-sdk-dynamodbstreams 1.115:
# shards as splits in lineage order, sequence numbers as positions.
apiVersion: loams.flow/v1
kind: Connector
id: dynamodb-streams
name: DynamoDB Streams
specVersion: 0.2.0
category: cdc
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_kv::ddbstreams::DynamoDbStreamsFactory
  version: "aws-sdk-dynamodbstreams 1.115.0"
licence:
  component: Apache-2.0
  dependencies:
    aws-sdk-dynamodbstreams: Apache-2.0
    aws-sdk-dynamodb: Apache-2.0
capabilities:
  source:
    streaming: true
    batch: false
    cdc: true
    webhook: false
    resumable: true
    position: each shard's last sequence number, and whether the shard was read to its end
  delivery: { source: effectively_once, sink: at_least_once }   # sink is required by the schema; there is no sink direction
  ordering: per_key               # a key's changes stay in one shard, and children wait for their parent
  formats: [json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [iam]
config:
  $ref: schemas/dynamodb-streams.config.json
secrets: [access_key_id, secret_access_key, session_token]
envelope:
  emits: io.loams.dev.flow.dynamodb-streams.change.v1
  consumes: ""
  passthrough: false
  stable_ids: true
limits: { max_record_bytes: 409600 }
conformance: [contract, roundtrip, kill-restart, dup-check, cdc, backpressure, auth]
notes:
  - "PR CI runs against floci 2.1.0 (R0.23; DynamoDB Local only if floci's shard lineage fails a test); the nightly job runs against AWS."
  - "A checkpoint whose records were trimmed (past the 24-hour retention) is PositionLost: the instance stops with a re-snapshot hint (a dynamodb Scan)."
  - "DynamoDB has no DDL: the cdc suite's DDL step is an item that gains a new attribute (ruling R14.6)."
docs: docs/guides/connectors/dynamodb-streams.md

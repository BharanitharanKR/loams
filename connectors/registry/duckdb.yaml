# DuckDB — P2 (§33 Appendix A.4), CN2 Task 17 (plan rulings R17.2, R17.7).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the ADBC module `loams_connector_analytics::adbc` under
# the target profile `duckdb` (OR-2), which defaults `driver: duckdb`. The driver
# is DuckDB's own `libduckdb` (v1.5.6, entry point `duckdb_adbc_init`), loaded by
# path from the runtime's allowlist with a SHA-256 check (CN1 Ruling 9); Loams
# compiles no DuckDB code. The suite runs in `connectors-p2`'s analytics shard
# against the real library; the row stays `planned` until it is green (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: duckdb
name: DuckDB
specVersion: 0.3.0
category: warehouse
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_analytics::adbc
  version: "adbc_driver_manager 0.24.0 / libduckdb 1.5.6"
  profile: duckdb
licence:
  component: Apache-2.0
  dependencies:
    adbc_core: Apache-2.0
    adbc_driver_manager: Apache-2.0
    libduckdb: MIT                # loaded at run time from the allowlist (licences.toml)
capabilities:
  source:
    streaming: false
    batch: true                   # the query's Arrow reader, one page per batch
    cdc: false
    webhook: false
    resumable: true
    position: the rows delivered; a restart re-runs the query and skips them (R17.9)
  sink:
    streaming: false
    batch: true                   # ADBC bulk ingest per batch
    transactional: false
    upsert: false
    delete: false
    idempotent: false
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: none                  # the query's ORDER BY decides
  formats: [cloudevents-binary, cloudevents-structured, json, arrow]
  schema: { registry: none, evolution: none }
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [none]                      # an in-process database file
config:
  $ref: schemas/duckdb.config.json
secrets: []
envelope:
  emits: io.loams.dev.flow.duckdb.rows.v1
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, bulk, backpressure]
docs: docs/guides/connectors/duckdb.md
notes:
  - "driver: an instance names an allowlisted driver; the allowlist (`LOAMS_ADBC_ALLOWLIST`) maps it to a path, a SHA-256 and an entry point, and a driver not in it is refused (CN1 Ruling 9, R17.7)"
  - "sink: `sink.mode: create_append` creates the table from the first batch; there is no upsert"

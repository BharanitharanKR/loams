# Apache Kafka — ★ connector 1 of §33 §8; CN1 plan Task 6.
# Runtime: native Rust, loams_flow::connectors::kafka (design §33 §5, D354).
# §33 §4's canonical YAML example is this manifest's shape; every value that
# example fixes is copied verbatim, and the rest is filled from CN1 Task 6's
# Semantics paragraph. The one deliberate departure is `name`: §4's illustrative
# example says `Apache Kafka`, while Appendix A's row — and therefore the
# generated `catalog.csv` — say `Kafka`. The registry's display name is the
# catalog's, so the catalog wins and this column needs no exception in
# `csv_and_manifests_agree` (CN1 "Rulings made during execution", row 6).
apiVersion: loams.flow/v1
kind: Connector
id: kafka
name: Kafka
specVersion: 1.1.0
category: messaging
priority: P1
starred: true
status: preview
runtime:
  kind: native
  ref: loams_flow::connectors::kafka
  version: "rdkafka 0.39 / librdkafka 2.x (verify)"   # §33 §4 verbatim
licence:
  component: Apache-2.0
  dependencies:                                        # D359: every loaded library
    librdkafka: BSD-2-Clause                          # the C client, statically built
    rdkafka: MIT                                       # the crate wrapper
    apache-avro: Apache-2.0                            # only when a schema registry is configured
capabilities:
  source:
    streaming: true
    batch: false
    cdc: false
    webhook: false
    resumable: true                # §33 §4: restarts from committed consumer-group offsets
    position: kafka-offsets        # committed after the Fabric acknowledges the batch (CN1 Ruling 4)
  sink:
    streaming: true
    batch: true
    transactional: true            # CN2 Task 9: `delivery: exactly_once` writes the batch and the checkpoint (__loams_checkpoints) in one Kafka transaction (OR-7)
    upsert: false
    delete: false
    idempotent: true               # the idempotent producer: enable.idempotence=true, acks=all (CN1 Task 6)
  delivery: { source: at_least_once, sink: exactly_once }    # CN2 Task 9 (OR-7): exactly_once through the transactional sink; the default idempotent producer is effectively_once
  ordering: per_partition          # a partition's records are read in offset order (CN1 Task 6)
  formats: [cloudevents-binary, cloudevents-structured, json, avro, bytes]
    # Avro appears only at the Kafka boundary (D356), and only when a schema
    # registry is configured (CN1 Task 6: "Avro values with a schema registry
    # when configured").
  schema: { registry: optional, evolution: backward }
    # optional because a registry is only in the path when one is configured (§33 §4).
  bulk: { arrow: false, max_batch_rows: 65536 }         # Ruling 3's default; Kafka payloads stay per record
  backpressure: push-with-ack     # the producer's acknowledgement is the backpressure signal
auth: [none, sasl-plain, sasl-scram-256, sasl-scram-512, mtls, aws-msk-iam]
    # §33 §4's list verbatim.  Appendix A's Auth cell says "sasl, mtls, iam";
    # §4 is the canonical YAML example and the finer-grained of the two, since
    # it names the SCRAM variants and aws-msk-iam, which Appendix A's legend
    # does not define.  Reviewer decision noted.
config:
  $ref: schemas/kafka.config.json
secrets: [sasl.password, tls.key_pem]   # D189 secret store; never stored in the instance (§33 §4)
envelope:
  emits: io.loams.dev.flow.kafka.record.v1
  consumes: "*"
  passthrough: true                # §33 §6: a record with valid ce_ headers keeps its type, source and id
limits: { max_record_bytes: 16777216 }
conformance: [contract, roundtrip, kill-restart, dup-check, exactly-once]
docs: docs/guides/connectors/kafka.md
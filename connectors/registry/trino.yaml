# Trino — P2 (§33 Appendix A.4), CN2 Task 17 (plan ruling R17.2).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the analytics family `loams_connector_analytics::trino`,
# over Trino's client REST protocol (`POST /v1/statement`, then `GET nextUri`)
# through the SDK's egress-checked HTTP client. A source only (A.4). The suite
# runs against Trino 483 (compose `trino`, `connectors-p2`); the row stays
# `planned` until it is green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: trino
name: Trino
specVersion: 0.3.0
category: warehouse
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_analytics::trino
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: false
    batch: true                   # one split (the query), read page by page
    cdc: false
    webhook: false
    resumable: true
    position: the query's as-of time, the page cursor (nextUri) and the rows delivered; a forgotten page re-runs the query and skips the delivered rows (R17.9)
  delivery: { source: effectively_once, sink: at_least_once }
    # Source: §33 §6 run ids over the instance, the query and the as-of time, so a
    # re-read yields the same ids and ingest's (source, id) dedup collapses it.
  ordering: none                  # the query's ORDER BY decides
  formats: [cloudevents-binary, cloudevents-structured, arrow]
  schema: { registry: none, evolution: backward }
    # `evolution: additive` by default (the SDK's SchemaPolicy).
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [basic, jwt]                # basic: `password` over HTTPS; jwt: `token` as a bearer token
config:
  $ref: schemas/trino.config.json
secrets: [password, token]
envelope:
  emits: io.loams.dev.flow.trino.rows.v1
  consumes: "*"
  passthrough: false
  stable_ids: true
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, bulk, schema-evolution, backpressure, auth]
docs: docs/guides/connectors/trino.md
notes:
  - "source: give the query an ORDER BY; without one, a re-run after Trino has forgotten the page (404/410) can skip or repeat different rows (R17.9)"
  - "auth: an OAuth 2 access token also works as `token` (a bearer token); no OAuth flow is built"
  - "types: timestamp(p) above 6 and zoneless timestamps are lossy unless listed under `lossy`; nested types (array, map, row) pause the instance"

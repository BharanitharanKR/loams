# OpenSearch — P2 (§33 Appendix A.3), CN2 Task 15. Hand-written by CN2 Task 2's
# follow-up of ruling R15.5, replacing the generated stub.
# Runtime: native Rust, the search family's Elasticsearch code
# (`loams_connector_search::elasticsearch`) under the `opensearch` target profile
# (OR-2): `api: opensearch` (OpenSearch's point-in-time API) and the `_id`
# tiebreaker (R15.4). Its suites run against OpenSearch itself, never against
# Elasticsearch. Status stays planned until they are green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: opensearch
name: OpenSearch
specVersion: 0.3.0
category: search
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_search::elasticsearch
  profile: opensearch
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: true               # with source.poll_interval_ms a finished pass starts again from the cursor
    batch: true                   # a point-in-time pass with search_after
    cdc: false
    webhook: false
    resumable: true
    position: the point-in-time id, the last sort values and the last cursor value
  sink:
    streaming: true               # the `_bulk` API is a continuous write
    batch: true
    transactional: false          # no multi-document transaction
    upsert: true                  # an index with an explicit _id (`key`, or ce_id)
    delete: true                  # loamsop = d deletes by _id
    idempotent: true              # a replay overwrites the same _id
  delivery: { source: effectively_once, sink: effectively_once }
    # Source ids `<index>/<_id>@<_seq_no>.<_primary_term>` are stable per version,
    # so ingest's (source, id) dedup collapses a re-read (R15.8, OR-7).
  ordering: per_key
  formats: [cloudevents-binary, cloudevents-structured, json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull              # the source pages on demand; a 429 halves the sink's _bulk size
auth: [basic, iam]                # iam is AWS SigV4 for Amazon OpenSearch Service (R15.3)
config:
  $ref: schemas/opensearch.config.json
secrets: [basic.password, aws.access_key_id, aws.secret_access_key, aws.session_token]
envelope:
  emits: io.loams.dev.flow.opensearch.document.v1
  consumes: "*"
  passthrough: false
  stable_ids: true
limits: { max_record_bytes: 16777216 }
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
notes:
  - "The PIT API of OpenSearch 2.4+ and the `_id` tiebreaker are unverified on 3.x until `opensearch_suite_against_opensearch` runs in CI (R15.4); a capability it finds missing is added to the profile's narrows with a `narrows:` note."
  - "The estate's OpenSearch runs without its security plugin, so the `auth` suite cannot run there yet; `iam` is exercised by the nightly `opensearch_sigv4_nightly` (R15.6)."
docs: docs/guides/connectors/opensearch.md

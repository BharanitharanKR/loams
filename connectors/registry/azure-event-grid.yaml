# Azure Event Grid — P2 (§33 Appendix A.1), CN2 Task 19. Hand-written by the
# registry follow-up of R19.6, replacing Task 2's generated stub.
# Runtime: native Rust, loams_connector_cloud::event_grid over Event Grid's
# HTTP API: the sink posts CloudEvents batches to a topic or a namespace
# topic; the source is Event Grid's webhook push (`delivery: webhook`, with
# its validation handshakes) or a namespace subscription's pull delivery.
# Status stays `planned` until its suites are green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: azure-event-grid
name: Azure Event Grid
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_cloud::event_grid
  version: "loams-connector-cloud 0.0.1 (Event Grid HTTP API)"
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: true
    batch: false
    cdc: false
    webhook: true                 # delivery: webhook, the default (R19.7)
    resumable: true
    position: Event Grid's own retry of an unanswered delivery (webhook), or the namespace subscription's locked events (pull); a delivery is answered 200, or an event acknowledged, only after the Fabric acknowledges it
  sink:
    streaming: true
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: false             # Event Grid does not deduplicate a resent event
  delivery: { source: effectively_once, sink: at_least_once }
  ordering: none
  formats: [cloudevents-structured, json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: push-with-ack     # the webhook answers 503 with Retry-After when the source is busy (R19.7)
auth: [aad, key]
config:
  $ref: schemas/azure-event-grid.config.json
secrets: [auth.client_id, auth.client_secret, auth.key, auth.webhook_key]
envelope:
  emits: io.loams.dev.flow.azure-event-grid.event.v1
  consumes: "*"
  passthrough: true               # CloudEvents-schema deliveries keep their identity (R19.8)
  stable_ids: true                # Event Grid's event id (or the CloudEvent's), unchanged when Event Grid redelivers
limits: { max_record_bytes: 1048576 }
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
notes:
  - "source: the webhook source needs the webhooks route (Task 8) and remote ingress (Task 28, Q30) to be reached by Azure; until then it runs on requests shaped like Event Grid's, and the pull source (delivery: pull) works without ingress (R19.7)"
  - "fixtures: no Event Grid fixture is recorded yet and none is fabricated (R13.5), so the webhook source cannot reach preview before one is"
  - "sink: a batch is taken whole; a refused batch (400, 413) goes back to the pipeline, which isolates the offending event to the DLQ"
docs: docs/guides/connectors/azure-event-grid.md

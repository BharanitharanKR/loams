# gRPC — P2 (§33 Appendix A.1), CN2 Task 21 (plan ruling R21.12).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the protocols family `loams_connector_protocols::grpc`: a
# dynamic client written in the crate over gRPC's HTTP/2 protocol on a socket the
# SDK opened after the egress check (R21.2), with messages built at run time from
# a FileDescriptorSet or the server's reflection service (R21.3). Tested against a
# loopback HTTP/2 peer; the real-system suite is a follow-up, so the row stays
# `planned` (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: grpc
name: gRPC
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_protocols::grpc
  version: "gRPC over HTTP/2 (hyper http2), prost-reflect 0.16.5"
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: true               # server-streaming calls, one split per method
    batch: false
    cdc: false
    webhook: false
    resumable: false              # only with `source.cursor` (see the note)
    position: ""
  sink:
    streaming: true               # unary calls, one per event
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: false
    reply: true                   # each answer is a reply event on `reply_topic` (OR-19, R21.6)
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: none
  formats: [cloudevents-binary, cloudevents-structured, json, protobuf]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [mtls, jwt]                 # mtls: tls.client_cert/client_key; jwt: a bearer token
config:
  $ref: schemas/grpc.config.json
secrets: [jwt, tls.client_cert, tls.client_key, tls.ca]
envelope:
  emits: io.loams.dev.flow.grpc.message.v1
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, backpressure, auth]
docs: docs/guides/connectors/grpc.md
notes:
  - "events: a streamed message is `message`; a sink's answer is `reply` (io.loams.dev.flow.grpc.reply.v1, id <input id>/reply) on `reply_topic` (R21.6)"
  - "source: with `source.cursor` a restart re-opens the call with the last message's cursor and ids are <method>@<cursor>; without one a restart opens a new call"
  - "errors: INVALID_ARGUMENT, NOT_FOUND, ALREADY_EXISTS, FAILED_PRECONDITION and OUT_OF_RANGE are Poison; UNAUTHENTICATED/PERMISSION_DENIED Auth; RESOURCE_EXHAUSTED Throttled; UNIMPLEMENTED and DATA_LOSS Fatal; the rest Retryable"

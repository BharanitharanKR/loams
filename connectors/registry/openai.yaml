# OpenAI — P2 (§33 Appendix A.16), CN2 Task 21 (plan rulings R21.9, R21.10, R21.12).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the protocols family `loams_connector_protocols::openai`: a
# request-reply sink (OR-19) over Chat Completions (`POST /v1/chat/completions`),
# through the SDK's egress-checked client (no vendor SDK, R21.1). Tested against
# fixtures of the documented shapes and the real API nightly; the row stays
# `planned` until those suites are green (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: openai
name: OpenAI
specVersion: 0.3.0
category: ai
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_protocols::openai
licence:
  component: Apache-2.0
capabilities:
  sink:
    streaming: false
    batch: true                   # each event of a batch is one call
    transactional: false
    upsert: false
    delete: false
    idempotent: false
    reply: true                   # the answer is a reply event on `reply_topic` (OR-19, R21.6)
  delivery: { source: at_least_once, sink: at_least_once }
    # A retried batch calls again; reply ids are stable (<input id>/reply), so
    # ingest drops a repeated reply.
  ordering: none
  formats: [cloudevents-binary, cloudevents-structured, json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [key]                       # Authorization: Bearer, by secret name
config:
  $ref: schemas/openai.config.json
secrets: [api_key]
envelope:
  emits: io.loams.dev.flow.openai.reply.v1
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, backpressure, auth]
docs: docs/guides/connectors/openai.md
notes:
  - "replies: data {provider, model, id, text, stop_reason, usage}, built from the answer only; the key is never in a reply, and a reply containing it is refused (R21.6)"
  - "prompts: prompt.system and prompt.user are templates; a placeholder with nothing to fill is Poison, and `params` may not set what the connector sets (R21.10)"
  - "rate limits: x-ratelimit-remaining-{requests,tokens}: 0 holds every later request until x-ratelimit-reset-*; 429 is Throttled with Retry-After (R21.9)"

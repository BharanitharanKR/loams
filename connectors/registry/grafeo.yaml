# Grafeo (Loams Graph) — §33 A.3's second graph row; D634, D741; CN2 Task 21
# (plan rulings R21.4, R21.12). Hand-written, and listed in handwritten.txt.
# Runtime: native Rust, the protocols family `loams_connector_protocols::grafeo`.
# Since D741 the graph engine is not in-process for Flow (D634 (b) is dropped):
# the connector is a client of `loams.graph.v1` over Connect's binary form, with
# the messages `loams-flow-proto` generates (OR-20, R21.4). So it crosses the
# network and authenticates with a Loams API key: R21.12 moves auth from D634 (b)'s
# `none` to `key`. No Bolt anywhere (D634 (c)). P2 and not ★ (D358). Tested
# against a loopback Connect peer everywhere and a Loams graph endpoint nightly;
# the row stays `planned` until that suite is green (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: grafeo
name: Grafeo
specVersion: 0.3.0
category: graph
priority: P2
starred: false              # D634 adds a row to §33, not a name to §8's 21 (D358)
status: planned
runtime:
  kind: native
  ref: loams_connector_protocols::grafeo
  version: "loams.graph.v1 over Connect (binary)"
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: false
    batch: true                   # ExecuteStream, one split per label; `poll_interval_ms` keeps polling
    cdc: false
    webhook: false
    resumable: true
    position: the last cursor value (as loams.graph.v1.Value bytes) and node id read, in (cursor, id) order
  sink:
    streaming: false
    batch: true                   # ExecuteBatch of parameterised statements
    transactional: false          # `atomic` makes each batch one transaction, but holds no Fabric checkpoint
    upsert: false
    delete: false
    idempotent: true              # each batch carries an idempotency key digested from its event ids
  delivery: { source: at_least_once, sink: effectively_once }
  ordering: per_key
  formats: [cloudevents-binary, cloudevents-structured, json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [key]                       # a Loams API key, required (R21.12; D634 (b)'s `none` is dropped with D741)
config:
  $ref: schemas/grafeo.config.json
secrets: [api_key]
envelope:
  emits: io.loams.dev.flow.grafeo.rows.v1
  consumes: "*"
  passthrough: false
  stable_ids: true                # <graph>/<label>/<id>@<cursor>
limits:
  max_record_bytes: 1048576
  batch_rows: 65536
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
docs: docs/guides/connectors/grafeo.md
notes:
  - "auth: an instance without `api_key` is refused when it is created (Auth); the key goes as Authorization: Bearer loams_<key_id>_<secret>"
  - "sink: effectively_once holds with `atomic: true` (the default), where a retried batch is the same idempotent request to the server"
  - "source: the default statement's id(n) is unverified on Grafeo until the nightly run; `source.statement` overrides it"

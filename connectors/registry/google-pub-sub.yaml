# Google Pub/Sub — P2 (§33 Appendix A.1), CN2 Task 19. Hand-written by the
# registry follow-up of R19.6, replacing Task 2's generated stub.
# Runtime: native Rust, loams_connector_cloud::pubsub: the Pub/Sub REST API
# (pull, acknowledge, modifyAckDeadline, publish) through the SDK's
# egress-checked HTTP client, with a service-account JWT grant; not the
# google-cloud-pubsub crate (R19.1).
# Status stays `planned` until its suites are green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: google-pub-sub
name: Google Pub/Sub
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_cloud::pubsub
  version: "loams-connector-cloud 0.0.1 (Pub/Sub REST v1)"
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: true               # unary pull with client-managed lease extension (R19.1)
    batch: false
    cdc: false
    webhook: false                # push subscriptions are not used
    resumable: true
    position: the subscription's unacknowledged messages; a message is acknowledged only after the Fabric acknowledges its event, and Pub/Sub redelivers it after its ack deadline otherwise
  sink:
    streaming: true
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: false             # publish does not deduplicate a resent message
  delivery: { source: effectively_once, sink: at_least_once }
  ordering: per_key               # ordering keys (ordering_key: subject)
  formats: [cloudevents-binary, cloudevents-structured, json, bytes]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [sa]
config:
  $ref: schemas/google-pub-sub.config.json
secrets: [auth.credentials_json]
envelope:
  emits: io.loams.dev.flow.google-pub-sub.message.v1
  consumes: "*"
  passthrough: true               # the CloudEvents Pub/Sub binding (ce-*) or a structured body (R19.8)
  stable_ids: true                # the Pub/Sub message id, unchanged on redelivery
limits: { max_record_bytes: 10485760 }
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
notes:
  - "ordering: per_key holds when the sink sets ordering_key: subject and the subscription has message ordering enabled; otherwise Pub/Sub keeps no order"
  - "auth: sa is a service-account key file named by secret (auth.credentials_json), signed as an RS256 JWT and exchanged at its token_uri; the emulator takes no credentials, so an instance with an endpoint may omit auth"
  - "oversized: a message larger than a whole batch is reported to the DLQ and left unacknowledged, so the subscription's dead-letter topic moves it; configure one (R19.5)"
docs: docs/guides/connectors/google-pub-sub.md

# Redpanda — P2 (§33 Appendix A.1), CN2 Task 9. Hand-written by CN2 Task 2's
# registry follow-up (R9.7), replacing the generated stub.
# Runtime: native Rust, loams-connector-kafka (rdkafka 0.39 over librdkafka built
# from source, R9.1) under the `redpanda` target profile (OR-2), which narrows
# nothing: Redpanda keeps Kafka transactions (R0.18), so the sink is the same
# transactional, exactly-once sink as the Kafka ★. The suites run against
# Redpanda itself (BSL-1.1, a ci-service, OR-3), never against Apache Kafka.
# Status stays `planned` until those suites are green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: redpanda
name: Redpanda
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_kafka::kafka
  version: "rdkafka 0.39.0 / librdkafka (built from source)"
  profile: redpanda
licence:
  component: Apache-2.0
  dependencies:
    librdkafka: BSD-2-Clause
    rdkafka: MIT
capabilities:
  source:
    streaming: true
    batch: false
    cdc: false
    webhook: false
    resumable: true                # each split is one partition, assigned (not subscribed); offsets are committed to the group (R9.3)
    position: kafka-offsets        # committed after the Fabric acknowledges the batch
  sink:
    streaming: true
    batch: true
    transactional: true            # `delivery: exactly_once` writes the batch and its checkpoint (__loams_checkpoints) in one Kafka transaction (R9.5, OR-7)
    upsert: false
    delete: false
    idempotent: true               # the idempotent producer, enable.idempotence=true with acks=all (R9.4)
  delivery: { source: at_least_once, sink: exactly_once }   # the default idempotent producer is effectively_once; exactly_once through the transactional sink
  ordering: per_partition
  formats: [cloudevents-binary, cloudevents-structured, json, bytes]
  schema: { registry: none, evolution: none }   # the Confluent registry client is not wired in yet (R9.8)
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: push-with-ack
auth: [none, sasl-plain, sasl-scram-256, sasl-scram-512, mtls]
config:
  $ref: schemas/redpanda.config.json
secrets: [sasl.password, tls.key_pem]
envelope:
  emits: io.loams.dev.flow.redpanda.record.v1
  consumes: "*"
  passthrough: true                # D270's ce_ headers pass through byte for byte (redpanda_ce_headers_pass_through)
  stable_ids: true                 # a record without ce_ headers gets <topic>/<partition>/<offset>
limits: { max_record_bytes: 1000000 }
conformance: [contract, roundtrip, kill-restart, dup-check, exactly-once, backpressure, auth]
docs: docs/guides/connectors/redpanda.md
notes:
  - "OAUTHBEARER (and with it aws-msk-iam) is not built in the native Kafka family yet, so SASL is plain or SCRAM (R9.6)."
  - "Redpanda does not implement KIP-890, so librdkafka uses the original transaction protocol (R0.18)."

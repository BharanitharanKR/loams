# S3 — ★ connector 6 of §33 §8; CN1 plan Task 9.
# Runtime: native Rust, loams_flow::connectors::s3 (design §33 §5, D354).
# object_store 0.14 listing with a high-water key for the source; for the sink,
# Iggy's `s3_sink` for raw events or Loams's own Parquet writer for Arrow
# batches (§33 §8 row 6, CN1 Task 9).  §33 §4 rule 2: the manifest names the
# runtime Loams ships, which for S3 is the native task.
apiVersion: loams.flow/v1
kind: Connector
id: s3
name: S3
specVersion: 1.1.0
category: object-storage
priority: P1
starred: true
status: preview
runtime:
  kind: native
  ref: loams_flow::connectors::s3
  version: "object_store 0.14"
  # CN2 OR-8: the sink is native (CN2 Task 13); Iggy's `s3_sink`, CN1's raw-event
  # sink (§33 §8 row 6), is its declared fallback (OR-4).
  fallback:
    kind: iggy
    ref: s3                       # s3_sink (CN2 R2.3)
    directions: [sink]
    replaced_by: CN2 Task 13
licence:
  component: Apache-2.0
  dependencies:
    object_store: Apache-2.0
capabilities:
  source:
    streaming: true               # S3 event notifications through SQS for low latency (CN1 Task 9)
    batch: true                   # object_store listing under a prefix with a high-water key
    cdc: false
    webhook: false
    resumable: true
    position: the last fully emitted key
    # §33 §6 / CN1 Task 9: an object event's id is "<bucket>/<key>@<etag>" and
    # the listing position is the last key whose event was fully emitted.
  sink:
    streaming: false              # the sink writes files, rolled by size or time
    batch: true
    transactional: false          # S3 has no multi-object transaction
    upsert: false
    delete: false
    idempotent: false             # a retried batch rolls a new object, so it is not deduped here
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: per_key               # a lexicographic key high-water is only meaningful per key range
  formats: [cloudevents-binary, cloudevents-structured, json, bytes, parquet]
    # bytes because an object event may carry the object itself; parquet because
    # the source decodes Parquet objects into Arrow batches and the sink writes
    # Parquet (CN1 Task 9).
  schema: { registry: none, evolution: backward }
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull              # the lister pulls objects; the writer pulls Arrow batches
auth: [iam, key]
    # iam for AWS roles (§33 Appendix A.5); key for the static credentials the
    # config schema names, which is how RustFS and MinIO are addressed in CI
    # (CN1 plan Tech Stack).
config:
  $ref: schemas/s3.config.json
secrets: [access_key_id, secret_access_key]
envelope:
  emits: io.loams.dev.flow.s3.object.v1
    # Ruling 2 also names `object-deleted` for S3.  CN1 emits `object` only, so
    # `object-deleted` waits for the change that adds removal notifications.
    # Reviewer decision noted.
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }   # Ruling 3's defaults
conformance: [contract, roundtrip, kill-restart, bulk]
docs: docs/guides/connectors/s3.md
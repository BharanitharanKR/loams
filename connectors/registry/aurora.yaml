# Amazon Aurora — P2 (§33 Appendix A.2), CN2 Task 10 (plan ruling R10.9).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the Postgres family `loams_connector_postgres` under
# the target profile `aurora-postgres` (OR-2): the same batch source, pgoutput
# CDC and exactly-once upsert sink as `postgresql`, plus RDS IAM tokens
# presigned locally per connection (R10.7). The MySQL engine is CN2 Task 11's
# `aurora-mysql` profile (see the note). Aurora has no image: its suites run
# nightly against a real cluster (OR-3), and the row stays `planned` until
# they are green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: aurora
name: Aurora
specVersion: 0.3.0
category: relational
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_postgres::PostgresFactory
  version: "tokio-postgres 0.7.18 / pg_walstream 0.9.0"
  profile: aurora-postgres
licence:
  component: Apache-2.0
  dependencies:
    tokio-postgres: MIT
    postgres-protocol: Apache-2.0          # MIT OR Apache-2.0 (licences.toml)
    pg_walstream: BSD-3-Clause
capabilities:
  source:
    streaming: true
    batch: true
    cdc: true                     # pgoutput; needs rds.logical_replication = 1
    webhook: false
    resumable: true
    position: pg-lsn (the end LSN of the last whole transaction delivered) for CDC, the last key delivered per table for batch reads; mysql-gtid on the MySQL engine
  sink:
    streaming: true
    batch: true
    transactional: true           # one transaction per batch with _loams_checkpoints (R10.12)
    upsert: true
    delete: true
    idempotent: true
  delivery: { source: at_least_once, sink: exactly_once }
  ordering: per_key
  formats: [cloudevents-binary, cloudevents-structured, json, arrow]
  schema: { registry: none, evolution: backward }
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [basic, iam]                # iam: RDS IAM tokens from AWS credentials named by secret
config:
  $ref: schemas/aurora.config.json
secrets: [password, aws.access_key_id, aws.secret_access_key, aws.session_token]
envelope:
  emits: io.loams.dev.flow.aurora.rows.v1
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, exactly-once, cdc, bulk, schema-evolution, backpressure, auth]
docs: docs/guides/connectors/aurora.md
notes:
  - 'engine: the instance''s `engine` setting chooses the family; `postgresql` runs this manifest''s ref with profile `aurora-postgres`, and `mysql` runs loams_connector_mysql::MysqlFactory with profile `aurora-mysql` (CN2 Tasks 10, 11)'
  - "events: batch reads emit `rows` (Arrow); CDC emits `change` and `schema-change` as on PostgreSQL (CN2 Task 10, R10.5)"
  - "tls: the profile defaults sslmode to require; verify-full needs ca_pem set to the Amazon RDS CA bundle, which is not in the webpki roots (R10.7)"

# GraphQL — P2 (§33 Appendix A.17), CN2 Task 21 (plan ruling R21.12).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the protocols family `loams_connector_protocols::graphql`:
# queries and mutations through the SDK's egress-checked HTTP client, and
# subscriptions over `graphql-transport-ws` on the family's own WebSocket client,
# also egress-checked (R21.1, R21.2). Tested against fixtures of the GitHub GraphQL
# API's documented shapes, a loopback WebSocket peer and the real API nightly; the
# row stays `planned` until the suites are green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: graphql
name: GraphQL
specVersion: 0.3.0
category: protocol
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_protocols::graphql
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: true               # a subscription (not resumable)
    batch: true                   # a Relay-cursor query, paged
    cdc: false
    webhook: false
    resumable: true               # the query source; a subscription subscribes afresh
    position: the Relay page cursor (endCursor), or an edge's cursor mid-page
  sink:
    streaming: true               # one mutation per event
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: false
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: none
  formats: [cloudevents-binary, cloudevents-structured, json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [key, oauth2]               # key: a header; oauth2: a bearer token
config:
  $ref: schemas/graphql.config.json
secrets: [auth.bearer, auth.header.secret]
envelope:
  emits: io.loams.dev.flow.graphql.item.v1
  consumes: "*"
  passthrough: false
  stable_ids: true                # an item's id is a digest of the item
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, backpressure, auth]
docs: docs/guides/connectors/graphql.md
notes:
  - "source: an unchanged item re-read keeps its id, so ingest drops it; a changed item is a new event. A subscription's restart replays nothing"
  - "errors: a GraphQL `errors` answer stops a read (Fatal) unless it says it was rate limited (Throttled, 60 s); on a mutation it is Poison for that event"

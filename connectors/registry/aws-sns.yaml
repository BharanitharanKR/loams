# AWS SNS — P2 (§33 Appendix A.1), CN2 Task 19. Hand-written by the registry
# follow-up of R19.6, replacing Task 2's generated stub.
# Runtime: native Rust, loams_connector_cloud::sns: SNS's Query protocol with
# SigV4 through the SDK's egress-checked HTTP client; no AWS SDK (R19.1).
# The sink only: the HTTPS-subscription source (R19.7) is declared once the
# webhooks route is wired (Task 8) and remote ingress opens (Task 28).
# Status stays `planned` until its suites are green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: aws-sns
name: AWS SNS
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_cloud::sns
  version: "loams-connector-cloud 0.0.1 (SNS Query API, SigV4)"
licence:
  component: Apache-2.0
capabilities:
  sink:
    streaming: true
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: true              # FIFO topics: the deduplication id is the event's ce_id (R19.6)
  delivery:
    source: at_least_once         # the schema requires it; the manifest declares no source
    sink: effectively_once
  ordering: per_key               # FIFO message groups; a standard topic keeps no order
  formats: [cloudevents-binary, cloudevents-structured, json, bytes]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: push-with-ack     # PublishBatch answers per entry; only failed entries are retried
auth: [iam]
config:
  $ref: schemas/aws-sns.config.json
secrets: [auth.access_key_id, auth.secret_access_key, auth.session_token]
envelope:
  emits: ""
  consumes: "*"
  passthrough: false
limits: { max_record_bytes: 262144 }
conformance: [contract, roundtrip, dup-check, backpressure, auth]
notes:
  - "delivery: the sink is effectively_once on a FIFO topic, whose deduplication id is the event's ce_id; a standard topic does not deduplicate, so a sink publishing to one is at_least_once (R19.6)"
  - "source: SNS pushes to an HTTPS subscription, which the family verifies (SignatureVersion 1 and 2, SNS's own certificate host, the instance's TopicArn) but the manifest does not declare until the webhooks route exists (R19.6, R19.7); until then subscribe an SQS queue and read it with aws-sqs"
  - "auth: iam means SigV4 with static keys named by secret (auth.*); there is no IMDS, IRSA or SSO credential chain yet (R19.1)"
docs: docs/guides/connectors/aws-sns.md

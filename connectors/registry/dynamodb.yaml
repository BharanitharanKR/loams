# DynamoDB — P2 (§33 Appendix A.3), CN2 Task 14. Installed from the family crate
# by the CN2 registry follow-up (ruling R14.1).
# Runtime: native Rust, loams-connector-kv over aws-sdk-dynamodb 1.128 (no
# default HTTPS client: requests go through the SDK's egress-checked client,
# ruling R14.3). Change capture is the dynamodb-streams manifest.
apiVersion: loams.flow/v1
kind: Connector
id: dynamodb
name: DynamoDB
specVersion: 0.2.0
category: nosql
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_kv::dynamodb::DynamoDbFactory
  version: "aws-sdk-dynamodb 1.128.0"
licence:
  component: Apache-2.0
  dependencies:
    aws-sdk-dynamodb: Apache-2.0
capabilities:
  source:                          # parallel Scan, one split per segment
    streaming: false
    batch: true
    cdc: false
    webhook: false
    resumable: true
    position: each Scan segment's LastEvaluatedKey
  sink:                            # BatchWriteItem (UnprocessedItems retried), or conditional PutItem by version
    streaming: true
    batch: true
    transactional: false
    upsert: true                  # PutItem replaces the item with the same key
    delete: true                  # loamsop=d becomes a DeleteRequest
    idempotent: true              # a replayed put leaves one item; with version_attribute an older one never wins
  delivery: { source: effectively_once, sink: effectively_once }
  ordering: per_key
  formats: [json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [iam]
config:
  $ref: schemas/dynamodb.config.json
secrets: [access_key_id, secret_access_key, session_token]
envelope:
  emits: io.loams.dev.flow.dynamodb.document.v1
  consumes: "*"
  passthrough: false
  stable_ids: true
limits: { max_record_bytes: 409600 }
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
notes:
  - "PR CI runs against floci 2.1.0 (R0.23); the nightly job runs against AWS with the LOAMS_AWS_* secrets."
  - "An item's id is the table plus a digest of the item, so an unchanged item re-read is dropped by ingest and a changed one is a new event."
  - "iam here is SigV4 with static keys (or a session token) from the secret store; instance roles and web identity are not built (ruling R14.3)."
docs: docs/guides/connectors/dynamodb.md

# Valkey — P2 (§33 Appendix A.3), CN2 Task 14. Installed from the family
# crate by the CN2 registry follow-up (ruling R14.1); the crate's
# `proposed_manifests_validate` checks it against the code.
# Runtime: native Rust, loams-connector-kv's Redis implementation under the
# `valkey` target profile (OR-2): the same code as the Redis ★, run against
# real Valkey 8 (BSD-3-Clause), never against Redis.
apiVersion: loams.flow/v1
kind: Connector
id: valkey
name: Valkey
specVersion: 0.2.0
category: nosql
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_kv::redis::RedisFactory
  version: "redis 1.7.1"
  profile: valkey
licence:
  component: Apache-2.0
  dependencies:
    redis: BSD-3-Clause
capabilities:
  source:                          # SCAN + typed reads (keys), or XREADGROUP (streams)
    streaming: true
    batch: true
    cdc: false
    webhook: false
    resumable: true
    position: the SCAN cursor of the page being read, or the stream entry id acknowledged with XACK
  sink:                            # SET / HSET by key template (DEL on loamsop=d), XADD, or PUBLISH
    streaming: true
    batch: true
    transactional: false
    upsert: true                  # SET and HSET replace the value at a key
    delete: true                  # loamsop=d deletes the key (or the hash field)
    idempotent: true              # a replayed keyed write leaves one value
  delivery: { source: effectively_once, sink: at_least_once }
  ordering: per_key
  formats: [json, cloudevents-binary, cloudevents-structured]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [none, basic]
config:
  $ref: schemas/valkey.config.json
secrets: [password]
envelope:
  emits: io.loams.dev.flow.valkey.document.v1
  consumes: "*"
  passthrough: false
  stable_ids: true
limits: { max_record_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
notes:
  - "The sink is at least once because its xadd mode appends again on a replay; the set and hset modes are effectively once (one value per key). Use the redis-streams manifest for Streams pipelines."
  - "Source ids are stable: a key's id is its database, name and a digest of its value, and a stream entry's is <stream>/<entry-id>."
  - "TLS (rediss://) uses the SDK's rustls with the webpki roots; client certificates (mtls) are not built yet (ruling R14.7)."
docs: docs/guides/connectors/valkey.md

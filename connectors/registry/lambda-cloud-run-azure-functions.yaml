# Lambda / Cloud Run / Azure Functions — P2 (§33 Appendix A.14), CN2 Task 21
# (plan rulings R21.8, R21.12). Hand-written (handwritten.txt).
# Runtime: native Rust, the protocols family `loams_connector_protocols::functions`:
# one manifest, three platforms, a request-reply sink (OR-19). Lambda `Invoke` is
# signed with the HTTP family's SigV4 (no AWS SDK); Cloud Run takes an ID token the
# secret store mints; Azure a function key. The source direction (a function calling
# back) is a webhook delivery, so the factory has no pull source (R21.8). Tested
# against floci as Lambda in `connectors-p2` and the real platforms nightly; the
# row stays `planned` until those suites are green (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: lambda-cloud-run-azure-functions
name: Lambda / Cloud Run / Azure Functions
specVersion: 0.3.0
category: infra
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_protocols::functions
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: true
    batch: false
    cdc: false
    webhook: true                 # a function calling back, delivered as a webhook
    resumable: false
    position: ""
  sink:
    streaming: true               # one invocation per event
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: false
    reply: true                   # the answer is a reply event on `reply_topic` (OR-19, R21.6)
  delivery: { source: at_least_once, sink: at_least_once }
    # A retried batch invokes again; its replies keep their ids, so ingest drops a
    # repeated reply.
  ordering: none
  formats: [cloudevents-binary, cloudevents-structured, json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [iam, sa, aad]              # iam: SigV4 (Lambda); sa: an ID token (Cloud Run); aad: a function key (Azure)
config:
  $ref: schemas/lambda-cloud-run-azure-functions.config.json
secrets: [aws.access_key_id, aws.secret_access_key, aws.session_token, id_token, function_key]
envelope:
  emits: io.loams.dev.flow.lambda-cloud-run-azure-functions.reply.v1
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, backpressure, auth]
docs: docs/guides/connectors/lambda-cloud-run-azure-functions.md
notes:
  - "replies: id <input id>/reply, keeping the input's subject, with loamsinreplyto and loamsinreplytosource; built from the answer body only, and a reply containing a credential the call sent is refused (R21.6)"
  - "errors: a function error (X-Amz-Function-Error) is Poison, or a reply {function_error, payload} with `function_error: reply`; 404 Fatal, 429 Throttled, 5xx Retryable, another 4xx Poison"
  - "sa: the Cloud Run ID token is a secret the store mints and rotates; minting it in-process is not built (R21.8)"

# Amazon Redshift — P2 (§33 Appendix A.4), CN2 Task 17 (plan ruling R17.2).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the analytics family `loams_connector_analytics::redshift`,
# over the Redshift Data API signed with SigV4 in the family crate (R17.4); S3
# (the UNLOAD output and the sink's staging) through object_store 0.13.2 with the
# egress-checked client. The suite runs nightly against a real Serverless
# workgroup; recorded fixtures wait for FixtureProxy's binary bodies (R17.10).
# The row stays `planned` until it is green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: redshift
name: Redshift
specVersion: 0.3.0
category: warehouse
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_analytics::redshift
  version: "Redshift Data API / object_store 0.13.2"
licence:
  component: Apache-2.0
  dependencies:
    object_store: Apache-2.0
    parquet: Apache-2.0
capabilities:
  source:
    streaming: false
    batch: true                   # GetStatementResult pages, or UNLOAD to Parquet (bulk)
    cdc: false
    webhook: false
    resumable: true
    position: the query's as-of time, the page cursor (statement id and NextToken, or the UNLOAD file) and the rows delivered; an expired result re-runs the query and skips the delivered rows (R17.9)
  sink:
    streaming: false
    batch: true
    transactional: false          # one BatchExecuteStatement per batch, but no checkpoint in it
    upsert: false                 # `sink.mode: merge` upserts on `sink.keys` (see the note)
    delete: false
    idempotent: false
  delivery: { source: effectively_once, sink: at_least_once }
    # Source: §33 §6 run ids, stable across re-reads. Sink: `append` (the default)
    # is at least once; `merge` is effectively once (see the note).
  ordering: none                  # the query's ORDER BY decides
  formats: [cloudevents-binary, cloudevents-structured, json, arrow, parquet]
  schema: { registry: none, evolution: backward }
    # `evolution: additive` by default (the SDK's SchemaPolicy).
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [iam]                       # AWS credentials by secret name; db_user or secret_arn pick the database user
config:
  $ref: schemas/redshift.config.json
secrets: [auth.access_key_id, auth.secret_access_key, auth.session_token]
envelope:
  emits: io.loams.dev.flow.redshift.rows.v1
  consumes: "*"
  passthrough: false
  stable_ids: true
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, bulk, schema-evolution, backpressure, auth]
docs: docs/guides/connectors/redshift.md
notes:
  - "sink: `sink.mode: merge` MERGEs on `sink.keys`, an upsert, and is effectively_once; `sink.upsert` stays false because the merge keys are `sink.keys`, not the top-level `key` the upsert rule reads, and the crate refuses unknown keys (R17.2)"
  - "sink: each batch is staged as one Parquet file named by the batch's id under `sink.staging`, copied in one transaction, then deleted"
  - "source: give the query an ORDER BY; a result expires after 24 h, and the re-run is exact only with a deterministic order (R17.9)"
  - "basic: Appendix A's database password is not built; Data API callers authenticate with AWS credentials, plus db_user (temporary credentials) or secret_arn"

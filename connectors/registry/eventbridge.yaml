# Amazon EventBridge — P2 (§33 Appendix A.1), CN2 Task 19. Hand-written by the
# registry follow-up of R19.6, replacing Task 2's generated stub.
# Runtime: native Rust, loams_connector_cloud::eventbridge: PutEvents over AWS
# JSON 1.1 with SigV4, no AWS SDK (R19.1). EventBridge pushes to targets, so
# the source is a rule whose target is an SQS queue, read as aws-sqs reads it.
# Status stays `planned` until its suites are green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: eventbridge
name: EventBridge
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_cloud::eventbridge
  version: "loams-connector-cloud 0.0.1 (EventBridge JSON 1.1, SQS JSON 1.0, SigV4)"
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: true               # through a rule's SQS target, long-polled
    batch: false
    cdc: false
    webhook: false
    resumable: true
    position: the rule's target queue's in-flight messages; a message is deleted only after the Fabric acknowledges its event
  sink:
    streaming: true
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: false             # PutEvents does not deduplicate a resent entry
  delivery: { source: effectively_once, sink: at_least_once }
  ordering: none
  formats: [cloudevents-structured, json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [iam]
config:
  $ref: schemas/eventbridge.config.json
secrets: [auth.access_key_id, auth.secret_access_key, auth.session_token]
envelope:
  emits: io.loams.dev.flow.eventbridge.event.v1
  consumes: "*"
  passthrough: true               # a detail that is a CloudEvent keeps its identity (R19.8)
  stable_ids: true                # EventBridge's event id, unchanged when SQS redelivers it
limits: { max_record_bytes: 262144 }
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
notes:
  - "source: EventBridge's source is a rule whose target is an SQS queue, which the instance reads with the SQS settings (queue_url, wait_time_seconds, visibility_timeout_seconds, receivers); the runbook sets up the rule, queue and policy (R19.6)"
  - "sink: each entry's Detail is the whole event in the structured CloudEvents form, so rules can match on any attribute; a throttled entry is retried alone and a refused one goes to the DLQ (R19.9)"
  - "auth: iam means SigV4 with static keys named by secret (auth.*); there is no IMDS, IRSA or SSO credential chain yet (R19.1)"
docs: docs/guides/connectors/eventbridge.md

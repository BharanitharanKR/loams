# PostgreSQL — ★ connector 2 of §33 §8; CN1 plan Task 7.
# Runtime: native Rust, loams_flow::connectors::postgres (design §33 §5, D354).
# §33 §4 rule 2: the manifest describes the runtime Loams ships, so this is the
# native batch source and the native upsert sink.  Appendix A's Streaming cell
# says Y for PostgreSQL because the *Iggy* `postgres_sink` alternative is
# streaming; §8's Direction column ("source (batch), sink (upsert)") is the
# runtime-specific truth recorded here, and the Iggy alternative is named in the
# comment on `runtime` below.
# CN2 Task 2 (OR-8, OR-9): the source gains native CDC (logical replication,
# `pgoutput`; CN2 Task 10 builds it), and CN1's alternatives become the declared
# fallbacks: Iggy's `postgres_source` and `postgres_sink` here, and Debezium Server
# through the `debezium-postgres` manifest.  Minor bump: capabilities widened.
apiVersion: loams.flow/v1
kind: Connector
id: postgresql
name: PostgreSQL
specVersion: 1.1.0
category: relational
priority: P1
starred: true
status: preview
runtime:
  kind: native
  ref: loams_flow::connectors::postgres
  version: "tokio-postgres 0.7 / adbc_driver_manager 0.24"
  fallback:
    kind: iggy
    ref: postgres                 # postgres_source and postgres_sink (CN2 R2.3)
    directions: [source, sink]
    replaced_by: CN2 Task 10
licence:
  component: Apache-2.0
  dependencies:
    tokio-postgres: MIT
    adbc-driver-postgres: Apache-2.0   # the Postgres ADBC driver for bulk loads (D356; licences.toml)
capabilities:
  source:
    streaming: true               # CN2 OR-9: native CDC streams changes
    batch: true
    cdc: true                     # CN2 OR-9: logical replication with pgoutput (Task 10)
    webhook: false
    resumable: true
    position: the exported snapshot id or the cursor_column value; for CDC the acknowledged commit LSN
    # §33 §6: a batch read's as-of position is the exported snapshot id (the
    # REPEATABLE READ snapshot the parallel workers share, CN1 Task 7); in
    # incremental mode it is the cursor_column high-water mark.
  sink:
    streaming: false
    batch: true
    transactional: true           # one transaction per batch, so a batch is atomic (CN1 Task 7)
    upsert: true                  # INSERT … ON CONFLICT (key) DO UPDATE; `key` is in the config schema
    delete: true                  # deletes for loamsop = d (CN1 Task 7, §33 §6)
    idempotent: true              # the upsert by the declared key dedupes a redelivered batch
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: per_key               # batches are partitioned by the declared key (D356)
  formats: [cloudevents-binary, cloudevents-structured, json, arrow]
    # Arrow because a batch read's events carry Arrow IPC stream bytes
    # (Ruling 3: datacontenttype application/vnd.apache.arrow.stream).
  schema: { registry: none, evolution: backward }
    # No registry: COPY's binary format carries the types.  Additive evolution
    # only, which is what §33 §7's additive table evolution allows.
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull              # the parallel COPY workers pull from the table
auth: [basic, mtls, iam]          # §33 Appendix A.2 (the third is AWS RDS IAM tokens)
config:
  $ref: schemas/postgresql.config.json
secrets: [password, tls.key_pem]
envelope:
  emits: io.loams.dev.flow.postgresql.rows.v1
  consumes: "*"
  passthrough: false              # a row batch is not a producer's CloudEvent (§33 §6)
limits: { batch_rows: 65536, batch_bytes: 8388608 }   # Ruling 3's defaults
conformance: [contract, roundtrip, kill-restart, dup-check, bulk]
docs: docs/guides/connectors/postgresql.md
# CockroachDB — P2 (§33 Appendix A.2), CN2 Task 10 (plan ruling R10.9).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the Postgres family `loams_connector_postgres` under
# the target profile `cockroachdb` (OR-2). CockroachDB speaks the Postgres wire
# protocol but has no logical replication and no binary `COPY … TO` (R0.20):
# its CDC is a sinkless `CREATE CHANGEFEED … WITH updated, diff, resolved`
# over the SQL connection (R10.13), its batch reads are `SELECT … AS OF SYSTEM
# TIME` pages, and the sink is the family's exactly-once upsert sink. The suite
# runs against real CockroachDB (a `ci-service`, OR-3); the row stays
# `planned` until it is green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: cockroachdb
name: CockroachDB
specVersion: 0.3.0
category: relational
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_postgres::PostgresFactory
  version: "tokio-postgres 0.7.18"
  profile: cockroachdb
licence:
  component: Apache-2.0
  dependencies:
    tokio-postgres: MIT
    postgres-protocol: Apache-2.0          # MIT OR Apache-2.0 (licences.toml)
capabilities:
  source:
    streaming: true
    batch: true
    cdc: true                     # a sinkless changefeed; needs kv.rangefeed.enabled
    webhook: false
    resumable: true
    position: the last resolved timestamp the Fabric acknowledged (changefeed cursor) for CDC; the last key and the AS OF SYSTEM TIME snapshot for batch reads
  sink:
    streaming: true
    batch: true
    transactional: true           # one transaction per batch with _loams_checkpoints; 40001 retries replay the batch (R10.12)
    upsert: true
    delete: true
    idempotent: true
  delivery: { source: at_least_once, sink: exactly_once }
  ordering: per_key
  formats: [cloudevents-binary, cloudevents-structured, json, arrow]
  schema: { registry: none, evolution: backward }
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [basic]                     # the CI cluster runs insecure; client certificates are not built
config:
  $ref: schemas/cockroachdb.config.json
secrets: [password]
envelope:
  emits: io.loams.dev.flow.cockroachdb.rows.v1
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, exactly-once, cdc, bulk, schema-evolution, backpressure, auth]
docs: docs/guides/connectors/cockroachdb.md
notes:
  - "events: changefeed rows emit `change` with ids <table>/<updated>/<key>, which ingest deduplicates after a restart; rows of a fresh feed's initial scan carry loamsop = r (R10.13)"
  - "config: the Postgres family's keys, without Aurora's IAM (`auth: iam`, `aws`); the slot and publication keys are not read on CockroachDB"

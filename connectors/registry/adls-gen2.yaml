# ADLS Gen2 — P2 (§33 Appendix A.5), CN2 Task 13.
# Runtime: native Rust, loams_connector_objects::adls_gen2. Listing, reading
# and writing use the Blob API, as Azure Blob does; with `hns: true` the sink
# publishes each rolled file by an atomic DFS rename that refuses an existing
# destination, because object_store renames by copy and delete (R0.21).
# Flat Blob operations run on Azurite in PR CI; the DFS rename runs only
# nightly on a real HNS account (R13.5).
apiVersion: loams.flow/v1
kind: Connector
id: adls-gen2
name: ADLS Gen2
specVersion: 0.3.0
category: object-storage
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_objects::adls_gen2
  version: "object_store 0.13.2"
licence:
  component: Apache-2.0
  dependencies:
    object_store: Apache-2.0
    reqwest: Apache-2.0
capabilities:
  source:
    streaming: false             # listing only; Event Grid notifications are Azure Blob's
    batch: true                   # a listing per prefix, read after a high-water key
    cdc: false
    webhook: false
    resumable: true
    position: the high-water key per prefix, plus the key, etag and next row of a partly emitted object
  sink:
    streaming: false              # files rolled by size (128 MiB) or time (5 min)
    batch: true
    transactional: false          # each batch is staged with its checkpoint (R13.2); exactly_once waits for the exactly-once suite on a real store
    upsert: false
    delete: false
    idempotent: true              # deterministic names + conditional publish: a replayed file is refused, never written twice
  delivery: { source: at_least_once, sink: effectively_once }
  ordering: per_key               # keys are read in lexicographic order within a prefix
  formats: [cloudevents-binary, cloudevents-structured, json, bytes, csv, ndjson, parquet, arrow]
  schema: { registry: none, evolution: backward }   # a new Arrow schema rolls the file
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [aad, key]
config:
  $ref: schemas/adls-gen2.config.json
secrets: [auth.access_key, auth.bearer_token, auth.sas_token]
envelope:
  emits: io.loams.dev.flow.adls-gen2.object.v1
  consumes: "*"
  passthrough: false
  stable_ids: true                # "<bucket>/<key>@<etag>" survives a re-read
limits: { max_record_bytes: 67108864, batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, bulk, schema-evolution, backpressure, auth]
docs: docs/guides/connectors/adls-gen2.md
notes:
  - "sink: with `hns: true` a file is published by the DFS rename (`x-ms-rename-source`, `If-None-Match: *`); the rename is unverified until `adls_hns_rename_nightly` is green (CN2 R0.21, R13.5)"
  - "auth: `key` is the account's shared key or a SAS token, `aad` an Entra ID bearer token; the DFS calls sign Shared Key requests themselves (HMAC-SHA256, version 2023-11-03)"
  - "sink: effectively_once holds while `sink.conditional_put` is on (the default); turning it off makes the sink at_least_once"
  - "source: ids are stable, so ingest's (source, id) dedup collapses a re-read; the source declares at_least_once because a decoded object resumed mid-object may be cut into different row ranges"

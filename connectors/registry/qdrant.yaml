# Qdrant — P2 (§33 Appendix A.3), CN2 Task 15. Hand-written by CN2 Task 2's
# follow-up of ruling R15.5, replacing the generated stub.
# Runtime: native Rust, the search family's REST client
# (`loams_connector_search::qdrant`, R15.2: not `qdrant-client`, whose gRPC
# dialling bypasses the SDK's egress check). Its suites run against real
# Qdrant; Loams collections' Qdrant API is an extra target only (OR-2). Status
# stays planned until the suites are green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: qdrant
name: Qdrant
specVersion: 0.3.0
category: vector
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_search::qdrant
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: false
    batch: true                   # scroll in point-id order, one split per collection
    cdc: false
    webhook: false
    resumable: true
    position: the scroll offset, the id of the next point to read
  sink:
    streaming: false
    batch: true                   # PUT /collections/<c>/points?wait=true, up to `batch` points a request
    transactional: false
    upsert: true                  # the point id is UUID v5 of the document key
    delete: true                  # loamsop = d deletes the point
    idempotent: true              # the same key always gives the same point
  delivery: { source: effectively_once, sink: effectively_once }
    # Source ids `<collection>/<point id>@<digest of {id, payload, vector}>` are
    # stable while a point is unchanged, so ingest dedups a re-read (R15.8, OR-7).
  ordering: per_key
  formats: [cloudevents-binary, cloudevents-structured, json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [key]                       # the `api-key` header
config:
  $ref: schemas/qdrant.config.json
secrets: [api_key]
envelope:
  emits: io.loams.dev.flow.qdrant.document.v1
  consumes: "*"
  passthrough: false
  stable_ids: true
limits: { max_record_bytes: 16777216 }
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
docs: docs/guides/connectors/qdrant.md

# Azure SQL Database — P2 (§33 Appendix A.2), CN2 Task 12 (plan ruling R12.9).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the SQL Server family `loams_connector_sqlserver` under the
# target profile `azure-sql` (OR-2), which defaults `auth: entra` and `encrypt:
# strict`: the same batch source, change-table CDC and exactly-once MERGE sink as
# `sql-server`, plus Entra ID service-principal tokens fetched through the SDK's
# HTTP client and gateway redirects opened through `sdk::net::connect`. Azure SQL
# has no image: its suites run nightly against a real database (OR-3), and the row
# stays `planned` until they are green (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: azure-sql
name: Azure SQL
specVersion: 0.3.0
category: relational
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_sqlserver::SqlServerFactory
  version: "tiberius 0.13.0 (TDS 8.0)"
  profile: azure-sql
licence:
  component: Apache-2.0
  dependencies:
    tiberius: Apache-2.0          # MIT OR Apache-2.0 (licences.toml)
capabilities:
  source:
    streaming: true               # mode: cdc
    batch: true                   # mode: batch, keyset paging under one snapshot
    cdc: true                     # the CDC change tables; CDC must be enabled on the database and the tables
    webhook: false
    resumable: true
    position: the (start_lsn, seqval, operation) of the last change delivered for CDC; the last key delivered per table (and range) for batch reads
  sink:
    streaming: true
    batch: true
    transactional: true           # one transaction per batch with the checkpoint in _loams_checkpoints, fenced by the lease epoch
    upsert: true                  # MERGE … WITH (HOLDLOCK) by `key`
    delete: true                  # loamsop = d deletes by key
    idempotent: true              # the MERGE by key dedupes a redelivered batch
  delivery: { source: at_least_once, sink: exactly_once }
    # Source: a change committed but not yet harvested when the snapshot starts can
    # arrive twice (R12.3). Sink: exactly once with `transactional: true` (the
    # default); `transactional: false` is at least once and idempotent by key.
  ordering: per_key               # CDC changes in LSN order; batch reads in key order
  formats: [cloudevents-binary, cloudevents-structured, json, arrow]
  schema: { registry: none, evolution: backward }
    # `evolution: additive` by default: a new capture instance after ALTER TABLE
    # emits a schema-change event; anything the policy refuses pauses.
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [basic, aad]                # basic: a SQL login; aad: an Entra ID service principal or token
config:
  $ref: schemas/azure-sql.config.json
secrets: [password, entra.client_secret, token]
envelope:
  emits: io.loams.dev.flow.azure-sql.rows.v1
  consumes: "*"
  passthrough: false
  stable_ids: true                # CDC ids <capture instance>/<start_lsn>/<seqval>/<operation>
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, exactly-once, cdc, bulk, schema-evolution, backpressure, auth]
docs: docs/guides/connectors/azure-sql.md
notes:
  - "events: batch reads emit `rows` (Arrow); CDC emits `change` (loamsop c, u or d; the snapshot as Arrow with loamsop = r) and `schema-change`, and an update's before and after images form one event"
  - "cdc: a position older than the cleanup job's retention (three days by default) is PositionLost, and the instance stops with a re-snapshot hint"
  - "cdc: needs the S3 tier or above (or vCore); msdb.dbo.cdc_jobs is not readable, so set `retention_minutes` for the position-risk metric"

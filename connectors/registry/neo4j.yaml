# Neo4j — P2 (§33 Appendix A.3), CN2 Task 21 (plan rulings R21.5, R21.12).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the protocols family `loams_connector_protocols::neo4j`,
# over Neo4j's HTTP Query API (`POST /db/{database}/query/v2`, 5.19 or later),
# through the SDK's egress-checked client. No Bolt client is built (D634 (c);
# `no_bolt_dependency`). Tested against `neo4j:5.26.30-community` in
# `connectors-p2`; the row stays `planned` until that suite is green (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: neo4j
name: Neo4j
specVersion: 0.3.0
category: graph
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_protocols::neo4j
  version: "Neo4j HTTP Query API v2 (5.19+)"
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: false
    batch: true                   # one split per label; `poll_interval_ms` keeps polling
    cdc: false
    webhook: false
    resumable: true
    position: the last cursor property value (typed) and elementId read, in (cursor, elementId) order
  sink:
    streaming: false
    batch: true                   # one parameterised statement per batch, $rows bound
    transactional: false          # each request is one implicit transaction, with no checkpoint in it
    upsert: false                 # a MERGE statement upserts, but the key lives in the statement, not a `key` setting
    delete: true                  # `delete_statement` for loamsop = d
    idempotent: false             # idempotent only when the statement MERGEs on a key (see the note)
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: per_key
  formats: [cloudevents-binary, cloudevents-structured, json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [basic]                     # a bearer token (SSO) is accepted too (see the note)
config:
  $ref: schemas/neo4j.config.json
secrets: [auth.basic.password, auth.bearer]
envelope:
  emits: io.loams.dev.flow.neo4j.rows.v1
  consumes: "*"
  passthrough: false
  stable_ids: true                # <label>/<elementId>@<cursor>
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, backpressure, auth]
docs: docs/guides/connectors/neo4j.md
notes:
  - "sink: a statement that MERGEs on a key makes a replayed batch harmless (neo4j_sink_merge_idempotent); the manifest declares at_least_once because the statement is the user's"
  - "community: whether Community Edition ships the Query API is unverified until the CI suite runs (R21.5); a 404 is reported as no such database or the Query API is disabled"
  - "auth: `auth.bearer` sends a bearer token (SSO) in place of HTTP Basic"

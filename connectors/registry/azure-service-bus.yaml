# Azure Service Bus over AMQP 1.0 — CN2 plan Task 18 (OR-22), loams_connector_brokers::amqp10
# (fe2o3-amqp with fe2o3-amqp-cbs). Staged in the brokers crate (R18.1) and installed here
# by the CN2 registry follow-up. PR CI runs the emulator (ci-service, with its SQL Server sidecar); a real
# namespace runs nightly.
apiVersion: loams.flow/v1
kind: Connector
id: azure-service-bus
name: Azure Service Bus
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_brokers::amqp10
  version: "loams-connector-brokers 0.0.1 / fe2o3-amqp 0.18.2 / fe2o3-amqp-cbs 0.18.0"
licence:
  component: Apache-2.0
  dependencies:
    fe2o3-amqp: Apache-2.0
    fe2o3-amqp-cbs: Apache-2.0
capabilities:
  source:
    streaming: true
    batch: false
    cdc: false
    webhook: false
    resumable: true
    position: peek-lock; a message is completed only after the Fabric acknowledges it, and Service Bus redelivers it when the lock is lost
  sink:
    streaming: true
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: false
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: per_partition
  formats: [cloudevents-binary, cloudevents-structured, json, bytes]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [cs, aad]
config:
  $ref: schemas/azure-service-bus.config.json
secrets: [connection_string, entra.client_secret, tls.key_pem]
envelope:
  emits: io.loams.dev.flow.azure-service-bus.message.v1
  consumes: "*"
  passthrough: true
  stable_ids: false
limits:
  max_record_bytes: 262144
notes:
  - "the sink sets message-id to the event id; an entity with duplicate detection on drops repeats within its window, but the manifest claims only at least once"
  - "partitioned entities, large messages and AMQP over WebSockets run only nightly (spike §5.3)"
conformance: [contract, roundtrip, kill-restart, backpressure, auth]
docs: docs/guides/connectors/azure-service-bus.md

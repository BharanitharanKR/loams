# RabbitMQ over AMQP 0-9-1 — CN2 plan Task 18 (OR-1), loams_connector_brokers::amqp091 (lapin).
# Staged in the brokers crate (R18.1) and installed here, with
# schemas/rabbitmq-amqp.config.json, by the CN2 registry follow-up (the id is in
# handwritten.txt). It stays `planned` until its suites are green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: rabbitmq-amqp
name: RabbitMQ / AMQP
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_brokers::amqp091
  version: "loams-connector-brokers 0.0.1 / lapin 4.12.0"
licence:
  component: Apache-2.0
  dependencies:
    lapin: MIT
    amq-protocol: BSD-2-Clause
capabilities:
  source:
    streaming: true
    batch: false
    cdc: false
    webhook: false
    resumable: true
    position: the broker's unacknowledged deliveries; a delivery is acked only after the Fabric acknowledges it, and RabbitMQ redelivers whatever a dead consumer held
  sink:
    streaming: true
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: false
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: per_partition
  formats: [cloudevents-binary, cloudevents-structured, json, bytes]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: push-with-ack
auth: [basic, mtls]
config:
  $ref: schemas/rabbitmq-amqp.config.json
secrets: [password, tls.key_pem]
envelope:
  emits: io.loams.dev.flow.rabbitmq-amqp.message.v1
  consumes: "*"
  passthrough: true
  stable_ids: false
limits: {}
conformance: [contract, roundtrip, kill-restart, backpressure, auth]
notes:
  - "backpressure: basic.qos prefetch is the pipeline's in-flight budget, and acks wait for the Fabric, so a slow Fabric stops delivery (R18.5)"
  - "ids: a message's message-id when it has one, else a per-connection id; ids are not stable across redeliveries, so the source is at least once"
docs: docs/guides/connectors/rabbitmq-amqp.md

# Databricks — P2 (§33 Appendix A.4), CN2 Task 17 (plan ruling R17.2).
# Hand-written: the generator no longer writes this file (handwritten.txt).
# Runtime: native Rust, the analytics family `loams_connector_analytics::databricks`,
# over the SQL Statement Execution API (Arrow result chunks behind presigned
# links) and the Files API, through the SDK's egress-checked HTTP client. The
# suite runs nightly against a real SQL warehouse; recorded fixtures wait for
# FixtureProxy's binary bodies (R17.10). The row stays `planned` until it is
# green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: databricks
name: Databricks
specVersion: 0.3.0
category: warehouse
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_analytics::databricks
  version: "SQL Statement Execution API 2.0"
licence:
  component: Apache-2.0
  dependencies:
    parquet: Apache-2.0
capabilities:
  source:
    streaming: false
    batch: true                   # EXTERNAL_LINKS + ARROW_STREAM, one page per result chunk
    cdc: false
    webhook: false
    resumable: true
    position: the query's as-of time, the chunk cursor and the rows delivered; a closed statement re-runs the query and skips the delivered rows (R17.9)
  sink:
    streaming: false
    batch: true
    transactional: false
    upsert: false                 # `sink.mode: merge` upserts on `sink.keys` (see the note)
    delete: false
    idempotent: true              # files uploaded with overwrite=false; COPY INTO skips a file it has loaded (R17.8)
  delivery: { source: effectively_once, sink: effectively_once }
  ordering: none                  # the query's ORDER BY decides
  formats: [cloudevents-binary, cloudevents-structured, json, arrow, parquet]
  schema: { registry: none, evolution: none }   # Arrow chunks carry their own schema; no policy is applied
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [key]                       # a personal access token or OAuth access token, by secret name
config:
  $ref: schemas/databricks.config.json
secrets: [token]
envelope:
  emits: io.loams.dev.flow.databricks.rows.v1
  consumes: "*"
  passthrough: false
  stable_ids: true
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, kill-restart, dup-check, bulk, backpressure, auth]
docs: docs/guides/connectors/databricks.md
notes:
  - "sink: `sink.mode: merge` MERGEs on `sink.keys`, an upsert; `sink.upsert` stays false because the merge keys are `sink.keys`, not the top-level `key` the upsert rule reads, and the crate refuses unknown keys (R17.2). Both modes are effectively_once"
  - "auth: Appendix A's oauth2 is an OAuth access token held in `token`; the M2M client-credentials exchange is not built (R17.8)"
  - "source: result-chunk links are fetched without the workspace token and never logged (their query strings are credentials)"

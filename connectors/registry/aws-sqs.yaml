# AWS SQS — P2 (§33 Appendix A.1), CN2 Task 19. Hand-written by the registry
# follow-up of R19.6, replacing Task 2's generated stub.
# Runtime: native Rust, loams_connector_cloud::sqs: the SQS JSON protocol with
# SigV4 through the SDK's egress-checked HTTP client; no AWS SDK (R19.1).
# Status stays `planned` until its suites are green in CI (OR-23).
apiVersion: loams.flow/v1
kind: Connector
id: aws-sqs
name: AWS SQS
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_cloud::sqs
  version: "loams-connector-cloud 0.0.1 (SQS JSON 1.0, SigV4)"
licence:
  component: Apache-2.0
capabilities:
  source:
    streaming: true               # long polling (ReceiveMessage, up to 20 s)
    batch: false
    cdc: false
    webhook: false
    resumable: true
    position: the queue's in-flight messages; a message is deleted only after the Fabric acknowledges its event, and SQS redelivers it after its visibility timeout otherwise
  sink:
    streaming: true
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: true              # FIFO queues: MessageDeduplicationId is the event's ce_id (R19.6)
  delivery: { source: effectively_once, sink: effectively_once }
  ordering: per_key               # FIFO message groups; a standard queue keeps no order
  formats: [cloudevents-binary, cloudevents-structured, json, bytes]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [iam]
config:
  $ref: schemas/aws-sqs.config.json
secrets: [auth.access_key_id, auth.secret_access_key, auth.session_token]
envelope:
  emits: io.loams.dev.flow.aws-sqs.message.v1
  consumes: "*"
  passthrough: true               # ce_* attributes, a structured body or an SNS envelope keep their identity (R19.8)
  stable_ids: true                # the SQS message id, unchanged on redelivery
limits: { max_record_bytes: 262144 }
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
notes:
  - "delivery: the sink is effectively_once on a FIFO queue (`….fifo`), whose MessageDeduplicationId is the event's ce_id within SQS's five-minute window; a standard queue does not deduplicate, so a sink writing one is at_least_once (R19.6)"
  - "auth: iam means SigV4 with static keys named by secret (auth.*); there is no IMDS, IRSA or SSO credential chain yet (R19.1). With an emulator endpoint and no auth, requests carry a placeholder key (R19.3)"
  - "oversized: a message larger than a whole batch is reported to the DLQ and left unacknowledged, so the queue's redrive policy moves it; configure one (R19.5)"
docs: docs/guides/connectors/aws-sqs.md

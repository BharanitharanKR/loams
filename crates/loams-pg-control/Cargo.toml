[package]
name = "loams-pg-control"
description = "Loams Postgres's control plane (design §46 §6): the records and the PgControlStore, over loams-kv's embedded (redb) store in single-node mode and TiKV in production."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Reached only through `loams`'s feature `postgres` (PG2 Task 9); its tikv
# backend depends on loams-tikv, which is publish = false.
publish = false

[features]
# The TiKV backend (store::tikv), wrapping loams-tikv through loams-kv.
tikv = ["loams-kv/tikv"]
# KvControlStore::with_faults: loams-kv's fault hooks, for the conformance
# suite's injected faults.
faults = ["loams-kv/faults"]
# secrets::KubeSecretStore: role secrets as Kubernetes Secrets (Task 6).
kubernetes = ["dep:kube", "dep:k8s-openapi"]
# secrets::KeySource::Keyring: the file store's key in the OS keyring.
keyring = ["dep:keyring"]

[dependencies]
# The single-node secret file (secrets::FileSecretStore).
age.workspace = true
async-trait.workspace = true
# The upcall listener (src/upcall.rs, Task 8): routes on axum, connections
# served by hyper with a header read timeout.
axum.workspace = true
base64.workspace = true
futures.workspace = true
hex.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
jsonwebtoken.workspace = true
k8s-openapi = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
loams-kv.workspace = true
# The clients NeonClients adapts (src/neon.rs); loams-postgres never
# depends on this crate.
loams-postgres.workspace = true
postcard.workspace = true
# Role passwords: 32 bytes from the OS (secrets::generate_password).
rand.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The storage controller's token, compared in constant time.
subtle = "2.6"
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
# Calling the upcall router per connection (tower::Service).
tower.workspace = true
tracing.workspace = true
ulid.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The conformance suite injects faults (feature `faults`).
loams-pg-control = { path = ".", features = ["faults"] }
proptest.workspace = true
# The upcall tests' HTTP client.
reqwest.workspace = true
tempfile.workspace = true
# role_secret_never_logged captures every log line.
tracing-subscriber.workspace = true

[[test]]
name = "store_tikv"
required-features = ["tikv"]

[[test]]
name = "service_tikv"
required-features = ["tikv"]

[[test]]
name = "reconcile_tikv"
required-features = ["tikv"]

[[test]]
name = "secrets_kube"
required-features = ["kubernetes"]

[lints]
workspace = true

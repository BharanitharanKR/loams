// Loams Git's derived data (design §36 §19.5.1, D830; plan GT1 Task 19):
// immutable objects under `derived/`, keyed by the object id they describe.
// Crate-local and pinned by the golden files in crates/loams-git/tests/golden/.

syntax = "proto3";
package loams.git.v1;

// A tree's entries with their sizes, as `git ls-tree -l` lists them.
message TreeAux {
  bytes tree = 1;                       // the tree's object id
  repeated TreeAuxEntry entries = 2;    // in the tree's order
}

message TreeAuxEntry {
  bytes name = 1;
  uint32 mode = 2;                      // git's mode bits (0o100644, 0o40000, ...)
  bytes oid = 3;
  optional uint64 size = 4;             // blobs and symlinks; unset for trees and submodules
}

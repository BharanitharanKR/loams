[package]
name = "loams-git"
description = "Loams Git's portable core (design §36, §19): identifiers, paths, limits, the bucket WAL formats, the blob store, the WAL, the repository state machine, the pack-cache and range-read object databases, the bucket ref log, checkpoints, forks, segment GC and the workspace store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
# Segment and checkpoint trailers (§36 §4.3).
crc32c.workspace = true
futures.workspace = true
# The gitoxide 0.88 train, pinned exactly in the workspace (plan GT1 R0.8).
gix-hash.workspace = true
# Object parsing and pack reading for the pack-cache object database (Task 9).
gix-object.workspace = true
gix-pack.workspace = true
gix-zlib.workspace = true
# The commit-graph reader (Task 20).
gix-commitgraph.workspace = true
# Blame over the stored history (Task 21).
gix-attributes.workspace = true
gix-blame.workspace = true
gix-diff.workspace = true
gix-error.workspace = true
gix-filter.workspace = true
gix-worktree.workspace = true
# Grep over a tree's blobs (Task 21).
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
gix-validate.workspace = true
# The protobuf format only: `record` would pull in loams-log (R0.4, T0-7).
loams-cloudevents = { path = "../loams-cloudevents", version = "0.1.1", default-features = false, features = ["protobuf"] }
# The H1 range cache that `RangeOdb`'s reads go through (Task 17, T0-15).
loams-cache.workspace = true
loams-common.workspace = true
# Spill files for large blob uploads (§36 §5.3, §17).
loams-fs.workspace = true
loams-store.workspace = true
# Commit-graph layers are mapped anonymously for `gix-commitgraph` (Task 20).
memmap2.workspace = true
# The body of a commit forwarded to the sequencer's owner (Ruling 27).
postcard.workspace = true
# The loams.git.v1 on-disk messages (R0.5).
prost.workspace = true
# Retry jitter.
rand.workspace = true
# The `head` hint is a small JSON object (§36 §4.1).
serde.workspace = true
serde_json.workspace = true
# `derived_blame` names hash the path.
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
# Generated ids (`r`, `w`, `m`, `s` + a lowercase ULID).
ulid.workspace = true

[build-dependencies]
prost-build.workspace = true

[dev-dependencies]
# The linearizability checker (plan GT1 Task 10).
loams-meta-conformance.workspace = true
# `FaultyStore` wraps an `ObjectStore`.
object_store.workspace = true
proptest.workspace = true
tempfile.workspace = true
# `test-util`: paused time for the fault proptests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package]
name = "loams-agentd-link"
description = "Loams integration for the desktop fork: Connect-RPC client for a local loams server (with a mock mode), Authentik OIDC sign-in, and the Loams Bot A2A client and ACP shim. No GPUI dependency, so it builds and tests fast."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
loams-agentd-proto.workspace = true
# Generated by buf (buf.gen.yaml); the connect tree needs the `client` feature,
# the in-process mock needs `server`.
buffa = { workspace = true, features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = { workspace = true, features = ["client", "server"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
futures.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
url = { workspace = true, features = ["serde"] }
http.workspace = true
sha2 = "0.10"
# The fork is on base64 0.22; the workspace key is 0.23.
base64 = "0.22"
getrandom = "0.3"
webbrowser = "1"
keyring = "4.2"
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "loams-agentd-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
tokio.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
# The doc_surgery example.
loams-agentd-doc.workspace = true
loro.workspace = true
serde_json.workspace = true
chrono.workspace = true
tempfile.workspace = true

# The workspace policy, except `unsafe_code` is `deny` rather than `forbid`: this crate
# has audited FFI and process sites, each under `#[allow(unsafe_code)]` with a SAFETY
# comment (plan DD1 ruling T1-13). Cargo cannot combine `workspace = true` with an
# override, so the rest of `[workspace.lints]` is repeated here; keep them in step.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[package]
name = "loams-agentd-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
loams-agentd-proto.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["serde"] }
sha2 = "0.10"
libc.workspace = true
chrono.workspace = true
bytes.workspace = true
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
# 0.24 as in the fork; loams-web-bridge is on 0.30 (not a workspace key).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

# The workspace policy, except `unsafe_code` is `deny` rather than `forbid`: this crate
# has audited FFI and process sites, each under `#[allow(unsafe_code)]` with a SAFETY
# comment (plan DD1 ruling T1-13). Cargo cannot combine `workspace = true` with an
# override, so the rest of `[workspace.lints]` is repeated here; keep them in step.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

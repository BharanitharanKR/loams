[package]
name = "loams-wal-decoder"
description = "loams-wal with the in-process interpreted sender: the Neon fork's wal_decoder behind loams-safekeeper's WalInterpreter (PG2 Task 31, Q112)."
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["The Loams Authors"]
publish = false

# A workspace of its own (PG2 ruling R31.3, owner ruling 2026-10-08): the
# fork's crates bring Neon's dependency tree and git sources, which stay out
# of the main workspace's Cargo.lock and licence check. The main workspace
# lists this directory in `exclude`.
#
# Building needs POSTGRES_INSTALL_DIR with v14..v17/include/postgresql/server
# (scripts/pg2/pg-headers.sh, from the pinned `neon` image).
[workspace]
members = ["."]

[lib]
path = "src/lib.rs"

# Not `loams-wal`: where both workspaces share one target dir (a configured
# target-dir, as on the build machine), a binary of the same name would
# overwrite the main workspace's loams-wal. scripts/loams-pg-bench/run.sh
# runs this one (LOAMS_WAL, else this workspace's target dir).
[[bin]]
name = "loams-wal-interpreted"
path = "src/bin/loams-wal-interpreted.rs"

[features]
# loams-wal's stores, passed through to loams-safekeeper.
tikv = ["loams-safekeeper/tikv"]
nvme = ["loams-safekeeper/nvme"]
compio = ["loams-safekeeper/compio"]

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.92"
bytes = "=1.12.1"
loams-safekeeper = { path = "../loams-safekeeper", features = ["server"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
# The fork: the Task 0 commit (fa504217) plus Loams' commits on the branch
# loams/decoder-trim-3 (tag loams-decoder-trim-3) that let wal_decoder's
# consumers leave out the storage clients and pprof (PG2 ruling R31.12), the
# tarball helpers, and utils' auth and connection string, pageserver_api's
# OpenTelemetry conversions and pq_proto's postgres-protocol. That keeps
# jsonwebtoken, opentelemetry_sdk and Neon's rust-postgres fork out of this
# graph (their security advisories). pageserver_api and utils without their
# default features.
pageserver_api = { git = "https://github.com/ostrium-labs/loams-postgres", rev = "0bc9b0c5f70f7d94093fd1bd8ff647dfa8756815", default-features = false }
postgres_ffi = { git = "https://github.com/ostrium-labs/loams-postgres", rev = "0bc9b0c5f70f7d94093fd1bd8ff647dfa8756815" }
utils = { git = "https://github.com/ostrium-labs/loams-postgres", rev = "0bc9b0c5f70f7d94093fd1bd8ff647dfa8756815", default-features = false, features = ["rename_noreplace"] }
wal_decoder = { git = "https://github.com/ostrium-labs/loams-postgres", rev = "0bc9b0c5f70f7d94093fd1bd8ff647dfa8756815" }

[dev-dependencies]
serde_json = "=1.0.151"
sha2 = "=0.10.8"
# The fork's zstd (see Cargo.lock), for the compressed WAL fixture.
zstd = "=0.13.0"

# Neon's `workspace_hack` (cargo-hakari) unifies features across Neon's whole
# workspace; an empty stand-in keeps that tree out of this build.
[patch."https://github.com/ostrium-labs/loams-postgres"]
workspace_hack = { path = "workspace-hack-stub" }

# Neon's rust-postgres fork is no longer in this graph (loams-decoder-trim-3):
# if a fork crate brings tokio-postgres or postgres-protocol back, redirect
# them to ostrium-labs/rust-postgres here, pinned by rev, and allow that
# source in deny.toml.

[package]
name = "loams-proto"
description = "The public loams.*.v1 protos of the unified Connect API (design §44 §7-§8): buffa messages, connect-rust service traits and, with the `client` feature, clients, generated at build time; plus the descriptor set gRPC reflection answers from."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/ostrium-labs/loams"
homepage = "https://loams.dev"
keywords = ["loams", "protobuf", "connect", "grpc"]
categories = ["api-bindings"]
# Published: the Rust SDK (`sdks/rust`, crate `loams` on crates.io) depends on it,
# so it ships with the SDKs (.github/workflows/sdk-release.yml). The protos ship
# inside the crate: `proto/` here is a symlink to the workspace's `proto/`, which
# `cargo package` resolves into real files, and build.rs reads it. Building the
# crate needs `protoc` on PATH, as it always has.

[features]
# The generated service clients (connect-rust's client transport), for the
# Rust SDK and for tests that call the server in-process. Off by default, so
# the server does not pull the client stack in.
client = ["connectrpc/client"]

[dependencies]
buffa.workspace = true
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc.workspace = true
# The generated JSON mapping derives serde (connectrpc's default json
# feature).
serde.workspace = true

[dev-dependencies]
# tests/postgres.rs walks FILE_DESCRIPTOR_SET (as loams-graph's tests do).
prost.workspace = true
prost-types.workspace = true

[build-dependencies]
connectrpc-build.workspace = true

[lints]
workspace = true
[package]
name = "loams-console-mock"
description = "The console API mock's contract and seed data (api/console/openapi.json), shared with loams-apps-mock, which serves it over REST on the same listener as the app protos (design §19 P10)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
# `httpmock` is only for [`register`], which this crate's contract tests use to
# check the routes; the routes themselves are served over axum by
# `loams-apps-mock` on one listener. The standalone binary that used it is
# gone.
httpmock.workspace = true
humantime.workspace = true
serde_json.workspace = true

[dev-dependencies]
reqwest.workspace = true
tokio.workspace = true

[lints]
workspace = true

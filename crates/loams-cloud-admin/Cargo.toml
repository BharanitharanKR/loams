[package]
name = "loams-cloud-admin"
description = "loams cloud admin: the Loams Cloud try-out's admin client (design 78 §25.8, plan LC1 LC2a Tasks 4 and 5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
base64.workspace = true
clap = { workspace = true, features = ["env"] }
keyring.workspace = true
# `rustls-no-provider`: TLS with the ring provider, installed by `run`, as the loams binary does.
reqwest = { workspace = true, features = ["rustls-no-provider", "form", "query"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
ulid.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[lints]
workspace = true

[package]
name = "loams-live-proto"
description = "The loams.live.v1 protos of Loams Live: buffa messages and the connect-rust LiveService trait and client, generated at build time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/ostrium-labs/loams"
homepage = "https://loams.dev"
keywords = ["loams", "protobuf", "connect", "grpc"]
categories = ["api-bindings"]
# Published: the Rust SDK (`sdks/rust`, crate `loams` on crates.io) depends on it,
# so it ships with the SDKs (.github/workflows/sdk-release.yml). The protos ship
# inside the crate: `proto/` here is a symlink to the workspace's `proto/`, which
# `cargo package` resolves into real files, and build.rs reads it. Building the
# crate needs `protoc` on PATH, as it always has.

[features]
# The generated `LiveServiceClient` (connect-rust's client transport). Off by
# default, so a server build does not pull in the client stack; Task 12's
# tests enable it.
client = ["connectrpc/client"]

[dependencies]
buffa.workspace = true
connectrpc.workspace = true
# The generated JSON mapping derives serde (connectrpc's default json feature).
serde.workspace = true

[build-dependencies]
connectrpc-build.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

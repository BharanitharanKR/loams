[package]
name = "loams-cloudevents"
description = "CloudEvents 1.0 for Loams streams: the JSON and HTTP binary formats, validation, and the record layout of the Kafka binding (design §02 §7.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["record"]
# The record layout of the Kafka binding (`record`), which needs `loams-log`.
record = ["dep:loams-log"]
# The protobuf format (`protobuf`), generated with prost from the vendored
# `io.cloudevents.v1` schema; needs a system `protoc`.
protobuf = ["dep:prost", "dep:prost-types", "dep:prost-build"]

[dependencies]
base64.workspace = true
bytes.workspace = true
http.workspace = true
loams-log = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
time.workspace = true

[build-dependencies]
prost-build = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package]
name = "loams-pgdog-sync"
description = "pgdog-config-sync: the sidecar beside each PgDog replica that takes pg-control's rendered config over mTLS and writes it atomically where PgDog reads it (design §46 §8.2; PG2 Task 21)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
bytes.workspace = true
clap.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile.workspace = true

[lints]
workspace = true

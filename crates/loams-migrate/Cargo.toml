[package]
name = "loams-migrate"
description = "Loams upgrades, server side: the format registry, the stack record, the migration ledger and runner, snapshots and restores (design §54, UP1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
crc32c.workspace = true
# The crash matrix's failpoints (`failpoints` feature only).
fail = { workspace = true, optional = true }
loams-common.workspace = true
# Live's store, for `LiveCx` (embedded or TiKV, as `loams` builds it).
loams-kv.workspace = true
loams-store.workspace = true
postcard.workspace = true
# preview.2's Durable and House SQLite files (read-only; the same
# libsqlite3-sys as sqlx).
rusqlite = { workspace = true, features = ["backup"] }
# `HouseCx::swap_dir`: renameat2(RENAME_EXCHANGE).
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
ulid.workspace = true

[dev-dependencies]
loams-meta.workspace = true
# The preview.2 TiKV dump test (`LOAMS_TEST_PD`).
loams-meta-tikv.workspace = true
loams-tikv.workspace = true
tempfile.workspace = true
tokio.workspace = true

[features]
# Named failpoints for the crash matrix (`tests/runner_failpoints.rs`).
failpoints = ["fail/failpoints"]

[[test]]
name = "runner_failpoints"
required-features = ["failpoints"]

[lints]
workspace = true

[package]
name = "loams-migrate"
description = "Loams upgrades, server side: the format registry, the stack record, the migration ledger and runner, snapshots and restores (design §54, UP1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
# The crash matrix's failpoints (`failpoints` feature only).
fail = { workspace = true, optional = true }
loams-common.workspace = true
postcard.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
loams-meta.workspace = true
loams-store.workspace = true
tempfile.workspace = true
tokio.workspace = true

[features]
# Named failpoints for the crash matrix (`tests/runner_failpoints.rs`).
failpoints = ["fail/failpoints"]

[[test]]
name = "runner_failpoints"
required-features = ["failpoints"]

[lints]
workspace = true

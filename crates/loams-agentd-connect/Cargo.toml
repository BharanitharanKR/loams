[package]
name = "loams-agentd-connect"
description = "loams-agentd's Connect surface for Loams Studio (loams.agentd.v1): a loopback Connect listener beside the ndjson wire, whose handlers map each proto message to the ndjson method's own types and call the same engine dispatch (design §53 §6.1–§6.2, plan SD1 Task 5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
loams-agentd-proto.workspace = true
loams-agentd-rpc.workspace = true
# The generated messages and services (build.rs), as loams-agentd-link and
# loams-apps-mock use them. `axum`: the listener is an axum app, so the
# token, Host and Origin checks run as a layer in front of every handler.
buffa.workspace = true
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = { workspace = true, features = ["axum", "server"] }
axum.workspace = true
chrono.workspace = true
futures.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# The remote listener (SD1 Task 7): TLS on rustls with ring, as loams-sqlgate
# serves it; HTTP/1.1 and HTTP/2 through hyper-util, as connectrpc's own
# server does; OIDC access tokens through jsonwebtoken 10.4.0 (T0-6), with the
# issuer's JWKS fetched by reqwest 0.12 (rustls on ring), as the other agentd
# crates fetch. All are already in the lock.
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
jsonwebtoken.workspace = true
jwks-http = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
thiserror.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
url.workspace = true
# Previews through the remote listener (SD1 Task 26): an HTTP/1 client to the
# daemon's loopback preview proxy, with upgrades for a dev server's HMR
# WebSocket, and ring's CSPRNG for preview tickets. All are already in the lock.
hyper = { version = "1", features = ["client", "http1"] }
ring.workspace = true
# The fuzz invariants (`fuzz`, SD1 Task 30): a recording fake engine behind
# the real router, called as a tower service. Both are already in the lock.
async-trait.workspace = true
tower.workspace = true

[build-dependencies]
connectrpc-build.workspace = true

[dev-dependencies]
# Reads the descriptor set in the descriptor tests.
buffa-descriptor = { version = "0.9.2", features = ["reflect"] }
# The in-process engine for the loopback tests, and the Connect clients.
loams-agentd-sessions.workspace = true
# The parity suite waits for a chat's queued commands to resolve.
loams-agentd-doc.workspace = true
connectrpc = { workspace = true, features = ["axum", "server", "client"] }
reqwest = { workspace = true, features = ["stream"] }
tempfile.workspace = true
# The remote listener's tests: a self-signed certificate (rcgen, as
# loams-sqlgate's tests make one) and a stand-in OIDC issuer that signs
# Ed25519 tokens (ring, as crates/loams/tests/auth.rs does).
base64.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring.workspace = true

[lints]
workspace = true

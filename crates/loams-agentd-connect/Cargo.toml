[package]
name = "loams-agentd-connect"
description = "loams-agentd's Connect surface for Loams Studio (loams.agentd.v1): a loopback Connect listener beside the ndjson wire, whose handlers map each proto message to the ndjson method's own types and call the same engine dispatch (design §53 §6.1–§6.2, plan SD1 Task 5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
loams-agentd-proto.workspace = true
loams-agentd-rpc.workspace = true
# The generated messages and services (build.rs), as loams-agentd-link and
# loams-apps-mock use them. `axum`: the listener is an axum app, so the
# token, Host and Origin checks run as a layer in front of every handler.
buffa.workspace = true
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = { workspace = true, features = ["axum", "server"] }
axum.workspace = true
chrono.workspace = true
futures.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[build-dependencies]
connectrpc-build.workspace = true

[dev-dependencies]
# Reads the descriptor set in the descriptor tests.
buffa-descriptor = { version = "0.9.2", features = ["reflect"] }
# The in-process engine for the loopback tests, and the Connect clients.
loams-agentd-sessions.workspace = true
connectrpc = { workspace = true, features = ["axum", "server", "client"] }
reqwest = { workspace = true, features = ["stream"] }
tempfile.workspace = true

[lints]
workspace = true

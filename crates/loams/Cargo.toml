[package]
name = "loams"
description = "The Loams server: the native HTTP API, the Qdrant and Elasticsearch gateways and the dev, standalone and cluster commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Not on crates.io yet. The optional loams-tikv, loams-durable and
# loams-meta-tikv dependencies are part of the published manifest, and all
# three are `publish = false` (the first two on git dependencies that no
# registry can resolve), so crates.io would ship a crate nobody can build.
# Publishing the binary is D294's install, as `cargo install loams-server` (D1106); it waits on the
# release pipeline's Task 9 and this flag comes off in the PR that does it.
# See docs/release/publishing.md.
publish = false

[[bin]]
name = "loams"
path = "src/main.rs"

[dependencies]
# Engine authentication (preview, API2 Task 6): API keys hashed with argon2id
# (0.6.0, as loams-sqlgate), compared in constant time (subtle 2.6, as
# loams-sqlgate) by their SHA-256 once verified, and OIDC JWTs (jsonwebtoken,
# the workspace pin). getrandom 0.3 generates the keys. All already in the
# lockfile.
argon2 = "0.6.0"
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
buffa.workspace = true
bytes.workspace = true
clap.workspace = true
# The Connect router mounts into this server's axum app (design §44 §4).
connectrpc = { workspace = true, features = ["axum", "server"] }
# `grpc.health.v1` and `grpc.reflection.v1` on the main port (design §44 §4,
# API1 Task 1).
connectrpc-health.workspace = true
connectrpc-reflection.workspace = true
datafusion = { workspace = true, optional = true }
datafusion-postgres = { workspace = true, optional = true }
# `WatchAuditEvents` streams (API2 Task 7), and the optional engines below.
futures.workspace = true
getrandom = "0.3"
fail = { workspace = true, optional = true }
http.workspace = true
jsonwebtoken.workspace = true
# The `loams.house.v1` proxy's streamed request body (HS1 Task 7).
http-body.workspace = true
loams-cache.workspace = true
# `protobuf`: `loams.stream.v1`'s ProduceCloudEvents decodes a protobuf CloudEventBatch (SDKP P0c).
loams-cloudevents = { workspace = true, features = ["protobuf"] }
loams-collection.workspace = true
loams-common.workspace = true
# The embedded Resonate server (D1), with the durable feature only.
loams-durable = { workspace = true, optional = true }
# Loams Graph (feature `graph`, GR1 Task 5).
loams-graph = { workspace = true, optional = true }
loams-es = { workspace = true, optional = true }
# Loams Git's portable core (feature `git`, GT1 Task 12, design §36).
loams-git = { workspace = true, optional = true }
# Loams Git's token file (`--git-tokens`, GT1 Task 16): TOML with SHA-256 hashes.
toml = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
loams-hnsw.workspace = true
loams-hot.workspace = true
loams-link.workspace = true
# The Loams Live sync service (R1 Task 12).
loams-live = { workspace = true, optional = true }
# Loams Live's function runtime: `loams live-worker`, the isolated worker
# process (LV1 plan Task 5).
loams-live-js = { workspace = true, optional = true }
# `loams.live.v1`, for the `LiveService` stub that answers
# `feature_not_in_variant` while the live engine is out of the build variant
# (design §44 §4). R1's crate owns those protos; `loams-proto` does not
# generate them a second time.
loams-live-proto.workspace = true
# `loams migrate run --live-store`: Live's store for Live migrations (UP1 Task 7).
loams-kv.workspace = true
loams-log.workspace = true
loams-meta.workspace = true
loams-meta-tikv = { workspace = true, optional = true }
# The startup gate, `loams migrate` and the ledger (design §54, UP1).
loams-migrate.workspace = true
# `loams upgrade` (UP1 Task 12): the client that upgrades a compose stack;
# it links no storage crate.
loams-upgrade.workspace = true
# Loams Postgres's control plane: the `loams pg-control` role (feature
# `postgres`, PG2 Task 9, design §46 §6.1), and the Neon clients it is
# configured with. Never in the default build (`pg_control.rs`'s
# `default_features_exclude_postgres`).
loams-pg-control = { path = "../loams-pg-control", optional = true }
loams-postgres = { workspace = true, optional = true }
# The public `loams.*.v1` packages the main port serves and reflects on
# (design §44 §7–§8, API1 Task 1).
loams-proto.workspace = true
opensrv-mysql = { workspace = true, optional = true }
loams-qdrant = { workspace = true, optional = true }
loams-query.workspace = true
loams-store.workspace = true
loams-sqlgate = { path = "../loams-sqlgate", optional = true }
loams-stream-grpc = { workspace = true, optional = true }
loams-tikv = { workspace = true, optional = true }
loams-worker.workspace = true
# `rustls-no-provider`: the House link's TLS (HS1 Task 20) with the ring
# provider this crate builds its own client configuration with.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
sync_wrapper.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
# TLS on the main port (LV1 plan Task 18).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The auth layer wraps the Qdrant gRPC and Flight SQL routes (tonic's axum
# routes); already a dependency of loams-query and loams-qdrant.
tonic.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
url.workspace = true

[features]
default = ["es", "flight", "hnsw", "live", "qdrant"]
# Serve the Elasticsearch REST API (plan M1.5; `--es-listen`).
es = ["dep:loams-es"]
# The TiKV metastore (R1 plan Task 6; `--meta tikv://…` on `dev` and
# `standalone`), with the cluster MVCC GC loop it runs. Off by default (owner
# ruling T7-3): it pulls in the git-pinned tikv-client (row R4), which the
# default build must not. CI's TiKV jobs build with `--features tikv`.
tikv = ["dep:loams-meta-tikv", "dep:loams-tikv", "loams-pg-control?/tikv"]
# Loams Live (R1 plan Task 12): the `loams.live.v1` sync API on its own
# loopback listener (`--live-*` on `dev` and `standalone`), on the embedded
# store under `<data_dir>/live/`. In the default set, with no tikv-client
# (LV1 plan Task 23, design §45 §8; reverses owner ruling T8-2 for the
# embedded part). The embedded store is always built into loams-kv.
live = ["dep:loams-live", "dep:loams-live-js"]
# Live on TiKV too: `--live-store tikv://<pd>[,<pd>]/<keyspace>` (and the
# deprecated `--live-pd`/`--live-keyspace`), with its cluster GC loop.
live-tikv = ["live", "tikv", "loams-live/tikv"]
# Loams Postgres's control plane (PG2 Task 9, design §46 §6.1): the
# `loams pg-control` role, serving `loams.postgres.v1` and the upcalls Neon's
# components call. Off by default: the default build links none of it. With
# `tikv` too, `--store tikv` keeps its records on TiKV.
postgres = ["dep:loams-pg-control", "dep:loams-postgres"]
# `--runtime kubernetes`: role secrets and the signing key as Kubernetes
# Secrets (the kube client).
postgres-kubernetes = ["postgres", "loams-pg-control/kubernetes"]
# Serve Arrow Flight SQL (Task 12; `--flight-sql-listen`).
flight = []
# Serve the Qdrant REST and gRPC APIs (plan M1.4; `--qdrant-listen`).
qdrant = ["dep:loams-qdrant"]
# The qdrant-edge HNSW engine for hot artifacts (M1.3); without it the hot
# tier builds only when `ServerConfig.hnsw_engine` is set.
hnsw = ["loams-hot/hnsw"]
# Durable execution (D1, design §21): the embedded Resonate server on SQLite,
# on 127.0.0.1:8001 (--durable-*). Opt-in (owner ruling O1): toggling it
# rebuilds about 480 crates. Release builds, CI's durable jobs and the Loams
# cloud build turn it on; without it, a --durable-* flag only logs.
durable = ["dep:loams-durable"]
# The TiDB durable store through Resonate's MySQL plugin (D1 Task 4).
durable-mysql = ["durable", "loams-durable/mysql"]
# The native TiKV durable store (`--durable-store tikv://…`).
durable-tikv = ["durable", "loams-durable/tikv"]
# The MySQL wire listener over collections (`--mysql-listen`).
mysql-wire = ["dep:opensrv-mysql", "dep:datafusion"]
# The PostgreSQL wire listener over collections (`--pg-listen`).
pgwire = ["dep:datafusion-postgres", "dep:datafusion"]
# The native stream gRPC endpoint used by Dapr protocol adapters.
stream-grpc = ["dep:loams-stream-grpc"]
# Loams Graph (GR1 Task 5, design §48, D741): `loams.graph.v1` on the main port, Grafeo
# embedded. Off by default: without it `loams` links no Grafeo crate (CI checks
# `cargo tree -p loams -e normal | grep -c grafeo` = 0) and the graph RPCs answer
# `feature_not_in_variant`.
graph = ["dep:loams-graph"]
# Loams Git (GT1 Task 12, design §36, §19): `loams.repos.v1` on the main port
# (`RepoService` from GT1 Task 13), the repository sequencers and, from later
# GT1 tasks, Smart HTTP and the git worker tasks. Off by default: without it
# `loams` links no `loams-git` or gitoxide crate (`tests/git/main.rs`'s
# `default_features_exclude_git`) and every `loams.repos.v1` RPC answers
# `feature_not_in_variant`.
git = ["dep:loams-git", "dep:toml", "dep:hex"]
# The sccache build cache (GT1 Tasks 68–71, design §36 §8). Reserved by GT1
# Task 12: its crate, `loams-buildcache`, does not exist yet.
buildcache = []
# The crates.io mirror (GT1 Tasks 72–73, design §36 §9). Reserved by GT1 Task
# 12: its crate, `loams-registry`, does not exist yet.
registry = []
# The Loams SQL gate (`--sqlgate-listen`; plan SQ1 Task 4).
sqldb = ["dep:loams-sqlgate"]
# Builds the multi-process cluster tests (`tests/cluster.rs`, M1.3 Task 11;
# E43); CI runs them in their own job.
cluster-tests = []
# Named failpoints for the crash gate (M0.4 Task 5): with it, the binary
# reads LOAMS_FAILPOINTS and LOAMS_FAILPOINT_HIT. Off by default, so release
# builds contain no failpoints.
failpoints = [
    "dep:fail",
    "fail/failpoints",
    "loams-collection/failpoints",
    "loams-hot/failpoints",
    "loams-link/failpoints",
    "loams-log/failpoints",
    "loams-meta/failpoints",
]

[dev-dependencies]
arrow-array.workspace = true
arrow-flight.workspace = true
# `connect_sql.rs` decodes `QueryArrow`'s IPC stream (API2 Task 1).
arrow-ipc.workspace = true
arrow-schema.workspace = true
futures.workspace = true
# `connect_admin.rs`'s `mock_and_server_answer_alike` runs the console mock
# beside the server (API2 Task 7).
loams-apps-mock = { path = "../loams-apps-mock" }
object_store.workspace = true
# The reference evaluator of the ES DSL tests (plan M1.5 Task 7).
loams-es = { workspace = true, features = ["test-util"] }
# The reference evaluator of the Qdrant filter tests (plan M1.4 Task 4).
loams-qdrant = { workspace = true, features = ["test-util"] }
proptest.workspace = true
# Ed25519 keys that sign the auth tests' OIDC tokens.
ring.workspace = true
prost.workspace = true
prost-types.workspace = true
# HTTP/2 with prior knowledge, so `connect_api.rs` can put a gRPC frame on the
# main port the way `grpcurl` does (h2c, not TLS ALPN).
# `stream`: `connect_api.rs` sends a request body chunk by chunk through the
# House proxy (HS1 Task 7).
reqwest = { workspace = true, features = ["http2", "stream"] }
tempfile.workspace = true
time.workspace = true
# The stand-in House front's streamed answer in `connect_api.rs` (HS1 Task 7).
tokio-stream.workspace = true
# `connect_api.rs`'s stand-in House front over TLS (HS1 Task 20), and the
# main port's TLS tests (LV1 plan Task 18).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
# The client of the PostgreSQL wire listener's tests (`pg::tests`).
tokio-postgres = "0.7"
# The client of the MySQL wire listener's tests (`mysql_wire::tests`).
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
tonic = { workspace = true, features = ["gzip"] }

[lints]
workspace = true

[package]
name = "loams-llm"
description = "Model providers for Loams Memory and the desktop daemon: chat with structured output, embeddings and reranking over OpenAI-compatible HTTP (incl. Ollama) and Anthropic Messages, deterministic fakes, token budgets and local-only mode (design §52 §10, MM1 Task 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
jsonschema.workspace = true
rand.workspace = true
# Raw HTTP, no vendor SDK (§50 §10.2). `rustls-no-provider` with ring, as
# `loams` builds its clients: the process provider is ring when none is set,
# so linking this crate into `loams` never adds a second rustls provider.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url = { workspace = true, features = ["serde"] }
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

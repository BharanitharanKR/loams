# The mock server: Go messages and connect-go handlers, written to mock/gen
# and committed (docs/protos.md). Run scripts/generate.sh.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ostrium-labs/loams-mobile/mock/gen
inputs:
  - directory: proto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: mock/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.21.0
    out: mock/gen
    opt: paths=source_relative
clean: true

# XcodeGen spec (https://github.com/yonaskolb/XcodeGen): `xcodegen generate` in ios/ writes
# Loams.xcodeproj, which is not committed. Keeps the project text-reviewable.
name: Loams
options:
  bundleIdPrefix: dev.loams
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # TODO(AP3 Task 0): Swift 6 mode for the app; LoamsCore already builds in Swift 6.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # TODO(Q420): the team id, provisioning and distribution signing come with the Apple
    # Developer Program membership. CI builds unsigned for the simulator.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  LoamsCore:
    path: Packages/LoamsCore
  LoamsProto:
    path: Packages/LoamsProto
  LoamsData:
    path: Packages/LoamsData
  # The app uses Connect and SwiftProtobuf types directly, so it links their products itself.
  connect-swift:
    url: https://github.com/connectrpc/connect-swift.git
    exactVersion: 1.2.3
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf.git
    minorVersion: 1.38.1
targets:
  Loams:
    type: application
    platform: iOS
    sources: [Loams]
    dependencies:
      - package: LoamsCore
      - package: LoamsProto
      - package: LoamsData
      - package: connect-swift
        product: Connect
      - package: swift-protobuf
        product: SwiftProtobuf
      - target: LoamsNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.loams.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Loams
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing code your Loams console shows.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID signs your approval decisions with this phone's key.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: Loams/Loams.entitlements
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # ATS stays on; Debug alone allows local networking for the mock (AP3 constraints).
        Debug:
          INFOPLIST_FILE: Loams/Debug-Info.plist
  LoamsNotificationService:
    type: app-extension
    platform: iOS
    sources: [LoamsNotificationService]
    dependencies:
      - package: LoamsCore
      - package: LoamsData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.loams.app.notification-service
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: LoamsNotificationService/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Loams Notifications
        CODE_SIGN_ENTITLEMENTS: LoamsNotificationService/LoamsNotificationService.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  LoamsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LoamsTests]
    dependencies:
      - target: Loams
      - package: LoamsCore
      - package: LoamsProto
      - package: LoamsData
      - package: swift-protobuf
        product: SwiftProtobuf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.loams.app.tests
schemes:
  Loams:
    build:
      targets:
        Loams: all
    test:
      targets:
        - LoamsTests

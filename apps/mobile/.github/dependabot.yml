# Weekly, grouped dependency bumps: one small PR per ecosystem.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /mock
    schedule:
      interval: weekly
    groups:
      mock:
        patterns: ["*"]
  - package-ecosystem: swift
    directories:
      - /ios/Packages/LoamsCore
      - /ios/Packages/LoamsProto
      - /ios/Packages/LoamsData
    schedule:
      interval: weekly
    groups:
      ios:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

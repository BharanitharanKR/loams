[workspace]
resolver = "3"
# bench/git-wal: the bucket WAL benchmark (GT1 Task 11).
members = ["crates/*", "bench/git-wal"]
# loams-wal-decoder is a workspace of its own: it links the Neon fork's
# crates, whose dependency tree stays out of this lockfile and licence check
# (PG2 ruling R31.3, owner ruling 2026-10-08).
exclude = ["crates/loams-wal-decoder"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["The Loams Authors"]

[workspace.dependencies]
# pg-control's single-node secret file (PG2 Task 6): x25519 recipients only.
# 0.11.5 (2026-07-14), not 0.12: 0.12 adds the post-quantum hpke, ml-kem and
# p256 trees, which the file store does not use.
age = "=0.11.5"
anyhow = "1"
arrow = "58.4"
arrow-array = "58.4"
arrow-flight = { version = "58.4", features = ["flight-sql-experimental"] }
arrow-schema = "58.4"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bitpacking = "0.9.3"
buffa = "0.9.2"
bytes = "1"
bytesize = "2.4"
clap = { version = "4", features = ["derive"] }
# The Loams Live sync API (R1 plan Task 7, row R12). Crates add `axum` (the
# server, Task 12); loams-live-proto's `client` feature adds `client`.
connectrpc = "0.9.1"
connectrpc-build = "0.9"
# `grpc.health.v1` and `grpc.reflection.v1` on the main port (design §44 §4,
# API1 Task 1). Both default their `client` transport off: the server does not
# need it.
connectrpc-health = { version = "0.9.0", default-features = false }
connectrpc-reflection = { version = "0.9.0", default-features = false }
# CRC-16 of Loams Live document ids (R1 plan Task 8).
# The Arm A WAL data path (§28 §7.2, D263): thread-per-core, io_uring.
compio = { version = "0.19.2", default-features = false, features = ["runtime", "io-uring", "polling", "net", "fs", "io", "time"] }
crc = "3"
crc32c = "0.6"
# Crockford base32 of Loams Live document ids (R1 plan Task 8).
data-encoding = "2"
# Lance's feature set (no parquet or compression): adding loams-query does
# not rebuild DataFusion for the workspace.
datafusion = { version = "54.1", default-features = false, features = [
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "nested_expressions",
    "regex_expressions",
    "sql",
    "string_expressions",
    "unicode_expressions",
] }
# PostgreSQL wire access over collections (loams feature `pgwire`, PG1).
datafusion-postgres = "0.18"
fail = "0.5"
fnv = "1"
foyer = "0.22"
futures = "0.3"
# Loams Graph's embedded engine (design §48, D741, D759; GR1 Task 0 rulings
# R0.2 and R0.3): Grafeo 0.5.43, which every Task 0 probe ran against, built
# from Loams' fork https://github.com/ostrium-labs/grafeo (owner, 2026-10-12)
# and pinned by rev to its release tag v0.5.43-loams.1: upstream v0.5.43 plus
# the patch queue in the fork's PATCHES.md (LG-0001 commit listener, LG-0002
# timeout on parameterised statements, LG-0003 ORDER BY relationships, LG-0004
# DETACH DELETE, LG-0006 epoch continuity). The other two of the six crates,
# grafeo-core and grafeo-storage, come from the same rev through these. A new
# tag is a new rev here, all four lines at once. Apache-2.0, all six crates
# (connectors/licences.toml, root NOTICE). `default-features = false`: grafeo's default `embedded` set
# brings `ai` and `arrow-export`, i.e. arrow 60 beside the workspace's 58.
# The features are the narrowest set that keeps LPG, GQL, WAL, CDC, spill,
# algorithms, metrics and tracing (R0.2):
#   * `grafeo-file` gates `backup_full`/`backup_incremental` (Task 13);
#   * `parallel` (rayon) and `regex` (GQL `=~` with the full `regex` engine,
#     not `regex-lite`) are kept on purpose;
#   * no `mmap`: outside `compact-store`/`vector-index` it gates nothing.
# NEVER enable `jemalloc` or `mimalloc-allocator`: each installs a
# `#[global_allocator]` in grafeo's lib.rs and would replace the allocator of
# the whole `loams` binary (R0.2).
grafeo = { version = "=0.5.43", git = "https://github.com/ostrium-labs/grafeo", rev = "92bc59a28ed8b38dbb43659b4a90271770c58956", default-features = false, features = ["gql", "wal", "grafeo-file", "spill", "cdc", "algos", "metrics", "tracing", "parallel", "regex"] }
# Named directly for its `lpg` feature: grafeo's own `lpg` also turns on
# `cypher`, `gremlin` and `sql-pgq` (R0.2). Task 33's `graph-cypher` feature
# adds `cypher` here; it costs code size and no package.
grafeo-engine = { version = "=0.5.43", git = "https://github.com/ostrium-labs/grafeo", rev = "92bc59a28ed8b38dbb43659b4a90271770c58956", default-features = false, features = ["lpg"] }
# `PropertyKey` and the value types the facade does not re-export.
grafeo-common = { version = "=0.5.43", git = "https://github.com/ostrium-labs/grafeo", rev = "92bc59a28ed8b38dbb43659b4a90271770c58956", default-features = false }
# Named for the GQL AST's `SessionCommand`, which `translate_full` returns and
# statement classification matches on (GR1 Task 3, R0.10). Already in the tree
# under grafeo-engine with the features above; this adds none.
grafeo-adapters = { version = "=0.5.43", git = "https://github.com/ostrium-labs/grafeo", rev = "92bc59a28ed8b38dbb43659b4a90271770c58956", default-features = false }
# Leiden for Loams Graph's `leiden` (GR1 Task 22, R22.3): `network_partitions`, the MIT-licensed Rust
# core of Microsoft's graspologic-native, which GraphRAG's hierarchical Leiden runs. Not on crates.io,
# so pinned by the rev of tag `v1.3.1` (2026-06-14), with an `allow-git` entry in `deny.toml` and
# Microsoft's notice in `NOTICE`. `default-features = false` leaves out the optional petgraph/sprs.
network_partitions = { version = "=0.3.0", git = "https://github.com/microsoft/graspologic-native", rev = "773181488b4e5b81925e302b972b294fd51f61a4", default-features = false }
# `network_partitions` takes a `rand` 0.10 generator; Loams seeds its `SmallRng` (Xoshiro256++, as
# graspologic-native's Python binding does) so a seed gives graspologic's answer (GR1 Task 22).
# Already in `Cargo.lock` at 0.10.3; the workspace's own `rand` stays 0.9.
rand_010 = { package = "rand", version = "=0.10.3", default-features = false }
# Loams Git (GT1): the gitoxide 0.88 train of 2026-09-25, pinned exactly
# (R0.8, T0-21), SHA-1 only (Ruling 8). A move to 0.89 is its own PR after
# 2026-10-22. MIT OR Apache-2.0.
gix-hash = { version = "=0.27.0", default-features = false, features = ["sha1"] }
gix-validate = { version = "=0.12.0", default-features = false }
gix-object = { version = "=0.65.0", default-features = false, features = ["sha1"] }
gix-pack = { version = "=0.75.0", default-features = false, features = ["sha1"] }
gix-zlib = { version = "=0.2.0", default-features = false }
# The commit-graph reader of `derived/graph/` layers (GT1 Task 20).
gix-commitgraph = { version = "=0.40.0", default-features = false }
# Blame (GT1 Task 21): `gix-blame` and the blob diff it runs on, same train.
gix-blame = { version = "=0.18.0", default-features = false, features = ["sha1"] }
gix-diff = { version = "=0.68.0", default-features = false, features = ["blob"] }
gix-attributes = { version = "=0.36.0" }
gix-error = { version = "=0.4.0" }
gix-filter = { version = "=0.35.0", default-features = false }
gix-worktree = { version = "=0.57.0", default-features = false, features = ["attributes"] }
# Grep (GT1 Task 21): ripgrep's library crates. Unlicense OR MIT.
grep-matcher = "=0.1.9"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
hex = "0.4"
# Live pagination cursors are HMAC-SHA256 tagged with the app's key (LV1
# Task 4); 0.13 is the line on sha2 0.11's digest.
hmac = "0.13"
http = "1"
http-body = "1"
httpmock = { version = "0.8.3", default-features = false, features = ["remote"] }
humantime = "2"
indexmap = { version = "2", features = ["serde"] }
itertools = "0.15"
# Ed25519 JWTs for computes (PG2 Task 8: the spec upcall's per-compute token
# and pg-control's token for compute_ctl), the library compute_ctl verifies
# them with. 10.4.0 (2026-05-11): 10.3.0 and later check an exp or nbf claim of
# the wrong JSON type instead of skipping it (GHSA-h395-gr6q-cpjc). The
# aws-lc-rs backend, as Resonate's resonate-auth and rustls use; never also
# enable `rust_crypto` (with both, jsonwebtoken picks no provider and panics).
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["aws_lc_rs"] }
# The Kubernetes client (PG2 Task 6's KubeSecretStore first). Task 0 ruling 5
# asks for the newest release at least 14 days old, 4.2.0; it is held at
# 3.1.0 (2026-03-17, k8s-openapi 0.27.1 of 2026-03-05) because kube-client 4.x
# needs serde-saphyr 0.0.29, which caps smallvec below 1.16 and would
# downgrade it workspace-wide. 3.1.0 reads kubeconfig with serde_yaml, already
# in the lockfile. rustls with ring.
k8s-openapi = { version = "=0.27.1", features = ["latest"] }
kafka-protocol = { version = "0.18", default-features = false }
# The OS keyring (macOS Keychain, Windows Credential Manager, the Secret
# Service), as loams-agentd-link uses it.
keyring = "=4.2.0"
kube = { version = "=3.1.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
lance = { version = "=12.0.0", default-features = false }
lance-file = { version = "=12.0.0", default-features = false }
lance-index = { version = "=12.0.0", default-features = false }
lance-io = { version = "=12.0.0", default-features = false }
lance-linalg = { version = "=12.0.0", default-features = false }
lance-table = { version = "=12.0.0", default-features = false }
# The isolated worker's filesystem, network and signal sandbox (LV1 plan
# Task 5, design §45 §3.1): Linux only, best effort for the running kernel.
landlock = "0.4.7"
# Commit-graph layers are read from memory through an anonymous mapping
# (`gix-commitgraph` reads an `Mmap`; GT1 Task 20). Already linked by `gix-pack`.
memmap2 = "0.9.11"
moka = { version = "0.12", features = ["future"] }
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "fs"] }
once_cell = "1"
openraft = { version = "=0.10.0-alpha.34", default-features = false, features = ["serde", "tokio-rt"] }
# The MySQL wire listener over collections (loams feature `mysql-wire`).
# No `tls`: the listener is loopback-only, and that feature pulls rustls 0.22.
opensrv-mysql = { version = "0.7", default-features = false }
# Bulk import (D1 Task 8): Parquet over object_store, on the workspace's arrow 58.
parquet = { version = "58", default-features = false, features = ["arrow", "async", "object_store", "snap", "zstd", "lz4"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
qdrant-edge = "=0.8.0"
rand = "0.9"
rand_chacha = "0.9"
redb = "4"
# Loams Live's function runtime (LV1 plan Task 3, R1 row R13): the module
# loader (for "loams:server"), ArrayBuffer and property definitions. The
# runtime is driven synchronously on its own threads, so no `futures` or
# `macro` (LV1 row T3-1).
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader", "array-buffer", "properties"] }
# Held at 2.0.1 for rquickjs's loader (LV1 row T3-1): 2.0.2 was two days old
# when rquickjs was added (14-day rule). loams-live-js names it only to pin it;
# drop the pin after 2026-10-21.
relative-path = "=2.0.1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Resonate, embedded by loams-durable (D1, D140): the fork ostrium-labs/resonate,
# branch loam/0.10.1 = upstream 28dfd01 + PR 0c (#1164), the gcp-idtoken
# feature, PR 0a (#1162), PR 1 (#1163), the SDK's reqwest defaults as a
# feature and resonate-auth on jsonwebtoken 10.3 (31ffb201; 0001_initial.sql
# unchanged from e3606698). Pinned by rev only; a bump compares each
# 0001_initial.sql with the pinned one and says in its PR when existing
# durable stores must be dropped (D1 plan X11). Never add resonate-server-scylladb or the NATS packages
# (BUSL-1.1 lineage).
resonate-base = { git = "https://github.com/ostrium-labs/resonate", rev = "31ffb2011b324c187f1d324b83feec2e16787e74" }
resonate-server-blob = { git = "https://github.com/ostrium-labs/resonate", rev = "31ffb2011b324c187f1d324b83feec2e16787e74" }
resonate-core = { git = "https://github.com/ostrium-labs/resonate", rev = "31ffb2011b324c187f1d324b83feec2e16787e74" }
resonate-gateway-http = { git = "https://github.com/ostrium-labs/resonate", rev = "31ffb2011b324c187f1d324b83feec2e16787e74" }
resonate-plugin = { git = "https://github.com/ostrium-labs/resonate", rev = "31ffb2011b324c187f1d324b83feec2e16787e74" }
# The package is resonate-sdk (lib resonate_sdk); `resonate` in that repository
# is the server binary. Its reqwest defaults (TLS, charset, system proxy) are
# off: Loams talks to the server in process.
resonate-sdk = { git = "https://github.com/ostrium-labs/resonate", rev = "31ffb2011b324c187f1d324b83feec2e16787e74", default-features = false }
resonate-server-mysql = { git = "https://github.com/ostrium-labs/resonate", rev = "31ffb2011b324c187f1d324b83feec2e16787e74" }
resonate-server-sqlite = { git = "https://github.com/ostrium-labs/resonate", rev = "31ffb2011b324c187f1d324b83feec2e16787e74" }
resonate-transport-http-poll = { git = "https://github.com/ostrium-labs/resonate", rev = "31ffb2011b324c187f1d324b83feec2e16787e74" }
# Without gcp-idtoken: no google-cloud-auth, and auth.mode = "gcp" is refused.
resonate-transport-http-push = { git = "https://github.com/ostrium-labs/resonate", rev = "31ffb2011b324c187f1d324b83feec2e16787e74", default-features = false }
# pg-control's Ed25519 signing key (PG2 Task 8). 0.17.14 (2025-03-11) is
# already in the lockfile (rustls, jsonwebtoken).
ring = "=0.17.14"
rmcp = { version = "3.4.1", features = ["server", "transport-streamable-http-server"] }
roaring = "0.11"
rustc-hash = "2"
rustix = { version = "1", default-features = false, features = ["std"] }
# The TLS library under sqlx (0.23, ring): loams-durable sets the process
# default crypto provider when none is set (D1 Task 5, T5-4).
rustls = { version = "0.23", default-features = false }
# The isolated worker's system-call allowlist (LV1 plan Task 5): seccomp-bpf,
# Linux only.
seccompiler = "0.5.0"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: qdrant-edge needs it, and Cargo unifies features, so the
# whole workspace uses one insertion-ordered map type (M1.3 row E58).
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde_json_borrow = "0.9"
serde_with = "3"
# JSON schemas of `loams upgrade`'s outputs (UP1 Task 12); 0.8.22 is already
# in the lockfile.
schemars = "0.8"
sha2 = "0.11"
slatedb = { version = "0.17", default-features = false }
# The MySQL driver resonate-server-mysql uses (0.8.6, rustls); loams-durable
# checks a TiDB store's schema with it before serving (D1 Task 4).
sqlx = { version = "0.9.0", default-features = false }
tantivy = { version = "=0.26.2", default-features = false, features = ["quickwit", "mmap", "stopwords", "stemmer", "lz4-compression", "zstd-compression", "columnar-zstd-compression"] }
tantivy-fst = "0.5"
tempfile = "3"
thiserror = "2"
# Loams's fork of tikv/client-rust, pinned by rev: branch `loam` of
# ostrium-labs/client-rust, upstream ab4be1c plus the TSO stream reconnect, the
# public generated protos, async-commit lock resolution on the read path,
# async commit's max_commit_ts and fail 0.5 (off rand 0.7, 8126c49a)
# (docs/plans/r1-dependency-spike.md, "The
# client-rust fork"). Not crates.io 0.4.0: it fails cargo-deny's advisories
# through tonic 0.10 and reports lost async-commit and 1PC acknowledgements as
# plain errors (R1 plan row R4). Default features pull in openssl, procfs and
# protobuf 2 through prometheus. The pin moves only by a PR that reruns the
# loams-tikv, loams-meta-tikv and loams-live suites.
tikv-client = { git = "https://github.com/ostrium-labs/client-rust", rev = "8126c49a15c0af7f1e7427f3b9020ae8d2c280cf", default-features = false }
time = { version = "0.3", features = ["std", "formatting", "parsing", "macros"] }
time-fmt = "0.3.8"
toml = "0.8"
# The engine's `loams.house.v1` proxy hands axum's `Send`-only request body to
# reqwest, which wants `Sync` (HS1 Task 7). 1.0.2 (2024-11-20) is already in the
# lock through axum. Apache-2.0.
sync_wrapper = "1.0.2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
# tokio-tungstenite is deliberately NOT a workspace dependency: its two
# consumers need incompatible shapes and Cargo unions features across a
# shared declaration. loams-web-bridge speaks wss:// to api.cloudflare.com
# and needs rustls; loams-sidebar-browser speaks ws:// to a loopback Obscura
# process only, and keeps no TLS stack in its graph. Each crate declares its
# own; the cost is two semver-incompatible copies during coexistence.
tokio-util = { version = "0.7", default-features = false }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
unicode-segmentation = "1.13"
url = "2"
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zeroize = "=1.9.0"
zstd = "0.14"
loams-cache = { path = "crates/loams-cache", version = "0.1.0" }
loams-collection = { path = "crates/loams-collection", version = "0.1.0" }
loams-cloudevents = { path = "crates/loams-cloudevents", version = "0.1.0" }
loams-common = { path = "crates/loams-common", version = "0.1.0" }
loams-durable = { path = "crates/loams-durable", version = "0.1.0" }
loams-es = { path = "crates/loams-es", version = "0.1.0" }
# The Fs trait for warm, rebuildable state and scratch (design §36 §17, GT1 Task 2).
loams-fs = { path = "crates/loams-fs", version = "0.1.0" }
# Loams Git's portable core (design §36, §19; GT1 Tasks 4 onwards).
loams-git = { path = "crates/loams-git", version = "0.1.0" }
loams-graph = { path = "crates/loams-graph", version = "0.1.0" }
loams-hnsw = { path = "crates/loams-hnsw", version = "0.1.0" }
loams-hot = { path = "crates/loams-hot", version = "0.1.0" }
loams-link = { path = "crates/loams-link", version = "0.1.0" }
loams-kv = { path = "crates/loams-kv", version = "0.1.0" }
loams-live = { path = "crates/loams-live", version = "0.1.0" }
loams-live-js = { path = "crates/loams-live-js", version = "0.1.0" }
loams-live-js-alloc = { path = "crates/loams-live-js-alloc", version = "0.1.0" }
loams-live-proto = { path = "crates/loams-live-proto", version = "0.1.0" }
# The public `loams.*.v1` packages of the unified Connect API and their
# descriptor set for reflection (design §44, API1 Task 1).
loams-postgres = { path = "crates/loams-postgres", version = "0.1.0" }
loams-proto = { path = "crates/loams-proto", version = "0.1.0" }
loams-log = { path = "crates/loams-log", version = "0.1.0" }
loams-meta = { path = "crates/loams-meta", version = "0.1.0" }
loams-meta-conformance = { path = "crates/loams-meta-conformance", version = "0.1.0" }
loams-meta-tikv = { path = "crates/loams-meta-tikv", version = "0.1.0" }
loams-migrate = { path = "crates/loams-migrate", version = "0.1.0" }
loams-upgrade = { path = "crates/loams-upgrade", version = "0.1.0" }
loams-stream-grpc = { path = "crates/loams-stream-grpc", version = "0.1.0" }
loams-pk = { path = "crates/loams-pk", version = "0.1.0" }
loams-qdrant = { path = "crates/loams-qdrant", version = "0.1.0" }
loams-query = { path = "crates/loams-query", version = "0.1.0" }
loams-quickwit = { path = "crates/loams-quickwit", version = "0.1.0" }
loams-store = { path = "crates/loams-store", version = "0.1.0" }
loams-text = { path = "crates/loams-text", version = "0.1.0" }
loams-tikv = { path = "crates/loams-tikv", version = "0.1.0" }
loams-tuple = { path = "crates/loams-tuple", version = "0.1.0" }
loams-web-bridge = { path = "crates/loams-web-bridge", version = "0.1.0" }
loams-worker = { path = "crates/loams-worker", version = "0.1.0" }

# loams-agentd: the per-user desktop daemon, moved from the zeron fork
# (design §50, D783, plan DD1 Task 1). Versions follow the fork's lockfile
# (DD1 T0-4). The fork pins reqwest 0.12 and sha2 0.10, which differ from the
# workspace keys above, so its crates name those two directly.
loams-agentd-connect = { path = "crates/loams-agentd-connect", version = "0.1.0" }
loams-agentd-doc = { path = "crates/loams-agentd-doc", version = "0.1.0" }
loams-agentd-harness = { path = "crates/loams-agentd-harness", version = "0.1.0" }
loams-agentd-link = { path = "crates/loams-agentd-link", version = "0.1.0" }
loams-agentd-mcp = { path = "crates/loams-agentd-mcp", version = "0.1.0" }
loams-agentd-preview = { path = "crates/loams-agentd-preview", version = "0.1.0" }
loams-agentd-proto = { path = "crates/loams-agentd-proto", version = "0.1.0" }
loams-agentd-rpc = { path = "crates/loams-agentd-rpc", version = "0.1.0" }
loams-agentd-sessions = { path = "crates/loams-agentd-sessions", version = "0.1.0" }
loams-agentd-store = { path = "crates/loams-agentd-store", version = "0.1.0" }
chrono = { version = "0.4", features = ["serde"] }
deser-hjson = "2.2"
gethostname = "1"
ignore = "0.4"
libc = "0.2"
loro = "1.13"
mimalloc = { version = "0.1", features = ["v2"] }
notify = "7"
nucleo-matcher = "0.3"
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
similar = "2"
# Generates the TypeScript wire types of `@loams/agentd-client` (design §50 §8,
# D789; plan DD1 T0-4 picked 12.0.1 and its features). `no-serde-warnings`
# silences notes on deserialize-only attributes (`alias`, `other`); the
# fixture `satisfies` checks in TypeScript catch any real mismatch.
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl", "uuid-impl", "chrono-impl", "no-serde-warnings"] }
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev]
debug = "line-tables-only"

# The daemon's RPC dispatch (`EngineRpc::handle`) is one large async state
# machine; unoptimized, it overflows a tokio worker's default 2 MiB stack
# (`checkout_file_diff_text_rpc_fits_the_default_worker_stack`). The zeron fork
# built its dependencies at opt-level 2; optimizing only this crate is enough
# (plan DD1 ruling T1-9).
[profile.dev.package.loams-agentd-sessions]
opt-level = 1

# QuickJS is an interpreter: built at -O0 it runs function bodies several
# times slower, which skews the CPU-limit tests (LV1 plan Task 3).
[profile.dev.package.rquickjs-sys]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

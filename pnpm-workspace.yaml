packages:
  - web
  - web/apps/*
  - web/packages/*
  - web/plugins/*
  - web/examples/*
  - sdks/typescript/packages/*
  - plugins
  - plugins/apps/*
  - plugins/core/*
  - plugins/packages/*
  - apps/desktop-electron

# One version of each shared UI dependency (docs/design/console-ui-stack.md).
# Packages depend on these as `"name": "catalog:"`. Bump here, and only to a
# release at least 14 days old.
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  lucide-react: 1.48.0
  '@base-ui/react': 1.8.0
  '@tanstack/react-query': 5.104.0
  '@tanstack/react-table': 9.2.4
  '@tanstack/react-virtual': 3.14.13
  '@connectrpc/connect-query': 2.3.1
  zod: 3.25.76
  echarts: 6.1.0
  '@xyflow/react': 12.12.0
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  # Studio's file viewer and diff panel (SD1 Tasks 20, 21; rulings T0-4, T0-5):
  # Apache-2.0. 1.5.1, because 1.5.2 is under 14 days old until 2026-10-19.
  '@pierre/diffs': 1.5.1
  # Studio's sidebar reorder (SD1 Task 17; MIT; published 2024-12-04/05).
  '@dnd-kit/core': 6.3.1
  '@dnd-kit/sortable': 10.0.0
  '@dnd-kit/utilities': 3.2.2
  # Studio's terminals (SD1 Task 22; D920, Q818): DD1's xterm.js pin, MIT, 2025-12-22.
  '@xterm/xterm': 6.0.0
  '@xterm/addon-fit': 0.11.0
  # Client-only UI stores (Q819), MIT, 2026-05-28: the version T3 Code uses.
  zustand: 5.0.14
  # Studio's composer (SD1 Task 19): Tiptap core and the free extensions, MIT,
  # 2026-09-04, the version T3 Code uses. Never @tiptap-pro/* or @tiptap-cloud/*.
  '@tiptap/core': 3.31.3
  '@tiptap/pm': 3.31.3
  '@tiptap/react': 3.31.3
  '@tiptap/starter-kit': 3.31.3
  '@tiptap/extension-blockquote': 3.31.3
  '@tiptap/extension-code': 3.31.3
  '@tiptap/extension-code-block': 3.31.3
  '@tiptap/extension-heading': 3.31.3
  '@tiptap/extension-horizontal-rule': 3.31.3
  '@tiptap/extension-list': 3.31.3
  '@tiptap/extension-task-item': 3.31.3
  '@tiptap/extension-task-list': 3.31.3
  # SD1 Task 18: Studio's chat markdown and code highlighting (MIT; npm licence and
  # publish time checked 2026-10-14, each release at least 14 days old). No rehype-raw (D919).
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  remark-breaks: 4.0.0
  rehype-sanitize: 6.0.0
  unified: 11.0.5
  shiki: 4.2.0
  # Playwright for the console's and the desktop's end-to-end tests (SD1 Task 29):
  # Apache-2.0, published 2026-09-04: the version the desktop smoke already pinned.
  '@playwright/test': 1.63.0

# Keep Vite+ isolated from the console's ordinary Vite/Vitest toolchain.
overrides:
  'vite-plus@1.0.0>vite': npm:@voidzero-dev/vite-plus-core@1.0.0
  'vite-plus@1.0.0>vitest': '5.0.1'
  'vitest@5.0.1>vite': npm:@voidzero-dev/vite-plus-core@1.0.0
  '@vitest/mocker@5.0.1>vite': npm:@voidzero-dev/vite-plus-core@1.0.0
  # Security: nx 23.2.1 pins vulnerable exact versions of these. Scoped to that
  # nx version so they lapse on the next nx bump.
  'nx@23.2.1>axios': 1.20.0
  'nx@23.2.1>smol-toml': 1.9.0
  'nx@23.2.1>brace-expansion': 5.0.12
  # Security (GHSA-g7r4-m6w7-qqqr, esbuild >=0.27.3 <0.28.1): tsup 8.5.1 asks for
  # esbuild ^0.27; 0.28.2 (2026-08-08) is the release the rest of the tree uses.
  # tsup 9 moves to ^0.28.2 but is under 14 days old; drop this with that bump.
  'tsup@8.5.1>esbuild': 0.28.2
  # Security (GHSA-hp3w-g68c-fv3c): sprintf-js has no fixed release. It comes only
  # through global-agent > roarr, the optional proxy module of @electron/get, which
  # loads it in a try/catch only when ELECTRON_GET_USE_PROXY is set. Without it,
  # Electron downloads ignore that variable (use a mirror via ELECTRON_MIRROR).
  '@electron/get@3.1.0>global-agent': '-'
  # Licences (SD1 T2-5, CONTRIBUTING rule 3): sax moved from ISC to BlueOak-1.0.0 in
  # 1.4.2; builder-util-runtime asks for ^1.2.4, so keep the last ISC release.
  'builder-util-runtime@9.7.0>sax': 1.4.1
  # js-yaml 4 uses argparse (Python-2.0) only for its command-line tool, which nothing
  # here runs; the library (`load`, `dump`) never imports it.
  'js-yaml@4.3.2>argparse': '-'
  # @pierre/diffs asks for shiki ^3 || ^4: keep a release at least 14 days old
  # (SD1 T0-5: shiki 4.2.0; 4.5.0 is too new).
  '@pierre/diffs@1.5.1>shiki': 4.2.0
  '@pierre/diffs@1.5.1>@shikijs/transformers': 4.2.0
  # @dnd-kit lists tslib (0BSD, T2-5) as a dependency, but none of its published
  # dist files imports it (checked in the tarballs of these exact versions).
  '@dnd-kit/core@6.3.1>tslib': '-'
  '@dnd-kit/sortable@10.0.0>tslib': '-'
  '@dnd-kit/utilities@3.2.2>tslib': '-'
  '@dnd-kit/accessibility@3.1.1>tslib': '-'
  # The 14-day rule (SD1 Task 19): @tiptap/react 3.31.3 asks for fast-equals ^5.3.3,
  # whose newest release (5.4.4) is from 2026-10-08; keep 5.4.3 (2026-09-20).
  '@tiptap/react@3.31.3>fast-equals': 5.4.3
  # SD1 Task 18 (Pins: at least 14 days old): react-markdown and remark-gfm accept these
  # mdast utilities' October 2026 releases; keep the previous ones until those age.
  mdast-util-find-and-replace: 3.0.2
  mdast-util-from-markdown: 2.0.3
  mdast-util-to-markdown: 2.1.3

allowBuilds:
  esbuild: true
  nx: true
  '@bufbuild/buf': false
  vite-plus: true
  msw: false
  electron: true
  electron-winstaller: false

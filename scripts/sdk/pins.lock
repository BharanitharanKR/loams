# scripts/sdk/pins.lock — the generation toolchain's pins, with an integrity for
# each. Read by `scripts/sdk/check-pins.sh`.
#
# A pin that moves is a deliberate act: it is a line here *and* the regenerated
# output in the same PR (SDK1's global constraint: "Remote plugins are pinned to
# a version; a bump is its own PR with regenerated output"). The checker fails
# when a tool's pin and this file disagree, when a pin is not exact, when a tool
# this file does not know about appears in a template, or when a row has no
# integrity.
#
# Format: one tool per line, fields separated by exactly ONE space (no column
# alignment — this file is read by awk), `#` starts a comment:
#
#   <kind> <id> <version> <integrity> <what it is>
#
# `kind` is one of:
#   npm     a package pinned in a package.json; `integrity` is the
#           `resolution: {integrity: ...}` value from the root pnpm-lock.yaml
#   pypi    a distribution pinned with `==`; `integrity` is the sha256 of the
#           file PyPI serves, from https://pypi.org/pypi/<id>/<version>/json
#   go      a module pinned in go.mod; `integrity` is the module and go.mod h1:
#           hashes from sum.golang.org/lookup/<id>@<version>
#   crate   a crate pinned in Cargo.toml; `integrity` is the sha256 Cargo.lock
#           records for the resolved version
#   bsr     a buf remote plugin; `integrity` is the plugin's upstream version,
#           because buf publishes no digest for a protoc plugin (see below)
#   buf     the buf CLI itself, pinned as an npm devDependency
#
# For a `bsr` row buf offers no checksum to record: the Buf Schema Registry
# resolves a plugin label to one published build but exposes no digest for a
# protoc plugin the way it does for a module. The strongest checkable pin is
# therefore the upstream `protoc-gen-*` release the build wraps, which is what
# `integrity` holds; the label in the template must equal it. Every other kind
# carries a real hash from its registry.
#
# Verified 2026-10-04: every `bsr` and `buf` row was resolved by an actual
# `buf generate`, and every library row was fetched from its registry on that
# date.


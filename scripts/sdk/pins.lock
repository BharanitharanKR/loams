# --- Python (design §44 §9 row 2; SDK2 Task 1) ---
# The runtime distribution is `connectrpc`, from connectrpc/connect-py. It is NOT
# `connect-python`: that name on PyPI is a different, third-party project whose
# last release predates this SDK. Both are Apache-2.0; only one is Connect's.
pypi connectrpc 0.12.1 da7ca41c6cd8d9ce640ad86ae325a71cd83dfdd1e43748976315cb4b0546fb69 the Connect runtime (sdist)
pypi protoc-gen-connectrpc 0.12.1 dde1652e291be825c4e84e71d9398c6ddd3c5c50995f3872a78ea9e4e21464dc the code generator (sdist)
# The maintained protobuf runtime, and the reason `sdks/python/buf.gen.proto.yaml`
# passes `protobuf=google` to connectrpc's generator: its default pairs with the
# generator's own `protobuf-py`, whose modules are named `*_pb.py`, while
# protoc-gen-python writes `*_pb2.py`.
pypi protobuf 7.36.2 497d0463ff3316681da6c0b9e8d06cb465d61abce00b613ab42226175644d1bb the protobuf runtime (sdist)
bsr buf.build/protocolbuffers/python v35.0 protoc-35.0 the messages
bsr buf.build/connectrpc/python v0.12.1 connect-py-0.12.1 the Connect clients


# reindeer: Buck targets for the root workspace's crates.io and git
# dependencies. scripts/buck/gen.py writes Cargo.toml here from the workspace's
# Cargo.toml and Cargo.lock (Cargo stays the source of truth), then runs
# reindeer. Rerun it after any Cargo.toml or Cargo.lock change; CI fails when
# a generated file is stale.
manifest_path = "Cargo.toml"
third_party_dir = "."

# Every Cargo environment variable, as Cargo sets them.
cargo_env = true

# Crate sources are downloaded at build time (http_archive), not vendored.
vendor = false

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"

[platform.macos-arm64]
target = "aarch64-apple-darwin"

[platform.macos-x86_64]
target = "x86_64-apple-darwin"

[buck]
file_name = "BUCK"
alias_with_platforms = "cargo_alias"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo", cargo_alias = "alias")
"""
generated_file_header = """
##
## @generated by reindeer from Cargo.toml and Cargo.lock.
## Do not edit: run scripts/buck/gen.py.
##
"""

tracing-subscriber = { package = "tracing-subscriber", version = "=0.3.23", default-features = true, features = ["alloc", "ansi", "env-filter", "fmt", "matchers", "nu-ansi-term", "once_cell", "registry", "sharded-slab", "smallvec", "std", "thread_local", "tracing", "tracing-log"] }
ts-rs = { package = "ts-rs", version = "=12.0.1", default-features = true, features = ["chrono", "chrono-impl", "no-serde-warnings", "serde-compat", "serde-json-impl", "serde_json", "uuid", "uuid-impl"] }
ulid = { package = "ulid", version = "=3.0.0", default-features = true, features = ["std"] }
unicode-segmentation = { package = "unicode-segmentation", version = "=1.13.3", default-features = false }
url = { package = "url", version = "=2.5.8", default-features = true, features = ["serde", "std"] }
uuid = { package = "uuid", version = "=1.28.0", default-features = true, features = ["js", "rng", "serde", "std", "v4"] }
webbrowser = { package = "webbrowser", version = "=1.2.4", default-features = false }
x509-parser = { package = "x509-parser", version = "=0.18.1", default-features = true, features = ["ring", "verify"] }
xxhash-rust = { package = "xxhash-rust", version = "=0.8.19", default-features = false, features = ["xxh3", "xxh32", "xxh64"] }
zeroize = { package = "zeroize", version = "=1.9.1", default-features = true, features = ["alloc", "derive", "zeroize_derive"] }
zip = { package = "zip", version = "=7.2.0", default-features = false, features = ["_deflate-any", "deflate-flate2", "deflate-flate2-zlib-rs"] }
zstd = { package = "zstd", version = "=0.14.0", default-features = true, features = ["arrays", "legacy", "zdict_builder"] }

[target.'cfg(any(all(target_os = "linux", target_arch = "aarch64"), all(target_os = "linux", target_arch = "x86_64")))'.dependencies]
landlock = { package = "landlock", version = "=0.4.7", default-features = false }
seccompiler = { package = "seccompiler", version = "=0.5.0", default-features = false }

[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
mimalloc = { package = "mimalloc", version = "=0.1.52", default-features = true, features = ["v2"] }

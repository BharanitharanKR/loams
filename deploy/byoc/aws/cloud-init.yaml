#cloud-config
# Loams on one VM in your own AWS account (design 70, BY0).
# GENERATED from deploy/byoc/cloud-init.tmpl.yaml, lib/ and aws/config.env
# by deploy/byoc/gen-cloud-init.sh; edit those, not this file. Fill the @@NAME@@
# placeholders with deploy/byoc/render.sh before you use it.
#
# What it does: mounts the data disk (if any), installs Docker, downloads the
# pinned Loams compose bundle and verifies its signature, writes the stack's
# settings (no cloud key), reads the tailnet key and setup token from the
# secret store with the VM's own identity, and starts the stack. The engine is
# reached over your tailnet only: no port is opened, and the VM needs none.
package_update: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
write_files:
  - path: /etc/loams-byoc/config.env
    permissions: "0644"
    owner: root:root
    content: |
      # Settings for the AWS VM (rendered into /etc/loams-byoc/config.env). No keys.
      LOAMS_BYOC_CLOUD=aws
      LOAMS_VERSION=@@VERSION@@
      LOAMS_BUCKET_URL=s3://@@BUCKET@@/loams
      REGION=@@REGION@@
      SECRET_PREFIX=@@SECRET_PREFIX@@
      LOAMS_PROFILES=@@PROFILES@@
      TS_HOSTNAME=@@HOSTNAME@@
      DATA_DEVICE=@@DATA_DEVICE@@
  - path: /etc/loams-byoc/loams-release-key.asc
    permissions: "0644"
    owner: root:root
    content: |
      -----BEGIN PGP PUBLIC KEY BLOCK-----

      mDMEatJGMhYJKwYBBAHaRw8BAQdAdkD6qgQhDjs8F74Gxt1APYZop8jVwWNBWRo4
      tcx2Wrq0NExvYW1zIFJlbGVhc2UgU2lnbmluZyBLZXkgPHNlY3VyaXR5QG9zdHJp
      dW1sYWJzLmNvbT6IeAQwFgoAIBYhBDM6yUWZ1aHrKkFtHoPcE02Mr4ldBQJq1Pf+

{{- $fullname := include "loams-connectors.fullname" . }}
# Metrics and health only: FlowService is loopback-only (D111).
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-flow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loams-connectors.labels" . | nindent 4 }}
    app.kubernetes.io/component: flow
spec:
  selector:
    {{- include "loams-connectors.flowSelector" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.flow.metricsPort | int64 }}
      targetPort: metrics
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-flow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loams-connectors.labels" . | nindent 4 }}
    app.kubernetes.io/component: flow
spec:
  maxUnavailable: {{ .Values.flow.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "loams-connectors.flowSelector" . | nindent 6 }}

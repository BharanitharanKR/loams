{{- $fullname := include "loams-connectors.fullname" . }}
# In the release namespace: the fleet's leader writes the flow Deployment's
# scale (R26.7), and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-flow-scale
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loams-connectors.labels" . | nindent 4 }}
    app.kubernetes.io/component: flow
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: [{{ printf "%s-flow" $fullname | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-flow-scale
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loams-connectors.labels" . | nindent 4 }}
    app.kubernetes.io/component: flow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-flow-scale
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-flow
    namespace: {{ .Release.Namespace }}
{{- range (include "loams-connectors.servedK8sNamespaces" . | trim | splitList "\n") }}
{{- if . }}
---
# In {{ . }}: read the instances' secrets (`get` only: no list, no watch;
# R25.9) and manage the fallback objects KubeRuntime renders.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-flow
  namespace: {{ . }}
  labels:
    {{- include "loams-connectors.labels" $ | nindent 4 }}
    app.kubernetes.io/component: flow
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-flow
  namespace: {{ . }}
  labels:
    {{- include "loams-connectors.labels" $ | nindent 4 }}
    app.kubernetes.io/component: flow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-flow
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-flow
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}

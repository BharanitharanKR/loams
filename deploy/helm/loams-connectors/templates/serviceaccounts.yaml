{{- $fullname := include "loams-connectors.fullname" . }}
# The flow pods' account: it reads instance secrets (`get` only, R25.9) and
# manages the fallback objects in the served namespaces, so its token is
# mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-flow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loams-connectors.labels" . | nindent 4 }}
    app.kubernetes.io/component: flow
automountServiceAccountToken: true
{{- range (include "loams-connectors.servedK8sNamespaces" . | trim | splitList "\n") }}
{{- if . }}
---
# The fallback pods' account in {{ . }}: bound to no Role, token never
# mounted (R25.9).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "loams-connectors.fallbackServiceAccount" $ }}
  namespace: {{ . }}
  labels:
    {{- include "loams-connectors.labels" $ | nindent 4 }}
    app.kubernetes.io/component: fallback
automountServiceAccountToken: false
{{- end }}
{{- end }}

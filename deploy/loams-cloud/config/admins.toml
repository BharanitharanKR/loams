# The Loams Cloud admin allow-list (design 78 §25.8, D1746; plan LC2a Task 4).
#
# An admin needs all three: membership of the "Ostrium" WorkOS organisation with
# the role cloud_admin, an entry here, and a TOTP step-up within 15 minutes.

# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# A TEMPLATE for a confidential OIDC client (a server-side app that can keep
# a secret), sharing the global issuer and signing key, so the engine
# verifies its tokens with the same JWKS. Not applied automatically: copy it,
# set the context values, and apply it from the admin interface
# (Customization > Blueprints) or `ak apply_blueprint`.
#
# The engine admits its tokens when its client id is in LOAMS_OIDC_AUDIENCE.
version: 1
metadata:
  name: Loams - confidential client (template)
  labels:
    blueprints.goauthentik.io/instantiate: "false"
    blueprints.goauthentik.io/description: Copy, edit the context and apply by hand
context:
  slug: my-loams-app
  name: My Loams app
  redirect_uri: https://app.example.com/oauth/callback
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: !Context slug
    attrs:
      client_type: confidential
      client_id: !Context slug
      # client_secret is generated; read it once in the admin interface.
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: global
      sub_mode: hashed_user_id
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      include_claims_in_id_token: true
      access_token_validity: minutes=10
      redirect_uris:
        - matching_mode: strict
          url: !Context redirect_uri
          redirect_uri_type: authorization
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "Loams: email (verified at sign-up)"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers:
      slug: !Context slug
    attrs:
      name: !Context name
      provider: !KeyOf provider

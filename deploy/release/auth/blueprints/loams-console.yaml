# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# The hosted console's sign-in on auth.loams.dev (preview, owner ruling
# 2026-10-12): one public OIDC client, `loams-console`, Authorization Code
# with PKCE, no secret, exact redirect URIs only (never a wildcard).
#
# Applied automatically (mounted at /blueprints/loams). Apache-2.0, like the
# rest of the repository; only models outside authentik/enterprise are used
# (design §38 D447, D458).
version: 1
metadata:
  name: Loams - hosted console
  labels:
    blueprints.goauthentik.io/description: The loams-console OIDC client and the sign-up flow
context:
  console_origin: !Env [LOAMS_CONSOLE_ORIGIN, "https://console.loams.dev"]
entries:
  # Sign-up verifies the email address before the account is active: the
  # engine admits users by verified email (LOAMS_OIDC_ALLOWED_EMAILS).
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Example - Enrollment with email verification
      required: true
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-enrollment-flow]]

  # `email_verified` is true: every account was verified at sign-up, and
  # setup.sh turns off changing the email afterwards. (Authentik's own email
  # mapping says false.)
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email
    identifiers:
      name: "Loams: email (verified at sign-up)"
    attrs:
      scope_name: email
      description: Your email address
      expression: |
        return {
            "email": request.user.email,
            "email_verified": bool(request.user.email) and request.user.is_active,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: loams-console
    attrs:
      client_type: public
      client_id: loams-console
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # One issuer for every application: https://auth.loams.dev/ (the
      # Caddyfile serves its discovery document at the root).
      issuer_mode: global
      sub_mode: hashed_user_id
      # RS256: the engine accepts RS256 and EdDSA only.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # The engine reads email and groups from the access token.
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=10
      refresh_token_validity: days=14
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/", !Context console_origin]
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Format ["%s/", !Context console_origin]
          redirect_uri_type: logout
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  - model: authentik_core.application
    identifiers:
      slug: loams-console
    attrs:
      name: Loams Console
      provider: !KeyOf provider
      meta_launch_url: !Context console_origin
      policy_engine_mode: any

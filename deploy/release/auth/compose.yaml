# The hosted auth service (auth.loams.dev): Authentik 2026.8.3, open-source
# edition (design §38 D447, no licence key), behind Caddy for TLS.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#   ./setup.sh            # once: admin settings the blueprints cannot set
#
# Only Caddy publishes ports (80 for the ACME challenge and the redirect,
# 443). Authentik and its Postgres stay on the compose network. Ostrium runs
# this; a self-hoster may run the same stack for their own issuer.
name: loams-auth

x-authentik-env: &authentik-env
  AUTHENTIK_POSTGRESQL__HOST: postgresql
  AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
  AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?set PG_PASS in .env}
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
  # First start only: the akadmin account.
  AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
  AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
  # Enrollment verifies email addresses (the engine's allowlist trusts them).
  AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
  AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-587}
  AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME:-}
  AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD:-}
  AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS:-true}
  AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:-Loams <no-reply@loams.dev>}
  # Read by blueprints/loams-console.yaml.
  LOAMS_CONSOLE_ORIGIN: ${LOAMS_CONSOLE_ORIGIN:-https://console.loams.dev}

services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?set PG_PASS in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 5s
    volumes:
      - database:/var/lib/postgresql/data

  server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.3}
    command: server
    restart: unless-stopped
    shm_size: 512mb
    depends_on:
      postgresql:
        condition: service_healthy
    environment: *authentik-env
    volumes:
      - data:/data
      - ./blueprints:/blueprints/loams:ro

  worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.3}
    command: worker
    restart: unless-stopped
    shm_size: 512mb
    depends_on:
      postgresql:
        condition: service_healthy
    environment: *authentik-env
    # No Docker socket: no managed outposts are used.
    volumes:
      - data:/data
      - ./blueprints:/blueprints/loams:ro

  caddy:
    image: docker.io/library/caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:-auth.loams.dev}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${AUTH_HTTP_BIND:-0.0.0.0}:80:80"
      - "${AUTH_HTTPS_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  database:
  data:
  caddy-data:
  caddy-config:

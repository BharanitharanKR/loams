# The Loams preview stack: everything a user runs themselves, on one machine
# or a VM of their own (BYOC, see byoc/install.sh). Configure it in .env (copy
# .env.example). Start the engine and its storage with
#
#   docker compose up -d loams tailscale
#
# or the whole stack (adds tidb and the Postgres stack) with `up -d`; add
# `--profile house` for Loams House on its own tailnet node.
#
# Network exposure: nothing binds a host port on 0.0.0.0. Only the engine and
# the Tailscale sidecar share a network namespace (the `loams` service's); no
# other container may join it, because the engine trusts Tailscale identity
# headers on its tailscale listener (LOAMS_TAILSCALE_LISTEN, 127.0.0.1:7781),
# whose only client is the sidecar's `tailscale serve` proxy. The sidecar joins
# the user's Tailscale tailnet (Headscale is coming soon) and
# serves https://loams.<tailnet>/ from that listener; that tailnet URL is
# LOAMS_ENGINE_URL for the console. Every other service (pd, tikv, tidb,
# agentd, the Postgres stack) is on the compose network and cannot reach the
# engine's loopback listeners. The House is on a network of its own, with its
# own sidecar in its namespace (`house-tailscale`, https://loams-house.<tailnet>/). The few published ports (console, headscale,
# the Postgres stack's) are on 127.0.0.1 unless .env says otherwise.
name: loams

include:
  # The Loams Postgres (Neon) storage stack and its compute. Point
  # LOAMS_POSTGRES_COMPOSE at ./postgres-off.yaml to leave it out.
  - path: ${LOAMS_POSTGRES_COMPOSE:-../loams-postgres-dev/compose.yaml}

x-restart: &restart
  restart: unless-stopped

services:
  pd:
    <<: *restart
    image: docker.io/pingcap/pd:${TIKV_TAG:-v8.5.8}
    command:
      - --name=pd
      - --data-dir=/data/pd
      - --config=/etc/pd.toml
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
    volumes:
      - pd-data:/data/pd
      - ./config/pd.toml:/etc/pd.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2379/pd/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  tikv:
    <<: *restart
    image: docker.io/pingcap/tikv:${TIKV_TAG:-v8.5.8}
    command:
      - --pd-endpoints=pd:2379
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=tikv:20180
      - --data-dir=/data/tikv
      - --config=/etc/tikv.toml
    volumes:
      - tikv-data:/data/tikv
      - ./config/tikv.toml:/etc/tikv.toml:ro
    depends_on:
      pd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:20180/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Keyspace-mode TiDB (Loams SQL), MySQL protocol on tidb:4000 in the compose
  # network. Its root user starts without a password: set one before forwarding
  # 4000 over the tailnet.
  tidb:
    <<: *restart
    image: ${TIDB_IMAGE:-ghcr.io/ostrium-labs/tidb:v8.5.8-loams.1}
    # The patched TiDB image is amd64 only: on Apple silicon and other arm64
    # hosts Docker Desktop runs it emulated (Rosetta or QEMU).
    platform: ${TIDB_PLATFORM:-linux/amd64}
    command:
      - --store=tikv
      - --path=pd:2379
      - --config=/etc/tidb.toml
      - --advertise-address=tidb
      - -P=4000
      - --status=10080
    volumes:
      - ./config/tidb.toml:/etc/tidb.toml:ro
    depends_on:
      tikv:
        condition: service_healthy

  loams:
    <<: *restart
    image: ${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams:${LOAMS_VERSION:-0.1.0-preview.2}
    command:
      - standalone
      - --bucket=${LOAMS_BUCKET:-file:///var/lib/loams/bucket}
      - --data-dir=/var/lib/loams
      - --listen=${LOAMS_LISTEN:-127.0.0.1:8080}
      # standalone defaults Flight SQL to 0.0.0.0, which would put it on the
      # compose network; keep it on loopback like every other engine listener.
      - --flight-sql-listen=127.0.0.1:8082
      - --graph-data-dir=/var/lib/loams/graph
      - --meta=tikv://pd:2379/loams_meta
      - --live-store=tikv://pd:2379/loams_live_dev
      # No --house-endpoint yet: the House serves loopback plaintext only until
      # TLS (D111, HS1 Task 20), and it may not share this namespace; it has
      # its own tailnet node instead (`--profile house`).
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # Engine auth (preview): tailscale | oidc | apikey | off (loopback only).
      # tailscale trusts the Tailscale-User-Login headers that the sidecar's
      # `tailscale serve` proxy adds, on LOAMS_TAILSCALE_LISTEN only: a loopback
      # port of its own that is the serve target and nothing else.
      LOAMS_AUTH_MODE: ${LOAMS_AUTH_MODE:-tailscale}
      LOAMS_TAILSCALE_LISTEN: ${LOAMS_TAILSCALE_LISTEN:-127.0.0.1:7781}
      LOAMS_OIDC_ISSUER: ${LOAMS_OIDC_ISSUER:-https://auth.loams.dev}
      LOAMS_OIDC_AUDIENCE: ${LOAMS_OIDC_AUDIENCE:-loams-console}
      LOAMS_OIDC_ALLOWED_EMAILS: ${LOAMS_OIDC_ALLOWED_EMAILS:-}
      LOAMS_OIDC_ALLOWED_SUBJECTS: ${LOAMS_OIDC_ALLOWED_SUBJECTS:-}
      LOAMS_OIDC_ALLOWED_GROUPS: ${LOAMS_OIDC_ALLOWED_GROUPS:-}
      LOAMS_TAILSCALE_ALLOWED_USERS: ${LOAMS_TAILSCALE_ALLOWED_USERS:-}
      LOAMS_API_KEYS_FILE: /etc/loams/secrets/api-keys
    # Further engine settings, such as AWS_* credentials for an s3://
    # LOAMS_BUCKET, kept out of compose.yaml.
    env_file:
      - path: ./secrets/engine.env
        required: false
    volumes:
      - loams-data:/var/lib/loams
      - ./secrets:/etc/loams/secrets:ro
    depends_on:
      pd:
        condition: service_healthy
      tikv:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

  # Loams House (the ClickHouse HTTP interface, loams-fabric with its chDB
  # workers), `--profile house`. It serves loopback plaintext only until TLS
  # (D111, HS1 Task 20), so it gets a door of its own, the same shape as the
  # engine's: the `house-tailscale` sidecar shares its network namespace and
  # serves https://loams-house.<tailnet>/ from 127.0.0.1:8123 (TLS from the
  # tailnet's certificates, reachable only by tailnet members the policy lets
  # in). Clients sign in as ClickHouse user `default` with the password in
  # /var/lib/loams-house/house.key (created on first start). It is on its own
  # network: nothing else in the stack can reach it, and its workers reach
  # nothing of the stack. The engine is not wired to it yet (no
  # --house-endpoint: the engine's link needs Task 20's TLS), so the console's
  # House page still says not configured.
  #
  # Workers run sealed (L3): HOUSE_SANDBOX=pods (the default) is Landlock (TCP
  # rules, Linux 6.7 or later) and seccomp, inside this container and its own
  # network; netns adds a user and network namespace per worker, which needs
  # unprivileged user namespaces in the container (Podman's default; Docker's
  # default seccomp profile refuses them). The worker refuses to boot when its
  # sandbox cannot be put in force. chDB's access control (R-ACL.1) and the
  # statement checks (L1) are always on.
  house:
    <<: *restart
    profiles: [house]
    image: ${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams-fabric:${LOAMS_VERSION:-0.1.0-preview.2}
    command:
      - house
      - --single-node
      - --data-dir=/var/lib/loams-house
      - --sandbox=${HOUSE_SANDBOX:-pods}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    networks: [house]
    volumes:
      - house-data:/var/lib/loams-house

  # The House's tailnet node, in the House's network namespace (its only
  # neighbour there). A second node on the tailnet: give it its own auth key
  # (HOUSE_TS_AUTHKEY) or a reusable TS_AUTHKEY.
  house-tailscale:
    <<: *restart
    profiles: [house]
    image: docker.io/tailscale/tailscale:${TAILSCALE_TAG:-v1.90.6}
    network_mode: service:house
    environment:
      TS_AUTHKEY: ${HOUSE_TS_AUTHKEY:-${TS_AUTHKEY:-}}
      TS_HOSTNAME: ${HOUSE_TS_HOSTNAME:-loams-house}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/house-serve-https.json
      TS_EXTRA_ARGS: --login-server=${TS_LOGIN_SERVER:-https://controlplane.tailscale.com} ${TS_EXTRA_ARGS:-}
    volumes:
      - house-tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      house:
        condition: service_started

  # The only way in from outside: a tailnet node named TS_HOSTNAME in the
  # engine's network namespace, the only container besides the engine there. Userspace networking needs no extra
  # capabilities or /dev/net/tun.
  tailscale:
    <<: *restart
    image: docker.io/tailscale/tailscale:${TAILSCALE_TAG:-v1.90.6}
    network_mode: service:loams
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-loams}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      # https (Tailscale: MagicDNS + HTTPS certificates), or http for Headscale
      # (coming soon, unsupported in 0.1.0-preview.2); see tailscale/serve-*.json.
      TS_SERVE_CONFIG: /config/serve-${TS_SERVE_MODE:-https}.json
      TS_EXTRA_ARGS: --login-server=${TS_LOGIN_SERVER:-https://controlplane.tailscale.com} ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      loams:
        condition: service_started

  # COMING SOON, unsupported in 0.1.0-preview.2: Headscale issues no ts.net
  # HTTPS certificates, so the hosted console cannot reach an engine on it.
  # A self-hosted tailnet control server (`--profile headscale`). Clients,
  # including the browser's device, must reach HEADSCALE_SERVER_URL, so on a VM
  # set HEADSCALE_BIND=0.0.0.0 (and TLS in front of it) or reach it over SSH.
  headscale:
    <<: *restart
    profiles: [headscale]
    image: docker.io/headscale/headscale:${HEADSCALE_TAG:-0.26.1}
    command: [serve]
    environment:
      HEADSCALE_SERVER_URL: ${HEADSCALE_SERVER_URL:-http://127.0.0.1:8090}
      HEADSCALE_DNS_BASE_DOMAIN: ${HEADSCALE_BASE_DOMAIN:-loams.internal}
    ports:
      - ${HEADSCALE_BIND:-127.0.0.1}:${HEADSCALE_PORT:-8090}:8080
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale

  # The console served from this machine (`--profile console`) instead of the
  # hosted one, Vercel or Cloudflare. LOAMS_CONSOLE_DIR is a built console
  # (web/apps/console's `pnpm build` output); /config.json carries its runtime
  # configuration.
  console:
    <<: *restart
    profiles: [console]
    image: docker.io/nginxinc/nginx-unprivileged:${NGINX_TAG:-1.29-alpine}
    environment:
      LOAMS_ENGINE_URL: ${LOAMS_ENGINE_URL:-}
      LOAMS_AUTH_ISSUER: ${LOAMS_AUTH_ISSUER:-https://auth.loams.dev}
      LOAMS_AUTH_CLIENT_ID: ${LOAMS_AUTH_CLIENT_ID:-loams-console}
    ports:
      - ${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-3000}:8080
    volumes:
      - ${LOAMS_CONSOLE_DIR:-./console/dist}:/usr/share/nginx/html:ro
      - ./console/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  # The optional agent daemon (`--profile agentd`); its config is
  # agentd/config.toml. It supervises its own engine, so it needs nothing from
  # this one and stays on the compose network.
  agentd:
    <<: *restart
    profiles: [agentd]
    image: ${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams-agentd:${LOAMS_VERSION:-0.1.0-preview.2}
    volumes:
      - ./agentd:/etc/loams-agentd:ro
      - agentd-data:/home/loams

networks:
  # The House's own network (see `house`): no other service joins it.
  house: {}

volumes:
  pd-data:
  tikv-data:
  loams-data:
  house-data:
  house-tailscale-state:
  tailscale-state:
  headscale-data:
  agentd-data:

# Real systems for the connector suites (CN2 OR-2, OR-3). CN2 Task 6 owns
# this file and adds the rest of the test estate; Task 9 (the Kafka-protocol
# family) adds the services below first (ruling R9.4). Every image is pinned
# by digest. Nothing here runs by default: each service is in a profile.
#
#   connectors          — open images for the starred connectors (CN1): Apache Kafka.
#   connectors-ci-only  — proprietary or source-available images (`ci-service`,
#                         OR-3): Redpanda (BSL), the Event Hubs emulator
#                         (Microsoft EULA) and the Azurite it needs. CI only;
#                         never in an image Loams builds.
#
# Kafka and the Event Hubs emulator both listen on 9092; they run in
# different CI jobs (`connectors-p2`, `connectors-ci-only`). Redpanda
# advertises 19092 so it can run beside the emulator.
name: loams-connectors

services:
  # Apache Kafka 4.3.1 (Apache-2.0), single-node KRaft, transactions on.
  kafka:
    image: apache/kafka:4.3.1@sha256:ccd1314e47ec76909e01f86308b4dcf2064f19f7c89759234322314b0e319e26
    profiles: [connectors]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redpanda v26.2.4 (BSL-1.1, `ci-service`). Transactions are on by default
  # (spike §5.1, R0.18).
  redpanda:
    image: redpandadata/redpanda:v26.2.4@sha256:b14446094ab13051a05f38402b3a36ac2e581a3f8fba3454a8cd0edb5858fa68
    profiles: [connectors-ci-only]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 10s
      retries: 30

  # The Azure Event Hubs emulator 2.2.1 (Microsoft emulator EULA,
  # `ci-service`): the Kafka endpoint on 9092 (SASL_PLAINTEXT, PLAIN,
  # `$ConnectionString`), producer and consumer APIs only (spike §5.2).
  # Its hubs and consumer groups come from eventhubs/config.json.
  eventhubs:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:2.2.1@sha256:be413f0d59541621879e6d197d73f64f3b3ac5fa45861641fdc1430252b8b44b
    profiles: [connectors-ci-only]
    depends_on: [azurite]
    ports: ["9092:9092", "5672:5672"]
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y"
    volumes:
      - ./eventhubs/config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro

  # Azurite 3.37.0 (MIT): the Event Hubs emulator's checkpoint and metadata store.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    profiles: [connectors-ci-only]

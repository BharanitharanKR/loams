# deploy/loams-postgres-dev: Loams Postgres (Neon), the development stack from the Neon + WeSQL spike (docs/design/23-neon-and-wesql.md).
# Derived from neondatabase/neon `docker-compose/` (Apache-2.0), with MinIO replaced by RustFS,
# one safekeeper instead of three, and computes that attach to an explicit tenant/timeline
# (compute1's is created by the one-shot pg-bootstrap unless .env names one).
# The pageserver's and the safekeeper's remote storage is a local folder in their own volumes by
# default (Neon's LocalFs: one disk, no second copy); the `rustfs` profile (COMPOSE_PROFILES=rustfs
# in .env) runs RustFS and puts both in its `neon` bucket instead. Pick one before the first start:
# the timelines stay in the storage they were created in.
# Not a production layout: no storage controller, no proxy, no TLS, default credentials, loopback ports.
# The project keeps its pre-rename name (D823): Docker names users' volumes
# after it, so renaming it would orphan their data.
name: loams-neon

# Multi-arch index digests, generated from deploy/pins/loams-postgres-images.toml by
# scripts/nf1/pins.py (NF1 Task 2; `pins.py check` fails on a hand edit): images.storage and
# images.compute-v<majors.default>. NEON_IMAGE and COMPUTE_IMAGE override them (PG2 R2.1).
x-neon-image: &neon-image ${NEON_IMAGE:-ghcr.io/ostrium-labs/loams-postgres-storage@sha256:4dcec4cbef637b92b1088ea2c0bc857f3b5ef4318f02e8d2d4a0f9263ed4140e}
x-compute-image: &compute-image ${COMPUTE_IMAGE:-ghcr.io/ostrium-labs/loams-postgres-compute-v17@sha256:210b71416c827b6cf7842853706e1dbdcc870fd4a7af8e235d6e7296b95edb0e}
x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
  AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
  AWS_REGION: us-east-1
  # The profiles (COMPOSE_PROFILES): `rustfs` selects the S3 remote storage.
  LOAMS_PROFILES: ${COMPOSE_PROFILES:-}

services:
  # RustFS and its bucket: `rustfs` profile only.
  rustfs:
    profiles: [rustfs]
    image: docker.io/rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - 127.0.0.1:9000:9000
    volumes:
      - rustfs-data:/data

  # Creates the `neon` bucket with a SigV4-signed PUT. RustFS requires x-amz-content-sha256,
  # which curl 7.88's --aws-sigv4 does not add, so it is set to the empty-body hash.
  create-bucket:
    profiles: [rustfs]
    image: *neon-image
    depends_on: [rustfs]
    restart: "no"
    environment: *s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until curl -sf -o /dev/null -H "x-amz-content-sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        --aws-sigv4 aws:amz:us-east-1:s3 --user "$${AWS_ACCESS_KEY_ID}:$${AWS_SECRET_ACCESS_KEY}"
        -X PUT http://rustfs:9000/neon
        || curl -sf -o /dev/null -H "x-amz-content-sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        --aws-sigv4 aws:amz:us-east-1:s3 --user "$${AWS_ACCESS_KEY_ID}:$${AWS_SECRET_ACCESS_KEY}"
        -I http://rustfs:9000/neon;
        do echo waiting for rustfs; sleep 1; done; echo bucket ready

  storage_broker:
    image: *neon-image
    command: ["storage_broker", "--listen-addr=0.0.0.0:50051"]

  # Its configuration is pageserver.toml plus the remote storage the profiles select, written
  # into the data volume at each start: the `neon` bucket on RustFS, or the folder
  # /data/.neon/remote_storage in the same volume.
  pageserver:
    image: *neon-image
    environment: *s3-env
    ports:
      - 127.0.0.1:9898:9898 # management API: tenants, timelines, branches
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        case ",$${LOAMS_PROFILES}," in
        *,rustfs,*) remote="{ endpoint='http://rustfs:9000', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/pageserver' }" ;;
        *) mkdir -p /data/.neon/remote_storage; remote="{ local_path='/data/.neon/remote_storage' }" ;;
        esac;
        { cat /etc/loams-pageserver/pageserver.toml; echo "remote_storage=$${remote}"; } > /data/.neon/pageserver.toml;
        exec /usr/local/bin/pageserver -D /data/.neon
    volumes:
      - pageserver-data:/data/.neon
      - ./pageserver.toml:/etc/loams-pageserver/pageserver.toml:ro
      - ./identity.toml:/data/.neon/identity.toml:ro
    depends_on:
      storage_broker:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
        required: false

  # WAL lands on the safekeeper's disk first and is offloaded to the bucket. Since preview.3 it is
  # on the safekeeper-data volume, so recreating the container loses nothing (design §54 §9.3,
  # D945). preview.2 kept it in the container filesystem: `loams upgrade` drains it (computes
  # stopped, every timeline uploaded) before it recreates the container, and `migrate`'s
  # `0001-safekeeper-volume` checks the drain again.
  safekeeper1:
    image: *neon-image
    environment: *s3-env
    ports:
      - 127.0.0.1:7676:7676
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        case ",$${LOAMS_PROFILES}," in
        *,rustfs,*) remote="{endpoint='http://rustfs:9000', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}" ;;
        *) mkdir -p /data/.neon/remote_storage; remote="{local_path='/data/.neon/remote_storage'}" ;;
        esac;
        exec safekeeper --listen-pg=safekeeper1:5454 --listen-http=0.0.0.0:7676 --id=1
        --broker-endpoint=http://storage_broker:50051 -D /data/.neon
        --remote-storage="$${remote}"
    # At /data/.neon, not /data: a fresh volume takes a copy of the image's directory, and the
    # image's /data holds a 600 MB Postgres tarball the safekeeper never reads. A stack whose
    # volume was first mounted at /data keeps its files at the volume's root, which is where they
    # are read now.
    volumes:
      - safekeeper-data:/data/.neon
    depends_on:
      storage_broker:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
        required: false

  # One-shot: makes sure compute1's tenant and timeline exist on the pageserver, then exits 0
  # (bootstrap/pg-bootstrap.sh). With TENANT_ID and TIMELINE_ID empty it creates them once and
  # keeps the ids in the pg-bootstrap volume, so every later run (an `up` after a `down` without
  # -v) reuses them; with both set in .env it only ensures those exist. It runs in the storage
  # image (curl), on the compose network only, and publishes nothing.
  pg-bootstrap:
    image: *neon-image
    restart: "no"
    environment:
      TENANT_ID: ${TENANT_ID:-}
      TIMELINE_ID: ${TIMELINE_ID:-}
      # The new timeline's Postgres major: it must match the compute image (COMPUTE_IMAGE).
      PG_VERSION: ${COMPUTE_PG_MAJOR:-17}
    # Root (the image's user is `neon`), so that it can write the fresh named volume, which is
    # root's; with no capabilities, since it only writes its own volume and talks HTTP.
    user: "0:0"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/bootstrap/pg-bootstrap.sh"]
    volumes:
      - ./bootstrap/pg-bootstrap.sh:/bootstrap/pg-bootstrap.sh:ro
      - pg-bootstrap:/var/lib/pg-bootstrap
    depends_on:
      pageserver:
        condition: service_started

  # A compute is stateless: it attaches to (TENANT_ID, TIMELINE_ID) from .env, or else to the ones
  # pg-bootstrap created (its volume, read-only). Recreating the container loses nothing.
  compute1:
    image: *compute-image
    environment:
      TENANT_ID: ${TENANT_ID:-}
      TIMELINE_ID: ${TIMELINE_ID:-}
    volumes:
      - ./compute/config.json:/var/db/postgres/configs/config.json:ro
      - ./compute/start.sh:/shell/start.sh:ro
      - pg-bootstrap:/var/lib/pg-bootstrap:ro
    ports:
      - 127.0.0.1:55433:55433
    entrypoint: ["/bin/bash", "/shell/start.sh"]
    depends_on:
      pageserver:
        condition: service_started
      safekeeper1:
        condition: service_started
      pg-bootstrap:
        condition: service_completed_successfully

  # A second compute for a branch timeline (profile `branch`).
  compute2:
    profiles: ["branch"]
    image: *compute-image
    environment:
      TENANT_ID: ${BRANCH_TENANT_ID:-${TENANT_ID:-}}
      TIMELINE_ID: ${BRANCH_TIMELINE_ID:-}
    volumes:
      - ./compute/config.json:/var/db/postgres/configs/config.json:ro
      - ./compute/start.sh:/shell/start.sh:ro
    ports:
      - 127.0.0.1:55434:55433
    entrypoint: ["/bin/bash", "/shell/start.sh"]
    depends_on: [pageserver, safekeeper1]

volumes:
  rustfs-data:
  pageserver-data:
  safekeeper-data:
  # pg-bootstrap's ids.env: the tenant and timeline it created for compute1.
  pg-bootstrap:

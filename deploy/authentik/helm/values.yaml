# Values for the official Authentik chart (https://charts.goauthentik.io,
# chart authentik-2026.8.3, app version 2026.8.3, released 2026-09-17).
#
#   helm repo add authentik https://charts.goauthentik.io
#   helm upgrade --install authentik authentik/authentik \
#     --version 2026.8.3 -n authentik -f values.yaml
#
# The chart is GPL-3.0 and is referenced, never vendored. Secrets are NOT in this
# file: they come from the Secret `authentik-env` (see secrets.example.yaml).
# Open-source edition only: no licence key, no tenants.
global:
  image:
    repository: ghcr.io/goauthentik/server
    tag: "2026.8.3"
    # Digest pin (index digest, multi-arch). The chart appends it to the tag.
    digest: "sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849"
  env:
    - name: AUTHENTIK_ERROR_REPORTING__ENABLED
      value: "false"
    - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
      value: "true"
    - name: AUTHENTIK_DISABLE_UPDATE_CHECK
      value: "true"
    - name: LOAMS_PREVIEW_ORIGIN
      value: https://preview.loams.dev
    - name: LOAMS_ENROLLMENT_OPEN
      value: "false"     # invitation-only for the beta
    - name: LOAMS_AUTH_DOMAIN
      value: auth.loams.dev
  # Secret keys: AUTHENTIK_SECRET_KEY, AUTHENTIK_POSTGRESQL__PASSWORD,
  # AUTHENTIK_EMAIL__PASSWORD, LOAMS_CLOUD_CLIENT_SECRET,
  # HEADSCALE_OIDC_CLIENT_SECRET,
  # AUTHENTIK_BOOTSTRAP_PASSWORD (first start only).
  envFrom:
    - secretRef:
        name: authentik-env
  # Placeholder logo and favicon, served as /media/public/loams/*.
  volumes:
    - name: loams-branding
      configMap:
        name: loams-branding
  volumeMounts:
    - name: loams-branding
      mountPath: /data/media/public/loams
      readOnly: true

authentik:
  log_level: info
  # secret_key comes from the Secret above (AUTHENTIK_SECRET_KEY).
  email:
    host: smtp.example.net      # TODO: set the real SMTP relay
    port: 587
    use_tls: true
    from: "Loams <no-reply@loams.dev>"
    # username and password: AUTHENTIK_EMAIL__USERNAME / __PASSWORD in the Secret
  error_reporting:
    enabled: false
  postgresql:
    # The CloudNativePG cluster in postgres-cnpg.yaml exposes this Service.
    host: authentik-db-rw.authentik.svc
    name: authentik
    user: authentik
    port: 5432
    # password: AUTHENTIK_POSTGRESQL__PASSWORD in the Secret

# Loams blueprints, generated into the ConfigMap `loams-blueprints` by
# deploy/authentik/kustomization.yaml from ../blueprints. The chart mounts each ConfigMap under
# /blueprints/mounted/cm-<name>/ and the worker applies it automatically.
blueprints:
  configMaps:
    - loams-blueprints

server:
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1536Mi}
  # Ingress is not used: cloudflared (cloudflared.yaml) reaches the Service
  # `authentik-server` inside the cluster. Nothing is exposed publicly.
  ingress:
    enabled: false
  service:
    type: ClusterIP

worker:
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1536Mi}

# Bundled Postgres subchart and Prometheus ServiceMonitor stay off; Postgres is
# CloudNativePG (docs 04, PD37) and Redis is not needed since Authentik 2025.10.
postgresql:
  enabled: false
prometheus:
  rules:
    enabled: false

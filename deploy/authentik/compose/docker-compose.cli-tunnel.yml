# Override for a locally-managed tunnel created with `cloudflared tunnel create`.
# Use:  docker compose -f docker-compose.yml -f docker-compose.cli-tunnel.yml up -d
# Needs ./cloudflared/config.yml and ./cloudflared/credentials.json
# (see docs/platform/deploy/authentik.md, "Option B: cloudflared CLI").
services:
  cloudflared:
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --config /etc/cloudflared/config.yml run
    environment:
      TUNNEL_TOKEN: ""
    volumes:
      - ./cloudflared:/etc/cloudflared:ro

# Everything around the chart: namespace, Postgres, backups, cloudflared and the
# blueprint/branding ConfigMaps.
#   kubectl apply -k deploy/authentik
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - helm/namespace.yaml
  - helm/postgres-cnpg.yaml
  - helm/backup-cronjob.yaml
  - helm/cloudflared.yaml
configMapGenerator:
  - name: loams-blueprints
    files:
      - blueprints/loams-01-groups.yaml
      - blueprints/loams-02-flows.yaml
      - blueprints/loams-03-oidc.yaml
      - blueprints/loams-04-brand.yaml
      - blueprints/loams-05-headscale.yaml
  - name: loams-branding
    files:
      - branding/logo.svg
      - branding/favicon.svg
generatorOptions:
  disableNameSuffixHash: true

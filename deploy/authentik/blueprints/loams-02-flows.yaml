# Loams hosted cloud: authentication (with MFA for admins), enrollment
# (invitation-only toggle, email verification) and recovery flows.
version: 1
metadata:
  name: Loams - Flows
  labels:
    app.kubernetes.io/part-of: loams
entries:
  # ---- Dependencies shipped with Authentik (all open source) ----------------
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Loams - Groups}
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - Password change flow}
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - TOTP MFA setup flow}
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - WebAuthn MFA setup flow}
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - Static MFA setup flow}
      required: false

  # ===========================================================================
  # Enrollment flow: [invitation] -> credentials -> profile -> write user
  # (inactive) -> email verification -> sign in.
  # Invitation-only is the beta default. Set LOAMS_ENROLLMENT_OPEN=true in the
  # environment of the worker (and let the blueprint re-apply) for open sign-up.
  # ===========================================================================
  - model: authentik_flows.flow
    id: flow-enroll
    identifiers:
      slug: loams-enrollment
    attrs:
      name: Loams sign up
      title: Create your Loams account
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_stages_invitation.invitationstage
    id: enroll-invitation
    identifiers:
      name: loams-enrollment-invitation
    attrs:
      continue_flow_without_invitation: !Env [LOAMS_ENROLLMENT_OPEN, "false"]

  - model: authentik_stages_prompt.prompt
    id: enroll-field-username
    identifiers: {name: loams-enrollment-field-username}
    attrs: {field_key: username, label: Username, type: username, required: true, placeholder: Username, placeholder_expression: false, order: 0}
  - model: authentik_stages_prompt.prompt
    id: enroll-field-password
    identifiers: {name: loams-enrollment-field-password}
    attrs: {field_key: password, label: Password, type: password, required: true, placeholder: Password, placeholder_expression: false, order: 1}
  - model: authentik_stages_prompt.prompt
    id: enroll-field-password-repeat
    identifiers: {name: loams-enrollment-field-password-repeat}
    attrs: {field_key: password_repeat, label: Password (repeat), type: password, required: true, placeholder: Password (repeat), placeholder_expression: false, order: 2}
  - model: authentik_stages_prompt.prompt
    id: enroll-field-name
    identifiers: {name: loams-enrollment-field-name}
    attrs: {field_key: name, label: Name, type: text, required: true, placeholder: Name, placeholder_expression: false, order: 0}
  - model: authentik_stages_prompt.prompt
    id: enroll-field-email
    identifiers: {name: loams-enrollment-field-email}
    attrs: {field_key: email, label: Email, type: email, required: true, placeholder: Email, placeholder_expression: false, order: 1}

  - model: authentik_stages_prompt.promptstage
    id: enroll-prompt-credentials
    identifiers: {name: loams-enrollment-prompt-credentials}
    attrs:
      fields:
        - !KeyOf enroll-field-username
        - !KeyOf enroll-field-password
        - !KeyOf enroll-field-password-repeat
  - model: authentik_stages_prompt.promptstage
    id: enroll-prompt-profile
    identifiers: {name: loams-enrollment-prompt-profile}
    attrs:
      fields:
        - !KeyOf enroll-field-name
        - !KeyOf enroll-field-email

  - model: authentik_stages_user_write.userwritestage
    id: enroll-user-write
    identifiers:
      name: loams-enrollment-user-write
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: true
      user_type: internal
      user_path_template: loams/users
      create_users_group: !Find [authentik_core.group, [name, loams-beta]]

  # Uses the instance's SMTP settings (AUTHENTIK_EMAIL__*).
  - model: authentik_stages_email.emailstage
    id: enroll-email
    identifiers:
      name: loams-enrollment-email-verification
    attrs:
      use_global_settings: true
      subject: Confirm your Loams email address
      template: email/account_confirmation.html
      token_expiry: hours=24
      activate_user_on_success: true

  - model: authentik_stages_user_login.userloginstage
    id: enroll-login
    identifiers:
      name: loams-enrollment-user-login

  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-enroll, stage: !KeyOf enroll-invitation, order: 5}
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-enroll, stage: !KeyOf enroll-prompt-credentials, order: 10}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-enroll, stage: !KeyOf enroll-prompt-profile, order: 11}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-enroll, stage: !KeyOf enroll-user-write, order: 20}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-enroll, stage: !KeyOf enroll-email, order: 30}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-enroll, stage: !KeyOf enroll-login, order: 100}

  # ===========================================================================
  # Recovery flow: identify -> email link -> MFA (if the user has a device) ->
  # new password -> sign in. Based on Authentik's recovery-with-MFA example.
  # ===========================================================================
  - model: authentik_flows.flow
    id: flow-recovery
    identifiers:
      slug: loams-recovery
    attrs:
      name: Loams account recovery
      title: Reset your password
      designation: recovery
      authentication: require_unauthenticated

  - model: authentik_stages_prompt.prompt
    id: recovery-field-password
    identifiers: {name: loams-recovery-field-password}
    attrs: {field_key: password, label: Password, type: password, required: true, placeholder: Password, placeholder_expression: false, order: 0}
  - model: authentik_stages_prompt.prompt
    id: recovery-field-password-repeat
    identifiers: {name: loams-recovery-field-password-repeat}
    attrs: {field_key: password_repeat, label: Password (repeat), type: password, required: true, placeholder: Password (repeat), placeholder_expression: false, order: 1}
  - model: authentik_policies_expression.expressionpolicy
    id: recovery-skip-if-restored
    identifiers: {name: loams-recovery-skip-if-restored}
    attrs:
      expression: |
        return bool(request.context.get('is_restored', True))
  - model: authentik_stages_identification.identificationstage
    id: recovery-identification
    identifiers: {name: loams-recovery-identification}
    attrs:
      user_fields: [email, username]
  - model: authentik_stages_email.emailstage
    id: recovery-email
    identifiers: {name: loams-recovery-email}
    attrs:
      use_global_settings: true
      subject: Reset your Loams password
      template: email/password_reset.html
      token_expiry: minutes=30
      activate_user_on_success: true
      recovery_max_attempts: 5
      recovery_cache_timeout: minutes=5
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: recovery-mfa
    identifiers: {name: loams-recovery-mfa}
    attrs:
      device_classes: [static, totp, webauthn]
      not_configured_action: skip
  # Admins must hold (or enrol) a second factor before the recovery flow signs them in.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: recovery-mfa-required
    identifiers: {name: loams-recovery-mfa-required}
    attrs:
      device_classes: [static, totp, webauthn]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
  - model: authentik_stages_prompt.promptstage
    id: recovery-prompt-password
    identifiers: {name: loams-recovery-new-password}
    attrs:
      fields:
        - !KeyOf recovery-field-password
        - !KeyOf recovery-field-password-repeat
      validation_policies: []
  - model: authentik_stages_user_write.userwritestage
    id: recovery-user-write
    identifiers: {name: loams-recovery-user-write}
    attrs:
      user_creation_mode: never_create
  - model: authentik_stages_user_login.userloginstage
    id: recovery-login
    identifiers: {name: loams-recovery-user-login}

  - model: authentik_flows.flowstagebinding
    id: recovery-bind-identification
    identifiers: {target: !KeyOf flow-recovery, stage: !KeyOf recovery-identification, order: 10}
    attrs: {evaluate_on_plan: true, re_evaluate_policies: true, policy_engine_mode: any, invalid_response_action: retry}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-recovery, stage: !KeyOf recovery-email, order: 20}
    attrs: {evaluate_on_plan: true, re_evaluate_policies: true, policy_engine_mode: any, invalid_response_action: retry}
  - model: authentik_flows.flowstagebinding
    id: recovery-bind-mfa-optional
    identifiers: {target: !KeyOf flow-recovery, stage: !KeyOf recovery-mfa, order: 21}
    attrs: {evaluate_on_plan: false, re_evaluate_policies: true, policy_engine_mode: all, invalid_response_action: retry}
  - model: authentik_flows.flowstagebinding
    id: recovery-bind-mfa-required
    identifiers: {target: !KeyOf flow-recovery, stage: !KeyOf recovery-mfa-required, order: 22}
    attrs: {evaluate_on_plan: false, re_evaluate_policies: true, policy_engine_mode: any, invalid_response_action: retry}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-recovery, stage: !KeyOf recovery-prompt-password, order: 30}
    attrs: {evaluate_on_plan: true, re_evaluate_policies: false, policy_engine_mode: any, invalid_response_action: retry}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-recovery, stage: !KeyOf recovery-user-write, order: 40}
    attrs: {evaluate_on_plan: true, re_evaluate_policies: false, policy_engine_mode: any, invalid_response_action: retry}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-recovery, stage: !KeyOf recovery-login, order: 100}
    attrs: {evaluate_on_plan: true, re_evaluate_policies: false, policy_engine_mode: any, invalid_response_action: retry}
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf recovery-skip-if-restored
      target: !KeyOf recovery-bind-identification
      order: 0
    attrs: {negate: false, enabled: true, timeout: 30}

  # ===========================================================================
  # Authentication flow: identification -> password -> MFA -> login.
  # MFA is mandatory for loams-admins and "authentik Admins" (they are asked to
  # enrol a TOTP or WebAuthn device on first sign-in) and used when present for
  # everyone else.
  # ===========================================================================
  - model: authentik_flows.flow
    id: flow-authn
    identifiers:
      slug: loams-authentication
    attrs:
      name: Loams sign in
      title: Sign in to Loams
      designation: authentication
      authentication: require_unauthenticated

  - model: authentik_stages_identification.identificationstage
    id: authn-identification
    identifiers:
      name: loams-authentication-identification
    attrs:
      user_fields: [email, username]
      enrollment_flow: !KeyOf flow-enroll
      recovery_flow: !KeyOf flow-recovery

  - model: authentik_stages_password.passwordstage
    id: authn-password
    identifiers:
      name: loams-authentication-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
        - authentik.core.auth.TokenBackend
      configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]]

  # Optional MFA: validates a device if the user has one, otherwise skips.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: authn-mfa-optional
    identifiers:
      name: loams-authentication-mfa-optional
    attrs:
      device_classes: [static, totp, webauthn]
      not_configured_action: skip

  # Required MFA: forces enrolment of TOTP or WebAuthn when nothing is configured.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: authn-mfa-required
    identifiers:
      name: loams-authentication-mfa-required
    attrs:
      device_classes: [static, totp, webauthn]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  - model: authentik_stages_user_login.userloginstage
    id: authn-login
    identifiers:
      name: loams-authentication-login
    attrs:
      session_duration: hours=24

  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-authn, stage: !KeyOf authn-identification, order: 10}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-authn, stage: !KeyOf authn-password, order: 20}
  - model: authentik_flows.flowstagebinding
    id: bind-mfa-optional
    identifiers: {target: !KeyOf flow-authn, stage: !KeyOf authn-mfa-optional, order: 30}
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_flows.flowstagebinding
    id: bind-mfa-required
    identifiers: {target: !KeyOf flow-authn, stage: !KeyOf authn-mfa-required, order: 31}
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-authn, stage: !KeyOf authn-login, order: 100}

  # Optional MFA applies to everyone who is NOT an admin ...
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bind-mfa-optional
      group: !Find [authentik_core.group, [name, loams-admins]]
      order: 0
    attrs: {negate: true, enabled: true, timeout: 30}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bind-mfa-optional
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 1
    attrs: {negate: true, enabled: true, timeout: 30}
  # ... required MFA applies to admins.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bind-mfa-required
      group: !Find [authentik_core.group, [name, loams-admins]]
      order: 0
    attrs: {negate: false, enabled: true, timeout: 30}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bind-mfa-required
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 1
    attrs: {negate: false, enabled: true, timeout: 30}

  # Recovery: optional MFA for everyone but admins, required MFA for admins
  # (same split as the sign-in flow).
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf recovery-bind-mfa-optional
      group: !Find [authentik_core.group, [name, loams-admins]]
      order: 0
    attrs: {negate: true, enabled: true, timeout: 30}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf recovery-bind-mfa-optional
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 1
    attrs: {negate: true, enabled: true, timeout: 30}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf recovery-bind-mfa-required
      group: !Find [authentik_core.group, [name, loams-admins]]
      order: 0
    attrs: {negate: false, enabled: true, timeout: 30}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf recovery-bind-mfa-required
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 1
    attrs: {negate: false, enabled: true, timeout: 30}

# Loams hosted cloud: branding for auth.loams.dev and the device-code flow.
#
# Logo and favicon are placeholders served from /media/public/loams/ (file names are relative to the tenant media root, so loams/logo.svg) (the
# deploy/authentik/branding directory is mounted there). Replace the files, or
# point the fields at final assets, without touching anything else.
version: 1
metadata:
  name: Loams - Brand
  labels:
    app.kubernetes.io/part-of: loams
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Loams - Flows}
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - Invalidation flow}
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - User settings flow}
      required: false

  # RFC 8628 device authorization (phones without a camera, CLI). Authentik
  # requires a flow assigned to the brand; it needs no stages of its own.
  - model: authentik_flows.flow
    id: flow-device-code
    identifiers:
      slug: loams-device-code
    attrs:
      name: Loams device code
      title: Connect a device to Loams
      designation: stage_configuration
      authentication: require_authenticated

  - model: authentik_brands.brand
    identifiers:
      domain: !Env [LOAMS_AUTH_DOMAIN, "auth.loams.dev"]
    attrs:
      default: false
      branding_title: Loams
      branding_logo: loams/logo.svg
      branding_favicon: loams/favicon.svg
      branding_custom_css: |
        :root { --ak-accent: #1f6feb; }
      flow_authentication: !Find [authentik_flows.flow, [slug, loams-authentication]]
      flow_recovery: !Find [authentik_flows.flow, [slug, loams-recovery]]
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      flow_user_settings: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      flow_device_code: !KeyOf flow-device-code

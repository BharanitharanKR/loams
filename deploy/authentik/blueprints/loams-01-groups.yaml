# Loams hosted cloud: groups.
#
# Applied automatically: the worker discovers every *.yaml under /blueprints and
# re-applies it on change and every 60 minutes. Open-source edition only: no
# model in these files lives under authentik/enterprise (OSS 38 D447, D458).
version: 1
metadata:
  name: Loams - Groups
  labels:
    app.kubernetes.io/part-of: loams
entries:
  # Operators of the hosted service. Not an Authentik superuser group: it grants
  # Loams admin rights through the `groups` claim and forces MFA at sign-in.
  - model: authentik_core.group
    id: group-admins
    identifiers:
      name: loams-admins
    attrs:
      is_superuser: false
      attributes:
        description: Loams operators. MFA (TOTP or WebAuthn) is required.

  # Beta cohort. New sign-ups through the enrollment flow land here.
  - model: authentik_core.group
    id: group-beta
    identifiers:
      name: loams-beta
    attrs:
      is_superuser: false
      attributes:
        description: Loams hosted-cloud beta users.

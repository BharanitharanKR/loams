# Loams hosted cloud: OAuth2/OIDC providers and applications.
#
#   loams-cloud    confidential client for the site (loams.dev, Auth.js)
#   loams-desktop  public PKCE client, loopback redirect (RFC 8252 section 7.3)
#   loams-mobile   public PKCE client, universal/app link or custom scheme
#
# Client ids are fixed. The loams-cloud secret comes from the worker's
# environment (LOAMS_CLOUD_CLIENT_SECRET), so nothing has to be copied out of
# the admin UI and a rebuilt instance keeps the same credentials.
version: 1
metadata:
  name: Loams - OIDC clients
  labels:
    app.kubernetes.io/part-of: loams
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Loams - Groups}
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - Provider authorization flow (implicit consent)}
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - Provider invalidation flow}
      required: false

  # ---- Scope mappings -------------------------------------------------------
  # `groups`: only groups prefixed `loams-` are released (OSS MT1 ruling 2), so
  # an operator's other Authentik groups never reach the site.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    identifiers:
      managed: loams.dev/oauth2/scope-groups
    attrs:
      name: "Loams OAuth Mapping: groups"
      scope_name: groups
      description: Loams group memberships
      expression: |
        return {
            "groups": [
                g.name for g in request.user.ak_groups.all()
                if g.name.startswith("loams-")
            ],
        }

  # `profile` replaces the stock mapping, which emits ALL groups. This one emits
  # only the `loams-` groups, so Auth.js's default scope "openid email profile"
  # already carries the `groups` claim; the separate `groups` scope above gives
  # the same value to clients that ask for it explicitly.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-profile
    identifiers:
      managed: loams.dev/oauth2/scope-profile
    attrs:
      name: "Loams OAuth Mapping: profile"
      scope_name: profile
      description: General profile information
      expression: |
        avatar = request.user.avatar
        return delete_none_values({
            "name": request.user.name,
            "given_name": ak_obj_attr(request.user, "given_name", "name"),
            "family_name": ak_obj_attr(request.user, "family_name"),
            "preferred_username": request.user.username,
            "nickname": request.user.username,
            "groups": [
                g.name for g in request.user.ak_groups.all()
                if g.name.startswith("loams-")
            ],
            "picture": avatar if avatar and not avatar.startswith("data:") else None,
        })

  # ---- loams-cloud: the site -----------------------------------------------
  # Auth.js callback: https://loams.dev/api/auth/callback/authentik
  # Preview origin: LOAMS_PREVIEW_ORIGIN (one exact origin, no wildcards).
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-cloud
    identifiers:
      name: loams-cloud
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Authentik 2026.x issues nothing unless the grant types are listed.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: loams-cloud
      client_secret: !Env LOAMS_CLOUD_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://loams.dev/api/auth/callback/authentik
        - matching_mode: strict
          url: !Format ["%s/api/auth/callback/authentik", !Env [LOAMS_PREVIEW_ORIGIN, "https://preview.loams.dev"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_token_validity: minutes=10
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf scope-profile
        - !KeyOf scope-groups
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  - model: authentik_core.application
    id: app-cloud
    identifiers:
      slug: loams-cloud
    attrs:
      name: Loams Cloud
      provider: !KeyOf provider-cloud
      group: Loams
      meta_launch_url: https://loams.dev
      meta_publisher: Loams
      meta_description: The Loams hosted cloud (loams.dev).
      policy_engine_mode: any
      open_in_new_tab: false

  # ---- loams-desktop: Tauri app, public PKCE, loopback redirect ---------------
  # The desktop app listens on http://127.0.0.1:<random port>/callback; the port
  # is only known at run time, so the loopback host is matched by regex.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-desktop
    identifiers:
      name: loams-desktop
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      grant_types:
        - authorization_code
        - refresh_token
        - urn:ietf:params:oauth:grant-type:device_code
      client_id: loams-desktop
      redirect_uris:
        - matching_mode: regex
          url: ^http://(127\.0\.0\.1|\[::1\]):[0-9]{2,5}/callback$
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_token_validity: minutes=10
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf scope-profile
        - !KeyOf scope-groups
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  - model: authentik_core.application
    id: app-desktop
    identifiers:
      slug: loams-desktop
    attrs:
      name: Loams Desktop
      provider: !KeyOf provider-desktop
      group: Loams
      meta_publisher: Loams
      meta_description: Loams Desktop (Tauri). Sign-in uses the system browser.
      policy_engine_mode: any

  # ---- loams-mobile: iOS and Android, public PKCE ----------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-mobile
    identifiers:
      name: loams-mobile
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      grant_types:
        - authorization_code
        - refresh_token
        - urn:ietf:params:oauth:grant-type:device_code
      client_id: loams-mobile
      redirect_uris:
        # Universal link / app link (OSS 37 section 7.2, option 2).
        - matching_mode: strict
          url: https://loams.dev/app/auth/callback
        # Fallback custom scheme (reverse-DNS of the domain, RFC 8252 section 7.1).
        - matching_mode: strict
          url: dev.loams.app:/oauth2redirect
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_token_validity: minutes=10
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf scope-profile
        - !KeyOf scope-groups
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  - model: authentik_core.application
    id: app-mobile
    identifiers:
      slug: loams-mobile
    attrs:
      name: Loams Mobile
      provider: !KeyOf provider-mobile
      group: Loams
      meta_publisher: Loams
      meta_description: Loams for iOS and Android.
      policy_engine_mode: any

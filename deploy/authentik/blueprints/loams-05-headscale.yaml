# Headscale (headscale.loams.dev): the OIDC client and the two groups it uses.
#
#   loams-net-users  may sign in to the tailnet (Headscale oidc.allowed_groups,
#                    and an Authentik policy binding, so non-members cannot even
#                    obtain a token for this application)
#   loams-net-ops    operators; mirrors `group:ops` in the Headscale policy
#                    (deploy/tailnet/policy/policy.hujson). Headscale cannot
#                    use OIDC groups in its policy, so this group is a roster
#                    and the policy lists the same people by email; keep them
#                    equal. Operators are members of both groups (the `groups`
#                    claim lists direct memberships only) (docs/platform/deploy/headscale.md, "Adding an operator").
#
# The client secret comes from the worker's environment
# (HEADSCALE_OIDC_CLIENT_SECRET), the same value Headscale reads, so nothing is
# copied out of the admin UI. Applied after loams-03-oidc.yaml, which defines
# the `groups` scope mapping this file reuses.
version: 1
metadata:
  name: Loams - Headscale
  labels:
    app.kubernetes.io/part-of: loams
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Loams - Groups}
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Loams - OIDC clients}
      required: true

  - model: authentik_core.group
    id: group-net-users
    identifiers:
      name: loams-net-users
    attrs:
      is_superuser: false
      attributes:
        description: May sign in to the Loams tailnet (Headscale).

  - model: authentik_core.group
    id: group-net-ops
    identifiers:
      name: loams-net-ops
    attrs:
      is_superuser: false
      attributes:
        description: Tailnet operators. Mirrors group:ops in the Headscale policy. Operators are also members of loams-net-users (the groups claim lists direct memberships only).

  # Confidential client, authorization code + PKCE (S256). Headscale does not
  # support encrypted (JWE) tokens: no encryption key is set on this provider.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-headscale
    identifiers:
      name: headscale
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: headscale
      client_secret: !Env HEADSCALE_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://headscale.loams.dev/oidc/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_token_validity: minutes=10
      refresh_token_validity: days=1
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, loams.dev/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, loams.dev/oauth2/scope-groups]]

  - model: authentik_core.application
    id: app-headscale
    identifiers:
      slug: headscale
    attrs:
      name: Loams Tailnet
      provider: !KeyOf provider-headscale
      group: Loams
      meta_launch_url: https://headscale.loams.dev
      meta_publisher: Loams
      meta_description: Sign in to the private network (Headscale).
      policy_engine_mode: any

  # Only members of loams-net-users may use it.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-headscale
      group: !KeyOf group-net-users
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30

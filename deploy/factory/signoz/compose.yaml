# The Software Factory's observability app: SigNoz on Loams House (D1666,
# owner, 2026-10-22). Opt-in: an overlay on the Loams stack, started with
#
#   docker compose -f deploy/release/compose.yaml \
#     -f deploy/factory/signoz/compose.yaml up -d
#
# PREVIEW: SigNoz on Loams House. SigNoz is the House's third gate
# application (D1571); until `signoz_on_house_smoke` passes, this overlay is
# the configuration contract, not a working default. SigNoz speaks only the
# ClickHouse native protocol, which the House serves from the gate's native
# listener (D1571 amends D1548), and it runs a clustered schema (`ON CLUSTER
# cluster`, Replicated*, Distributed) that a one-node House accepts.
#
# What runs: the MIT build of SigNoz (`signoz/signoz-community`, query API and
# web UI on one port; never the enterprise `signoz/signoz` image) and its
# OTLP collector, whose image also runs the two schema-migration jobs (AGPL-3.0,
# unmodified). Pins and licences are in ../images.lock. No ClickHouse server is
# bundled: telemetry lives in the install's House, which already runs.
#
# Storage, by configuration (.env):
#
#   SIGNOZ_HOUSE_NATIVE    host:port of the House's native listener (house:9000)
#   SIGNOZ_HOUSE_HTTP      the House's HTTP endpoint, for the readiness check
#                          (http://house:8123)
#   SIGNOZ_HOUSE_USER      the House user SigNoz signs in as (default)
#   SIGNOZ_HOUSE_PASSWORD  its password; for `default`, the one in the House's
#                          /var/lib/loams-house/house.key. URL-encode it.
#   SIGNOZ_HOUSE_CLUSTER   the cluster name SigNoz's DDL uses (cluster)
#   SIGNOZ_JWT_SECRET      SigNoz's session-signing secret (required)
#
# The House reaches SigNoz, and SigNoz the House, on `house-signoz`, an
# internal network only those join; the House's other networks are unchanged.
# Apps send OpenTelemetry to the collector (OTLP gRPC 4317, HTTP 4318). Host
# ports bind to 127.0.0.1. SigNoz's own analytics and usage reporting are off.

x-house-dsn: &house-dsn tcp://${SIGNOZ_HOUSE_USER:-default}:${SIGNOZ_HOUSE_PASSWORD:-}@${SIGNOZ_HOUSE_NATIVE:-house:9000}

x-collector-env: &collector-env
  SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: *house-dsn
  SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: ${SIGNOZ_HOUSE_CLUSTER:-cluster}
  SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
  SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
  SIGNOZ_HOUSE_DSN: *house-dsn
  LOW_CARDINAL_EXCEPTION_GROUPING: "false"

x-collector-image: &collector-image docker.io/signoz/signoz-otel-collector:v0.144.12@sha256:deb566a7a3c0ba544ee58ccc92ee1f0e6da827bc40383e52f3c824705e100a3d

services:
  house:
    networks: [house-signoz]

  # Waits for the House over HTTP, then creates SigNoz's schema in it.
  signoz-migrator-sync:
    image: *collector-image
    labels: { io.loams.licence: "AGPL-3.0-only" }
    restart: on-failure
    # The image has bash but no HTTP client: GET /ping over /dev/tcp.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        hp=$${SIGNOZ_HOUSE_HTTP#*://}; hp=$${hp%%/*};
        until (exec 3<>"/dev/tcp/$${hp%:*}/$${hp##*:}" &&
        printf 'GET /ping HTTP/1.0\r\nHost: %s\r\n\r\n' "$$hp" >&3 &&
        grep -q '^Ok\.' <&3) 2>/dev/null; do echo "waiting for the House at $$hp"; sleep 2; done;
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up
    environment:
      <<: *collector-env
      SIGNOZ_HOUSE_HTTP: ${SIGNOZ_HOUSE_HTTP:-http://house:8123}
    networks: [house-signoz]
    depends_on:
      house: { condition: service_started }

  signoz-migrator-async:
    image: *collector-image
    labels: { io.loams.licence: "AGPL-3.0-only" }
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command: ["/signoz-otel-collector migrate async up"]
    environment: *collector-env
    networks: [house-signoz]
    depends_on:
      signoz-migrator-sync: { condition: service_completed_successfully }

  signoz:
    restart: unless-stopped
    image: docker.io/signoz/signoz-community:v0.145.0@sha256:5f9b59276590a5e0e0eb2a7f99e88c9b27f44e4575d18c555aaa07648bca9d0c
    labels: { io.loams.licence: "MIT" }
    environment:
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: *house-dsn
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_CLUSTER: ${SIGNOZ_HOUSE_CLUSTER:-cluster}
      SIGNOZ_SQLSTORE_PROVIDER: sqlite
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_TOKENIZER_JWT_SECRET: ${SIGNOZ_JWT_SECRET:?set SIGNOZ_JWT_SECRET in .env}
      SIGNOZ_ANALYTICS_ENABLED: "false"
      SIGNOZ_STATSREPORTER_ENABLED: "false"
    ports: ["127.0.0.1:${SIGNOZ_PORT:-3301}:8080"]
    volumes: [signoz-data:/var/lib/signoz]
    networks: [default, house-signoz]
    depends_on:
      signoz-migrator-async: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v2/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30

  signoz-otel-collector:
    restart: unless-stopped
    image: *collector-image
    labels: { io.loams.licence: "AGPL-3.0-only" }
    entrypoint: ["/bin/sh", "-c"]
    command: ["/signoz-otel-collector migrate sync check && /signoz-otel-collector --config=/etc/otel-collector-config.yaml"]
    environment: *collector-env
    # Relative to the project directory, deploy/release (the first -f).
    volumes: [../factory/signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro]
    ports:
      - 127.0.0.1:${SIGNOZ_OTLP_GRPC_PORT:-4317}:4317
      - 127.0.0.1:${SIGNOZ_OTLP_HTTP_PORT:-4318}:4318
    networks: [default, house-signoz]
    depends_on:
      signoz-migrator-async: { condition: service_completed_successfully }

networks:
  # The House and SigNoz only, with no route out.
  house-signoz:
    internal: true

volumes:
  # SigNoz's metadata (users, dashboards, alerts): SQLite, the MIT build's only
  # metadata store. Telemetry is in the House.
  signoz-data:

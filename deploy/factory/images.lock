# The software factory's app images, pinned by digest (SF1 Task 2, design §39 D-SF-17).
# Each is the newest stable release at least 14 days old on `pinned_on`, tested end to end
# in Studio against the factory's adapters (PR #773). Licences are design §39 §4's.
# Test notes: Langfuse 4 needs ClickHouse 25.12 or newer (its compose pins 25.12) and
# takes traces over OTLP; Zulip 12 refuses plain HTTP that did not come through a
# TLS-terminating proxy; ItsAPlan's api and web are separate origins (Plane's App URL).
# Bump: pick the release, resolve its manifest-list digest, re-run the factory's
# end-to-end checks, then edit this file.

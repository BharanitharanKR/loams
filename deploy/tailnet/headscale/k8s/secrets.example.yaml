# Create the Secret from the shell instead of committing values:
#
#   kubectl -n headscale create secret generic headscale-env \
#     --from-literal=HEADSCALE_OIDC_CLIENT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=HEADSCALE_DERP_SERVER_IPV4=203.0.113.7 \
#     --from-literal=ACME_EMAIL=ops@loams.dev
#
#   kubectl -n headscale create secret generic headscale-backup \
#     --from-literal=BACKUP_BUCKET=... \
#     --from-literal=BACKUP_AGE_RECIPIENT=age1... \
#     --from-literal=RCLONE_CONFIG_BACKUP_TYPE=s3 \
#     --from-literal=RCLONE_CONFIG_BACKUP_PROVIDER=Cloudflare \
#     --from-literal=RCLONE_CONFIG_BACKUP_ENDPOINT=https://<account>.r2.cloudflarestorage.com \
#     --from-literal=RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID=... \
#     --from-literal=RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY=... \
#     --from-literal=RCLONE_CONFIG_BACKUP_REGION=auto \
#     --from-literal=RCLONE_CONFIG_BACKUP_NO_CHECK_BUCKET=true
#
# HEADSCALE_OIDC_CLIENT_SECRET is the `headscale` application's client secret in Zitadel.

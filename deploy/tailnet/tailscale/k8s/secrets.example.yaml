# Create out of band; never commit real values. Namespace: authentik.
#
# Tailscale (default; BYOK):
#   kubectl -n authentik create secret generic tailnet-auth \
#     --from-literal=TS_AUTHKEY='tskey-auth-...' \
#     --from-literal=TS_EXTRA_ARGS='--advertise-tags=tag:authentik'
#
# Headscale (the same Secret, with the login server added; configuration only):
#   kubectl -n authentik create secret generic tailnet-auth \
#     --from-literal=TS_AUTHKEY="$(hs preauthkeys create --tags tag:authentik --expiration 1h)" \
#     --from-literal=TS_EXTRA_ARGS='--login-server=https://headscale.loams.dev'
#   (no --advertise-tags: Headscale takes the tags from the tagged pre-auth key and
#   refuses a client-requested tag; checked 2026-10-02, v0.29.4)
#
# The auth key is used only on first registration (state then lives in the
# Secret tailscale-authentik-state, created by the pod).
apiVersion: v1
kind: Secret
metadata: {name: tailnet-auth, namespace: authentik}
type: Opaque
stringData:
  TS_AUTHKEY: ""
  TS_EXTRA_ARGS: "--advertise-tags=tag:authentik"

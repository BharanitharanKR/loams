# Keep Authentik's admin and user-settings interfaces and its management API off
# the public name auth.loams.dev. Sign-in, OIDC and the flows stay public.
#
# Dashboard-managed tunnel (the Authentik runbook's default): add two published
# application routes for auth.loams.dev, in this order, the first with the
# path below and service `HTTP Status: 404`, the second with no path and the
# service http://server:9000. Locally managed tunnel: replace ONLY the `ingress:`
# list of your existing config with the one below, and keep the `tunnel:` and
# `credentials-file:` settings already there (this file omits them).
#
# Paths are Go regular expressions, matched against the URL path.
ingress:
  - hostname: auth.loams.dev
    path: '^/(if/(admin|user)|api/v3/(admin|rbac|policies|propertymappings|providers|sources|stages|outposts|managed|crypto|events|blueprints|tasks|enterprise|tenants|core/(users|groups|tokens|applications|user_consent)|authenticators/admin))(/|$)'
    service: http_status:404
  - hostname: auth.loams.dev
    service: http://server:9000
  - service: http_status:404

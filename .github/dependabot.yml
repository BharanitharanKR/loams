version: 2
# CI volume (docs/ci/optimisation-2026-10.md): every Dependabot pull request
# runs the Rust and web tiers, and every automatic rebase runs them again.
# - Version updates come once a month (security updates are not scheduled:
#   they still open as soon as an advisory lands).
# - Each ecosystem's bumps come grouped: minor and patch in one pull request,
#   majors in another (after the lockstep groups, which match first).
# - No automatic rebases: comment `@dependabot rebase` on the pull request
#   when it is ready to merge.
updates:
  - package-ecosystem: cargo
    directory: /
    # Every update goes to dev; main moves only at a release merge.
    target-branch: dev
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    labels: ["area/ci", "status/needs-triage"]
    commit-message:
      prefix: "deps"
    groups:
      # The gix-* crates are pinned with `=` and move in lockstep (gix-hash,
      # gix-object, gix-pack, gix-diff, gix-blame and the rest): one bumped alone
      # does not compile (#934). Listed first, so every gix bump lands in one PR
      # of its own instead of in the weekly group.
      gix:
        patterns:
          - "gix-*"
      # Patch and minor bumps land together each week.
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
      # These move in lockstep (Lance pins DataFusion and Arrow), so a major
      # bump of one needs the others; review them as one PR.
      data-stack:
        patterns:
          - "arrow*"
          - "datafusion*"
          - "lance*"
          - "parquet"
        update-types: ["major"]
      # Every other major bump in one pull request a month, not one each.
      cargo-major:
        update-types: ["major"]
    ignore:
      # Git-pinned forks: bumped by hand with the fork (see Cargo.toml and NOTICE).
      - dependency-name: "resonate-*"
      - dependency-name: "tikv-client"
      # Pinned with `=` on purpose; bumped by hand with the matching tests.
      - dependency-name: "tantivy"
      - dependency-name: "qdrant-edge"
      - dependency-name: "openraft"
      # Major bumps that break compilation; do them by hand, together where noted.
      # arrow*/datafusion*: Lance 12 re-exports Arrow 58, so they move with Lance.
      - dependency-name: "arrow-array"
        update-types: ["version-update:semver-major"]
      - dependency-name: "arrow-schema"
        update-types: ["version-update:semver-major"]
      - dependency-name: "arrow-flight"
        update-types: ["version-update:semver-major"]
      - dependency-name: "datafusion*"
        update-types: ["version-update:semver-major"]
      # rand and rand_chacha 0.10 change the Rng traits and move together.
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand_chacha"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    labels: ["area/ci", "status/needs-triage"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # The root pnpm workspace (pnpm-workspace.yaml: web, plugins, SDKs, desktop).
  # Shared UI versions live in its `catalog:`; security pins in its `overrides:`.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    rebase-strategy: disabled
    # The 14-day rule (pnpm-workspace.yaml): only releases at least 14 days old.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["area/web", "status/needs-triage"]
    commit-message:
      prefix: "deps"
    groups:
      # vite, electron-vite, vitest and their plugins move together: vite 8 under
      # electron-vite 5 built a desktop whose window never opened (#811, #935).
      # A major bump of one is reviewed with the others', as the cargo data-stack
      # group does; minors and patches stay in the weekly group below.
      vite:
        patterns:
          - "vite"
          - "electron-vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"
        update-types: ["major"]
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
      # Every other major bump in one pull request a month, not one each.
      npm-major:
        update-types: ["major"]
    ignore:
      # @types/node tracks the Node version the repo targets (Node 22 in CI and
      # `engines`). Skip majors above 22; revisit when the Node target moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Dev-only client drivers for the sqlgate codec fixtures (SQ1 Task 3).
  - package-ecosystem: npm
    directory: /scripts/sqlgate/capture/node
    target-branch: dev
    schedule:
      interval: monthly
    rebase-strategy: disabled
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    labels: ["area/ci", "status/needs-triage"]
    commit-message:
      prefix: "deps"
    groups:
      sqlgate-capture-node:
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /scripts/sqlgate/capture/go
    target-branch: dev
    schedule:
      interval: monthly
    rebase-strategy: disabled
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    labels: ["area/ci", "status/needs-triage"]
    commit-message:
      prefix: "deps"
    groups:
      sqlgate-capture-go:
        update-types: ["minor", "patch"]

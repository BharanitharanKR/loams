# GT1 nightly (docs/plans/2026-10-10-gt1-loams-git.md, Task 11): the
# linearizability histories on 1024 seeds, and the bucket WAL bench in
# memory and on RustFS, and a million workspaces listed in pages (Task 23).
# The bench's JSON lines are kept as an artifact.
name: Git nightly

on:
  workflow_dispatch:

concurrency:
  group: git-nightly-${{ github.ref }}
  # The nightly runs to completion.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # CI builds are never debugged: no debug info in dev and test builds (smaller
  # caches, faster links; a panic still names its file and line) and no
  # incremental artifacts. rust-cache sets CARGO_INCREMENTAL=0 too; this covers
  # the jobs without it.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  loams-git-nightly:
    name: Seeds and bench
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gt1-loams-git
          save-if: false
      - name: RustFS
        run: scripts/git/rustfs.sh start | sed -n 's/^export //p' >> "$GITHUB_ENV"
      - name: linearizability (1024 seeds)
        env:
          LOAMS_GIT_LIN_SEEDS: "1024"
        run: cargo test -p loams-git --locked --test linearizable
      - name: store-backed suite
        run: cargo test -p loams-git --locked --test s3
      - name: a million workspaces (Task 23)
        env:
          LOAMS_GIT_WS_SCALE: "1000000"
        run: cargo test -p loams-git --locked --test ws_store million_workspaces_listing_pages
      - name: bench
        env:
          LOAMS_GIT_BENCH_S3: ${{ env.LOAMS_TEST_S3_URL }}
        run: scripts/git/bench.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: git-wal-bench
          path: bench/results/git-wal/
      - name: stop RustFS
        if: always()
        run: scripts/git/rustfs.sh stop || true

# NF1 (docs/plans/2026-10-09-nf1-neon-fork.md): Loams Postgres's names and pins.
#
# names (Task 1b, D823): no pre-rename name is left (the old crate, dev stack
# and fork URL; see scripts/nf1/check-names.sh).
#
# pins (Task 2): `pins.py check`, the pin file deploy/pins/loams-postgres-images.toml
# against every consumer generated from it, the audit file of each `mirror:`
# source, and no deployable reference to the private neon-archive packages;
# then test_pins.py. It runs on every PR, so on every one that touches the pin
# file or a consumer.
#
# verify (Task 12): verify-pins.sh, every pinned image Loams Postgres built is
# signed by loams-release.yml or loams-sign.yml on the fork's main, attested
# (provenance, SPDX SBOM with no forbidden licence) and, for a compute image,
# carries its sources; `mirror:` pins are skipped with a notice. Then
# test_verify_pins.sh (stub cosign, gh and oras).
#
# candidate (Task 16): test_candidate.py, the checks nf1-candidate.yml applies to
# a release candidate's pin document before Loams' integration runs on it.
#
# revs (Task 3): check-pinned-revs.sh, every ostrium-labs fork rev pinned by a
# Cargo.toml here is reachable from the fork's protected branch or carries a
# loams-* tag; then test_pinned_revs.py (its live half uses the job's token).
#
# mirror (Task 1): mirror-images.sh against a local registry, audit-image.sh on
# fixture `.dep-v0` payloads, and the README runbook order.
name: Postgres pins

# A pull request runs it (the checks above run on what the pull request
# changes); the nightly dispatches it on dev for the remote state (signatures,
# fork revisions), so a push to dev does not run it again. docs/ is skipped:
# check-names.sh ignores it and nothing here reads it.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

# Superseded runs of a pull request are cancelled; a push to main, a tag,
# a dispatch (the nightly) and a schedule run to completion. The event is in
# the group, so a push never cancels a dispatch on the same branch.
concurrency:
  group: nf1-pins-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # names, pins and revs in one job: one runner slot instead of three (the
  # org's concurrent-job limit is what queues pull requests). Every step runs,
  # so one failure does not hide another.
  checks:
    name: Names, pins and revisions
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check-names.sh and its tests
        if: ${{ !cancelled() }}
        run: scripts/nf1/tests/test_check_names.sh
      - name: pins.py check
        if: ${{ !cancelled() }}
        run: python3 -I scripts/nf1/pins.py check
      - name: test_pins.py
        if: ${{ !cancelled() }}
        run: python3 -I scripts/nf1/tests/test_pins.py
      - name: test_candidate.py (G3's candidate pins, Task 16)
        if: ${{ !cancelled() }}
        run: python3 -I scripts/nf1/tests/test_candidate.py
      - name: check-pinned-revs.sh
        if: ${{ !cancelled() }}
        run: scripts/nf1/check-pinned-revs.sh .
      - name: test_pinned_revs.py
        if: ${{ !cancelled() }}
        run: python3 -I scripts/nf1/tests/test_pinned_revs.py
      # cosign v3.0.6 and oras 1.3.1, for verify-pins.sh.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ !cancelled() }}
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        if: ${{ !cancelled() }}
      - name: verify-pins.sh
        if: ${{ !cancelled() }}
        run: scripts/nf1/verify-pins.sh
      - name: test_verify_pins.sh
        if: ${{ !cancelled() }}
        run: scripts/nf1/tests/test_verify_pins.sh

  # The slow job (it compiles rust-audit-info): only when the mirror scripts,
  # the pin file or this workflow change, and always on dispatch (the nightly).
  mirror-changes:
    name: Changed paths
    if: github.event_name == 'pull_request'
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mirror: ${{ steps.filter.outputs.mirror }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            mirror:
              - "scripts/nf1/**"
              - "deploy/pins/**"
              - ".github/workflows/nf1-pins.yml"

  mirror:
    name: Mirror and audit scripts
    needs: mirror-changes
    if: ${{ !cancelled() && (needs.mirror-changes.result == 'skipped' || needs.mirror-changes.outputs.mirror == 'true') }}
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    services:
      registry:
        # registry:3.0.0 (2026-01-28)
        image: docker.io/library/registry@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: skopeo and rust-audit-info
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q skopeo
          cargo install --locked rust-audit-info@0.5.4
      - name: test_mirror.py
        env:
          MIRROR_TEST_REGISTRY: localhost:5000
        run: python3 -I scripts/nf1/tests/test_mirror.py

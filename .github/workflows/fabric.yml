name: Connectors

# This workflow file is shared with FL1 (issue #209), which introduces the
# `fabric/` workspace; CN1 (issue #211, plan 2026-10-01-cn1-starred-connectors)
# adds the connector registry on top of it. Jobs owned by CN1:
#   connectors-unit  — fmt, clippy, tests and cargo-deny over `fabric/`
#   connectors-drift — the weekly network-dependent catalog drift checks
#   connect-routes   — declared, gated off until CN1 Task 12 lands
# Jobs owned by CN2 (plan 2026-10-10-cn2-connectors):
#   sdk-unit           — fmt, clippy and tests of `loams-connector-sdk` (Task 4)
#                        and `loams-connector-http`'s profile engine (Task 7)
#   conformance-kit    — fmt, clippy and tests of `loams-flow-conformance`
#                        (Task 6: the suites, systems.toml, the compose estate)
#   connectors-p2      — each family crate's suites against the open images of
#                        deploy/fabric/compose.yaml (profile connectors-p2),
#                        sharded by family, path-filtered per family crate
#   connectors-ci-only — the same against the `ci-service` images (profile
#                        connectors-ci-only; OR-3: CI only, never shipped)
#   connectors-nightly — scheduled: the suites against real cloud and SaaS
#                        accounts, with repository secrets (OR-3, OR-23)
#   connectors-alerts  — promtool rule tests of the connector alerts and the
#                        metrics/activity tests that run them (Task 24)
# Jobs FL1 owns and adds here separately: connectors-it (the ★ contract suites
# against the `connectors` compose profile, from CN1 Tasks 3–13), and the
# `fabric` workspace's own build/publish steps. Keep this file minimal and
# additive: a job belongs here once more than one plan needs it.
on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer dev head supersedes an older one; main runs to completion.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which parts of the tree a pull request, or a push to dev (against the
  # previous dev head), touches; the jobs below run there only when their filter
  # matches, and on a push to main or a dispatch (the nightly) they all run
  # (this job is skipped there). A draft pull request skips the connector
  # stacks until it is ready for review (or carries the `ci:full` label). dorny/paths-filter is MIT-licensed; pinned to
  # v4.0.3, as in ci.yml.
  changes:
    name: Changed paths
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
      # 'true' on a pull request into main: the full tier.
      full: ${{ github.base_ref == 'main' }}
      fabric: ${{ steps.filter.outputs.fabric }}
      drift: ${{ steps.filter.outputs.drift }}
      connect-routes: ${{ steps.filter.outputs.connect-routes }}
      sdk: ${{ steps.filter.outputs.sdk }}
      conformance: ${{ steps.filter.outputs.conformance }}
      # A JSON list of the families whose suites a pull request must run.
      families: ${{ steps.families.outputs.list }}
      alerts: ${{ steps.filter.outputs.alerts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            # Every Rust filter includes these.
            toolchain: &toolchain
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain*"
              - ".cargo/**"
              - ".github/workflows/fabric.yml"
            # The fabric/ workspace, the registry data and its drift scripts.
            # A new crate under fabric/crates/** is covered by fabric/**.
            fabric: &fabric
              - *toolchain
              - "fabric/**"
              - "connectors/**"
              - "scripts/connectors/**"
              # `loams-house-proto` generates from the root proto tree (HS1
              # Task 8), and `loams-house`'s registry test reads the reasons page.
              - "proto/loams/house/**"
              - "proto/loams/operations/**"
              - "proto/loams/options/**"
              - "proto/loams/errors/**"
              - "docs/api/reasons.md"
            # The generated appendix and the two scripts that check the Camel
            # and Kestra columns against their catalogs (design §33 CN-R1).
            drift:
              - *fabric
              - "docs/design/33-connectors.md"
            # `connect/` holds the generated Camel YAML routes for
            # `loams-connect` (design §33 §10, Q353). Declared for CN1 Task 12.
            connect-routes:
              - ".github/workflows/fabric.yml"
              - "connect/**"
              - "fabric/crates/loams-flow/**"
              - "fabric/crates/loams-fabric/**"
            # The connector SDK (CN2 Task 4) and the workspace files its build
            # reads.
            sdk:
              - *toolchain
              - "fabric/Cargo.toml"
              - "fabric/Cargo.lock"
              - "fabric/crates/loams-connector-sdk/**"
              - "fabric/crates/loams-connector-http/**"
              # Task 20: the SaaS suites read the profiles, their fixtures and
              # the import routes, through `loams-flow` and the kit.
              - "fabric/crates/loams-flow/**"
              - "fabric/crates/loams-flow-conformance/**"
              - "connectors/profiles/**"
              - "connectors/schema/profile.schema.json"
              - "connectors/routes/**"
              - "conformance/connectors/fixtures/**"
            # The conformance kit and the real-system estate (CN2 Task 6).
            # Every family's suites depend on all of it.
            conformance: &conformance
              - *toolchain
              - "fabric/Cargo.toml"
              - "fabric/Cargo.lock"
              - "fabric/crates/loams-connector-sdk/**"
              - "fabric/crates/loams-flow/**"
              - "fabric/crates/loams-flow-proto/**"
              - "fabric/crates/loams-flow-conformance/**"
              - "conformance/connectors/**"
              - "deploy/fabric/**"
              - "connectors/**"
            # One filter per family crate (OR-6): a change to one family runs
            # that family's shard only.
            family-http: [*conformance, "fabric/crates/loams-connector-http/**"]
            family-kafka: [*conformance, "fabric/crates/loams-connector-kafka/**"]
            family-postgres: [*conformance, "fabric/crates/loams-connector-postgres/**"]
            family-mysql: [*conformance, "fabric/crates/loams-connector-mysql/**"]
            family-sqlserver: [*conformance, "fabric/crates/loams-connector-sqlserver/**"]
            family-objects: [*conformance, "fabric/crates/loams-connector-objects/**"]
            family-kv: [*conformance, "fabric/crates/loams-connector-kv/**"]
            family-search: [*conformance, "fabric/crates/loams-connector-search/**"]
            family-mongodb: [*conformance, "fabric/crates/loams-connector-mongodb/**"]
            family-analytics: [*conformance, "fabric/crates/loams-connector-analytics/**"]
            family-lakehouse: [*conformance, "fabric/crates/loams-connector-lakehouse/**"]
            family-brokers: [*conformance, "fabric/crates/loams-connector-brokers/**"]
            family-cloud: [*conformance, "fabric/crates/loams-connector-cloud/**"]
            family-protocols: [*conformance, "fabric/crates/loams-connector-protocols/**"]
            # The connector alerts and dashboard (CN2 Task 24) and the code
            # that writes the series they read.
            alerts:
              - *toolchain
              - "fabric/Cargo.toml"
              - "fabric/Cargo.lock"
              - "fabric/crates/loams-connector-sdk/**"
              - "fabric/crates/loams-flow/**"
              - "deploy/observability/connectors/**"
      # The changed families, as a JSON list for the shards' matrices. A
      # shard whose family has no service in its stack, or no crate yet,
      # finishes at once (scripts/connectors/compose_services.py).
      - id: families
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          echo "list=$(jq -c '[.[] | select(startswith("family-")) | ltrimstr("family-")]' <<<"$CHANGES")" >> "$GITHUB_OUTPUT"

  # CN1 owns this job. FL1 owns the `lints_match_root` test that proves the
  # fabric workspace's lint table equals the root workspace's; it runs in FL1's
  # own job and is not repeated here.
  connectors-unit:
    name: "Fabric: fmt, clippy, tests and deny"
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.fabric == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The flow protos are compiled by build.rs, exactly as ci.yml's `check`
      # job does it for the root workspace.
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: fabric -> target
      - name: rustfmt
        working-directory: fabric
        run: cargo fmt --all --check
      - name: clippy
        working-directory: fabric
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        working-directory: fabric
        run: cargo test --workspace --locked
      # The licence gate for the fabric image (design §33 D359) reads
      # fabric/deny.toml; taiki-e/install-action is the pin ci.yml already uses.
      - uses: taiki-e/install-action@badb8c3638e0b773c6c17a6025c2306a8f1c4303 # nextest, 2026-10-02
        with:
          tool: cargo-deny
      - name: licenses, advisories, sources
        working-directory: fabric
        run: cargo deny check
      # CN2 Task 3's licence gate (design §33 D359; OR-3): no ci-service or
      # user-supplied component in an image Loams builds or the default compose
      # profile, and no denied or missing licence among the crates compiled into a
      # loams-connector-* family crate. Each runs its shared-fixture self-test first.
      # PyYAML reads the compose files (MIT; pinned here, unpinned in ci.yml).
      - name: PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check PyYAML==6.0.2
      - name: image licences (ci-service, user-supplied)
        run: |
          python3 scripts/connectors/image_licences.py --self-test
          python3 scripts/connectors/image_licences.py
      - name: family crate licences
        run: |
          python3 scripts/connectors/crate_licences.py --self-test
          python3 scripts/connectors/crate_licences.py
      # CN2 Task 7: every profile under connectors/profiles/ and every manifest's
      # runtime.profile (the same rules as loams-flow's `profile` module).
      - name: connector profiles
        run: python3 scripts/connectors/profiles.py --check

  # CN2 owns this job (plan 2026-10-10-cn2-connectors, Task 4): the connector
  # SDK alone, the crate every native connector family builds on. It needs no
  # protoc and no services (the in-memory Fabric and the reference connector
  # serve its tests), so it stays fast; `connectors-unit` covers the crate
  # again inside the whole workspace, with cargo-deny.
  sdk-unit:
    name: "Connector SDK: tests"
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.sdk == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # `loams-connector-http`'s SaaS suites (CN2 Task 20) load the real
      # profiles through `loams-flow` and replay fixtures through the
      # conformance kit, both of which link `loams-flow-proto`.
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: fabric -> target
          key: sdk-unit
      - name: rustfmt
        working-directory: fabric
        run: cargo fmt -p loams-connector-sdk -p loams-connector-http --check
      - name: clippy
        working-directory: fabric
        run: cargo clippy -p loams-connector-sdk -p loams-connector-http --all-targets --locked -- -D warnings
      - name: tests
        working-directory: fabric
        run: cargo test -p loams-connector-sdk -p loams-connector-http --locked

  # CN2 owns this job (Task 6): the conformance kit alone — its suites run
  # against the SDK's reference connector, and its estate tests read
  # conformance/connectors/systems.toml, deploy/fabric/compose.yaml and this
  # file. No services. It links `loams-flow`, hence protoc.
  conformance-kit:
    name: "Conformance kit: tests"
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.conformance == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: fabric -> target
          key: conformance-kit
      - name: rustfmt
        working-directory: fabric
        run: cargo fmt -p loams-flow-conformance --check
      - name: clippy
        working-directory: fabric
        run: cargo clippy -p loams-flow-conformance --all-targets --locked -- -D warnings
      - name: tests
        working-directory: fabric
        run: cargo test -p loams-flow-conformance --locked
      - name: the compose estate parses
        run: docker compose -f deploy/fabric/compose.yaml --profile connectors-p2 --profile connectors-ci-only config --quiet

  # CN2 Task 6: each family crate's suites against the open images of the
  # `connectors-p2` profile, one shard per family (OR-6). On a pull request
  # only the families it touches run; on a push and on demand, all of them.
  # A shard whose crate does not exist yet, or whose family has no service in
  # this stack, ends after checkout.
  connectors-p2:
    name: "Connectors: ${{ matrix.family }}"
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.outputs.full == 'true' && (needs.changes.outputs.families != '[]'))) && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.changes.result == 'success' && needs.changes.outputs.families || '["http","kafka","postgres","mysql","sqlserver","objects","kv","search","mongodb","analytics","lakehouse","brokers","cloud","protocols"]') }}
    env:
      FAMILY: ${{ matrix.family }}
      PROFILE: connectors-p2
    steps:
      - uses: actions/checkout@v7
      - name: the family's crate and services
        id: plan
        run: |
          docker compose -f deploy/fabric/compose.yaml --profile connectors-p2 --profile connectors-ci-only \
            config --format json > "$RUNNER_TEMP/compose.json"
          services=$(python3 scripts/connectors/compose_services.py \
            --profile "$PROFILE" --family "$FAMILY" --compose-json "$RUNNER_TEMP/compose.json")
          # The ★ Apache Kafka suite (CN2 Task 9; CN1's manifest has no
          # systems.toml entry until Task 8 ports it onto the SDK).
          if [ "$FAMILY" = kafka ]; then services="${services:+$services }kafka"; fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          if [ -d "fabric/crates/loams-connector-$FAMILY" ] && [ -n "$services" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to run: crate loams-connector-$FAMILY $( [ -d "fabric/crates/loams-connector-$FAMILY" ] && echo present || echo absent ), services '${services}'"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: protoc
        if: steps.plan.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.plan.outputs.run == 'true'
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: fabric -> target
          key: connectors-${{ matrix.family }}
      - name: build the family crate's tests
        if: steps.plan.outputs.run == 'true'
        working-directory: fabric
        run: cargo test -p "loams-connector-$FAMILY" --locked --no-run
      - name: up (${{ steps.plan.outputs.services }})
        if: steps.plan.outputs.run == 'true'
        run: |
          # shellcheck disable=SC2086 # the service list is space-separated on purpose
          docker compose -f deploy/fabric/compose.yaml --profile "$PROFILE" up -d --wait --wait-timeout 600 ${{ steps.plan.outputs.services }}
      # CN2 Task 13: buckets, the Azurite container and the SFTP host key.
      - name: objects endpoints and buckets
        if: steps.plan.outputs.run == 'true' && matrix.family == 'objects'
        run: scripts/connectors/objects_stack.sh
      # CN2 Task 17 (R17.7): the DuckDB target loads DuckDB's own shared
      # library by path from an allowlist with a SHA-256 check; Loams compiles
      # no DuckDB code. The analytics shard fetches the pinned release asset
      # (v1.5.6, 2026-09-28, MIT), checked against GitHub's recorded digest.
      - name: libduckdb (analytics)
        if: steps.plan.outputs.run == 'true' && matrix.family == 'analytics'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/libduckdb.zip" \
            https://github.com/duckdb/duckdb/releases/download/v1.5.6/libduckdb-linux-amd64.zip
          echo "b845005f5132a7d8180057c35e14a7626632258782f871a90861b19c1c03841b  $RUNNER_TEMP/libduckdb.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/libduckdb.zip" libduckdb.so -d "$RUNNER_TEMP/duckdb"
          echo "3f4962cdd266eab2b479a5b5a4a6d063d279b2954ae814ed00385d553b747633  $RUNNER_TEMP/duckdb/libduckdb.so" | sha256sum -c -
          echo "LOAMS_DUCKDB_DRIVER=$RUNNER_TEMP/duckdb/libduckdb.so" >> "$GITHUB_ENV"
          echo "LOAMS_DUCKDB_DRIVER_SHA256=3f4962cdd266eab2b479a5b5a4a6d063d279b2954ae814ed00385d553b747633" >> "$GITHUB_ENV"
      - name: suites
        if: steps.plan.outputs.run == 'true'
        working-directory: fabric
        env:
          LOAMS_CONNECTORS_P2_STACK: "1"
          # The Kafka family's ★ Apache Kafka suite (CN2 Task 9).
          LOAMS_CONNECTORS_STACK: ${{ matrix.family == 'kafka' && '1' || '' }}
        run: cargo test -p "loams-connector-$FAMILY" --locked
      - name: service logs
        if: failure() && steps.plan.outputs.run == 'true'
        run: docker compose -f deploy/fabric/compose.yaml --profile "$PROFILE" logs --no-color --tail 200
      - name: down
        if: always() && steps.plan.outputs.run == 'true'
        run: docker compose -f deploy/fabric/compose.yaml --profile "$PROFILE" down -v

  # CN2 Task 6, OR-3: the same against the `ci-service` images (proprietary,
  # source-available or under a EULA: Redpanda, the Azure emulators, SQL
  # Server, Oracle Free, CockroachDB, MongoDB, Redis 8, Splunk, the Pub/Sub
  # emulator). They run here only: never in an image Loams builds, never in
  # the default compose profile.
  connectors-ci-only:
    name: "Connectors: ${{ matrix.family }} (CI-only images)"
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.outputs.full == 'true' && (needs.changes.outputs.families != '[]'))) && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.changes.result == 'success' && needs.changes.outputs.families || '["http","kafka","postgres","mysql","sqlserver","objects","kv","search","mongodb","analytics","lakehouse","brokers","cloud","protocols"]') }}
    env:
      FAMILY: ${{ matrix.family }}
      PROFILE: connectors-ci-only
    steps:
      - uses: actions/checkout@v7
      - name: the family's crate and services
        id: plan
        run: |
          docker compose -f deploy/fabric/compose.yaml --profile connectors-p2 --profile connectors-ci-only \
            config --format json > "$RUNNER_TEMP/compose.json"
          services=$(python3 scripts/connectors/compose_services.py \
            --profile "$PROFILE" --family "$FAMILY" --compose-json "$RUNNER_TEMP/compose.json")
          echo "services=$services" >> "$GITHUB_OUTPUT"
          if [ -d "fabric/crates/loams-connector-$FAMILY" ] && [ -n "$services" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to run: crate loams-connector-$FAMILY $( [ -d "fabric/crates/loams-connector-$FAMILY" ] && echo present || echo absent ), services '${services}'"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: protoc
        if: steps.plan.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.plan.outputs.run == 'true'
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: fabric -> target
          key: connectors-${{ matrix.family }}
      - name: build the family crate's tests
        if: steps.plan.outputs.run == 'true'
        working-directory: fabric
        run: cargo test -p "loams-connector-$FAMILY" --locked --no-run
      - name: up (${{ steps.plan.outputs.services }})
        if: steps.plan.outputs.run == 'true'
        run: |
          # shellcheck disable=SC2086 # the service list is space-separated on purpose
          docker compose -f deploy/fabric/compose.yaml --profile "$PROFILE" up -d --wait --wait-timeout 900 ${{ steps.plan.outputs.services }}
      # The Event Hubs emulator has no health check (CN2 Task 9).
      - name: wait for the Event Hubs emulator
        if: steps.plan.outputs.run == 'true' && contains(steps.plan.outputs.services, 'eventhubs')
        run: |
          for _ in $(seq 1 90); do
            if docker compose -f deploy/fabric/compose.yaml --profile "$PROFILE" logs eventhubs 2>&1 | grep -q "Emulator Service is Successfully Up"; then exit 0; fi
            sleep 2
          done
          echo "the Event Hubs emulator did not come up"; exit 1
      - name: suites
        if: steps.plan.outputs.run == 'true'
        working-directory: fabric
        env:
          LOAMS_CONNECTORS_CI_ONLY_STACK: "1"
        run: cargo test -p "loams-connector-$FAMILY" --locked
      - name: service logs
        if: failure() && steps.plan.outputs.run == 'true'
        run: docker compose -f deploy/fabric/compose.yaml --profile "$PROFILE" logs --no-color --tail 200
      - name: down
        if: always() && steps.plan.outputs.run == 'true'
        run: docker compose -f deploy/fabric/compose.yaml --profile "$PROFILE" down -v

  # CN2 Task 6, OR-3 and OR-23: every family's suites against real cloud and
  # SaaS accounts, daily, with the repository secrets `systems.toml` names
  # (`kind = "nightly"`). Both compose stacks are up as well, so a nightly is
  # the full suite. A suite whose secrets are not configured is skipped, and a
  # skipped suite never counts toward `stable` (14 consecutive green
  # nightlies). `nightly_secrets_are_wired_into_the_nightly_job` keeps the env
  # block below in step with systems.toml.
  connectors-nightly:
    name: "Connectors: ${{ matrix.family }} (nightly)"
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family: [http, kafka, postgres, mysql, sqlserver, objects, kv, search, mongodb, analytics, lakehouse, brokers, cloud, protocols]
    env:
      FAMILY: ${{ matrix.family }}
      LOAMS_ADLS_ACCOUNT: ${{ secrets.LOAMS_ADLS_ACCOUNT }}
      LOAMS_ADLS_KEY: ${{ secrets.LOAMS_ADLS_KEY }}
      LOAMS_AMAZON_OPENSEARCH_URL: ${{ secrets.LOAMS_AMAZON_OPENSEARCH_URL }}
      LOAMS_ANTHROPIC_API_KEY: ${{ secrets.LOAMS_ANTHROPIC_API_KEY }}
      LOAMS_AURORA_MYSQL_URL: ${{ secrets.LOAMS_AURORA_MYSQL_URL }}
      LOAMS_AURORA_POSTGRES_URL: ${{ secrets.LOAMS_AURORA_POSTGRES_URL }}
      LOAMS_AWS_ACCESS_KEY_ID: ${{ secrets.LOAMS_AWS_ACCESS_KEY_ID }}
      LOAMS_AWS_REGION: ${{ secrets.LOAMS_AWS_REGION }}
      LOAMS_AWS_SECRET_ACCESS_KEY: ${{ secrets.LOAMS_AWS_SECRET_ACCESS_KEY }}
      LOAMS_AZURE_FUNCTIONS_KEY: ${{ secrets.LOAMS_AZURE_FUNCTIONS_KEY }}
      LOAMS_AZURE_FUNCTIONS_URL: ${{ secrets.LOAMS_AZURE_FUNCTIONS_URL }}
      LOAMS_AZURE_SQL_URL: ${{ secrets.LOAMS_AZURE_SQL_URL }}
      LOAMS_AZURE_STORAGE_ACCOUNT: ${{ secrets.LOAMS_AZURE_STORAGE_ACCOUNT }}
      LOAMS_AZURE_STORAGE_KEY: ${{ secrets.LOAMS_AZURE_STORAGE_KEY }}
      LOAMS_CLOUD_RUN_URL: ${{ secrets.LOAMS_CLOUD_RUN_URL }}
      LOAMS_DATABRICKS_HOST: ${{ secrets.LOAMS_DATABRICKS_HOST }}
      LOAMS_DATABRICKS_TOKEN: ${{ secrets.LOAMS_DATABRICKS_TOKEN }}
      LOAMS_DATABRICKS_WAREHOUSE_ID: ${{ secrets.LOAMS_DATABRICKS_WAREHOUSE_ID }}
      LOAMS_DELTA_TABLE_URI: ${{ secrets.LOAMS_DELTA_TABLE_URI }}
      LOAMS_EVENTGRID_ENDPOINT: ${{ secrets.LOAMS_EVENTGRID_ENDPOINT }}
      LOAMS_EVENTGRID_KEY: ${{ secrets.LOAMS_EVENTGRID_KEY }}
      LOAMS_EVENTHUBS_CONNECTION_STRING: ${{ secrets.LOAMS_EVENTHUBS_CONNECTION_STRING }}
      LOAMS_EVENTHUBS_NAMESPACE: ${{ secrets.LOAMS_EVENTHUBS_NAMESPACE }}
      LOAMS_GCP_CREDENTIALS_JSON: ${{ secrets.LOAMS_GCP_CREDENTIALS_JSON }}
      LOAMS_GCP_PROJECT: ${{ secrets.LOAMS_GCP_PROJECT }}
      LOAMS_GCS_BUCKET: ${{ secrets.LOAMS_GCS_BUCKET }}
      LOAMS_GITHUB_TOKEN: ${{ secrets.LOAMS_GITHUB_TOKEN }}
      LOAMS_GITLAB_TOKEN: ${{ secrets.LOAMS_GITLAB_TOKEN }}
      LOAMS_GOOGLE_WORKSPACE_CREDENTIALS_JSON: ${{ secrets.LOAMS_GOOGLE_WORKSPACE_CREDENTIALS_JSON }}
      LOAMS_GRAFEO_API_KEY: ${{ secrets.LOAMS_GRAFEO_API_KEY }}
      LOAMS_GRAFEO_GRAPH: ${{ secrets.LOAMS_GRAFEO_GRAPH }}
      LOAMS_GRAFEO_NAMESPACE: ${{ secrets.LOAMS_GRAFEO_NAMESPACE }}
      LOAMS_GRAFEO_URL: ${{ secrets.LOAMS_GRAFEO_URL }}
      LOAMS_HUBSPOT_TOKEN: ${{ secrets.LOAMS_HUBSPOT_TOKEN }}
      LOAMS_JIRA_SITE: ${{ secrets.LOAMS_JIRA_SITE }}
      LOAMS_JIRA_TOKEN: ${{ secrets.LOAMS_JIRA_TOKEN }}
      LOAMS_JIRA_USER: ${{ secrets.LOAMS_JIRA_USER }}
      LOAMS_OPENAI_API_KEY: ${{ secrets.LOAMS_OPENAI_API_KEY }}
      LOAMS_POSTHOG_API_KEY: ${{ secrets.LOAMS_POSTHOG_API_KEY }}
      LOAMS_POSTHOG_HOST: ${{ secrets.LOAMS_POSTHOG_HOST }}
      LOAMS_R2_ACCESS_KEY_ID: ${{ secrets.LOAMS_R2_ACCESS_KEY_ID }}
      LOAMS_R2_ACCOUNT_ID: ${{ secrets.LOAMS_R2_ACCOUNT_ID }}
      LOAMS_R2_BUCKET: ${{ secrets.LOAMS_R2_BUCKET }}
      LOAMS_R2_SECRET_ACCESS_KEY: ${{ secrets.LOAMS_R2_SECRET_ACCESS_KEY }}
      LOAMS_REDPANDA_BROKERS: ${{ secrets.LOAMS_REDPANDA_BROKERS }}
      LOAMS_REDPANDA_SASL_PASSWORD: ${{ secrets.LOAMS_REDPANDA_SASL_PASSWORD }}
      LOAMS_REDPANDA_SASL_USERNAME: ${{ secrets.LOAMS_REDPANDA_SASL_USERNAME }}
      LOAMS_REDSHIFT_DATABASE: ${{ secrets.LOAMS_REDSHIFT_DATABASE }}
      LOAMS_REDSHIFT_IAM_ROLE: ${{ secrets.LOAMS_REDSHIFT_IAM_ROLE }}
      LOAMS_REDSHIFT_SINK_TABLE: ${{ secrets.LOAMS_REDSHIFT_SINK_TABLE }}
      LOAMS_REDSHIFT_UNLOAD_URI: ${{ secrets.LOAMS_REDSHIFT_UNLOAD_URI }}
      LOAMS_REDSHIFT_WORKGROUP: ${{ secrets.LOAMS_REDSHIFT_WORKGROUP }}
      LOAMS_SALESFORCE_CLIENT_ID: ${{ secrets.LOAMS_SALESFORCE_CLIENT_ID }}
      LOAMS_SALESFORCE_CLIENT_SECRET: ${{ secrets.LOAMS_SALESFORCE_CLIENT_SECRET }}
      LOAMS_SALESFORCE_INSTANCE_URL: ${{ secrets.LOAMS_SALESFORCE_INSTANCE_URL }}
      LOAMS_SEGMENT_WRITE_KEY: ${{ secrets.LOAMS_SEGMENT_WRITE_KEY }}
      LOAMS_SENDGRID_API_KEY: ${{ secrets.LOAMS_SENDGRID_API_KEY }}
      LOAMS_SERVICEBUS_CONNECTION_STRING: ${{ secrets.LOAMS_SERVICEBUS_CONNECTION_STRING }}
      LOAMS_SERVICENOW_INSTANCE: ${{ secrets.LOAMS_SERVICENOW_INSTANCE }}
      LOAMS_SERVICENOW_PASSWORD: ${{ secrets.LOAMS_SERVICENOW_PASSWORD }}
      LOAMS_SERVICENOW_USER: ${{ secrets.LOAMS_SERVICENOW_USER }}
      LOAMS_SHOPIFY_SHOP: ${{ secrets.LOAMS_SHOPIFY_SHOP }}
      LOAMS_SHOPIFY_TOKEN: ${{ secrets.LOAMS_SHOPIFY_TOKEN }}
      LOAMS_SLACK_BOT_TOKEN: ${{ secrets.LOAMS_SLACK_BOT_TOKEN }}
      LOAMS_SLACK_SIGNING_SECRET: ${{ secrets.LOAMS_SLACK_SIGNING_SECRET }}
      LOAMS_STRIPE_API_KEY: ${{ secrets.LOAMS_STRIPE_API_KEY }}
      LOAMS_TWILIO_ACCOUNT_SID: ${{ secrets.LOAMS_TWILIO_ACCOUNT_SID }}
      LOAMS_TWILIO_AUTH_TOKEN: ${{ secrets.LOAMS_TWILIO_AUTH_TOKEN }}
      LOAMS_ZENDESK_SUBDOMAIN: ${{ secrets.LOAMS_ZENDESK_SUBDOMAIN }}
      LOAMS_ZENDESK_TOKEN: ${{ secrets.LOAMS_ZENDESK_TOKEN }}
      LOAMS_ZENDESK_USER: ${{ secrets.LOAMS_ZENDESK_USER }}
      # CN2 Task 13: the objects family's nightly suites read these names, and
      # run only when LOAMS_CONNECTORS_NIGHTLY is set.
      LOAMS_ADLS_ACCESS_KEY: ${{ secrets.LOAMS_ADLS_ACCESS_KEY }}
      LOAMS_ADLS_FILESYSTEM: ${{ secrets.LOAMS_ADLS_FILESYSTEM }}
      LOAMS_AZURE_ACCESS_KEY: ${{ secrets.LOAMS_AZURE_ACCESS_KEY }}
      LOAMS_AZURE_ACCOUNT: ${{ secrets.LOAMS_AZURE_ACCOUNT }}
      LOAMS_AZURE_CONTAINER: ${{ secrets.LOAMS_AZURE_CONTAINER }}
      LOAMS_GCS_SERVICE_ACCOUNT_KEY: ${{ secrets.LOAMS_GCS_SERVICE_ACCOUNT_KEY }}
      LOAMS_R2_ENDPOINT: ${{ secrets.LOAMS_R2_ENDPOINT }}
      LOAMS_CONNECTORS_NIGHTLY: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: the family's crate and services
        id: plan
        run: |
          if [ ! -d "fabric/crates/loams-connector-$FAMILY" ]; then
            echo "nothing to run: crate loams-connector-$FAMILY absent"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker compose -f deploy/fabric/compose.yaml --profile connectors-p2 --profile connectors-ci-only \
            config --format json > "$RUNNER_TEMP/compose.json"
          for p in connectors-p2 connectors-ci-only; do
            echo "${p//-/_}=$(python3 scripts/connectors/compose_services.py \
              --profile "$p" --family "$FAMILY" --compose-json "$RUNNER_TEMP/compose.json")" >> "$GITHUB_OUTPUT"
          done
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: protoc
        if: steps.plan.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.plan.outputs.run == 'true'
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: fabric -> target
          key: connectors-${{ matrix.family }}
      - name: up
        if: steps.plan.outputs.run == 'true'
        run: |
          # shellcheck disable=SC2086 # the service lists are space-separated on purpose
          services="${{ steps.plan.outputs.connectors_p2 }} ${{ steps.plan.outputs.connectors_ci_only }}"
          if [ -n "${services// /}" ]; then
            docker compose -f deploy/fabric/compose.yaml --profile connectors-p2 --profile connectors-ci-only \
              up -d --wait --wait-timeout 900 $services
          fi
      - name: objects endpoints and buckets
        if: steps.plan.outputs.run == 'true' && matrix.family == 'objects'
        run: scripts/connectors/objects_stack.sh
      - name: suites
        if: steps.plan.outputs.run == 'true'
        working-directory: fabric
        env:
          LOAMS_CONNECTORS_P2_STACK: "1"
          LOAMS_CONNECTORS_CI_ONLY_STACK: "1"
        run: cargo test -p "loams-connector-$FAMILY" --locked
      - name: down
        if: always() && steps.plan.outputs.run == 'true'
        run: docker compose -f deploy/fabric/compose.yaml --profile connectors-p2 --profile connectors-ci-only down -v

  # CN2 owns this job (plan 2026-10-10-cn2-connectors, Task 24): every alert in
  # deploy/observability/connectors/alerts.yaml must fire in a promtool rule
  # test. promtool comes from the Prometheus 3.5.0 release (Apache-2.0, LTS,
  # 2025-07-14), checked against its published SHA-256. The Rust test
  # `each_alert_fires_in_a_test` runs the same rule tests through
  # LOAMS_PROMTOOL, beside the label and activity-observer tests.
  connectors-alerts:
    name: "Connectors: alerts and activity"
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.outputs.full == 'true' && (needs.changes.outputs.alerts == 'true'))) }}
    runs-on: ubuntu-24.04
    env:
      PROMETHEUS_VERSION: "3.5.0"
      PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: promtool
        run: |
          dir="$RUNNER_TEMP/prometheus"
          mkdir -p "$dir"
          curl -sSfL --retry 3 -o "$dir/p.tgz" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  $dir/p.tgz" | sha256sum -c -
          tar -xzf "$dir/p.tgz" -C "$dir" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "LOAMS_PROMTOOL=$dir/promtool" >> "$GITHUB_ENV"
      - name: promtool check and test rules
        run: |
          "$LOAMS_PROMTOOL" check rules deploy/observability/connectors/alerts.yaml
          "$LOAMS_PROMTOOL" test rules deploy/observability/connectors/alerts.test.yaml
      # loams-flow builds loams-flow-proto, which needs protoc.
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: fabric -> target
          key: connectors-alerts
      - name: metrics and activity tests
        working-directory: fabric
        run: cargo test -p loams-flow --test activity --locked

  # CN1 Task 2's drift checks (design §33 CN-R1): the appendix is regenerated
  # from connectors/registry/catalog.csv and diffed against the design doc, and
  # the Camel and Kestra columns are checked against those projects' own
  # catalogs. Both catalog checks need the network, so this runs on the weekly
  # schedule and on demand only, and each script skips cleanly when its catalog
  # is not there.
  connectors-drift:
    name: "Connectors: catalog drift"
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    env:
      # A literal path under the runner's temp directory, not `runner.temp` and
      # not `env.RUNNER_TEMP`: neither context is available in a job-level `env:`
      # block. Referencing one made GitHub reject the whole file at parse time,
      # so all 93 runs of this workflow since it was added failed with zero jobs
      # created and nothing ever reported a cause. The path is fixed per step
      # below rather than interpolated here.
      CATALOG_DIR: /tmp/connector-drift
      # Apache Camel 4.22.1 (Apache-2.0), the version design §33 §5 records and
      # CN1 Task 0 pins. Apache-2.0, so the D359 licence gate is satisfied.
      CAMEL_CATALOG_URL: https://repo1.maven.org/maven2/org/apache/camel/camel-catalog/4.22.1/camel-catalog-4.22.1.jar
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Each catalog is best-effort: Maven Central or the GitHub API being down
      # must not fail the run, so the step continues and the script skips.
      - name: camel-catalog 4.22.1
        continue-on-error: true
        run: |
          mkdir -p "$CATALOG_DIR"
          curl -sSfL --retry 3 -o "$CATALOG_DIR/camel-catalog-4.22.1.jar" "$CAMEL_CATALOG_URL"
      - name: kestra-io plugin repositories
        continue-on-error: true
        run: gh repo list kestra-io --limit 1000 --json name --jq '.[].name' > "$CATALOG_DIR/kestra-repos.txt"
      - name: point the scripts at what downloaded
        run: |
          if [ -f "$CATALOG_DIR/camel-catalog-4.22.1.jar" ]; then
            echo "LOAMS_CAMEL_CATALOG=$CATALOG_DIR/camel-catalog-4.22.1.jar" >> "$GITHUB_ENV"
          else
            echo "camel-catalog did not download; camel_catalog.py will skip"
          fi
          if [ -s "$CATALOG_DIR/kestra-repos.txt" ]; then
            echo "LOAMS_KESTRA_REPOS=$CATALOG_DIR/kestra-repos.txt" >> "$GITHUB_ENV"
          else
            echo "the kestra-io repository list is empty; kestra_catalog.py will skip"
          fi
      - name: the appendix matches connectors/registry/catalog.csv
        run: |
          python3 scripts/connectors/matrix.py --check \
            --json "$CATALOG_DIR/matrix.json"
      - name: the Camel column against camel-catalog
        run: |
          # --tag pins the module tree to the same Camel version as the jar above.
          # --check is also what lets the script read that tree from the GitHub
          # API (components/* and the group sub-module directories); with no
          # catalog and no --check it would skip instead of spending the calls.
          python3 scripts/connectors/camel_catalog.py --check --tag 4.22.1 \
            --json "$CATALOG_DIR/camel-catalog.json"
      - name: the Kestra column against the kestra-io repositories
        run: |
          python3 scripts/connectors/kestra_catalog.py --check \
            --json "$CATALOG_DIR/kestra-catalog.json"
      # The summaries, so a drift finding can be read after the fact without
      # re-running the checks. actions/upload-artifact is Apache-2.0.
      - name: the drift summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connector-catalog-drift
          path: ${{ env.CATALOG_DIR }}/*.json
          if-no-files-found: ignore

  # CN1 Task 12 adds `loams-connect` and its generated Camel YAML routes under
  # `connect/`, and this job validates them (`camel validate`, the rendered-route
  # YAML-DSL test). Until then the filter has no consumer, so the job is
  # declared and switched off rather than written as an empty shell: Loams
  # writes no Java (owner, 2026-10-01), so there is nothing to build here yet.
  connect-routes:
    name: "Connect: routes"
    needs: changes
    if: false
    runs-on: ubuntu-24.04
    steps:
      # Replaced by CN1 Task 12: checkout, a Camel JBang `camel validate` over
      # connect/routes/**/*.yaml, and `rendered_routes_are_valid_yaml_dsl`.
      - name: not implemented yet (CN1 Task 12)
        run: echo "connect-routes is declared for CN1 Task 12 and is switched off"

  # One check for branch protection: it passes when every job this event
  # selected passed and the rest were skipped (as ci.yml's `CI required`).
  # The nightly suites against real accounts and the weekly drift scripts are
  # not in it: they run on the schedule, not on a pull request.
  required:
    name: Connectors required
    if: always()
    needs:
      - changes
      - connectors-unit
      - sdk-unit
      - conformance-kit
      - connectors-p2
      - connectors-ci-only
      - connectors-alerts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all selected fabric jobs to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' <<< "$NEEDS_JSON"; then
            echo "A fabric job failed or was cancelled" >&2
            exit 1
          fi

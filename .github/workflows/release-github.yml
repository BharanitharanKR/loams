name: Release GitHub

# The second half of a preview release. "Release images" (release-images.yml)
# builds deploy/release/Containerfile.<name> on a v* tag and publishes
# ghcr.io/ostrium-labs/<name>:<version> and :preview for linux/amd64 and
# linux/arm64. When it succeeds, this workflow:
#
#   1. resolves each published :<version> manifest list to its digest,
#   2. attests an SPDX SBOM for it (anchore/sbom-action + actions/attest-sbom),
#      pushed to the registry next to the image. Build provenance is attested
#      by release-images.yml itself, in the tag's run, so it names the tag's
#      commit; a workflow_run's token would name the default branch's,
#   3. creates the GitHub release as a pre-release (never "Latest") and attaches
#      the compose bundle (deploy/release plus the Postgres stack it includes,
#      with the console built from the tag in release/console/dist), the SBOMs
#      and SHA256SUMS,
#   4. dispatches the binary builds that attach to that release:
#      release-package.yml (the `loams` CLI for Linux, Windows and macOS) and
#      desktop-electron-release.yml (Loams Desktop for all three). A release
#      created with this workflow's token raises no `release: published` event,
#      so without this step neither would run (v0.1.0-preview.1 had to be
#      packaged by hand).
#
# A tag such as v0.1.0-preview.1 gives images :0.1.0-preview.1 and :preview
# (never :latest) and a pre-release on GitHub, also when the release already
# existed. A tag with no `-` (v0.1.0) gives :0.1.0, :0.1 and :latest and a
# normal, "Latest" release. release-images.yml owns the tags and
# scripts/release/channel.sh the rule.
# This workflow pushes no image and moves no tag; it only adds attestations.
on:
  workflow_run:
    workflows: ["Release images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z(-pre) tag whose published images to attest and release."
        required: true

permissions: {}

concurrency:
  group: release-github-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/ostrium-labs

jobs:
  guard:
    name: Tag guard
    # A tag push's workflow_run carries the tag in head_branch; a branch run of
    # "Release images" (there is none today) is not a release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      version: ${{ steps.guard.outputs.version }}
      sha: ${{ steps.guard.outputs.sha }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      latest_flag: ${{ steps.channel.outputs.latest_flag }}
      title: ${{ steps.channel.outputs.title }}
      alias_note: ${{ steps.channel.outputs.alias_note }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: the tag is a vX.Y.Z(-pre) tag on the default branch
        id: guard
        env:
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "$TAG is not a vX.Y.Z(-pre) tag"; exit 1
          fi
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}") \
            || { echo "$TAG has no commit in this repository"; exit 1; }
          if [ -n "$RUN_SHA" ] && [ "$RUN_SHA" != "$sha" ]; then
            echo "$TAG is at $sha but the image build ran at $RUN_SHA; refusing"; exit 1
          fi
          git merge-base --is-ancestor "$sha" "origin/$DEFAULT_BRANCH" \
            || { echo "$TAG is not on $DEFAULT_BRANCH; refusing to release from anywhere else"; exit 1; }
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "$TAG at $sha"
      # No `-` in the version: a normal release and "Latest". A `-preview.N` or
      # `-rc.N`: a pre-release, never "Latest". scripts/release/channel.sh owns the rule.
      - name: the release channel
        id: channel
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: scripts/release/channel.sh "$VERSION" | tee -a "$GITHUB_OUTPUT"

  attest:
    name: Provenance and SBOM (${{ matrix.image }})
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [loams, loams-fabric, loams-agentd, loams-pg-control]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the published manifest list's digest
        id: manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "no digest for $IMAGE:$VERSION"; exit 1; }
          # The rolling tag (:preview, or :latest for a stable release) must be
          # this release; release-images.yml moved it.
          rolling=preview; [[ "$VERSION" == *-* ]] || rolling=latest
          moved=$(docker buildx imagetools inspect "$IMAGE:$rolling" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$moved" = "$digest" ] || echo "::warning::$IMAGE:$rolling is $moved, not $VERSION ($digest): a newer tag moved it"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/${{ matrix.image }}-${{ needs.guard.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM attestation (attested to the registry)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/${{ matrix.image }}-${{ needs.guard.outputs.version }}.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}-${{ needs.guard.outputs.version }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  # The console the compose bundle's `--profile console` service serves (#868).
  # In the repository deploy/release/console/dist is a placeholder page, and
  # release-package.yml's console build is dispatched only after the release
  # exists, so the bundle cannot take it. Built here from the tag's commit, in
  # a job that can only read; the release job below takes it as an artifact
  # (static files, copied as data, never run).
  console:
    name: The web console (compose bundle)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      # No dependency cache: this build ships in the release, and a cache
      # another run wrote could change it (cache poisoning).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # release-package.yml's build, for the root path: the compose service's
      # nginx serves the build at / and its runtime configuration at
      # /config.json (deploy/release/console/default.conf.template). The
      # default build is the engine's, for /ui/ (web/README.md); behind that
      # nginx its pages would not find their scripts.
      - name: build the console
        env:
          LOAMS_UI_BASE: /
        run: |
          set -euo pipefail
          cd web
          pnpm install --frozen-lockfile
          pnpm build
      - name: the build is the console, for the root path
        run: |
          set -euo pipefail
          index=web/apps/console/dist/index.html
          test -f "$index" || { echo "::error::$index is missing after pnpm build"; exit 1; }
          if grep -q 'Put the built console here' "$index"; then
            echo "::error::$index is the placeholder page, not a built console"; exit 1
          fi
          if grep -q '"/ui/' "$index"; then
            echo "::error::$index was built for /ui/; the compose console service serves it at /"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-dist
          path: web/apps/console/dist
          if-no-files-found: error
          retention-days: 7

  # The compose bundle: deploy/release and the Postgres stack its compose file
  # includes (deploy/loams-postgres-dev), in the layout byoc/install.sh copies
  # to a VM, with .env.example pinned to this release's image tag and
  # release/console/dist holding the console job's build.
  release:
    name: GitHub release and assets
    needs: [guard, attest, console]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      # false when a person had already published the release: that raised
      # `release: published`, which started release-package.yml already.
      # desktop-electron-release.yml has no release trigger, so it is always dispatched.
      dispatch_cli: ${{ steps.publish.outputs.dispatch_cli }}
    steps:
      # No checkout: this job holds contents: write, so it never puts the
      # tag's tree where a later step could run it. The bundle is the commit's
      # tarball from the API, unpacked as data (two directories, no scripts run).
      # The built console comes the same way, as the console job's artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      # Outside assets/: everything there is attached to the release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: the compose bundle
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.guard.outputs.sha }}
          VERSION: ${{ needs.guard.outputs.version }}
          OUT: ${{ runner.temp }}/assets
          CONSOLE: ${{ runner.temp }}/console
        run: |
          set -euo pipefail
          name="loams-compose-$VERSION"
          stage="$RUNNER_TEMP/$name"
          src="$RUNNER_TEMP/src"
          mkdir -p "$stage" "$src"
          # Tracked files only (the API's tarball is git archive), so no local
          # .env or secret can be in it. Its top directory is <repo>-<sha>.
          gh api "repos/$GITHUB_REPOSITORY/tarball/$SHA" > "$RUNNER_TEMP/src.tar.gz"
          tar -xzf "$RUNNER_TEMP/src.tar.gz" -C "$src" --strip-components=1 \
            --wildcards '*/deploy/release' '*/deploy/loams-postgres-dev' \
            '*/release/upgrade-path.toml' '*/scripts/release/upgrade_path.py'
          test -f "$src/deploy/release/compose.yaml" || { echo "deploy/release/compose.yaml is missing at this tag"; exit 1; }
          cp -a "$src/deploy/release" "$src/deploy/loams-postgres-dev" "$stage/"
          # The release train (design §54 §11.2): the bundle carries it, and
          # loams-upgrade-<version>.json is the release manifest's `upgrade`
          # object (the CLI checks it against SHA256SUMS until the signed
          # manifest of CLI2 exists).
          if [ -f "$src/release/upgrade-path.toml" ]; then
            cp "$src/release/upgrade-path.toml" "$stage/upgrade-path.toml"
            python3 "$src/scripts/release/upgrade_path.py" manifest "$VERSION" --root "$src" \
              > "$OUT/loams-upgrade-$VERSION.json"
          fi
          mtime=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" -q .commit.committer.date)
          # The images are published by release-images.yml; the bundle only runs them.
          rm -f "$stage"/release/Containerfile.* "$stage/release/build.sh"
          if [ -f "$stage/release/.env.example" ]; then
            sed -i "s/^LOAMS_VERSION=.*/LOAMS_VERSION=$VERSION/" "$stage/release/.env.example"
          fi
          # The built console replaces the placeholder page (#868). With no
          # build the bundle is refused, not shipped with a warning: it is the
          # documented install path, its name does not say which console it
          # holds, and a warning in this run reaches no one who downloads it.
          test -f "$CONSOLE/index.html" \
            || { echo "::error::the console-dist artifact has no index.html; refusing to ship the placeholder console"; exit 1; }
          rm -rf "$stage/release/console/dist"
          mkdir -p "$stage/release/console"
          cp -R "$CONSOLE" "$stage/release/console/dist"
          if grep -q 'Put the built console here' "$stage/release/console/dist/index.html"; then
            echo "::error::release/console/dist/index.html in the bundle is still the placeholder page"; exit 1
          fi
          # First-run checks on the staged bundle (#870, #871), so a bundle that
          # cannot finish first-run setup does not ship. `compose config` only
          # resolves the files (it runs nothing); the checks name no version.
          # - the engine reads config/setup-token.env, the file is in the bundle,
          #   and a LOAMS_SETUP_TOKEN set for compose reaches the engine;
          # - every file the stack mounts or reads as an env_file from inside
          #   the bundle is in it (secrets/ is the user's, so it is skipped);
          # - when the Postgres stack's compute1 is in it, it starts after the
          #   one-shot pg-bootstrap that creates its tenant and timeline.
          cfg=$(cd "$stage/release" && docker compose --env-file .env.example --profile '*' \
            config --no-env-resolution --format json)
          test -f "$stage/release/config/setup-token.env" \
            || { echo "release/config/setup-token.env is missing from the bundle"; exit 1; }
          grep -q '^LOAMS_SETUP_TOKEN=' "$stage/release/config/setup-token.env" \
            || { echo "release/config/setup-token.env does not set LOAMS_SETUP_TOKEN"; exit 1; }
          # From the source file: Docker Compose 2.38 inlines env_file into
          # `environment` and drops the key from `compose config`'s output.
          yq -e '.services.loams.env_file[] | select((.path // .) == "./config/setup-token.env")' \
            "$stage/release/compose.yaml" >/dev/null \
            || { echo "compose.yaml does not list config/setup-token.env in the loams service's env_file"; exit 1; }
          (cd "$stage/release" && LOAMS_SETUP_TOKEN=bundle-check docker compose --env-file .env.example \
            config --format json loams) \
            | jq -e '.services.loams.environment.LOAMS_SETUP_TOKEN == "bundle-check"' >/dev/null \
            || { echo "LOAMS_SETUP_TOKEN does not reach the loams service"; exit 1; }
          missing=$(jq -r --arg stage "$stage/" --arg secrets "$stage/release/secrets/" \
            '[.services[] | ((.env_file // [])[] | (.path? // .)),
                            ((.volumes // [])[] | select(.type == "bind") | .source)]
             | unique[] | select(startswith($stage) and (startswith($secrets) | not))' <<<"$cfg" \
            | while read -r f; do [ -e "$f" ] || echo "$f"; done)
          [ -z "$missing" ] || { echo "the bundle lacks files its compose file uses:"; echo "$missing"; exit 1; }
          if jq -e '.services | has("compute1")' <<<"$cfg" >/dev/null; then
            jq -e '.services.compute1.depends_on["pg-bootstrap"].condition == "service_completed_successfully"
                   and .services["pg-bootstrap"].restart == "no"' <<<"$cfg" >/dev/null \
              || { echo "compute1 does not wait for the one-shot pg-bootstrap"; exit 1; }
          fi
          tar -C "$RUNNER_TEMP" --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="$mtime" -czf "$OUT/$name.tar.gz" "$name"
          (cd "$OUT" && sha256sum -- * > SHA256SUMS)
          ls -l "$OUT"; cat "$OUT/SHA256SUMS"
      - name: create the release if needed, keep its channel, attach
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          LATEST_FLAG: ${{ needs.guard.outputs.latest_flag }}
          TITLE: ${{ needs.guard.outputs.title }}
          ALIAS_NOTE: ${{ needs.guard.outputs.alias_note }}
          REGISTRY: ${{ env.REGISTRY }}
          OUT: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            channel_flags=(--prerelease "$LATEST_FLAG")
            intro="Loams $VERSION (preview)."
          else
            channel_flags=("$LATEST_FLAG")
            intro="Loams $VERSION."
          fi
          dispatch_cli=true
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes="$RUNNER_TEMP/notes.md"
            {
              echo "$intro Run it yourself with Docker Compose: see deploy/release/README.md in the attached bundle."
              echo
              echo "Images (linux/amd64, linux/arm64; provenance and SBOM attested, verify with \`gh attestation verify oci://<image> -R $GITHUB_REPOSITORY\`):"
              for image in loams loams-fabric loams-agentd loams-pg-control; do
                echo "- \`$REGISTRY/$image:$VERSION\` ($ALIAS_NOTE)"
              done
              # The generated "Upgrading" section (design §54 §11.3, D942).
              if [ -f "$RUNNER_TEMP/src/release/upgrade-path.toml" ]; then
                echo
                python3 "$RUNNER_TEMP/src/scripts/release/upgrade_path.py" notes "$VERSION" --root "$RUNNER_TEMP/src"
              fi
            } > "$notes"
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag "${channel_flags[@]}" \
              --title "$TITLE" --notes-file "$notes"
          else
            draft=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
            [ "$draft" = true ] || dispatch_cli=false
            # A release drafted by hand for this tag is published in its channel:
            # a preview is never the repository's "Latest" release, a stable one is.
            if [ "$PRERELEASE" = true ]; then
              gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
            else
              gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
            fi
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$OUT"/*
          echo "dispatch_cli=$dispatch_cli" >> "$GITHUB_OUTPUT"

  # The CLI binaries and the desktop app, built from the tag and attached to the
  # release by their own workflows (dispatched at the tag, so each runs the
  # tag's workflow file and checks out the tag's commit).
  binaries:
    name: Dispatch the CLI and desktop builds
    needs: [guard, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: release-package.yml and desktop-electron-release.yml
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          DISPATCH_CLI: ${{ needs.release.outputs.dispatch_cli }}
        run: |
          set -euo pipefail
          echo "Dispatched for $TAG:" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DISPATCH_CLI" = true ]; then
            gh workflow run release-package.yml -R "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
            echo "- release-package.yml (loams CLI: Linux packages, Windows zip, macOS tarballs)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- release-package.yml: not dispatched; publishing the release already started it" >> "$GITHUB_STEP_SUMMARY"
          fi
          gh workflow run desktop-electron-release.yml -R "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
          echo "- desktop-electron-release.yml (Loams Desktop: Linux, Windows, macOS)" >> "$GITHUB_STEP_SUMMARY"

name: Release desktop

# Cuts a draft GitHub Release of Loams Desktop from a `desktop-vX.Y.Z` tag (plan AP1e Task 31;
# D676 Linux, D677 Windows through SignPath and macOS unsigned). docs/release/desktop.md is the page a
# maintainer reads: every secret and variable below, and how to cut a release.
#
# Two kinds of tag, one build:
#   desktop-vX.Y.Z   (push) a draft "Loams Desktop X.Y.Z" release of its own, as before.
#   vX.Y.Z(-pre)     (dispatched by release-github.yml once the product release exists, or by hand
#                    with `--ref <tag> -f tag=<tag>`) the desktop files are attached to that product
#                    release, stamped with its version (LOAMS_DESKTOP_VERSION), with their checksums
#                    in DESKTOP-SHA256SUMS so they do not replace the release's own SHA256SUMS.
#   dry_run: true    builds every platform and keeps the files as workflow artifacts; no release is
#                    touched and the tag checks are skipped (for testing this workflow on a branch).
#
#   Linux    AppImage, deb, rpm, pacman for x64 and arm64. The rpm goes to SignPath (desktop-sign.yml);
#            AppImage, deb, pacman and SHA256SUMS get detached GPG signatures (gpg-sign.sh).
#   Windows  NSIS x64. The unpacked app is signed by SignPath BEFORE the installer is built from it,
#            then the installer is signed too (signpath/artifact-configuration.desktop-windows.xml).
#   macOS    dmg and zip for arm64 (macos-15) and x64 (macos-15-intel); either runner can be swapped
#            with MACOS_ARM64_RUNNER / MACOS_X64_RUNNER, and a runner of the other architecture
#            cross-compiles. Ad-hoc signed and not notarized unless the Apple secrets exist
#            (MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD; notarization also needs
#            APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER); the notes carry the xattr step.
#
# Signing secrets live in the protected `desktop-release` environment (docs/release/desktop.md): the
# plan job, every SignPath call (desktop-sign.yml) and the release job run in it.
#
# Nothing here pretends to sign. A file whose signing secrets are absent is built with "-unsigned" in
# its name, the release says so, and with the repository variable DESKTOP_REQUIRE_SIGNING = true the
# `plan` job fails instead.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'desktop-vX.Y.Z, or a product vX.Y.Z(-pre) release to attach the desktop files to. Dispatch with --ref set to the same tag.'
        required: true
      dry_run:
        description: 'Build and keep the files as workflow artifacts only; touch no release.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  CARGO_TERM_COLOR: always
  # Build-time constants of the updater (src/main/update/pubkey.ts). Public values, hence variables.
  LOAMS_UPDATE_PUBKEY: ${{ vars.LOAMS_UPDATE_PUBKEY }}
  # The generic provider appends latest*.yml. Clients read the rolling `desktop-latest` release, which
  # desktop-promote.yml updates only after a version release is PUBLISHED, never a draft.
  LOAMS_UPDATE_FEED: ${{ vars.LOAMS_UPDATE_FEED || format('https://github.com/{0}/releases/download/desktop-latest', github.repository) }}

jobs:
  # The tag must be desktop-vX.Y.Z, match apps/desktop-electron/package.json, and sit on the default
  # branch. Then decide, once, what this run can sign: every later job reads these outputs, so the
  # file names, the signing calls and the release notes cannot disagree.
  plan:
    name: Plan
    environment: desktop-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      desktop_version: ${{ steps.plan.outputs.desktop_version }}
      sign_mac: ${{ steps.plan.outputs.sign_mac }}
      notarize_mac: ${{ steps.plan.outputs.notarize_mac }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      sign_rpm: ${{ steps.plan.outputs.sign_rpm }}
      sign_win: ${{ steps.plan.outputs.sign_win }}
      gpg: ${{ steps.plan.outputs.gpg }}
      update_key: ${{ steps.plan.outputs.update_key }}
      sfx_gpg: ${{ steps.plan.outputs.sfx_gpg }}
      sfx_rpm: ${{ steps.plan.outputs.sfx_rpm }}
      sfx_win: ${{ steps.plan.outputs.sfx_win }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: validate the tag and decide what is signed
        id: plan
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUIRE: ${{ vars.DESKTOP_REQUIRE_SIGNING }}
          HAS_MAC_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          HAS_MAC_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
          # Booleans only: the secret values are never loaded into this job's environment.
          HAS_GPG: ${{ secrets.LOAMS_GPG_PRIVATE_KEY != '' }}
          HAS_UPDATE_KEY: ${{ secrets.LOAMS_UPDATE_SIGNING_KEY != '' }}
          HAS_SP_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          SP_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SP_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SP_RPM_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SP_RPM_CONFIG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SP_WIN_POLICY: ${{ vars.SIGNPATH_WINDOWS_SIGNING_POLICY_SLUG }}
          SP_WIN_CONFIG: ${{ vars.SIGNPATH_DESKTOP_WINDOWS_ARTIFACT_CONFIGURATION_SLUG }}
          SP_WIN_INSTALLER_CONFIG: ${{ vars.SIGNPATH_DESKTOP_WINDOWS_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          UPDATE_PUBKEY: ${{ vars.LOAMS_UPDATE_PUBKEY }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^desktop-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
            mode=desktop
            version="${BASH_REMATCH[1]}"
            desktop_version=""
            pkg=$(node -p 'require("./apps/desktop-electron/package.json").version')
            [ "$pkg" = "$version" ] || { echo "::error::$TAG, but apps/desktop-electron/package.json is $pkg"; exit 1; }
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
            # A product release: the desktop build carries the product's version.
            mode=product
            version="${BASH_REMATCH[1]}"
            desktop_version="$version"
          else
            echo "::error::$TAG is neither a desktop-vX.Y.Z(-pre) nor a vX.Y.Z(-pre) tag"; exit 1
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::dry run: building $GITHUB_SHA as $TAG ($mode); no release is touched"
          else
            tag_sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}") \
              || { echo "::error::$TAG is not a tag in this repository"; exit 1; }
            [ "$tag_sha" = "$GITHUB_SHA" ] \
              || { echo "::error::this run is at $GITHUB_SHA but $TAG is $tag_sha; dispatch with --ref $TAG"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" \
              || { echo "::error::$TAG is not on $DEFAULT_BRANCH; refusing to release it"; exit 1; }
          fi
          sign_mac=false; [[ "$HAS_MAC_CERT" = true ]] && sign_mac=true
          notarize_mac=false; [[ $sign_mac = true && "$HAS_MAC_NOTARY" = true ]] && notarize_mac=true
          [ $sign_mac = true ] || echo "::warning::macOS is ad-hoc signed only (no MACOS_CERTIFICATE_P12_BASE64/MACOS_CERTIFICATE_PASSWORD): users clear the quarantine flag on first launch"
          [ $sign_mac = false ] || [ $notarize_mac = true ] || echo "::warning::macOS is signed but NOT notarized (APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER unset)"

          sp_common=true
          [[ "$HAS_SP_TOKEN" = true && -n "$SP_ORG" && -n "$SP_PROJECT" ]] || sp_common=false
          sign_rpm=false; [[ $sp_common = true && -n "$SP_RPM_POLICY" && -n "$SP_RPM_CONFIG" ]] && sign_rpm=true
          sign_win=false; [[ $sp_common = true && -n "$SP_WIN_POLICY" && -n "$SP_WIN_CONFIG" && -n "$SP_WIN_INSTALLER_CONFIG" ]] && sign_win=true
          gpg=false; [[ "$HAS_GPG" = true ]] && gpg=true
          update_key=false; [[ "$HAS_UPDATE_KEY" = true && -n "$UPDATE_PUBKEY" ]] && update_key=true

          if [ "$REQUIRE" = true ]; then
            missing=()
            [ $sign_rpm = true ] || missing+=("SignPath rpm (SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG, SIGNPATH_ARTIFACT_CONFIGURATION_SLUG)")
            [ $sign_win = true ] || missing+=("SignPath Windows (the same three plus SIGNPATH_WINDOWS_SIGNING_POLICY_SLUG, SIGNPATH_DESKTOP_WINDOWS_ARTIFACT_CONFIGURATION_SLUG, SIGNPATH_DESKTOP_WINDOWS_INSTALLER_ARTIFACT_CONFIGURATION_SLUG)")
            [ $gpg = true ] || missing+=("LOAMS_GPG_PRIVATE_KEY")
            [ $update_key = true ] || missing+=("LOAMS_UPDATE_SIGNING_KEY and variable LOAMS_UPDATE_PUBKEY")
            if [ ${#missing[@]} -gt 0 ]; then
              echo "::error::DESKTOP_REQUIRE_SIGNING is true and this release would ship unsigned. Missing: ${missing[*]}"
              exit 1
            fi
          fi
          [ $sign_rpm = true ] || echo "::warning::rpm will NOT be signed (SignPath not configured); it is named -unsigned"
          [ $sign_win = true ] || echo "::warning::Windows installer will NOT be signed (SignPath not configured); it is named -unsigned"
          [ $gpg = true ] || echo "::warning::no GPG signatures (LOAMS_GPG_PRIVATE_KEY unset); AppImage, deb, pacman are named -unsigned"
          [ $update_key = true ] || echo "::warning::update manifests are not signed (LOAMS_UPDATE_SIGNING_KEY or LOAMS_UPDATE_PUBKEY unset); the in-app updater stays disabled"

          unsigned() { [ "$1" = true ] && echo "" || echo "-unsigned"; }
          {
            echo "mode=$mode"; echo "dry_run=$DRY_RUN"; echo "desktop_version=$desktop_version"
            echo "sign_mac=$sign_mac"; echo "notarize_mac=$notarize_mac"
            echo "version=$version"
            echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)"
            echo "sign_rpm=$sign_rpm"; echo "sign_win=$sign_win"; echo "gpg=$gpg"; echo "update_key=$update_key"
            echo "sfx_gpg=$(unsigned $gpg)"; echo "sfx_rpm=$(unsigned $sign_rpm)"; echo "sfx_win=$(unsigned $sign_win)"
          } >> "$GITHUB_OUTPUT"

  linux:
    name: "Linux: package (${{ matrix.arch }})"
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      LOAMS_SUFFIX_GPG: ${{ needs.plan.outputs.sfx_gpg }}
      LOAMS_SUFFIX_RPM: ${{ needs.plan.outputs.sfx_rpm }}
      LOAMS_DESKTOP_VERSION: ${{ needs.plan.outputs.desktop_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ inputs.dry_run == true && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev rpm libarchive-tools fakeroot
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Dry runs only: a run that publishes builds without a cache another
        # run could have written (cache poisoning).
        if: inputs.dry_run == true
        with:
          key: desktop-release-linux-${{ matrix.arch }}
      - name: engine (live and durable)
        run: cargo build --release -p loams --features live,durable,live-tikv,graph
      # The agent daemon behind Studio (0.1.0 release fix B9); fetch-engine.mjs bundles it with
      # SHA256SUMS and VERSION, and fails the package without it (LOAMS_REQUIRE_AGENTD).
      - name: agent daemon
        env:
          DESKTOP_VERSION: ${{ needs.plan.outputs.desktop_version }}
          LOAMS_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The daemon reports the app's version; empty (a dry run) keeps the crate's.
          [ -n "$DESKTOP_VERSION" ] && export LOAMS_AGENTD_VERSION="$DESKTOP_VERSION"
          cargo build --release -p loams-agentd
          target/release/loams-agentd version
      - name: package
        env:
          LOAMS_REQUIRE_AGENTD: "1"
        run: pnpm nx run loams-desktop-electron:package-linux --outputStyle=static
      - name: split the rpm (SignPath) from the rest
        run: |
          set -euo pipefail
          cd apps/desktop-electron/dist
          mkdir -p ../out-rpm ../out-rest
          mv ./*.rpm ../out-rpm/
          mv ./*.AppImage ./*.deb ./*.pacman ../out-rest/
          for y in latest*.yml; do [ -e "$y" ] && mv "$y" ../out-rest/; done
          ls -l ../out-rpm ../out-rest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: apps/desktop-electron/out-rest/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-${{ matrix.arch }}-in
          path: apps/desktop-electron/out-rpm/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  sign-rpm:
    name: "Linux: sign the rpm (${{ matrix.arch }})"
    needs: [plan, linux]
    if: needs.plan.outputs.sign_rpm == 'true'
    strategy:
      matrix:
        arch: [x64, arm64]
    uses: ./.github/workflows/desktop-sign.yml
    with:
      artifact_name: rpm-${{ matrix.arch }}-in
      kind: rpm
      require_signing: ${{ vars.DESKTOP_REQUIRE_SIGNING == 'true' }}

  windows-unpacked:
    name: "Windows: package the unpacked app"
    needs: plan
    runs-on: windows-2025
    # A cold Windows engine build takes about an hour, the agent daemon about 16 more minutes.
    timeout-minutes: 240
    env:
      LOAMS_DESKTOP_VERSION: ${{ needs.plan.outputs.desktop_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ inputs.dry_run == true && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # protoc from its GitHub release (not Chocolatey, whose outages exit 0) and NASM. The engine
      # step below may fail without failing the job, so a missing protoc would ship the app without
      # its engine: this step fails instead.
      - name: protoc and NASM
        uses: ./.github/actions/windows-build-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Dry runs only: a run that publishes builds without a cache another
        # run could have written (cache poisoning).
        if: inputs.dry_run == true
        with:
          key: desktop-release-windows
      # The Windows engine is bundled only if it builds and starts. Otherwise the app ships without it
      # (LOAMS_DESKTOP_NO_LOCAL_ENGINE=1, read by fetch-engine.mjs) and shows "not available on Windows yet".
      - name: engine (bundled only if it builds and passes the smoke test)
        id: engine
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          rustup target add x86_64-pc-windows-msvc
          cargo build --release -p loams --features live,durable,live-tikv,graph --target x86_64-pc-windows-msvc
          exe=target/x86_64-pc-windows-msvc/release/loams.exe
          # smoke test: the binary starts and reports its version
          "$exe" --version
          # Node reads this path, so give it a Windows one (D:/a/...), not Git Bash's /d/a/...
          echo "LOAMS_BIN=$(cygpath -m "$PWD/$exe")" >> "$GITHUB_ENV"
      - name: no Windows engine
        if: steps.engine.outcome != 'success'
        shell: bash
        run: |
          echo "::warning::the Windows engine did not build or pass its smoke test; shipping without it"
          echo "LOAMS_DESKTOP_NO_LOCAL_ENGINE=1" >> "$GITHUB_ENV"
      # The agent daemon behind Studio (release fix B9), required: unlike the engine, a Windows build
      # without it fails (LOAMS_REQUIRE_AGENTD), so Studio never says "not bundled" on a release.
      - name: agent daemon
        shell: bash
        env:
          DESKTOP_VERSION: ${{ needs.plan.outputs.desktop_version }}
          LOAMS_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The daemon reports the app's version; empty (a dry run) keeps the crate's.
          [ -n "$DESKTOP_VERSION" ] && export LOAMS_AGENTD_VERSION="$DESKTOP_VERSION"
          rustup target add x86_64-pc-windows-msvc
          cargo build --release -p loams-agentd --target x86_64-pc-windows-msvc
          exe=target/x86_64-pc-windows-msvc/release/loams-agentd.exe
          "$exe" version
          echo "LOAMS_AGENTD_BIN=$(cygpath -m "$PWD/$exe")" >> "$GITHUB_ENV"
      - name: unpacked app (unsigned)
        env:
          LOAMS_REQUIRE_AGENTD: "1"
        run: pnpm nx run loams-desktop-electron:package-windows-unpacked --outputStyle=static
      - name: the daemon is bundled
        shell: bash
        run: |
          set -euo pipefail
          bin=apps/desktop-electron/dist/win-unpacked/resources/bin
          ls -l "$bin"
          for f in loams-agentd.exe SHA256SUMS VERSION; do
            [ -s "$bin/$f" ] || { echo "::error::$bin/$f is missing"; exit 1; }
          done
          (cd "$bin" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-unpacked-in
          path: apps/desktop-electron/dist/win-unpacked/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  sign-win-unpacked:
    name: "Windows: sign the app"
    needs: [plan, windows-unpacked]
    if: needs.plan.outputs.sign_win == 'true'
    uses: ./.github/workflows/desktop-sign.yml
    with:
      artifact_name: win-unpacked-in
      kind: windows
      require_signing: ${{ vars.DESKTOP_REQUIRE_SIGNING == 'true' }}

  # The installer is built from the (signed) unpacked app, so it packages signed executables.
  windows-installer:
    name: "Windows: build the installer"
    needs: [plan, windows-unpacked, sign-win-unpacked]
    if: ${{ !cancelled() && needs.windows-unpacked.result == 'success' && (needs.sign-win-unpacked.result == 'success' || needs.sign-win-unpacked.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      unpacked_signed: ${{ steps.verify.outputs.signed }}
    env:
      LOAMS_DESKTOP_VERSION: ${{ needs.plan.outputs.desktop_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ inputs.dry_run == true && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign-win-unpacked.outputs.signed == 'true' && 'win-unpacked-in-signed' || 'win-unpacked-in' }}
          path: apps/desktop-electron/dist/win-unpacked
      # Do not trust the SignPath submission: check the Authenticode signatures on the files that went in.
      # Not signed (or not planned): fail when DESKTOP_REQUIRE_SIGNING, else the installer is built and
      # named -unsigned, and the installer is not submitted.
      - name: verify the unpacked app's signatures
        id: verify
        shell: pwsh
        env:
          PLAN_SIGN_WIN: ${{ needs.sign-win-unpacked.outputs.signed }}
          REQUIRE: ${{ vars.DESKTOP_REQUIRE_SIGNING }}
        run: |
          $signed = $false
          if ($env:PLAN_SIGN_WIN -eq 'true') {
            $root = 'apps/desktop-electron/dist/win-unpacked'
            $files = @("$root/Loams Desktop.exe")
            if (Test-Path "$root/resources/bin/loams.exe") { $files += "$root/resources/bin/loams.exe" }
            $files += "$root/resources/bin/loams-agentd.exe"
            $bad = @()
            foreach ($f in $files) {
              $st = (Get-AuthenticodeSignature -LiteralPath $f).Status
              Write-Host "$f : $st"
              if ($st -ne 'Valid') { $bad += "$f ($st)" }
            }
            if ($bad.Count -eq 0) { $signed = $true }
            elseif ($env:REQUIRE -eq 'true') { Write-Error "SignPath returned files without a valid Authenticode signature: $($bad -join ', ')"; exit 1 }
            else { Write-Warning "not validly signed: $($bad -join ', '); the installer will be named -unsigned" }
          }
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          $sfx = if ($signed) { '' } else { '-unsigned' }
          "LOAMS_SUFFIX_WIN=$sfx" >> $env:GITHUB_ENV
      # Authenticode signing rewrote loams-agentd.exe and loams.exe: SHA256SUMS, which
      # `loams-agentd install-runtime` checks, must list the signed files (release fix B9).
      - name: SHA256SUMS of the shipped binaries
        shell: bash
        run: |
          set -euo pipefail
          bin=apps/desktop-electron/dist/win-unpacked/resources/bin
          node apps/desktop-electron/scripts/bin-sums.cjs "$bin" win32
          (cd "$bin" && sha256sum -c SHA256SUMS)
      - name: NSIS installer from the unpacked app
        shell: bash
        run: pnpm --filter @loams/desktop run package --win nsis --x64 --prepackaged dist/win-unpacked --publish never
      - name: split the installer (SignPath) from the manifest
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop-electron/dist
          mkdir -p ../out-exe ../out-meta
          mv ./*.exe ../out-exe/
          mv latest.yml ../out-meta/ 2>/dev/null || echo "::warning::no latest.yml (LOAMS_UPDATE_FEED unset?)"
          ls -l ../out-exe ../out-meta
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-installer-in
          path: apps/desktop-electron/out-exe/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-win-meta
          path: apps/desktop-electron/out-meta/*
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  sign-win-installer:
    name: "Windows: sign the installer"
    needs: [plan, windows-installer]
    if: needs.plan.outputs.sign_win == 'true' && needs.windows-installer.outputs.unpacked_signed == 'true'
    uses: ./.github/workflows/desktop-sign.yml
    with:
      artifact_name: win-installer-in
      kind: windows-installer
      require_signing: ${{ vars.DESKTOP_REQUIRE_SIGNING == 'true' }}

  verify-win-installer:
    name: "Windows: verify the installer"
    needs: [plan, sign-win-installer]
    if: needs.sign-win-installer.outputs.signed == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      signed: ${{ steps.verify.outputs.signed }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: win-installer-in-signed
          path: signed
      - name: Get-AuthenticodeSignature
        id: verify
        shell: pwsh
        env:
          REQUIRE: ${{ vars.DESKTOP_REQUIRE_SIGNING }}
        run: |
          $signed = $true
          foreach ($f in Get-ChildItem signed -Filter *.exe) {
            $st = (Get-AuthenticodeSignature -LiteralPath $f.FullName).Status
            Write-Host "$($f.Name) : $st"
            if ($st -ne 'Valid') { $signed = $false }
          }
          if (-not (Get-ChildItem signed -Filter *.exe)) { $signed = $false }
          if (-not $signed -and $env:REQUIRE -eq 'true') { Write-Error 'the installer has no valid Authenticode signature'; exit 1 }
          if (-not $signed) { Write-Warning 'the installer is not validly signed; it will be released as -unsigned' }
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT

  macos:
    name: "macOS: package (${{ matrix.arch }})"
    needs: plan
    # The Apple signing secrets, when they exist, live with the others in this environment.
    environment: desktop-release
    runs-on: ${{ matrix.runner }}
    # A cold Intel engine build took 2h04m and the agent daemon 23 more minutes (Desktop run
    # 39099462854 hit the old 150-minute limit while packaging).
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        include:
          # Runners as in desktop-electron.yml: repository variables, and a runner of the other
          # architecture cross-compiles.
          - { arch: arm64, runner: "${{ vars.MACOS_ARM64_RUNNER || 'macos-15' }}" }
          - { arch: x64, runner: "${{ vars.MACOS_X64_RUNNER || 'macos-15-intel' }}" }
    env:
      LOAMS_DESKTOP_VERSION: ${{ needs.plan.outputs.desktop_version }}
      LOAMS_DESKTOP_MAC_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ inputs.dry_run == true && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: brew install protobuf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Dry runs only: a run that publishes builds without a cache another
        # run could have written (cache poisoning).
        if: inputs.dry_run == true
        with:
          key: desktop-release-macos-${{ matrix.arch }}
      - name: engine (live and durable)
        run: |
          set -euo pipefail
          features=live,durable,live-tikv,graph
          # A macOS build whose runner is the other architecture is a cross build (see the matrix).
          if [ "$RUNNER_OS" = macOS ]; then
            want=arm64; target=aarch64-apple-darwin
            [ "$LOAMS_DESKTOP_MAC_ARCH" = x64 ] && { want=x86_64; target=x86_64-apple-darwin; }
            [ "$(uname -m)" = "$want" ] || RUST_TARGET=$target
            echo "RUST_TARGET=${RUST_TARGET:-}" >> "$GITHUB_ENV"
          fi
          if [ -n "${RUST_TARGET:-}" ]; then
            rustup target add "$RUST_TARGET"
            cargo build --release -p loams --features "$features" --target "$RUST_TARGET"
            echo "LOAMS_BIN=$PWD/target/$RUST_TARGET/release/loams" >> "$GITHUB_ENV"
          else
            cargo build --release -p loams --features "$features"
          fi
      - name: engine smoke test
        run: |
          set -euo pipefail
          bin="${LOAMS_BIN:-target/release/loams}"
          file "$bin"
          if [ "${RUST_TARGET:-}" = x86_64-apple-darwin ]; then
            # Cross-built on Apple Silicon: run it under Rosetta, which the image may lack.
            arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
            arch -x86_64 "$bin" --version
          elif [ "${RUST_TARGET:-}" = aarch64-apple-darwin ]; then
            # Cross-built on Intel, which cannot run it: check the architecture only.
            echo "::notice::arm64 engine cross-built on an Intel runner; not executed here"
            [ "$(lipo -archs "$bin")" = arm64 ]
          else
            "$bin" --version
          fi
      # The agent daemon behind Studio (release fix B9), built for the same target as the engine.
      # scripts/mac-sign.cjs signs it with the app and writes SHA256SUMS again from the signed file.
      - name: agent daemon
        env:
          DESKTOP_VERSION: ${{ needs.plan.outputs.desktop_version }}
          LOAMS_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The daemon reports the app's version; empty (a dry run) keeps the crate's.
          [ -n "$DESKTOP_VERSION" ] && export LOAMS_AGENTD_VERSION="$DESKTOP_VERSION"
          if [ -n "${RUST_TARGET:-}" ]; then
            cargo build --release -p loams-agentd --target "$RUST_TARGET"
            bin="$PWD/target/$RUST_TARGET/release/loams-agentd"
            echo "LOAMS_AGENTD_BIN=$bin" >> "$GITHUB_ENV"
          else
            cargo build --release -p loams-agentd
            bin=target/release/loams-agentd
          fi
          if [ "${RUST_TARGET:-}" = x86_64-apple-darwin ]; then
            arch -x86_64 "$bin" version
          elif [ "${RUST_TARGET:-}" = aarch64-apple-darwin ]; then
            [ "$(lipo -archs "$bin")" = arm64 ]
          else
            "$bin" version
          fi
      # electron-builder.config.cjs: with CSC_LINK it signs with the Developer ID under the hardened
      # runtime and notarizes when the APPLE_API_* variables are set; without it, an ad-hoc signature.
      # The .p8 key is written to a file because notarytool takes a path.
      - name: Apple notary key
        if: needs.plan.outputs.notarize_mac == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: package (${{ needs.plan.outputs.sign_mac == 'true' && 'Developer ID' || 'ad-hoc signed' }})
        env:
          CSC_LINK: ${{ needs.plan.outputs.sign_mac == 'true' && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ needs.plan.outputs.sign_mac == 'true' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ needs.plan.outputs.notarize_mac == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.plan.outputs.notarize_mac == 'true' && secrets.APPLE_API_ISSUER || '' }}
        # An empty CSC_LINK is not "no certificate" to electron-builder: it resolves ''
        # against the project directory and fails with "<dir> not a file" (v0.1.0-preview.2,
        # run 38733095344). Unset the empty ones so the ad-hoc path is taken.
        run: |
          set -euo pipefail
          [ -n "${CSC_LINK:-}" ] || { unset CSC_LINK CSC_KEY_PASSWORD; export CSC_IDENTITY_AUTO_DISCOVERY=false; }
          [ -n "${APPLE_API_KEY_ID:-}" ] || unset APPLE_API_KEY_ID APPLE_API_ISSUER
          export LOAMS_REQUIRE_AGENTD=1
          pnpm nx run loams-desktop-electron:package-macos --outputStyle=static
      - name: verify the signature
        env:
          SIGN_MAC: ${{ needs.plan.outputs.sign_mac }}
          NOTARIZE_MAC: ${{ needs.plan.outputs.notarize_mac }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/apple-api-key.p8"
          apps=(apps/desktop-electron/dist/mac*/*.app); app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|Authority|TeamIdentifier' || true
          lipo -archs "$app/Contents/MacOS/Loams Desktop"
          lipo -archs "$app/Contents/Resources/bin/loams"
          # The bundled daemon (release fix B9): signed, the right architecture, and SHA256SUMS
          # matching the signed files, as `loams-agentd install-runtime` checks.
          bin="$app/Contents/Resources/bin"
          [ "$(lipo -archs "$bin/loams-agentd")" = "$([ "$LOAMS_DESKTOP_MAC_ARCH" = x64 ] && echo x86_64 || echo arm64)" ]
          codesign --verify --strict --verbose=2 "$bin/loams-agentd"
          [ -s "$bin/VERSION" ] || { echo "::error::$bin/VERSION is missing"; exit 1; }
          (cd "$bin" && shasum -a 256 -c SHA256SUMS)
          if [ "$SIGN_MAC" = true ]; then
            codesign -dv "$app" 2>&1 | grep -q '^Authority=Developer ID Application' \
              || { echo "::error::a Developer ID certificate was configured but the app is not signed with it"; exit 1; }
          fi
          if [ "$NOTARIZE_MAC" = true ]; then
            xcrun stapler validate "$app"
          fi
      # Both builds write latest-mac.yml; keep the arm64 one under that name (the updater's version
      # probe) and the x64 one beside it.
      - name: keep the two manifests apart
        if: matrix.arch == 'x64'
        run: |
          cd apps/desktop-electron/dist
          [ -e latest-mac.yml ] && mv latest-mac.yml latest-mac-x64.yml || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop-electron/dist/*.dmg
            apps/desktop-electron/dist/*.zip
            apps/desktop-electron/dist/latest-mac*.yml
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    name: "${{ needs.plan.outputs.mode == 'product' && 'Release: attach to the product release' || 'Release: draft' }}"
    environment: desktop-release
    needs: [plan, linux, sign-rpm, windows-installer, sign-win-installer, verify-win-installer, macos]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      PLAN_SIGN_RPM: ${{ needs.plan.outputs.sign_rpm }}
      # Windows counts as signed only when the installer's signature was verified, not merely requested.
      PLAN_SIGN_WIN: ${{ needs.verify-win-installer.outputs.signed }}
      PLAN_GPG: ${{ needs.plan.outputs.gpg }}
      PLAN_UPDATE_KEY: ${{ needs.plan.outputs.update_key }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      MODE: ${{ needs.plan.outputs.mode }}
      PLAN_SIGN_MAC: ${{ needs.plan.outputs.sign_mac }}
      PLAN_NOTARIZE_MAC: ${{ needs.plan.outputs.notarize_mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ inputs.dry_run == true && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter @loams/desktop

      - name: gather the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: unsigned rpms
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rpm-*-in
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: SignPath-signed rpms
        if: env.PLAN_SIGN_RPM == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rpm-*-in-signed
          path: ${{ runner.temp }}/rpm-signed
          merge-multiple: true
      # A signed rpm replaces its unsigned twin. A planned rpm with no signed twin (SignPath rejected it,
      # DESKTOP_REQUIRE_SIGNING off) was built without the suffix, so label it unsigned.
      - name: replace signed rpms, label the rest
        run: |
          set -euo pipefail
          shopt -s nullglob
          rel="$RUNNER_TEMP/release"; sg="$RUNNER_TEMP/rpm-signed"
          for f in "$rel"/*.rpm; do
            b=$(basename "$f")
            if [ -e "$sg/$b" ]; then cp "$sg/$b" "$f"; echo "signed: $b"
            elif [[ "$b" != *-unsigned.rpm ]]; then mv "$f" "$rel/${b%.rpm}-unsigned.rpm"; echo "labelled unsigned: $b"; echo "PLAN_SIGN_RPM=false" >> "$GITHUB_ENV"; fi
          done
      - name: Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PLAN_SIGN_WIN == 'true' && 'win-installer-in-signed' || 'win-installer-in' }}
          path: ${{ runner.temp }}/release

      # SignPath was planned but its output did not verify (DESKTOP_REQUIRE_SIGNING is off): the file
      # was built without the -unsigned suffix, so add it, and keep latest.yml pointing at the new name.
      - name: label an unverified installer unsigned
        if: env.PLAN_SIGN_WIN != 'true'
        run: |
          set -euo pipefail
          rel="$RUNNER_TEMP/release"
          for f in "$rel"/*-win-x64.exe; do
            [ -e "$f" ] || continue
            old=$(basename "$f"); new="${old%.exe}-unsigned.exe"
            mv "$f" "$rel/$new"
            [ -e "$rel/latest.yml" ] && sed -i "s/$old/$new/g" "$rel/latest.yml"
            echo "renamed $old to $new"
          done

      - name: the manifest follows the signed installer
        if: env.PLAN_SIGN_WIN == 'true'
        run: |
          set -euo pipefail
          rel="$RUNNER_TEMP/release"
          if [ -e "$rel/latest.yml" ]; then
            node apps/desktop-electron/scripts/refresh-manifest.mjs "$rel/latest.yml" "$rel"
          fi

      - name: sign the update manifests (Ed25519)
        if: env.PLAN_UPDATE_KEY == 'true'
        env:
          LOAMS_UPDATE_SIGNING_KEY: ${{ secrets.LOAMS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for y in "$RUNNER_TEMP"/release/latest*.yml; do
            node apps/desktop-electron/scripts/sign-manifest.mjs "$y"
          done

      # A product release carries no update manifests (they are only served from desktop-v releases),
      # so drop them before the checksums: DESKTOP-SHA256SUMS must list only files that are attached.
      - name: no update manifests on a product release
        if: env.MODE == 'product'
        run: rm -f "$RUNNER_TEMP"/release/latest*.yml "$RUNNER_TEMP"/release/latest*.yml.sig

      - name: checksums
        run: node apps/desktop-electron/scripts/checksums.mjs "$RUNNER_TEMP/release"

      - name: GPG signatures
        env:
          LOAMS_GPG_PRIVATE_KEY: ${{ secrets.LOAMS_GPG_PRIVATE_KEY }}
          # A key id is not a secret; the CLI packages (release-package.yml) read the same variable.
          LOAMS_GPG_KEY_ID: ${{ vars.LOAMS_GPG_KEY_ID }}
          LOAMS_GPG_PASSPHRASE: ${{ secrets.LOAMS_GPG_PASSPHRASE }}
        run: bash apps/desktop-electron/scripts/gpg-sign.sh "$RUNNER_TEMP/release"

      - name: release notes
        run: |
          set -euo pipefail
          yn() { [ "$1" = true ] && echo "$2" || echo "$3"; }
          {
            echo "Loams Desktop $VERSION."
            echo
            echo "| Platform | Files | Signing |"
            echo "|---|---|---|"
            echo "| Linux x64, arm64 | AppImage, deb, rpm, pacman | rpm: $(yn "$PLAN_SIGN_RPM" 'SignPath (GPG)' '**unsigned**'); AppImage, deb, pacman: $(yn "$PLAN_GPG" 'detached GPG .sig files' '**unsigned**') |"
            echo "| Windows x64 | NSIS installer | $(yn "$PLAN_SIGN_WIN" 'Authenticode, signed through SignPath' '**unsigned** (expect a SmartScreen warning)') |"
            echo "| macOS arm64, x64 | dmg, zip | $(yn "$PLAN_SIGN_MAC" "Developer ID$(yn "$PLAN_NOTARIZE_MAC" ', notarized' ', **not notarized**')" '**ad-hoc signed only, not notarized**') |"
            echo
            echo "Verify downloads with \`SHA256SUMS\`$(yn "$PLAN_GPG" ' and SHA256SUMS.asc (detached GPG signature)' '; this release has no GPG signature')."
            echo
            echo "### macOS: first launch"
            echo
            echo "Unless the table above says notarized, macOS quarantines the download (the app carries an ad-hoc signature, which Apple Silicon requires, but no Developer ID). After copying it to /Applications, run:"
            echo
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine "/Applications/Loams Desktop.app"'
            echo '```'
            echo
            echo "or right-click the app, choose Open, and confirm. macOS does not self-update: the app offers \"Download v...\" when a newer release exists."
            if [ "$PLAN_SIGN_WIN" != true ]; then
              echo
              echo "### Windows: first launch"
              echo
              echo "The installer is unsigned, so SmartScreen shows *Windows protected your PC*: choose **More info**, then **Run anyway**. That is an unknown-publisher warning, not a malware detection."
            fi
            echo
            echo "### Updates"
            echo
            echo "Windows and the Linux AppImage update in place from the \`desktop-latest\` feed release once this release is published and promoted (see docs/release/desktop.md), and only when the update manifest is signed$(yn "$PLAN_UPDATE_KEY" ' (it is, for this release)' ' (it is NOT for this release, so the in-app updater stays off)'). deb, rpm and pacman installs, and macOS, show \"Download v...\" instead."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # A product release (vX.Y.Z) already has its own SHA256SUMS (release-github.yml) and update
      # manifests are only served from desktop-v releases, so rename the one and drop the others.
      - name: product release layout
        if: env.MODE == 'product'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          mv SHA256SUMS DESKTOP-SHA256SUMS
          [ ! -e SHA256SUMS.asc ] || mv SHA256SUMS.asc DESKTOP-SHA256SUMS.asc
          ls -l

      # The product release is created by release-github.yml; this only adds the desktop files and a
      # section of notes, once. A published product release is updated in place.
      - name: attach to the product release
        if: env.MODE == 'product'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null \
            || { echo "::error::$TAG has no release yet; release-github.yml creates it"; exit 1; }
          gh release upload "$TAG" "$RUNNER_TEMP"/release/* --clobber --repo "$GITHUB_REPOSITORY"
          marker="## Loams Desktop"
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          case "$body" in
            *"$marker"*) echo "the release notes already have the desktop section" ;;
            *)
              { printf '%s\n\n%s\n\n' "$body" "$marker"; sed -e '/^### Updates/,$d' -e 's/^Verify downloads with `SHA256SUMS`/Verify the desktop downloads with `DESKTOP-SHA256SUMS`/' -e 's/SHA256SUMS\.asc/DESKTOP-SHA256SUMS.asc/' -e 's/^### /#### /' "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/body.md"
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md" --repo "$GITHUB_REPOSITORY"
              ;;
          esac

      # Idempotent: a re-run for the same tag reuses its draft (files replaced, notes refreshed). A tag
      # whose release is already published is refused: published assets are not rewritten.
      - name: create or update the draft release
        if: env.MODE == 'desktop'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          ls -l
          if state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null); then
            [ "$state" = true ] || { echo "::error::$TAG is already a published release; cut a new version instead"; exit 1; }
            echo "reusing the existing draft for $TAG"
            gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "Loams Desktop $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          else
            flags=(--draft --verify-tag --title "Loams Desktop $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$TAG" ./* "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          echo "Draft ready. Publish it, then desktop-promote.yml moves it onto the update feed." >> "$GITHUB_STEP_SUMMARY"

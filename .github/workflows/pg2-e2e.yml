# PG2 end-to-end tests on compose stacks (docs/plans/2026-10-08-pg2-postgres-production.md).
#
# neon-deploy (Task 2): loams-postgres against deploy/loams-postgres-dev at its pinned digests
# (it_deploy_neon_tenant_timeline_branch: attach, timeline, branch, list,
# delete).
#
# pageserver-loams-wal (Tasks 31 and 32, run here since Task 2 pinned the
# bench's Neon images; R32.2): scripts/pg2/it-pageserver-loams-wal.sh on
# deploy/loams-pg-bench with no safekeeper. A compute writes through
# loams-wal-interpreted, the pageserver finds it through the storage broker and
# ingests the interpreted protocol, and a fresh compute reads the rows back.
# This is it_pageserver_discovers_loams_wal_via_broker, which is also Task 31's
# it_pageserver_ingests_from_loams_wal_without_safekeeper.
#
# pg-control-deploy-neon (Task 9, the PG2a exit): e2e_create_project_and_branch,
# the service and the reconciler against deploy/loams-postgres-dev's
# pageserver and a loams-wal; then again against the stack's stock
# safekeeper1, which the release stack's pg-control uses (0.1.0 blocker B2:
# the WAL client sends the stock safekeeper's `mconf` and reads its head).
#
# pg-control-compose-runtime (Task 10): it_compose_compute_answers_select_1,
# a compute the compose runtime starts on deploy/loams-postgres-dev's network
# reads its spec from the upcall listener and answers SELECT 1 on its
# endpoint's host port. The same job runs it_endpoint (Tasks 11 and 12): an
# endpoint's start, suspend, restart and delete on real computes, and idle
# detection (a query longer than the suspend timeout keeps the compute
# running; idle, it suspends).
#
# The images are pinned by digest in the compose files; nothing here uses a tag.
name: Postgres e2e

on:
  workflow_dispatch:
  # nf1-candidate.yml (NF1 Task 16, G3 of the fork's gate): these jobs on a
  # release candidate's images, with the pin file and its consumers rewritten
  # in the job's checkout.
  workflow_call:
    inputs:
      candidate-pins:
        description: "A Loams Postgres release candidate's pin document (TOML)"
        type: string
        default: ""
      candidate-fork-commit:
        description: "The ostrium-labs/loams-postgres commit the candidate was built from"
        type: string
        default: ""
  # Full tier: pull requests into main (the release gate) and into a release branch; the
  # nightly dispatches it on dev.
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # loams-postgres and what it builds on
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/loams-postgres/**"
      - "crates/loams-pg-control/**"
      # compiled into loams-pg-control (runtime::images)
      - "deploy/pins/loams-postgres-images.toml"
      - "crates/loams-kv/**"
      - "crates/loams-proto/**"
      - "proto/**"
      # loams-wal-interpreted and what it builds on (its own workspace)
      - "crates/loams-wal-decoder/**"
      - "crates/loams-safekeeper/**"
      - "crates/loams-tikv/**"
      - "crates/loams-tuple/**"
      # the stacks and the scripts that drive them
      - "deploy/loams-postgres-dev/**"
      - "deploy/loams-pg-bench/**"
      - "scripts/pg2/**"
      - ".github/workflows/pg2-e2e.yml"

permissions:
  contents: read

concurrency:
  # A candidate run (workflow_call) is its own group, so it never cancels or
  # waits on the branch's own runs.
  # A newer push to a pull request supersedes the older run; a dispatch (the
  # nightly) runs to completion.
  group: pg2-e2e-${{ inputs.candidate-pins && format('candidate-{0}', github.run_id) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI builds are never debugged: no debug info in dev and test builds (smaller
  # caches, faster links; a panic still names its file and line) and no
  # incremental artifacts. rust-cache sets CARGO_INCREMENTAL=0 too; this covers
  # the jobs without it.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # The server headers' source: images.storage in deploy/pins/loams-postgres-images.toml,
  # written by scripts/nf1/pins.py (as in pg2.yml; NF1 Task 2).
  PG_HEADERS_IMAGE: ghcr.io/ostrium-labs/loams-postgres-storage@sha256:4dcec4cbef637b92b1088ea2c0bc857f3b5ef4318f02e8d2d4a0f9263ed4140e
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  neon-deploy:
    if: github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: Deploy
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: the candidate's pins (nf1-candidate.yml, NF1 Task 16)
        if: inputs.candidate-pins
        env:
          CANDIDATE_PINS: ${{ inputs.candidate-pins }}
          CANDIDATE_FORK_COMMIT: ${{ inputs.candidate-fork-commit }}
        run: |
          printf '%s\n' "$CANDIDATE_PINS" > "$RUNNER_TEMP/candidate.toml"
          python3 -I scripts/nf1/candidate.py apply --doc "$RUNNER_TEMP/candidate.toml" \
            --fork-commit "$CANDIDATE_FORK_COMMIT" --env "$GITHUB_ENV"
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      # The cache pg2.yml's neon-client job saves (on dev); this job only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: pg2-loams-postgres
          save-if: false
      - name: build the test
        run: cargo test -p loams-postgres --locked --test it_deploy_neon --no-run
      # Pulled on their own, with retries, so a registry hiccup is not a test failure.
      - name: pull the pinned images
        working-directory: deploy/loams-postgres-dev
        run: |
          for i in 1 2 3; do
            docker compose pull rustfs create-bucket storage_broker pageserver && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: deploy/loams-postgres-dev storage
        working-directory: deploy/loams-postgres-dev
        run: |
          docker compose up -d --pull never rustfs create-bucket storage_broker pageserver
          for _ in $(seq 1 120); do curl -sf localhost:9898/v1/status && break; sleep 1; done
          curl -sf localhost:9898/v1/status
      - name: it_deploy_neon_tenant_timeline_branch
        run: cargo test -p loams-postgres --locked --test it_deploy_neon -- --ignored
      - name: logs
        if: failure()
        working-directory: deploy/loams-postgres-dev
        run: docker compose logs --tail 200
      - name: teardown
        if: always()
        working-directory: deploy/loams-postgres-dev
        run: docker compose down -v

  pageserver-loams-wal:
    if: github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: Pageserver ingest
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: the candidate's pins (nf1-candidate.yml, NF1 Task 16)
        if: inputs.candidate-pins
        env:
          CANDIDATE_PINS: ${{ inputs.candidate-pins }}
          CANDIDATE_FORK_COMMIT: ${{ inputs.candidate-fork-commit }}
        run: |
          printf '%s\n' "$CANDIDATE_PINS" > "$RUNNER_TEMP/candidate.toml"
          python3 -I scripts/nf1/candidate.py apply --doc "$RUNNER_TEMP/candidate.toml" \
            --fork-commit "$CANDIDATE_FORK_COMMIT" --env "$GITHUB_ENV"
      # The neon image is about 5 GB and the decoder workspace's build several
      # more; the runner's preinstalled toolchains are not needed.
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: header cache
        id: headers
        uses: actions/cache@v6
        with:
          path: crates/loams-wal-decoder/pg_install
          key: pg-server-headers-${{ env.PG_HEADERS_IMAGE }}
      - name: extract the server headers
        if: steps.headers.outputs.cache-hit != 'true'
        run: scripts/pg2/pg-headers.sh "$PG_HEADERS_IMAGE" crates/loams-wal-decoder/pg_install
      - name: build tools (protoc, libclang for bindgen)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev libclang-dev
      # The cache pg2.yml's wal-decoder job saves (on dev); this job only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: crates/loams-wal-decoder
          cache-directories: ~/.cargo/git/db
          shared-key: pg2-wal-decoder
          save-if: false
      - name: seed the fork's Postgres submodules (shallow)
        run: scripts/pg2/seed-neon-submodules.sh crates/loams-wal-decoder/Cargo.lock
      - name: build loams-wal-interpreted
        working-directory: crates/loams-wal-decoder
        run: |
          export POSTGRES_INSTALL_DIR="$GITHUB_WORKSPACE/crates/loams-wal-decoder/pg_install"
          cargo build --locked --bin loams-wal-interpreted
          target=$(cargo metadata --format-version 1 --no-deps --offline |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          echo "LOAMS_WAL=$target/debug/loams-wal-interpreted" >> "$GITHUB_ENV"
      - name: pull the pinned images
        working-directory: deploy/loams-pg-bench
        run: |
          for i in 1 2 3; do
            docker compose pull rustfs create-bucket storage_broker pageserver compute && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: it_pageserver_discovers_loams_wal_via_broker
        env:
          RUN_DIR: ${{ runner.temp }}/it-pg
          LOAMS_BENCH_LOCK: ${{ runner.temp }}/loams-pg-bench.lock
        run: |
          mkdir -p "$RUN_DIR"
          scripts/pg2/it-pageserver-loams-wal.sh
      - name: logs
        if: failure()
        run: |
          tail -n 200 "${{ runner.temp }}/it-pg/"*.log || true

  pg-control-deploy-neon:
    if: github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: pg-control deploy
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: the candidate's pins (nf1-candidate.yml, NF1 Task 16)
        if: inputs.candidate-pins
        env:
          CANDIDATE_PINS: ${{ inputs.candidate-pins }}
          CANDIDATE_FORK_COMMIT: ${{ inputs.candidate-fork-commit }}
        run: |
          printf '%s\n' "$CANDIDATE_PINS" > "$RUNNER_TEMP/candidate.toml"
          python3 -I scripts/nf1/candidate.py apply --doc "$RUNNER_TEMP/candidate.toml" \
            --fork-commit "$CANDIDATE_FORK_COMMIT" --env "$GITHUB_ENV"
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      # The cache pg2.yml's pg-control job saves (on dev); this job only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: pg2-loams-pg-control
          save-if: false
      - name: build the test and loams-wal
        run: |
          cargo test -p loams-pg-control --locked --test e2e_deploy_neon --no-run
          cargo build -p loams-safekeeper --features server --bin loams-wal --locked
      - name: pull the pinned images
        working-directory: deploy/loams-postgres-dev
        run: |
          for i in 1 2 3; do
            docker compose pull rustfs create-bucket storage_broker pageserver safekeeper1 && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: deploy/loams-postgres-dev storage (with its stock safekeeper1), and loams-wal
        working-directory: deploy/loams-postgres-dev
        run: |
          docker compose up -d --pull never rustfs create-bucket storage_broker pageserver safekeeper1
          nohup "$GITHUB_WORKSPACE/target/debug/loams-wal" --store mem \
            --listen-pg 127.0.0.1:5455 --listen-http 127.0.0.1:7677 > "${{ runner.temp }}/loams-wal.log" 2>&1 &
          for _ in $(seq 1 120); do
            curl -sf localhost:9898/v1/status && curl -sf localhost:7677/v1/status \
              && curl -sf localhost:7676/v1/status && break
            sleep 1
          done
          curl -sf localhost:9898/v1/status && curl -sf localhost:7677/v1/status && curl -sf localhost:7676/v1/status
      - name: e2e_create_project_and_branch
        env:
          NEON_WAL: http://127.0.0.1:7677
        run: cargo test -p loams-pg-control --locked --test e2e_deploy_neon -- --ignored
      # 0.1.0 blocker B2: the release stack points pg-control's --wal at the
      # stock safekeeper1 of the pinned storage image, not at loams-wal. The
      # same CreateProject, branch and delete, against it.
      - name: e2e_create_project_and_branch on the stack's stock safekeeper (B2)
        env:
          NEON_WAL: http://127.0.0.1:7676
        run: cargo test -p loams-pg-control --locked --test e2e_deploy_neon -- --ignored
      - name: logs
        if: failure()
        run: |
          (cd deploy/loams-postgres-dev && docker compose logs --tail 200) || true
          tail -n 200 "${{ runner.temp }}/loams-wal.log" || true
      - name: teardown
        if: always()
        working-directory: deploy/loams-postgres-dev
        run: docker compose down -v

  # PG2 Task 13: the Kubernetes runtime on kind (preinstalled on the runner).
  pg-control-kind:
    if: github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: Kubernetes runtime
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: the candidate's pins (nf1-candidate.yml, NF1 Task 16)
        if: inputs.candidate-pins
        env:
          CANDIDATE_PINS: ${{ inputs.candidate-pins }}
          CANDIDATE_FORK_COMMIT: ${{ inputs.candidate-fork-commit }}
        run: |
          printf '%s\n' "$CANDIDATE_PINS" > "$RUNNER_TEMP/candidate.toml"
          python3 -I scripts/nf1/candidate.py apply --doc "$RUNNER_TEMP/candidate.toml" \
            --fork-commit "$CANDIDATE_FORK_COMMIT" --env "$GITHUB_ENV"
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: pg2-loams-pg-control
          save-if: false
      - name: build the test
        run: cargo test -p loams-pg-control --locked --features kubernetes --test it_kind --no-run
      - name: kind, and the pinned compute image
        run: |
          image="$(python3 -c 'import tomllib; p = tomllib.load(open("deploy/pins/loams-postgres-images.toml", "rb")); c = p["images"]["compute-v17"]; print(c["repository"] + "@" + c["digest"])')"
          kind create cluster --name loams-pg --wait 120s
          # Pull inside the node, so containerd records the image under its
          # digest reference. `kind load docker-image` of a digest-only image
          # imports it as `import-<date>@sha256:...`, which the kubelet then
          # resolves to an image containerd cannot find ("failed to check if
          # this is a checkpoint image").
          for i in 1 2 3; do
            docker exec loams-pg-control-plane crictl pull "$image" && break
            test "$i" -lt 3 || { echo "could not pull $image into the kind node"; exit 1; }
            sleep $((i * 15))
          done
          docker exec loams-pg-control-plane crictl inspecti "$image" > /dev/null
      - name: it_kind_start_bind_and_stop
        run: cargo test -p loams-pg-control --locked --features kubernetes --test it_kind -- --ignored
      - name: logs
        if: failure()
        run: |
          kubectl -n loams-pg-it get pods,services,secrets -o wide || true
          kubectl -n loams-pg-it describe pods || true
          kubectl -n loams-pg-it logs -l app.kubernetes.io/component=postgres-compute --tail 200 || true
      - name: teardown
        if: always()
        run: kind delete cluster --name loams-pg || true

  pg-control-compose-runtime:
    if: github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: Compose runtime
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: the candidate's pins (nf1-candidate.yml, NF1 Task 16)
        if: inputs.candidate-pins
        env:
          CANDIDATE_PINS: ${{ inputs.candidate-pins }}
          CANDIDATE_FORK_COMMIT: ${{ inputs.candidate-fork-commit }}
        run: |
          printf '%s\n' "$CANDIDATE_PINS" > "$RUNNER_TEMP/candidate.toml"
          python3 -I scripts/nf1/candidate.py apply --doc "$RUNNER_TEMP/candidate.toml" \
            --fork-commit "$CANDIDATE_FORK_COMMIT" --env "$GITHUB_ENV"
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      # The cache pg2.yml's pg-control job saves (on dev); this job only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: pg2-loams-pg-control
          save-if: false
      - name: build the test
        run: cargo test -p loams-pg-control --locked --test it_compose --test it_endpoint --no-run
      - name: pull the pinned images
        working-directory: deploy/loams-postgres-dev
        run: |
          for i in 1 2 3; do
            docker compose pull rustfs create-bucket storage_broker pageserver safekeeper1 compute1 && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: deploy/loams-postgres-dev storage
        working-directory: deploy/loams-postgres-dev
        run: |
          docker compose up -d --pull never rustfs create-bucket storage_broker pageserver safekeeper1
          for _ in $(seq 1 120); do
            curl -sf localhost:9898/v1/status && break
            sleep 1
          done
          curl -sf localhost:9898/v1/status
      - name: it_compose_compute_answers_select_1
        env:
          # The upcall listener is on the runner; Docker names it through
          # host-gateway.
          IT_UPCALL_HOST: host.docker.internal
          IT_EXTRA_HOSTS: host.docker.internal:host-gateway
        run: cargo test -p loams-pg-control --locked --test it_compose -- --ignored
      - name: it_endpoint (the lifecycle, and idle detection)
        env:
          IT_UPCALL_HOST: host.docker.internal
          IT_EXTRA_HOSTS: host.docker.internal:host-gateway
        run: cargo test -p loams-pg-control --locked --test it_endpoint -- --ignored
      - name: it_endpoint through the compute runner (R-REL.1)
        env:
          IT_UPCALL_HOST: host.docker.internal
          IT_EXTRA_HOSTS: host.docker.internal:host-gateway
          IT_COMPUTE_RUNNER: "1"
        run: cargo test -p loams-pg-control --locked --test it_endpoint -- --ignored it_endpoint_starts_suspends_and_deletes
      - name: logs
        if: failure()
        run: |
          (cd deploy/loams-postgres-dev && docker compose logs --tail 200) || true
          docker compose -p loams-pg-it logs --tail 200 || true
          docker compose -p loams-pg-it-ep logs --tail 200 || true
          docker compose -p loams-pg-it-idle logs --tail 200 || true
      - name: teardown
        if: always()
        working-directory: deploy/loams-postgres-dev
        run: |
          docker compose -p loams-pg-it down || true
          docker compose -p loams-pg-it-ep down || true
          docker compose -p loams-pg-it-idle down || true
          docker compose down -v

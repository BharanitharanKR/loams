# PG2 end-to-end tests on compose stacks (docs/plans/2026-10-08-pg2-postgres-production.md).
#
# neon-deploy (Task 2): loams-postgres against deploy/loams-postgres-dev at its pinned digests
# (it_deploy_neon_tenant_timeline_branch: attach, timeline, branch, list,
# delete).
#
# pageserver-loams-wal (Tasks 31 and 32, run here since Task 2 pinned the
# bench's Neon images; R32.2): scripts/pg2/it-pageserver-loams-wal.sh on
# deploy/loams-pg-bench with no safekeeper. A compute writes through
# loams-wal-interpreted, the pageserver finds it through the storage broker and
# ingests the interpreted protocol, and a fresh compute reads the rows back.
# This is it_pageserver_discovers_loams_wal_via_broker, which is also Task 31's
# it_pageserver_ingests_from_loams_wal_without_safekeeper.
#
# pg-control-deploy-neon (Task 9, the PG2a exit): e2e_create_project_and_branch,
# the service and the reconciler against deploy/loams-postgres-dev's
# pageserver and a loams-wal (the stack's stock safekeeper refuses
# loams-wal's timeline create, R2.11).
#
# pg-control-compose-runtime (Task 10): it_compose_compute_answers_select_1,
# a compute the compose runtime starts on deploy/loams-postgres-dev's network
# reads its spec from the upcall listener and answers SELECT 1 on its
# endpoint's host port. The same job runs it_endpoint (Tasks 11 and 12): an
# endpoint's start, suspend, restart and delete on real computes, and idle
# detection (a query longer than the suspend timeout keeps the compute
# running; idle, it suspends).
#
# The images are pinned by digest in the compose files; nothing here uses a tag.
name: PG2 e2e

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      # loams-postgres and what it builds on
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/loams-postgres/**"
      - "crates/loams-pg-control/**"
      # compiled into loams-pg-control (runtime::images)
      - "deploy/pins/loams-postgres-images.toml"
      - "crates/loams-kv/**"
      - "crates/loams-proto/**"
      - "proto/**"
      # loams-wal-interpreted and what it builds on (its own workspace)
      - "crates/loams-wal-decoder/**"
      - "crates/loams-safekeeper/**"
      - "crates/loams-tikv/**"
      - "crates/loams-tuple/**"
      # the stacks and the scripts that drive them
      - "deploy/loams-postgres-dev/**"
      - "deploy/loams-pg-bench/**"
      - "scripts/pg2/**"
      - ".github/workflows/pg2-e2e.yml"
  pull_request:
    paths:
      # loams-postgres and what it builds on
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/loams-postgres/**"
      - "crates/loams-pg-control/**"
      # compiled into loams-pg-control (runtime::images)
      - "deploy/pins/loams-postgres-images.toml"
      - "crates/loams-kv/**"
      - "crates/loams-proto/**"
      - "proto/**"
      # loams-wal-interpreted and what it builds on (its own workspace)
      - "crates/loams-wal-decoder/**"
      - "crates/loams-safekeeper/**"
      - "crates/loams-tikv/**"
      - "crates/loams-tuple/**"
      # the stacks and the scripts that drive them
      - "deploy/loams-postgres-dev/**"
      - "deploy/loams-pg-bench/**"
      - "scripts/pg2/**"
      - ".github/workflows/pg2-e2e.yml"

permissions:
  contents: read

concurrency:
  group: pg2-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # The server headers' source: images.storage in deploy/pins/loams-postgres-images.toml,
  # written by scripts/nf1/pins.py (as in pg2.yml; NF1 Task 2).
  PG_HEADERS_IMAGE: ghcr.io/neondatabase/neon@sha256:7a4f124917bb929964b2d696d710f19584f80bb9bd51b2af4a6e2425434c761f
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  neon-deploy:
    name: loams-postgres against deploy/loams-postgres-dev (it_deploy_neon)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      # The cache pg2.yml's neon-client job saves (on dev); this job only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pg2-loams-postgres
          save-if: false
      - name: build the test
        run: cargo test -p loams-postgres --locked --test it_deploy_neon --no-run
      # Pulled on their own, with retries, so a registry hiccup is not a test failure.
      - name: pull the pinned images
        working-directory: deploy/loams-postgres-dev
        run: |
          for i in 1 2 3; do
            docker compose pull rustfs create-bucket storage_broker pageserver && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: deploy/loams-postgres-dev storage
        working-directory: deploy/loams-postgres-dev
        run: |
          docker compose up -d --pull never rustfs create-bucket storage_broker pageserver
          for _ in $(seq 1 120); do curl -sf localhost:9898/v1/status && break; sleep 1; done
          curl -sf localhost:9898/v1/status
      - name: it_deploy_neon_tenant_timeline_branch
        run: cargo test -p loams-postgres --locked --test it_deploy_neon -- --ignored
      - name: logs
        if: failure()
        working-directory: deploy/loams-postgres-dev
        run: docker compose logs --tail 200
      - name: teardown
        if: always()
        working-directory: deploy/loams-postgres-dev
        run: docker compose down -v

  pageserver-loams-wal:
    name: the pageserver ingests from loams-wal (it-pageserver-loams-wal.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      # The neon image is about 5 GB and the decoder workspace's build several
      # more; the runner's preinstalled toolchains are not needed.
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: header cache
        id: headers
        uses: actions/cache@v6
        with:
          path: crates/loams-wal-decoder/pg_install
          key: pg-server-headers-${{ env.PG_HEADERS_IMAGE }}
      - name: extract the server headers
        if: steps.headers.outputs.cache-hit != 'true'
        run: scripts/pg2/pg-headers.sh "$PG_HEADERS_IMAGE" crates/loams-wal-decoder/pg_install
      - name: build tools (protoc, libclang for bindgen)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev libclang-dev
      # The cache pg2.yml's wal-decoder job saves (on dev); this job only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/loams-wal-decoder
          cache-directories: ~/.cargo/git/db
          shared-key: pg2-wal-decoder
          save-if: false
      - name: seed the fork's Postgres submodules (shallow)
        run: scripts/pg2/seed-neon-submodules.sh crates/loams-wal-decoder/Cargo.lock
      - name: build loams-wal-interpreted
        working-directory: crates/loams-wal-decoder
        run: |
          export POSTGRES_INSTALL_DIR="$GITHUB_WORKSPACE/crates/loams-wal-decoder/pg_install"
          cargo build --locked --bin loams-wal-interpreted
          target=$(cargo metadata --format-version 1 --no-deps --offline |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          echo "LOAMS_WAL=$target/debug/loams-wal-interpreted" >> "$GITHUB_ENV"
      - name: pull the pinned images
        working-directory: deploy/loams-pg-bench
        run: |
          for i in 1 2 3; do
            docker compose pull rustfs create-bucket storage_broker pageserver compute && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: it_pageserver_discovers_loams_wal_via_broker
        env:
          RUN_DIR: ${{ runner.temp }}/it-pg
          LOAMS_BENCH_LOCK: ${{ runner.temp }}/loams-pg-bench.lock
        run: |
          mkdir -p "$RUN_DIR"
          scripts/pg2/it-pageserver-loams-wal.sh
      - name: logs
        if: failure()
        run: |
          tail -n 200 "${{ runner.temp }}/it-pg/"*.log || true

  pg-control-deploy-neon:
    name: pg-control against deploy/loams-postgres-dev and loams-wal (e2e_deploy_neon)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      # The cache pg2.yml's pg-control job saves (on dev); this job only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pg2-loams-pg-control
          save-if: false
      - name: build the test and loams-wal
        run: |
          cargo test -p loams-pg-control --locked --test e2e_deploy_neon --no-run
          cargo build -p loams-safekeeper --features server --bin loams-wal --locked
      - name: pull the pinned images
        working-directory: deploy/loams-postgres-dev
        run: |
          for i in 1 2 3; do
            docker compose pull rustfs create-bucket storage_broker pageserver && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: deploy/loams-postgres-dev storage, and loams-wal
        working-directory: deploy/loams-postgres-dev
        run: |
          docker compose up -d --pull never rustfs create-bucket storage_broker pageserver
          nohup "$GITHUB_WORKSPACE/target/debug/loams-wal" --store mem \
            --listen-pg 127.0.0.1:5455 --listen-http 127.0.0.1:7677 > "${{ runner.temp }}/loams-wal.log" 2>&1 &
          for _ in $(seq 1 120); do
            curl -sf localhost:9898/v1/status && curl -sf localhost:7677/v1/status && break
            sleep 1
          done
          curl -sf localhost:9898/v1/status && curl -sf localhost:7677/v1/status
      - name: e2e_create_project_and_branch
        env:
          NEON_WAL: http://127.0.0.1:7677
        run: cargo test -p loams-pg-control --locked --test e2e_deploy_neon -- --ignored
      - name: logs
        if: failure()
        run: |
          (cd deploy/loams-postgres-dev && docker compose logs --tail 200) || true
          tail -n 200 "${{ runner.temp }}/loams-wal.log" || true
      - name: teardown
        if: always()
        working-directory: deploy/loams-postgres-dev
        run: docker compose down -v

  pg-control-compose-runtime:
    name: pg-control's compose runtime and endpoint lifecycle against deploy/loams-postgres-dev (it_compose, it_endpoint)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      # The cache pg2.yml's pg-control job saves (on dev); this job only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pg2-loams-pg-control
          save-if: false
      - name: build the test
        run: cargo test -p loams-pg-control --locked --test it_compose --test it_endpoint --no-run
      - name: pull the pinned images
        working-directory: deploy/loams-postgres-dev
        run: |
          for i in 1 2 3; do
            docker compose pull rustfs create-bucket storage_broker pageserver safekeeper1 compute1 && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: deploy/loams-postgres-dev storage
        working-directory: deploy/loams-postgres-dev
        run: |
          docker compose up -d --pull never rustfs create-bucket storage_broker pageserver safekeeper1
          for _ in $(seq 1 120); do
            curl -sf localhost:9898/v1/status && break
            sleep 1
          done
          curl -sf localhost:9898/v1/status
      - name: it_compose_compute_answers_select_1
        env:
          # The upcall listener is on the runner; Docker names it through
          # host-gateway.
          IT_UPCALL_HOST: host.docker.internal
          IT_EXTRA_HOSTS: host.docker.internal:host-gateway
        run: cargo test -p loams-pg-control --locked --test it_compose -- --ignored
      - name: it_endpoint (the lifecycle, and idle detection)
        env:
          IT_UPCALL_HOST: host.docker.internal
          IT_EXTRA_HOSTS: host.docker.internal:host-gateway
        run: cargo test -p loams-pg-control --locked --test it_endpoint -- --ignored
      - name: logs
        if: failure()
        run: |
          (cd deploy/loams-postgres-dev && docker compose logs --tail 200) || true
          docker compose -p loams-pg-it logs --tail 200 || true
          docker compose -p loams-pg-it-ep logs --tail 200 || true
      - name: teardown
        if: always()
        working-directory: deploy/loams-postgres-dev
        run: |
          docker compose -p loams-pg-it down || true
          docker compose -p loams-pg-it-ep down || true
          docker compose down -v

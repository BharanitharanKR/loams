# PG2 (docs/plans/2026-10-08-pg2-postgres-production.md).
#
# postgres-protos (Task 1): `loams.postgres.v1` passes `buf lint` (STANDARD)
# and `buf breaking` (FILE, against dev), and its descriptor tests.
#
# wal-decoder: loams-wal's in-process interpreted sender (Task 31). crates/loams-wal-decoder is a
# workspace of its own that links the Neon fork's crates; their
# postgres_ffi generates bindings from the Postgres 14..17 server headers,
# which are extracted from a `neon` image pinned by digest and cached per
# digest. Its golden tests compare loams-wal's stream with the fork's
# safekeeper's (tests/fixtures).
#
# neon-client (Task 2): loams-postgres's fixture tests (the request bodies and
# answers recorded from deploy/loams-postgres-dev at its pinned digests).
#
# pg-control (Task 3 onward): loams-pg-control's tests on the local store, and
# clippy on the default and the tikv build. Its TiKV conformance runs in
# ci.yml's TiKV suites job, against the playground.
#
# pg-control-role (Task 9): the `loams pg-control` role (feature `postgres`):
# authorization, audit, the API and upcall listeners, served-only
# reflection, and that the default build links none of it.
name: Postgres

on:
  workflow_dispatch:
  # nf1-candidate.yml (NF1 Task 16, G3 of the fork's gate): the WAL decoder job on a
  # release candidate's images, with the pin file and its consumers rewritten
  # in the job's checkout.
  workflow_call:
    inputs:
      candidate-pins:
        description: "A Loams Postgres release candidate's pin document (TOML)"
        type: string
        default: ""
      candidate-fork-commit:
        description: "The ostrium-labs/loams-postgres commit the candidate was built from"
        type: string
        default: ""
  # On dev too, so that the caches pull requests restore are warm.
  push:
    branches: [dev]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "crates/loams-safekeeper/**"
      - "crates/loams-tikv/**"
      - "crates/loams-wal-decoder/**"
      - "crates/loams-postgres/**"
      - "crates/loams-pg-control/**"
      - "crates/loams-pgdog-sync/**"
      # compiled into loams-pg-control (runtime::images)
      - "deploy/pins/loams-postgres-images.toml"
      - "crates/loams/Cargo.toml"
      - "crates/loams/src/lib.rs"
      - "crates/loams/src/main.rs"
      - "crates/loams/src/pg_control.rs"
      - "crates/loams/src/pg_control_cli.rs"
      - "crates/loams/src/api/mod.rs"
      - "crates/loams/src/api/connect.rs"
      - "crates/loams/src/api/connect_postgres.rs"
      - "crates/loams/src/api/postgres_messages.rs"
      - "crates/loams/tests/pg_control.rs"
      - "crates/loams-kv/**"
      - "scripts/pg2/**"
      - "proto/**"
      - "buf.yaml"
      - "crates/loams-proto/**"
      - "docs/api/reasons.md"
      - "docs/api/route-map.md"
      - "docs/design/46-loams-postgres-production.md"
      - ".github/workflows/pg2.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "crates/loams-safekeeper/**"
      - "crates/loams-tikv/**"
      - "crates/loams-wal-decoder/**"
      - "crates/loams-postgres/**"
      - "crates/loams-pg-control/**"
      - "crates/loams-pgdog-sync/**"
      # compiled into loams-pg-control (runtime::images)
      - "deploy/pins/loams-postgres-images.toml"
      - "crates/loams/Cargo.toml"
      - "crates/loams/src/lib.rs"
      - "crates/loams/src/main.rs"
      - "crates/loams/src/pg_control.rs"
      - "crates/loams/src/pg_control_cli.rs"
      - "crates/loams/src/api/mod.rs"
      - "crates/loams/src/api/connect.rs"
      - "crates/loams/src/api/connect_postgres.rs"
      - "crates/loams/src/api/postgres_messages.rs"
      - "crates/loams/tests/pg_control.rs"
      - "crates/loams-kv/**"
      - "scripts/pg2/**"
      - "proto/**"
      - "buf.yaml"
      - "crates/loams-proto/**"
      - "docs/api/reasons.md"
      - "docs/api/route-map.md"
      - "docs/design/46-loams-postgres-production.md"
      - ".github/workflows/pg2.yml"

# A newer push to the same pull request supersedes the older run (the runner
# pool is shared by every workflow). dev runs to completion, so its cache save
# lands; main, a dispatch (the nightly) and a candidate run do too.
concurrency:
  # A candidate run (workflow_call) is its own group, so it never cancels or
  # waits on the branch's own runs.
  group: pg2-${{ inputs.candidate-pins && format('candidate-{0}', github.run_id) || format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI builds are never debugged: no debug info in dev and test builds (smaller
  # caches, faster links; a panic still names its file and line) and no
  # incremental artifacts. rust-cache sets CARGO_INCREMENTAL=0 too; this covers
  # the jobs without it.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # The headers' source: images.storage in deploy/pins/loams-postgres-images.toml, written
  # by scripts/nf1/pins.py (NF1 Task 2). Since NF1 Task 14 a Loams Postgres release; the
  # golden fixtures' safekeeper came from Neon 77e22e4b (16.9, 17.5, R31.6). Since
  # lp-2026.11.0 the headers are 16.15 and 17.11, minors of the same majors, whose WAL
  # format the fork keeps (docs/loams/pg17-vm-clear.md there); its G3 ran this workflow's
  # decoder job on them. Its multi-arch index.
  PG_HEADERS_IMAGE: ghcr.io/ostrium-labs/loams-postgres-storage@sha256:4dcec4cbef637b92b1088ea2c0bc857f3b5ef4318f02e8d2d4a0f9263ed4140e
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  postgres-protos:
    if: ${{ !inputs.candidate-pins }}
    name: Protos
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # buf is pinned as a devDependency of @loams/proto, as in ci.yml's
      # app-protos job.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: buf lint (STANDARD)
        run: web/packages/proto/node_modules/.bin/buf lint
      # Against the pull request's base: a release pull request into main is
      # cut from dev and lacks what dev gained since, which is not a break.
      - name: buf breaking (FILE, against the base branch)
        env:
          BASE: ${{ github.base_ref || 'dev' }}
        run: |
          git fetch --no-tags origin "$BASE"
          web/packages/proto/node_modules/.bin/buf breaking --against ".git#branch=origin/$BASE"
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: the descriptor, reasons and route-map tests
        run: cargo test -p loams-proto --test postgres --locked

  neon-client:
    if: ${{ !inputs.candidate-pins }}
    name: Client fixtures
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      # Shared with pg2-e2e.yml's neon-deploy, which only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: pg2-loams-postgres
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: test
        run: cargo test -p loams-postgres --locked
      - name: clippy
        run: cargo clippy -p loams-postgres --all-targets --locked -- -D warnings

  wal-decoder:
    # Full tier: a pull request into main, a dispatch (the nightly), not dev.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: WAL decoder
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: the candidate's pins (nf1-candidate.yml, NF1 Task 16)
        if: inputs.candidate-pins
        env:
          CANDIDATE_PINS: ${{ inputs.candidate-pins }}
          CANDIDATE_FORK_COMMIT: ${{ inputs.candidate-fork-commit }}
        run: |
          printf '%s\n' "$CANDIDATE_PINS" > "$RUNNER_TEMP/candidate.toml"
          python3 -I scripts/nf1/candidate.py apply --doc "$RUNNER_TEMP/candidate.toml" \
            --fork-commit "$CANDIDATE_FORK_COMMIT" --env "$GITHUB_ENV"
      - name: the Neon fork stays out of the main workspace
        run: python3 scripts/pg2/check-decoder-deny.py .
      - name: header cache
        id: headers
        uses: actions/cache@v6
        with:
          path: crates/loams-wal-decoder/pg_install
          key: pg-server-headers-${{ env.PG_HEADERS_IMAGE }}
      - name: extract the server headers
        if: steps.headers.outputs.cache-hit != 'true'
        run: scripts/pg2/pg-headers.sh "$PG_HEADERS_IMAGE" crates/loams-wal-decoder/pg_install
      - name: build tools (protoc, libclang for bindgen)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev libclang-dev
      # Shared with pg2-e2e.yml's pageserver-loams-wal, which only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: crates/loams-wal-decoder
          cache-directories: ~/.cargo/git/db
          shared-key: pg2-wal-decoder
          # Not from a candidate run (nf1-candidate.yml dispatches on dev).
          save-if: ${{ github.ref == 'refs/heads/dev' && !inputs.candidate-pins }}
      # One commit per Postgres submodule instead of the full history: the
      # build reads the headers from POSTGRES_INSTALL_DIR, never the sources.
      - name: seed the fork's Postgres submodules (shallow)
        run: scripts/pg2/seed-neon-submodules.sh crates/loams-wal-decoder/Cargo.lock
      - uses: taiki-e/install-action@badb8c3638e0b773c6c17a6025c2306a8f1c4303 # the pin fabric.yml uses (2026-10-02)
        with:
          tool: cargo-deny
      - name: licences, advisories, bans, sources (the decoder's own policy)
        working-directory: crates/loams-wal-decoder
        run: cargo deny check
      - name: test
        working-directory: crates/loams-wal-decoder
        run: |
          export POSTGRES_INSTALL_DIR="$GITHUB_WORKSPACE/crates/loams-wal-decoder/pg_install"
          cargo test --locked
      - name: build loams-wal-interpreted (nvme)
        working-directory: crates/loams-wal-decoder
        run: |
          export POSTGRES_INSTALL_DIR="$GITHUB_WORKSPACE/crates/loams-wal-decoder/pg_install"
          cargo build --locked --bin loams-wal-interpreted --features nvme
      - name: build loams-wal-interpreted (tikv)
        working-directory: crates/loams-wal-decoder
        run: |
          export POSTGRES_INSTALL_DIR="$GITHUB_WORKSPACE/crates/loams-wal-decoder/pg_install"
          cargo build --locked --bin loams-wal-interpreted --features tikv

  pg-control:
    # Full tier: a pull request into main, a dispatch (the nightly), not dev.
    if: ${{ !inputs.candidate-pins && (github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
    name: pg-control
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: pg2-loams-pg-control
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: test
        env:
          LOAMS_TEST_PD: ""
          LOAMS_TEST_TMPDIR: ${{ runner.temp }}
        run: cargo test -p loams-pg-control -p loams-pgdog-sync --locked
      - name: clippy (default)
        run: cargo clippy -p loams-pg-control -p loams-pgdog-sync --all-targets --locked -- -D warnings
      - name: clippy (tikv)
        run: cargo clippy -p loams-pg-control --all-targets --features tikv --locked -- -D warnings
      - name: test (the Kubernetes secret store, against a stand-in API)
        run: cargo test -p loams-pg-control --features kubernetes --test secrets_kube --test runtime_kube --locked
      - name: clippy (kubernetes, keyring)
        run: cargo clippy -p loams-pg-control --all-targets --features kubernetes,keyring --locked -- -D warnings

  pg-control-role:
    # Full tier: a pull request into main, a dispatch (the nightly), not dev.
    if: ${{ !inputs.candidate-pins && (github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
    name: Engine with pg-control
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: pg2-loams-pg-control-role
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: test (feature postgres; the binary's unit tests too)
        run: cargo test -p loams --features postgres --locked --test pg_control --bins
      - name: test (default features)
        run: cargo test -p loams --locked --test pg_control
      - name: clippy (postgres, postgres-kubernetes)
        run: cargo clippy -p loams --all-targets --features postgres-kubernetes --locked -- -D warnings

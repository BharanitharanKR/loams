name: TEMP agentd platforms (remove before merge)
on:
  push:
    branches: [rel-agentd-platforms]
permissions:
  contents: read
jobs:
  build:
    name: "agentd ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, runner: windows-2025 }
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-x64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: protoc (macos)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: protoc and NASM (windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-build-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: tmp-agentd-${{ matrix.name }}
      - name: build and run
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p loams-agentd
          exe=target/release/loams-agentd; [ "$RUNNER_OS" = Windows ] && exe=target/release/loams-agentd.exe
          "$exe" version
          "$exe" --help | head -30

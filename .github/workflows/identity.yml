# IA0 (docs/plans/2026-10-21-ia1-identity-authz.md, design §76): the OpenFGA model tests and the
# Zitadel + OpenFGA compose smoke. Not part of CI required while identity is a spike (D1621).
name: Identity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "conformance/identity/**"
      - "deploy/openfga/**"
      - "spikes/ia0-authz/**"
      - "crates/loams-authz/**"
      - "crates/loams-zitadel/**"
      - ".github/workflows/identity.yml"

# Superseded runs of a pull request are cancelled; a push to main, a tag,
# a dispatch (the nightly) and a schedule run to completion. The event is in
# the group, so a push never cancels a dispatch on the same branch.
concurrency:
  group: identity-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  openfga-model:
    name: "Identity: OpenFGA model v1 tests"
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fga model validate and test (openfga/cli v0.8.1, pinned by digest)
        working-directory: conformance/identity
        run: |
          ./fga.sh model validate --file /model/fga.mod | tee /dev/stderr | jq -e '.is_valid'
          ./fga.sh model test --tests /model/core.fga.yaml
      - name: no_cross_org_tuples self-test
        run: python3 -I conformance/identity/cross_org_scan.py --self-test

  identity-smoke:
    name: "Identity: Zitadel + OpenFGA compose smoke"
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: spikes/ia0-authz
          shared-key: ia0-authz
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: build the spike service
        run: cargo build --release --locked --manifest-path spikes/ia0-authz/Cargo.toml
      - name: clippy and offline tests
        run: |
          cargo clippy --release --locked --manifest-path spikes/ia0-authz/Cargo.toml --all-targets -- -D warnings
          cargo test --release --locked --manifest-path spikes/ia0-authz/Cargo.toml
      - name: smoke (up, bootstrap, allow/deny scenario, Actions v2, cross-org scan, down)
        run: IA0_SPIKE_BIN="$PWD/spikes/ia0-authz/target/release/ia0-authz" conformance/identity/smoke.sh

  loams-authz:
    name: "Identity: loams-authz against OpenFGA"
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: loams-authz
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: start OpenFGA (profile authz) and write model v1
        working-directory: conformance/identity
        run: |
          set -euo pipefail
          printf 'ZITADEL_MASTERKEY=x\nZITADEL_DB_PASSWORD=x\nZITADEL_ADMIN_PASSWORD=x\nLOGIN_SESSION_COOKIE_SECRET=x\n' > .env
          docker compose --profile authz up -d --wait
          store=$(curl -fsS -X POST http://127.0.0.1:18081/stores -d '{"name":"loams-authz-ci"}' | jq -re .id)
          model=$(./fga.sh model write --store-id "$store" --file /model/fga.mod | jq -re .authorization_model_id)
          {
            echo "LOAMS_AUTHZ_OPENFGA_GRPC=http://127.0.0.1:18082"
            echo "LOAMS_AUTHZ_OPENFGA_STORE=$store"
            echo "LOAMS_AUTHZ_OPENFGA_MODEL=$model"
          } >> "$GITHUB_ENV"
      - name: test (unit and OpenFGA integration)
        run: cargo test -p loams-authz --locked
      - name: clippy
        run: cargo clippy -p loams-authz --all-targets --locked -- -D warnings

  loams-zitadel:
    name: "Identity: loams-zitadel agents against Zitadel and OpenFGA"
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: loams-zitadel
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: build the tests while the stack starts
        run: cargo test -p loams-zitadel --locked --no-run
      - name: start Zitadel and OpenFGA (the IA0 stack) and bootstrap them
        run: conformance/identity/up.sh
      - name: test (fake and live)
        working-directory: conformance/identity
        run: |
          set -euo pipefail
          set -a; source .env.ia0; set +a
          export LOAMS_IDENTITY_ZITADEL_URL="$IA0_ISSUER"
          export LOAMS_IDENTITY_ZITADEL_TOKEN_FILE="$PWD/.secrets/admin.pat"
          export LOAMS_IDENTITY_ZITADEL_ORG="$IA0_ORG"
          export LOAMS_IDENTITY_ZITADEL_PROJECT="$IA0_AUDIENCE"
          export LOAMS_AUTHZ_OPENFGA_GRPC="${IA0_FGA_GRPC:-http://127.0.0.1:18082}"
          export LOAMS_AUTHZ_OPENFGA_STORE="$IA0_STORE"
          export LOAMS_AUTHZ_OPENFGA_MODEL="$IA0_MODEL"
          cd ../.. && cargo test -p loams-zitadel --locked -- --test-threads 1
      - name: clippy
        run: cargo clippy -p loams-zitadel --all-targets --locked -- -D warnings
      - name: stop the stack
        if: always()
        working-directory: conformance/identity
        run: docker compose --profile identity --profile authz down -v || true

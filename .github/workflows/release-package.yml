name: Release packages

# Linux packages, the Windows zip and the macOS tarballs of the `loams` binary, with
# `git-remote-loams` (git's helper for `loams::` URLs, crates/loams-git-remote)
# installed next to it, for a published release (the server stack itself ships as Linux containers; on macOS and
# Windows it runs under Docker Desktop). This is the piece
# that gives .github/workflows/release-sign.yml something to sign: its `sign`
# job refuses to submit unless an .rpm is in the set (D625), because SignPath's
# free Open Source Code Signing programme can sign `<rpm-sign>` and nothing else
# Loams builds (D621). Before this workflow the repository produced no .rpm at
# all, so the signing pipeline had nothing to sign and said so.
#
# docs/release/packaging.md is the page a maintainer reads. It names every
# secret and variable below, what is signed, and what is not. Read that before
# changing this file.
#
# What this workflow produces, per release tag:
#
#   Linux    loams_<v>_amd64.deb, loams-<v>-1.x86_64.rpm,
#            loams-<v>-1-x86_64.pkg.tar.zst  (+ .sig when a GPG key exists)
#            (both binaries in /usr/bin)
#   Windows  loams-<v>-windows-x86_64.zip, holding loams.exe,
#            git-remote-loams.exe and the console
#   macOS    loams-<v>-macos-arm64.tar.gz, loams-<v>-macos-x86_64.tar.gz, holding
#            loams, git-remote-loams and the console. arm64 builds on macos-15, x86_64 on
#            macos-15-intel (variables MACOS_ARM64_RUNNER / MACOS_X64_RUNNER swap
#            them; a runner of the other architecture cross-compiles), stripped
#            and ad-hoc signed:
#            Apple Silicon will not run an arm64 binary with no signature at all.
#            There is no Developer ID signature or notarization (no Apple
#            certificate in this project yet), so a downloaded copy is quarantined
#            and the notes carry the `xattr -d com.apple.quarantine` step.
#   agentd   loams-agentd-<v>-linux-x86_64.tar.gz, loams-agentd-<v>-linux-aarch64.tar.gz:
#            the agent daemon for a headless Linux host (#874), each built on its
#            architecture's own runner. The top-level directory holds loams-agentd,
#            loams, SHA256SUMS and VERSION, the layout `loams-agentd install-runtime
#            --from` reads (install-runtime copies both binaries, so `loams` is in it).
#
# Signing, and the shape of the gate:
#
#   * The .deb and the .pkg.tar.zst are signed here, with the project's GPG key,
#     because SignPath's free programme cannot sign either (D621). nFPM writes the
#     .deb's _gpgorigin and gpg writes the pacman .sig.
#   * The .rpm is NOT signed here. nFPM 2.47.0 cannot sign an RPM at all, so the
#     .rpm goes to .github/workflows/release-sign.yml, which submits it to
#     SignPath's <rpm-sign>. That is the whole reason the .rpm is built here.
#   * Windows is unsigned, by decision (D620). There is no code-signing
#     certificate in this project. The zip says so on its face.
#   * macOS is ad-hoc signed only (see above), which is not an identity.
#   * The loams-agentd tarballs are unsigned, like the Windows zip; the release's
#     SHA256SUMS (release-checksums.yml) lists them.
#
# Dispatch with dry_run: true to build every artifact from the dispatched ref and
# keep them as workflow artifacts only: no release is read or written, so the
# workflow can be tested on a branch.
#
# The gate is the same shape as release-sign.yml's: with no configuration the run
# builds the artifacts, warns loudly that they are unsigned, and does not
# pretend otherwise; dispatch with require_signing: true and it fails, naming
# exactly what is missing. No step in this file reports a signature it did not
# produce -- scripts/release/build-artifacts.py reads every signature back off
# the finished artifact and writes signing.json.
#
# Repository publication is deliberately NOT done here. Publishing an apt, dnf
# or pacman repository means putting packages in a public registry, and
# scripts/release/make-repo.py refuses to build a repository from an unsigned
# package at all. See "Repositories" in docs/release/packaging.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to package, vX.Y.Z. Defaults to the dispatched release.'
        required: false
        default: ''
      require_signing:
        description: >-
          Fail the run when no GPG signing key is configured, instead of building
          unsigned packages. Use this once the key exists, so a release cannot
          quietly ship unsigned.
        type: boolean
        required: false
        default: false
      dry_run:
        description: >-
          Build everything from the dispatched ref and keep the files as workflow
          artifacts; attach nothing and touch no release. The tag input is ignored.
        type: boolean
        required: false
        default: false

# `contents: write` is what attaches the artifacts to the release. This workflow
# does hold write permission, because attaching a package to a release is its
# entire purpose; release-sign.yml deliberately does not, because submitting a
# signing request and publishing are different powers.
permissions:
  contents: write

concurrency:
  group: release-package-${{ inputs.dry_run && github.run_id || github.event.release.tag_name || inputs.tag || github.run_id }}
  # Two runs attaching to one release would interleave their asset lists.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Shipped artefacts never come from a task cache (docs/guides/nx-cloud.md): no Nx Cloud,
  # and no cached Nx results, local or remote.
  NX_NO_CLOUD: 'true'
  NX_SKIP_NX_CACHE: 'true'
  # The server's features: the release image's (deploy/release/Containerfile.loams
  # FEATURES), so `loams dev` from a package serves what the image serves,
  # Durable on 127.0.0.1:8001 included (#925, D262). The Linux job checks the
  # two lists are equal.
  LOAMS_PACKAGE_FEATURES: live,live-tikv,durable,durable-tikv,graph,git,tikv,pgwire,mysql-wire,stream-grpc
  RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || github.event.repository.default_branch }}

jobs:
  # The same guard release-crates.yml and release-sign.yml run: the tag must be a
  # published release on the release branch, at the workspace version. The code
  # that runs is the branch's, and the source under review includes the build
  # scripts and the packaging definitions, which is what makes the artifact
  # traceable to a reviewed commit.
  guard:
    name: Tag guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      version: ${{ steps.guard.outputs.version }}
      mtime: ${{ steps.guard.outputs.mtime }}
      # The commit every build job checks out: the tag's, or the dispatched one on a dry run.
      ref: ${{ steps.guard.outputs.ref }}
      dry_run: ${{ steps.guard.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.RELEASE_BRANCH || github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: the tag is a published release on the release branch
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            version=$(git show "$GITHUB_SHA:Cargo.toml" | python3 -c 'import tomllib,sys;print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')
            {
              echo "tag=v$version"; echo "version=$version"
              echo "mtime=$(git show -s --format=%cI "$GITHUB_SHA")"
              echo "ref=$GITHUB_SHA"; echo "dry_run=true"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::dry run: building $GITHUB_SHA as $version; nothing is attached to any release"
            exit 0
          fi
          test -n "$TAG" || { echo 'no release tag: dispatch with the tag input'; exit 1; }
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "$TAG is not a vX.Y.Z(-pre) tag"; exit 1
          fi
          gh release view "$TAG" --json isDraft,tagName -q '"release " + .tagName' \
            || { echo "$TAG is not a published release"; exit 1; }
          git rev-parse --verify "refs/tags/$TAG^{commit}" > "$RUNNER_TEMP/tag.sha" \
            || { echo "$TAG has no commit in this repository"; exit 1; }
          tag_sha=$(cat "$RUNNER_TEMP/tag.sha")
          git merge-base --is-ancestor "$tag_sha" HEAD \
            || { echo "$TAG is not on $RELEASE_BRANCH; refusing to package a tag from anywhere else"; exit 1; }
          version=$(python3 -c 'import tomllib,sys;print(tomllib.load(open(sys.argv[1],"rb"))["workspace"]["package"]["version"])' Cargo.toml)
          if [ "${TAG#v}" != "$version" ]; then
            echo "the workspace version is $version but the release tag is $TAG"; exit 1
          fi
          # The packages bake this timestamp in, rather than the build machine's
          # clock, so two builds of the same commit produce the same bytes.
          mtime=$(git show -s --format=%cI "$tag_sha")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mtime=$mtime" >> "$GITHUB_OUTPUT"
          echo "ref=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "dry_run=false" >> "$GITHUB_OUTPUT"
          echo "$TAG ($version) is a published release on $RELEASE_BRANCH at $tag_sha, mtime $mtime"

  # Decides, out loud, whether this run signs. Same rule as release-sign.yml's
  # preflight: warn and continue by default, fail when the dispatcher asked for
  # signing and there is no key.
  preflight:
    name: GPG signing configuration
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: decide whether this run signs
        id: decide
        env:
          LOAMS_GPG_PRIVATE_KEY: ${{ secrets.LOAMS_GPG_PRIVATE_KEY }}
          LOAMS_GPG_KEY_ID: ${{ vars.LOAMS_GPG_KEY_ID }}
          REQUIRE_SIGNING: ${{ inputs.require_signing == true }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${LOAMS_GPG_PRIVATE_KEY:-}" ]] || missing+=("secret LOAMS_GPG_PRIVATE_KEY")
          [[ -n "${LOAMS_GPG_KEY_ID:-}" ]] || missing+=("variable LOAMS_GPG_KEY_ID")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "mode=sign" >> "$GITHUB_OUTPUT"
            echo "A GPG key is configured; the .deb and the .pkg.tar.zst will be signed."
            echo "The .rpm will still be unsigned here and is signed by .github/workflows/release-sign.yml (SignPath <rpm-sign>)."
            echo "The Windows zip is unsigned by decision and will not be signed by this workflow."
            exit 0
          fi
          if [ "$REQUIRE_SIGNING" = true ]; then
            echo "::error::No GPG signing key is configured and require_signing was set, so this release would ship unsigned."
            printf 'missing: %s\n' "${missing[@]}"
            echo "docs/release/packaging.md has the setup, including the two steps that need an organisation owner."
            exit 1
          fi
          echo "mode=skip" >> "$GITHUB_OUTPUT"
          echo "::warning title=No GPG signing key::The .deb and the .pkg.tar.zst will be UNSIGNED. Missing: ${missing[*]}."
          echo "::warning title=No signature was produced::The Linux packages are unsigned. The .rpm is unsigned until SignPath runs; the Windows zip is unsigned by decision. Do not describe this release as signed."

  linux:
    name: "Linux: packages (deb, rpm, pkg.tar.zst)"
    needs: [guard, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      assets: ${{ steps.collect.outputs.assets }}
      summary: ${{ steps.collect.outputs.summary }}
    steps:
      # The tag's commit, not the dispatching branch's head: the packages are that release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      # Six build.rs scripts in this workspace shell out to protoc (see
      # docs/build-from-source/windows.md for the crate-by-crate list). CI
      # installs it the same way.
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Dry runs only: a run that publishes builds without a cache another
        # run could have written (cache poisoning).
        if: inputs.dry_run == true

      # The packaging scripts' own tests. They build real .deb, .rpm and
      # .pkg.tar.zst files from fixtures, so a packaging definition that nFPM
      # rejects fails here rather than on a release.
      - name: the packaging self-tests
        run: |
          set -euo pipefail
          bash scripts/release/install-nfpm.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH applies from the next step on; without this the self-test
          # skipped every nFPM case and the package call below was never exercised.
          export PATH="$RUNNER_TEMP/bin:$PATH"
          python3 scripts/release/build-artifacts.py --self-test
          python3 scripts/release/make-repo.py --self-test

      # The console is a separate pnpm workspace. The engine serves it at /ui/
      # from /usr/share/loams/console. Its build is deliberately non-fatal: a
      # TypeScript error in the console must not stop the .deb, the .rpm and
      # the pacman package from being produced. The packaging script then
      # ships the packages without the console and says so on stderr.
      - name: the web console (non-fatal)
        id: console
        continue-on-error: true
        run: |
          set -euo pipefail
          cd web
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          test -f apps/console/dist/index.html

      - name: the package features are the image's
        run: |
          set -euo pipefail
          image=$(sed -n 's/^ARG FEATURES=//p' deploy/release/Containerfile.loams)
          [ "$image" = "$LOAMS_PACKAGE_FEATURES" ] || {
            echo "::error::LOAMS_PACKAGE_FEATURES ($LOAMS_PACKAGE_FEATURES) differs from Containerfile.loams FEATURES ($image)"; exit 1; }

      - name: build the server binary
        run: cargo build --release -j 4 -p loams --bin loams --locked --features "$LOAMS_PACKAGE_FEATURES"

      # Durable answers on its loopback listener (#925): a package built
      # without `durable` started and served nothing on 8001.
      - name: smoke test (Durable on 127.0.0.1:8001)
        run: scripts/release/smoke-durable.sh target/release/loams

      # A separate cargo call, so the helper's dependencies cannot change the
      # server's feature set (features unify across the packages of one build).
      - name: build git-remote-loams
        run: |
          set -euo pipefail
          cargo build --release -j 4 -p loams-git-remote --bin git-remote-loams --locked
          target/release/git-remote-loams --version

      # Recorded in the release notes so a reader can see what the binary
      # actually links against, next to the depends list nfpm.yaml declares.
      # The helper must need nothing the server does not, or the one depends
      # list in nfpm.yaml would not cover it.
      - name: the binaries' dynamic dependencies
        run: |
          set -euo pipefail
          readelf -d target/release/loams | grep NEEDED | tee "$RUNNER_TEMP/needed.txt"
          readelf -d target/release/git-remote-loams | grep NEEDED | tee "$RUNNER_TEMP/needed-git-remote.txt"
          extra=$(comm -13 <(grep -o '\[.*\]' "$RUNNER_TEMP/needed.txt" | sort -u) \
                           <(grep -o '\[.*\]' "$RUNNER_TEMP/needed-git-remote.txt" | sort -u))
          if [ -n "$extra" ]; then
            echo "::error::git-remote-loams needs libraries the server does not, so release/nfpm.yaml's depends list does not cover it: $extra"
            exit 1
          fi
          # The libraries release/nfpm.yaml's depends lists cover (#1105: libz.so.1
          # shipped undeclared in 0.1.1). A new one fails here, not on install:
          # add its package to every format in nfpm.yaml, then to this list.
          covered="ld-linux-x86-64.so.2 libc.so.6 libgcc_s.so.1 libm.so.6 libz.so.1"
          undeclared=$(comm -23 <(grep -o '\[.*\]' "$RUNNER_TEMP/needed.txt" | tr -d '[]' | sort -u) \
                                <(tr ' ' '\n' <<<"$covered" | sort -u))
          if [ -n "$undeclared" ]; then
            echo "::error::the server links libraries release/nfpm.yaml does not declare: $undeclared"
            exit 1
          fi

      - name: build the three Linux packages
        id: package
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          MTIME: ${{ needs.guard.outputs.mtime }}
          SIGN: ${{ needs.preflight.outputs.mode == 'sign' }}
          LOAMS_GPG_PRIVATE_KEY: ${{ secrets.LOAMS_GPG_PRIVATE_KEY }}
          LOAMS_GPG_KEY_ID: ${{ vars.LOAMS_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/packages"
          mkdir -p "$out"
          nfpm --version | tail -1

          args=(package --version "$VERSION" --binary target/release/loams
                --git-remote target/release/git-remote-loams
                --format deb --format rpm --format archlinux
                --out "$out" --mtime "$MTIME")

          # The console is packaged when it built, and its absence is the
          # script's problem to report rather than a reason to fail here.
          if [ -f web/apps/console/dist/index.html ]; then
            args+=(--console web/apps/console/dist)
          else
            echo "::notice::no console build; the packages will ship without /usr/share/loams/console"
          fi

          if [ "$SIGN" = true ]; then
            # The key is a secret; the file goes in the runner's temp directory,
            # is imported by the script, and is removed below. The runner is
            # ephemeral, and this is the same key material the SignPath policy
            # holds. The .rpm is deliberately left unsigned here.
            printf '%s' "$LOAMS_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/loams-signing-key.asc"
            chmod 600 "$RUNNER_TEMP/loams-signing-key.asc"
            # nFPM's key_id is a 64-bit long id (16 hex digits) and a 40-digit
            # fingerprint overflows it ("value out of range", v0.1.0 run
            # 39186624061). LOAMS_GPG_KEY_ID is the fingerprint, whose last 16
            # digits are the long id; gpg --local-user takes either.
            key_id="${LOAMS_GPG_KEY_ID// /}"
            [[ "$key_id" =~ ^[0-9A-Fa-f]{16}([0-9A-Fa-f]{24})?$ ]] \
              || { echo "::error::LOAMS_GPG_KEY_ID is not a 16- or 40-digit hex key id"; exit 1; }
            args+=(--gpg-key "$RUNNER_TEMP/loams-signing-key.asc"
                   --gpg-key-id "${key_id: -16}")
          fi

          python3 scripts/release/build-artifacts.py "${args[@]}"
          rm -f "$RUNNER_TEMP/loams-signing-key.asc"
          ls -l "$out"

      - name: attach the packages to the release
        if: needs.guard.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          # --clobber so a re-run of the same tag replaces the previous
          # artifacts instead of failing on the ones already there.
          gh release upload "$TAG" "$RUNNER_TEMP"/packages/* --clobber

      - name: report what was built and what was signed
        id: collect
        env:
          OUT: ${{ runner.temp }}/packages
        run: |
          set -euo pipefail
          # signing.json is written by build-artifacts.py from signatures read
          # back off the finished artifacts, so this table is that file, not a
          # restatement of which key was configured.
          python3 -c '
          import json, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          report = json.loads((out / "signing.json").read_text(encoding="utf-8"))
          for name, entry in sorted(report.items()):
              state = "signed" if entry["signed"] else "UNSIGNED"
              print("\t".join([name, entry["format"], state, entry["method"]]))
          ' "$OUT" | tee "$RUNNER_TEMP/signing.tsv"
          {
            echo "assets<<EOF"
            (cd "$OUT" && ls | grep -E '\.(deb|rpm|pkg\.tar\.zst|sig|json)$')
            echo "EOF"
            echo "summary<<EOF"
            cat "$RUNNER_TEMP/signing.tsv"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loams-linux-${{ needs.guard.outputs.tag }}
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
          retention-days: 30

  windows:
    name: "Windows: zip (unsigned)"
    needs: [guard]
    runs-on: windows-latest
    # A cold Windows build of the workspace takes about an hour.
    timeout-minutes: 240
    outputs:
      assets: ${{ steps.collect.outputs.assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      # Documented, per crate, in docs/build-from-source/windows.md: six build.rs
      # scripts need protoc, and aws-lc-sys needs NASM on windows+x86_64 unless
      # AWS_LC_SYS_PREBUILT_NASM=1. Visual Studio Build Tools and the MSVC target
      # are already present on windows-latest.
      #
      # protoc comes from its GitHub release, pinned by SHA-256, not from Chocolatey: the community
      # feed answered 504 in Desktop run 38619527317 and `choco install` still exited 0. Inline, not
      # ./.github/actions/windows-build-tools (the same script), because the checkout is the tag's
      # commit, and a tag older than that action does not have it. Keep the two in step.
      - name: protoc and NASM
        shell: pwsh
        env:
          PROTOC_VERSION: "36.2"
          PROTOC_SHA256: f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 6 -RetryIntervalSec 10
          $sha = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($sha -ne $env:PROTOC_SHA256) {
            throw "protoc-$env:PROTOC_VERSION-win64.zip has SHA-256 $sha, not $env:PROTOC_SHA256"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Join-Path $dir 'bin\protoc.exe'
          & $exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "PROTOC=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          (Join-Path $dir 'bin') | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

          # Chocolatey exits 0 when its feed fails, so success is a nasm.exe that runs.
          $places = @("$env:ProgramFiles\NASM", "$env:ChocolateyInstall\bin")
          function Find-Nasm {
            foreach ($p in $places) {
              $candidate = Join-Path $p 'nasm.exe'
              if (Test-Path $candidate) { return $candidate }
            }
            return $null
          }
          $nasm = Find-Nasm
          for ($i = 1; -not $nasm -and $i -le 4; $i++) {
            if ($i -gt 1) { Start-Sleep -Seconds (15 * ($i - 1)) }
            choco install --no-progress -y nasm
            $nasm = Find-Nasm
          }
          if ($nasm) {
            & $nasm -v
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            (Split-Path $nasm) | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          } else {
            Write-Output '::warning title=NASM::Chocolatey failed 4 times; building aws-lc-sys with its prebuilt NASM objects (AWS_LC_SYS_PREBUILT_NASM=1)'
            'AWS_LC_SYS_PREBUILT_NASM=1' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Dry runs only: a run that publishes builds without a cache another
        # run could have written (cache poisoning).
        if: inputs.dry_run == true

      - name: the web console (non-fatal)
        id: console
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Location web
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          if (-not (Test-Path apps/console/dist/index.html)) { throw 'no dist/index.html' }

      - name: build the server binary
        run: cargo build --release -j 4 -p loams --bin loams --locked --features "$env:LOAMS_PACKAGE_FEATURES"

      - name: build git-remote-loams
        run: cargo build --release -j 4 -p loams-git-remote --bin git-remote-loams --locked

      - name: report the toolchain and the binaries
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V
          (Get-Item target/release/loams.exe).Length
          (Get-Item target/release/git-remote-loams.exe).Length
          # The smoke test: each binary starts and reports its version.
          ./target/release/loams.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./target/release/git-remote-loams.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: smoke test (Durable on 127.0.0.1:8001)
        shell: bash
        run: scripts/release/smoke-durable.sh target/release/loams.exe

      - name: build the Windows zip
        id: package
        shell: pwsh
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          python scripts/release/build-artifacts.py windows-zip `
            --version $env:VERSION `
            --binary target/release/loams.exe `
            --git-remote target/release/git-remote-loams.exe `
            --console web/apps/console/dist `
            --out $out
          Get-ChildItem $out

      - name: attach the zip to the release
        if: needs.guard.outputs.dry_run != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          # There is no Authenticode signature on loams.exe (D620), so say so in
          # the log before the file goes anywhere a user can reach it.
          Write-Warning 'loams.exe carries NO Authenticode signature. Windows SmartScreen will show an unknown-publisher warning for a downloaded copy. See docs/build-from-source/windows.md.'
          gh release upload $env:TAG (Join-Path $env:RUNNER_TEMP 'windows/*') --clobber

      - name: report what was built
        id: collect
        shell: pwsh
        run: |
          $names = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'windows') -File).Name -join "`n"
          "assets<<EOF`n$names`nEOF" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loams-windows-${{ needs.guard.outputs.tag }}
          path: ${{ runner.temp }}/windows
          if-no-files-found: error
          retention-days: 30

  # The macOS tarballs. The runners are repository variables so either macOS pool
  # can be swapped when GitHub's capacity runs short; a runner of the other
  # architecture cross-compiles (x86_64 on Apple Silicon is smoke-tested under
  # Rosetta; arm64 on Intel cannot be run there).
  macos:
    name: "macOS: tarball (${{ matrix.arch }})"
    needs: [guard]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, target: aarch64-apple-darwin, runner: "${{ vars.MACOS_ARM64_RUNNER || 'macos-15' }}" }
          - { arch: x86_64, target: x86_64-apple-darwin, runner: "${{ vars.MACOS_X64_RUNNER || 'macos-15-intel' }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - name: protoc
        run: brew install protobuf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Dry runs only: a run that publishes builds without a cache another
        # run could have written (cache poisoning).
        if: inputs.dry_run == true
        with:
          key: release-macos-${{ matrix.arch }}

      # Required here, unlike the Linux packages: the tarball is the whole
      # install, so one without the console would not be the same artifact.
      - name: the web console
        run: |
          set -euo pipefail
          cd web
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          test -f apps/console/dist/index.html

      - name: build the server binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          cargo build --release -j 4 -p loams --bin loams --locked --target "$TARGET" --features "$LOAMS_PACKAGE_FEATURES"
          # Separately, so the helper cannot change the server's feature set.
          cargo build --release -j 4 -p loams-git-remote --bin git-remote-loams --locked --target "$TARGET"

      # Strip (the release profile keeps symbols: ~470 MB) and then sign
      # ad-hoc, in that order: stripping invalidates the linker's signature, and
      # Apple Silicon refuses an arm64 binary whose signature is missing or broken.
      - name: strip, ad-hoc sign, smoke test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host=$(uname -m)
          for name in loams git-remote-loams; do
            bin="$RUNNER_TEMP/$name"
            cp "target/$TARGET/release/$name" "$bin"
            strip -x "$bin"
            codesign --force --sign - "$bin"
            codesign --verify --strict --verbose=2 "$bin"
            file "$bin"
            ls -l "$bin"
            if [ "$TARGET" = "$host-apple-darwin" ] || { [ "$host" = arm64 ] && [ "$TARGET" = aarch64-apple-darwin ]; }; then
              "$bin" --version
            elif [ "$TARGET" = x86_64-apple-darwin ]; then
              # Cross-built on Apple Silicon: run it under Rosetta, which the image may lack.
              arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
              arch -x86_64 "$bin" --version
            else
              # Cross-built on Intel, which cannot run it: check the architecture only.
              echo "::notice::arm64 $name cross-built on an Intel runner; not executed here"
              [ "$(lipo -archs "$bin")" = arm64 ]
            fi
          done

      # Where the runner can execute the binary natively (a cross-build is
      # checked by architecture only, above).
      - name: smoke test (Durable on 127.0.0.1:8001)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "$(uname -m | sed 's/^arm64$/aarch64/')-apple-darwin" ]; then
            scripts/release/smoke-durable.sh "$RUNNER_TEMP/loams"
          else
            echo "::notice::$TARGET is not this runner's architecture; Durable smoke test skipped"
          fi

      - name: build the macOS tarball
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          MTIME: ${{ needs.guard.outputs.mtime }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/macos"
          python3 scripts/release/build-artifacts.py macos-tar --version "$VERSION" \
            --binary "$RUNNER_TEMP/loams" --git-remote "$RUNNER_TEMP/git-remote-loams" --arch "$ARCH" \
            --console web/apps/console/dist --out "$out" --mtime "$MTIME"
          ls -l "$out"

      - name: attach the tarball to the release
        if: needs.guard.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          echo "::warning::the macOS binary is ad-hoc signed only (no Developer ID, not notarized); a downloaded copy is quarantined until the user clears it"
          gh release upload "$TAG" "$RUNNER_TEMP"/macos/* --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loams-macos-${{ matrix.arch }}-${{ needs.guard.outputs.tag }}
          path: ${{ runner.temp }}/macos
          if-no-files-found: error
          retention-days: 30

  # loams-agentd for a headless Linux host, without Loams Desktop (#874): one
  # tarball per architecture, each built on that architecture's runner (the
  # release images use the same two), so nothing is cross-built and both are
  # smoke-tested. The tarball is what `loams-agentd install-runtime --from` reads
  # (scripts/release/build-artifacts.py agentd-tar), and the job runs that on it.
  # Ubuntu 24.04 has glibc 2.39, so the binaries need at most that, like the image's.
  agentd:
    name: "Linux: loams-agentd tarball (${{ matrix.arch }})"
    needs: [guard]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      # Two release builds of the workspace's largest binaries in one job.
      - name: Free disk space (GitHub-hosted runners have about 14 GB free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      # protoc, and the rest of the release images' build dependencies
      # (deploy/release/Containerfile.loams), named rather than assumed from
      # either runner image.
      - name: protoc and the build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev pkg-config libssl-dev clang cmake
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Dry runs only: a run that publishes builds without a cache another
        # run could have written (cache poisoning).
        if: inputs.dry_run == true
        with:
          key: release-agentd-${{ matrix.arch }}

      # `loams` with the packages' features, so the runtime's copy serves what
      # the .deb's does. Separate cargo calls, so neither binary's dependencies
      # can change the other's feature set (features unify across one build).
      - name: build loams-agentd and loams
        run: |
          set -euo pipefail
          cargo build --release -j 4 -p loams-agentd --bin loams-agentd --locked
          cargo build --release -j 4 -p loams --bin loams --locked --features "$LOAMS_PACKAGE_FEATURES"

      - name: smoke test, architecture and libraries
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "$ARCH" ] || { echo "::error::this runner is $(uname -m), not $ARCH"; exit 1; }
          for name in loams-agentd loams; do
            bin="target/release/$name"
            readelf -h "$bin" | grep -E 'Class|Machine'
            ls -l "$bin"
            readelf -d "$bin" | grep NEEDED
            # The newest glibc symbol version it needs: the oldest glibc it runs on.
            echo "$name needs glibc $(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1)"
          done
          # VERSION in the tarball is the workspace version; the daemon must report the same.
          reported=$(target/release/loams-agentd version)
          [ "$reported" = "loams-agentd $VERSION" ] || { echo "::error::loams-agentd reports '$reported', not $VERSION"; exit 1; }
          target/release/loams --version

      - name: smoke test (Durable on 127.0.0.1:8001)
        run: scripts/release/smoke-durable.sh target/release/loams

      - name: build the loams-agentd tarball
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          MTIME: ${{ needs.guard.outputs.mtime }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/agentd"
          python3 scripts/release/build-artifacts.py agentd-tar --version "$VERSION" \
            --agentd target/release/loams-agentd --binary target/release/loams --arch "$ARCH" \
            --out "$out" --mtime "$MTIME"
          ls -l "$out"

      # What docs/guides/studio/remote-agentd.md tells a user to do: unpack the
      # tarball and run install-runtime from the unpacked directory.
      - name: install-runtime accepts the tarball
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          top="loams-agentd-$VERSION-linux-$ARCH"
          work="$RUNNER_TEMP/agentd-check"
          mkdir -p "$work"
          tar -xzf "$RUNNER_TEMP/agentd/$top.tar.gz" -C "$work"
          (cd "$work/$top" && sha256sum -c SHA256SUMS)
          "$work/$top/loams-agentd" install-runtime --from "$work/$top" --to "$work/runtime"
          [ "$(readlink "$work/runtime/current")" = "$VERSION" ] \
            || { echo "::error::runtime/current does not name $VERSION"; exit 1; }
          "$work/runtime/current/loams-agentd" version
          "$work/runtime/current/loams" --version

      - name: attach the tarball to the release
        if: needs.guard.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP"/agentd/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loams-agentd-linux-${{ matrix.arch }}-${{ needs.guard.outputs.tag }}
          path: ${{ runner.temp }}/agentd
          if-no-files-found: error
          retention-days: 30

  # SHA256SUMS over everything attached so far, signed (SHA256SUMS.asc). Also after
  # a failed build, so what was attached is covered; a re-run rewrites the pair.
  checksums:
    name: Checksums
    needs: [guard, linux, windows, macos, agentd]
    if: ${{ always() && needs.guard.result == 'success' && needs.guard.outputs.dry_run != 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-checksums.yml
    with:
      tag: ${{ needs.guard.outputs.tag }}
    secrets: inherit

  # One job edits the release notes, so the Linux, Windows and macOS notes cannot
  # interleave. The warnings here are the point: a reader who downloads a file
  # from this release must not have to guess whether it is signed.
  notes:
    name: Release notes
    needs: [guard, linux, windows, macos, agentd]
    # Also after a failed build: whatever was attached still needs its signature status.
    if: ${{ always() && needs.guard.result == 'success' && needs.guard.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: append the packaging and signature status
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          LINUX_ASSETS: ${{ needs.linux.outputs.assets }}
          LINUX_SUMMARY: ${{ needs.linux.outputs.summary }}
          WINDOWS_ASSETS: ${{ needs.windows.outputs.assets }}
          VERSION: ${{ needs.guard.outputs.version }}
          # No checkout in this job, so gh needs the repository named.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The macOS rows come from what is actually attached, not from the matrix.
          mac_assets=$(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '^loams-.*-macos-.*\.tar\.gz$' || true)
          agentd_assets=$(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '^loams-agentd-.*-linux-.*\.tar\.gz$' || true)
          {
            echo
            echo "## Linux packages, the Windows zip and the macOS tarballs"
            echo
            echo "### Linux"
            echo
            echo "| File | Format | Signature | By |"
            echo "|---|---|---|---|"
            printf '%s\n' "$LINUX_SUMMARY" | while IFS=$'\t' read -r name format state method; do
              [ -n "$name" ] || continue
              echo "| \`$name\` | $format | $state | $method |"
            done
            echo
            echo "- The **.deb** and the **.pkg.tar.zst** are signed with the project GPG key at build time."
            echo "- The **.rpm is not signed by this workflow**: nFPM cannot sign an RPM, so it is submitted to"
            echo "  SignPath's \`<rpm-sign>\` by [\`.github/workflows/release-sign.yml\`](../../.github/workflows/release-sign.yml)."
            echo "  Until that workflow has run against this tag, the .rpm is unsigned."
            echo
            echo "### Windows"
            echo
            echo "| File | Signature |"
            echo "|---|---|"
            printf '%s\n' "$WINDOWS_ASSETS" | grep -E '\.zip$' | while read -r name; do
              [ -n "$name" ] || continue
              echo "| \`$name\` | **UNSIGNED** |"
            done
            echo
            echo "> **The Windows binary has no Authenticode signature.** Windows SmartScreen will show"
            echo "> *Windows protected your PC* on a downloaded copy. That is an unknown-publisher warning,"
            echo "> not a malware detection, and it clears once the user unblocks the file. Building from"
            echo "> source produces no such prompt: [\`docs/build-from-source/windows.md\`](../../docs/build-from-source/windows.md)."
            echo
            echo "### macOS"
            echo
            echo "| File | Signature |"
            echo "|---|---|"
            if [ -z "$mac_assets" ]; then
              echo "| (none: the macOS build failed) | |"
            fi
            printf '%s\n' "$mac_assets" | while read -r name; do
              [ -n "$name" ] || continue
              echo "| \`$name\` | **ad-hoc only** (no Developer ID, not notarized) |"
            done
            echo
            echo "> The binary carries an ad-hoc signature, which Apple Silicon needs to run it at all, but no"
            echo "> Developer ID, so Gatekeeper quarantines a downloaded copy. Clear the flag once after unpacking:"
            echo ">"
            echo "> \`\`\`sh"
            echo "> tar -xzf loams-$VERSION-macos-arm64.tar.gz"
            echo "> xattr -dr com.apple.quarantine loams-$VERSION-macos-arm64"
            echo "> ./loams-$VERSION-macos-arm64/loams --version"
            echo "> ./loams-$VERSION-macos-arm64/git-remote-loams --version"
            echo "> \`\`\`"
            echo ">"
            echo "> The server stack itself (Postgres, the images in this release) runs as Linux containers;"
            echo "> on macOS and Windows use Docker Desktop with the attached compose bundle."
            echo
            echo "### Git push and fetch to the bucket"
            echo
            echo "Every package installs \`git-remote-loams\` next to \`loams\` (\`/usr/bin\` on Linux; the"
            echo "top level of the zip and the tarballs). With that directory on PATH, git handles"
            echo "\`loams::<store-url>/ns/<ns>/repos/<repo>\` URLs itself: \`git clone\`, \`fetch\` and \`push\`"
            echo "go straight to the repository in the bucket, with no Loams server in between."
            echo
            echo "### loams-agentd for Linux"
            echo
            echo "| File | Signature |"
            echo "|---|---|"
            if [ -z "$agentd_assets" ]; then
              echo "| (none: the loams-agentd build failed) | |"
            fi
            printf '%s\n' "$agentd_assets" | while read -r name; do
              [ -n "$name" ] || continue
              echo "| \`$name\` | **UNSIGNED** |"
            done
            echo
            echo "> The agent daemon behind Studio, for a headless host without Loams Desktop. Each tarball holds"
            echo "> \`loams-agentd\`, \`loams\`, \`SHA256SUMS\` and \`VERSION\`, the layout \`loams-agentd install-runtime --from\`"
            echo "> reads. Built on Ubuntu 24.04 (glibc 2.39). Check it against this release's \`SHA256SUMS\`; setup is in"
            echo "> [\`docs/guides/studio/remote-agentd.md\`](../../docs/guides/studio/remote-agentd.md)."
            echo
            echo "### Not in this release"
            echo
            echo "- **No Android APK.** There is no Android or Gradle project in this repository."
            echo "- **No AUR package in-tree.** A PKGBUILD is at [\`release/aur/PKGBUILD\`](../../release/aur/PKGBUILD);"
            echo "  the AUR submission path is documented in [\`release/aur/README.md\`](../../release/aur/README.md)."
          } >> "$RUNNER_TEMP/notes.md"

          body=$(gh release view "$TAG" --json body -q .body)
          marker="## Linux packages, the Windows zip and the macOS tarballs"
          case "$body" in
            *"$marker"*)
              echo "the release notes already carry the packaging section; leaving them alone"
              exit 0
              ;;
          esac
          { printf '%s\n' "$body"; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/body.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
          echo "release notes updated"
# Deploys the console to Cloudflare Workers static assets at
# https://console.loams.dev (issue #269): the assets-only Worker
# `loams-console` on the free plan (web/apps/console/wrangler.jsonc).
#
# Needs the `production` environment's CLOUDFLARE_API_TOKEN (Workers Scripts
# edit, on the loams.dev account) and CLOUDFLARE_ACCOUNT_ID. Without them the
# job builds and stages, then skips the deploy with a notice, and stays green.
# Sign-in: LOAMS_AUTH_MODE (variable) is the console's default mode, tailscale
# unless set; people can also pick oidc (a Loams account at auth.loams.dev) or an
# API key. LOAMS_AUTH_MODES (variable) narrows that to the modes the deploy has
# tested; Ostrium's console sets `tailscale`, so oidc and apikey stay hidden.
# LOAMS_AUTH_CLIENT_ID (variable, loams-console) is required for the deploy so
# oidc is offered; LOAMS_AUTH_ISSUER defaults to https://auth.loams.dev.
# Each person connects their own engine on first run (LOAMS_ENGINE_URL stays
# unset here). Engine-hosted builds retain the same-origin empty config.
name: Console deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # The web packages install from the root workspace and lockfile.
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "nx.json"
      - ".github/workflows/console-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://console.loams.dev
    defaults:
      run:
        working-directory: web
    steps:
      - name: Cloudflare secrets present
        id: secrets
        working-directory: .
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the production environment; the deploy is skipped."
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: node --test apps/console/deploy/*.test.mjs
      - run: pnpm build
      - name: stage for Workers static assets
        env:
          LOAMS_AUTH_MODE: ${{ vars.LOAMS_AUTH_MODE || 'tailscale' }}
          LOAMS_AUTH_MODES: ${{ vars.LOAMS_AUTH_MODES }}
          LOAMS_AUTH_ISSUER: ${{ vars.LOAMS_AUTH_ISSUER }}
          LOAMS_AUTH_CLIENT_ID: ${{ vars.LOAMS_AUTH_CLIENT_ID }}
          # The remote agentd hosts Studio may call and frame (SD1 Task 30).
          LOAMS_AGENTD_ORIGINS: ${{ vars.LOAMS_AGENTD_ORIGINS }}
          DEPLOYING: ${{ steps.secrets.outputs.ok }}
        run: |
          if [ "$DEPLOYING" = true ]; then
            node apps/console/deploy/stage.mjs --require-auth
          else
            # Nothing is deployed: stage with a placeholder client when none is
            # set, so the check still covers the oidc option and its CSP.
            LOAMS_AUTH_CLIENT_ID="${LOAMS_AUTH_CLIENT_ID:-stage-check-only}" \
              node apps/console/deploy/stage.mjs
          fi
      - name: deploy
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.146.0"
          workingDirectory: web/apps/console
          command: deploy
      - name: smoke check
        env:
          LOAMS_AUTH_MODE: ${{ vars.LOAMS_AUTH_MODE || 'tailscale' }}
          LOAMS_AUTH_ISSUER: ${{ vars.LOAMS_AUTH_ISSUER || 'https://auth.loams.dev' }}
        if: steps.secrets.outputs.ok == 'true'
        run: node apps/console/deploy/smoke.mjs https://console.loams.dev

syntax = "proto3";

package bi.v1;

import "google/protobuf/struct.proto";
import "bi/v1/data.proto";

// ---------------------------------------------------------------------------
// Dashboard spec, widget compilation, and the theme catalogue.
//
// The dashboard document itself stays a JSON `google.protobuf.Struct`: it is
// author-supplied, evolves faster than this contract, and is already validated
// by the zod schemas in @bi/types. Re-modelling it field-by-field here would
// create a second source of truth that drifts from the validator we actually
// enforce. A Struct is the honest encoding for "opaque, schema-validated".
// ---------------------------------------------------------------------------

message ListDashboardsRequest {}

message DashboardSummary {
  string id = 1;
  string title = 2;
  int32 version = 3;
  int32 widget_count = 4;
}

message ListDashboardsResponse {
  repeated DashboardSummary dashboards = 1;
}

message GetDashboardRequest {
  string id = 1;
}

message GetDashboardResponse {
  // A DashboardSpec as JSON.
  google.protobuf.Struct spec = 1;
}

message CreateDashboardRequest {
  string title = 1;
  google.protobuf.Struct spec = 2;
}

message PatchOperation {
  // RFC 6902 JSON Patch operation, applied by the dashboard-spec service.
  string op = 1;
  string path = 2;
  google.protobuf.Value value = 3;
}

message PatchDashboardRequest {
  string id = 1;
  int32 base_version = 2;
  repeated PatchOperation ops = 3;
  string actor = 4;
}

message Widget {
  string id = 1;
  // A widget as JSON: type, position, datasetId, and the `chartSpec` chart spec.
  google.protobuf.Struct spec = 2;
  google.protobuf.Struct position = 3;
}

message WidgetDataRequest {
  Widget widget = 1;
  google.protobuf.Struct params = 2;
}

message WidgetDataResponse {
  QueryResponse data = 1;
  repeated Row sample_rows = 2;
}

message PreviewWidgetRequest {
  Widget widget = 1;
  google.protobuf.Struct params = 2;
  // The dashboard-level theme selection, so a preview matches what the
  // dashboard will actually render.
  google.protobuf.Struct dashboard_theme = 3;
}

message PreviewWidgetResponse {
  // A compiled chart option as JSON.
  google.protobuf.Struct option = 1;
  repeated Row sample_rows = 2;
  int32 row_count = 3;
}

// ---------------------------------------------------------------------------
// Themes
// ---------------------------------------------------------------------------

message ThemeSummary {
  string id = 1;
  string label = 2;
  string description = 3;
  // Inline SVG data URI.
  string icon = 4;
}

message ListThemesRequest {}

message ListThemesResponse {
  repeated ThemeSummary themes = 1;
}

message GetThemeRequest {
  string id = 1;
}

message ThemeReportEntry {
  string stage = 1;
  string path = 2;
  string message = 3;
}

message GetThemeResponse {
  // True when the theme resolved. A resolved theme may still be DOWNGRADED and
  // carry report entries, which is not an error.
  bool valid = 1;
  google.protobuf.Struct spec = 2;
  repeated ThemeReportEntry report = 3;
}

service DashboardService {
  rpc ListDashboards(ListDashboardsRequest) returns (ListDashboardsResponse);
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
  rpc CreateDashboard(CreateDashboardRequest) returns (GetDashboardResponse);
  rpc PatchDashboard(PatchDashboardRequest) returns (GetDashboardResponse);
  rpc FetchWidgetData(WidgetDataRequest) returns (WidgetDataResponse);
  rpc PreviewWidget(PreviewWidgetRequest) returns (PreviewWidgetResponse);
}

service ThemeService {
  rpc ListThemes(ListThemesRequest) returns (ListThemesResponse);
  rpc GetTheme(GetThemeRequest) returns (GetThemeResponse);
}

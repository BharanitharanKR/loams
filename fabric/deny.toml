# cargo-deny policy. See CONTRIBUTING.md "Dependency licenses".
[graph]
all-features = true

[licenses]
# Permissive licenses only. AGPL/GPL/LGPL/BUSL-1.1/SSPL/ELv2 and proprietary licenses are not allowed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # Boost Software License 1.0 (xxhash-rust), not the Business Source License
    "BSL-1.0",
    # libbz2-rs-sys, via datafusion-datasource
    "bzip2-1.0.6",
    # borrow-or-share 0.2.4, via fluent-uri -> referencing -> jsonschema 0.58,
    # which loams-flow's manifest validator pulls in (CN1 Task 1). MIT-0 is
    # OSI-approved and is MIT without the attribution clause; it is a transitive
    # dependency of one crate rather than a dependency Loams chooses, and jsonschema
    # offers no way to avoid it. The engine workspace does not need this entry
    # because it does not depend on jsonschema, which is why `fabric/deny.toml` is
    # a copy rather than a symlink and the two lists have drifted by one entry.
    "MIT-0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# stringmetrics (via httpmock, dev tooling in loams-console-mock) states its
# license only as a LICENSE file: Apache-2.0.
[[licenses.clarify]]
crate = "stringmetrics"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0fb72a18 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# Prefix variants are rejected by scripts/ci/no-metering.sh; cargo-deny package
# selectors are exact names (https://embarkstudios.github.io/cargo-deny/checks/cfg.html).
deny = [{ name = "loam-platform", reason = "The OSS engine cannot depend on the private platform (D551)" }]

[advisories]
yanked = "deny"
# Only fail on unmaintained crates we depend on directly; transitive ones are tracked upstream.
unmaintained = "workspace"
ignore = [
    # No fixed rsa release exists (the Marvin timing attack). It is reached
    # only through sqlx-mysql, which uses it for the RSA password exchange of
    # caching_sha2_password/sha256_password on a non-TLS connection.
    { id = "RUSTSEC-2023-0071", reason = "rsa via sqlx-mysql: used only for RSA password exchange on non-TLS MySQL connections; Loams connects to TiDB over TLS or the cluster network with mysql_native_password (§21 §11.2)" },
    # quick-xml 0.39.4 through object_store 0.13.2 (CN2 Task 13), which pins
    # `^0.39`; the fix is 0.41. object_store must stay on 0.13.2 while parquet
    # 59 and deltalake 1.1.0 need it (CN2 R0.13). Both are denial-of-service
    # bugs in parsing XML; object_store parses only the list and error
    # responses of the store endpoint the instance names, behind the egress
    # check. CN2 ruling R13.7; lifted when the workspace moves to arrow 60 and
    # object_store 0.14.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 via object_store 0.13.2 (CN2 R0.13, R13.7): parses only the configured object store's responses; fixed by moving to object_store 0.14 with arrow 60" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39 via object_store 0.13.2 (CN2 R0.13, R13.7): parses only the configured object store's responses; fixed by moving to object_store 0.14 with arrow 60" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# tikv-client is pinned by rev to Loams's fork, branch `loam` (R1 plan rows R4
# and F1). Resonate is pinned by rev to the fork's loam/0.10.1 (D1 plan Task
# 1, D140).
allow-git = ["https://github.com/ostrium-labs/client-rust", "https://github.com/ostrium-labs/resonate"]

# Apache Pulsar — CN2 plan Task 18 (OR-1), loams_connector_brokers::pulsar (pulsar 6.9.0 on
# tokio and rustls). Staged in the brokers crate (R18.1) until Task 2 (#477) lands the registry
# row. The sink is at least once and auth is jwt only (R18.7).
apiVersion: loams.flow/v1
kind: Connector
id: pulsar
name: Pulsar
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_brokers::pulsar
  version: "loams-connector-brokers 0.0.1 / pulsar 6.9.0"
licence:
  component: Apache-2.0
  dependencies:
    pulsar: Apache-2.0
capabilities:
  source:
    streaming: true
    batch: false
    cdc: false
    webhook: false
    resumable: true
    position: the durable subscription's cursor; messages are acknowledged individually after the Fabric acknowledges them
  sink:
    streaming: true
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: false
  delivery: { source: effectively_once, sink: at_least_once }
  ordering: per_partition
  formats: [cloudevents-binary, cloudevents-structured, json, bytes]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [jwt]
config:
  $ref: schemas/pulsar.config.json
secrets: [token]
envelope:
  emits: io.loams.dev.flow.pulsar.message.v1
  consumes: "*"
  passthrough: true
  stable_ids: true
limits: {}
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
notes:
  - "ids: messages that are not CloudEvents get <topic>/<ledger>:<entry>:<partition>:<batch>, stable across redeliveries, so ingest's dedup makes the source effectively once"
  - "sink: at least once, not effectively once by sequence id: pulsar 6.9.0 numbers sequence ids from 0 for every producer and renumbers retries (R18.7, pulsar_producer_dedup)"
  - "auth: oauth2 and mtls are not offered by this build of the client (R18.7)"
docs: docs/guides/connectors/pulsar.md

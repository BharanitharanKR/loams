# NATS and JetStream — CN2 plan Task 18 (OR-1), loams_connector_brokers::nats (async-nats).
# Staged in the brokers crate (R18.1) until Task 2 (#477) lands the registry row. The manifest
# declares JetStream; core NATS (`mode: core`) delivers less, and the factory says so (R18.6).
apiVersion: loams.flow/v1
kind: Connector
id: nats
name: NATS
specVersion: 0.3.0
category: messaging
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_brokers::nats
  version: "loams-connector-brokers 0.0.1 / async-nats 0.50.0"
licence:
  component: Apache-2.0
  dependencies:
    async-nats: Apache-2.0
capabilities:
  source:
    streaming: true
    batch: false
    cdc: false
    webhook: false
    resumable: true
    position: the JetStream durable consumer's ack floor (stream sequence); messages are acked after the Fabric acknowledges them
  sink:
    streaming: true
    batch: false
    transactional: false
    upsert: false
    delete: false
    idempotent: true
  delivery: { source: at_least_once, sink: effectively_once }
  ordering: per_partition
  formats: [cloudevents-binary, cloudevents-structured, json, bytes]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [key, jwt, mtls]
config:
  $ref: schemas/nats.config.json
secrets: [auth.nkey_seed, auth.credentials, tls.key_pem]
envelope:
  emits: io.loams.dev.flow.nats.message.v1
  consumes: "*"
  passthrough: true
  stable_ids: false
limits: {}
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
notes:
  - "core NATS (`source.mode: core`) is not resumable and at most once, and a core sink is at most once (nats_core_declares_not_resumable)"
  - "sink: JetStream publishes carry Nats-Msg-Id = the event id, so the stream drops a repeat within its duplicate window (effectively once)"
  - "ids: JetStream messages that are not CloudEvents get <stream>/<stream sequence>, stable across redeliveries; core messages do not, so the manifest does not claim stable ids"
docs: docs/guides/connectors/nats.md

[package]
name = "loams-connector-sqlserver"
description = "The Loams SQL Server connector family (CN2 Task 12, OR-6): key-range batch reads under snapshot isolation, native CDC over the capture-instance change tables, an exactly-once MERGE sink, and the Azure SQL target profile with Entra ID tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
# The conformance harnesses (`harness`), which link the kit and so
# `loams-flow`. Off by default: a family crate depends only on the SDK and its
# protocol crates (OR-6), and `loams-flow` will link this crate (`conn-sqlserver`).
conformance = ["dep:loams-flow-conformance"]

[dependencies]
loams-connector-sdk = { path = "../loams-connector-sdk" }
loams-flow-conformance = { path = "../loams-flow-conformance", optional = true }
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
# The SDK's own async-trait pin (0.1.92 in fabric/Cargo.lock).
async-trait = "0.1.89"
bytes.workspace = true
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
http.workspace = true
# The TDS client (R0.10), without any TLS backend of its own (ruling R12.1):
# TLS is the SDK's rustls with ring, set up before TDS starts (TDS 8.0
# `strict`), so the connection is opened by `sdk::net::connect` and
# `tiberius` only speaks TDS over it. `tds73` gives `date`, `time`,
# `datetime2` and `datetimeoffset`. MIT OR Apache-2.0, 2026-09-25.
tiberius = { version = "=0.13.0", default-features = false, features = ["tds73"] }
# The SDK's TLS pins: rustls with ring only (no aws-lc).
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
# `tiberius` reads and writes `futures::io`; the stream is tokio's
# (0.7.19 in fabric/Cargo.lock).
tokio-util = { version = "0.7.19", default-features = false, features = ["compat"] }
tracing.workspace = true
# The root set of `encrypt: strict` (the SDK's own pin, 1.0 in fabric/Cargo.lock).
webpki-roots = "1"

[dev-dependencies]
loams-connector-sqlserver = { path = ".", features = ["conformance"] }
# Manifests for the kit's suites.
loams-flow = { path = "../loams-flow" }
loams-flow-conformance = { path = "../loams-flow-conformance" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util", "test-util"] }

[lints]
workspace = true

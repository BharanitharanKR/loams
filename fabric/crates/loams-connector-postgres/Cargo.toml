[package]
name = "loams-connector-postgres"
description = "The Loams Postgres connector family (CN2 Task 10, OR-6): batch reads, native pgoutput CDC with a snapshot handoff, an exactly-once upsert sink, and the target profiles aurora-postgres, cockroachdb and pgvector."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
# The conformance harnesses (`harness`), which link the kit and so
# `loams-flow`. Off by default: a family crate depends only on the SDK and its
# protocol crates (OR-6), and `loams-flow` will link this crate (`conn-postgres`).
conformance = ["dep:loams-flow-conformance"]

[dependencies]
loams-connector-sdk = { path = "../loams-connector-sdk" }
loams-flow-conformance = { path = "../loams-flow-conformance", optional = true }
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
async-trait = "0.1.89"
bytes.workspace = true
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
# The pgoutput decoder (R0.6), without its connection layer (ruling R10.1).
pg_walstream = { version = "=0.9.0", default-features = false, features = ["std"] }
postgres-protocol = "0.6.12"
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "net", "io-util"] }
tokio-postgres = { version = "0.7.18", default-features = false }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
tracing.workspace = true
# The root set of `sslmode: verify-full` (the SDK's own pin, 1.0 in fabric/Cargo.lock).
webpki-roots = "1"

[dev-dependencies]
loams-connector-postgres = { path = ".", features = ["conformance"] }
# Manifests for the kit's suites.
loams-flow = { path = "../loams-flow" }
loams-flow-conformance = { path = "../loams-flow-conformance" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util", "test-util"] }

[lints]
workspace = true

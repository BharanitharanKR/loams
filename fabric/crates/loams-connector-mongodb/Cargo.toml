[package]
name = "loams-connector-mongodb"
description = "The Loams MongoDB connector (CN2 Task 16, OR-6): snapshot batch reads, change-stream CDC with a snapshot handoff, and an exactly-once sink, over a MongoDB wire-protocol client that connects through the SDK's egress check."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
# The conformance harness (`conformance`), which links the kit and so
# `loams-flow`. Off by default: a family crate depends only on the SDK and its
# protocol code (OR-6), and `loams-flow` will link this crate (`conn-mongodb`).
conformance = ["dep:loams-flow-conformance"]

[dependencies]
loams-connector-sdk = { path = "../loams-connector-sdk" }
loams-flow-conformance = { path = "../loams-flow-conformance", optional = true }
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait = "0.1.89"
base64.workspace = true
bytes.workspace = true
# SCRAM-SHA-256 (HMAC, PBKDF2, SHA-256) and the random nonces and session ids:
# the `ring` the SDK's rustls already links (0.17.14 in fabric/Cargo.lock).
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
# TLS and mutual TLS (`auth: mtls`) with ring, as the SDK's own pins.
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
tracing.workspace = true
# The root set for `tls: true` without a `tls_ca_pem` (the SDK's own pin).
webpki-roots = "1"

[dev-dependencies]
loams-connector-mongodb = { path = ".", features = ["conformance"] }
# Manifests for the kit's suites.
loams-flow = { path = "../loams-flow" }
loams-flow-conformance = { path = "../loams-flow-conformance" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util", "test-util"] }

[lints]
workspace = true

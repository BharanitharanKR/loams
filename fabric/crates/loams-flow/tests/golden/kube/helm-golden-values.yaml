# Source: loams-connectors/templates/fleet-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: loams-connectors-fleet
  namespace: loams-system
  labels:
    app.kubernetes.io/name: loams-connectors
    app.kubernetes.io/instance: loams-connectors
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: loams-connectors-0.1.0
    app.kubernetes.io/component: flow
data:
  fleet.yaml: |
    flow:
      k8s_namespace: "loams-system"
      deployment: "loams-connectors-flow"
      min_replicas: 2
      max_replicas: 8
      pod_memory_bytes: 2147483648
      max_instances_per_pod: 64
    namespace_template: "loams-{ns}"
    served_namespaces: [7, 9]
    cluster:
      pod_cidrs: ["10.244.0.0/16"]
      service_cidrs: ["10.96.0.0/12"]
      control_plane: ["10.0.0.10/32"]
      control_plane_hosts: ["loams-api.loams-system.svc"]
    fabric:
      k8s_namespace: "loams-system"
      pod_labels: {"app.kubernetes.io/name":"loams-fabric"}
      ports: [8080, 8090]
    fallback:
      service_account: "loams-connectors-fallback"
      secret_mount_root: "/var/run/loams/secrets"
      camel:
        image:
          repository: "ghcr.io/ostrium-labs/loams-connect"
          digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
        uid: 1001
        metrics_port: 9876
        metrics_path: "/observe/metrics"
        resources:
          cpu_request: "250m"
          memory_request: "512Mi"
          memory_limit: "1Gi"
      debezium:
        image:
          repository: "quay.io/debezium/server"
          digest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"
        uid: 185
        metrics_port: 8080
        metrics_path: "/q/metrics"
        resources:
          cpu_request: "250m"
          memory_request: "768Mi"
          memory_limit: "1536Mi"
        storage:
          size: "10Gi"
      iggy:
        image:
          repository: "ghcr.io/ostrium-labs/iggy-connectors"
          digest: "sha256:3333333333333333333333333333333333333333333333333333333333333333"
        uid: 10001
        metrics_port: 8081
        metrics_path: "/metrics"
        resources:
          cpu_request: "100m"
          memory_request: "128Mi"
          memory_limit: "512Mi"

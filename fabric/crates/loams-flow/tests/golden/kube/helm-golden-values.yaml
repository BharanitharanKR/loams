    helm.sh/chart: loams-connectors-0.1.0
    app.kubernetes.io/component: flow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loams-connectors
      app.kubernetes.io/instance: loams-connectors
      app.kubernetes.io/component: flow
  policyTypes: ["Ingress"]
  ingress:

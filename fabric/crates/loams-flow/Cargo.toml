[package]
name = "loams-flow"
description = "Loams Flow's connector registry: the manifests of design §33 D352, their JSON Schema, the semantic rules and the 200-connector catalog."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Not published: the crate reads `connectors/registry/*.yaml`,
# `connectors/schema/connector.schema.json`, `connectors/registry/catalog.csv`
# and `connectors/licences.toml` from the repository at run time (design §33
# D352; D359's gate input), and a crate archive would not carry them.
publish = false

[features]
# R-CN2-4 (CN2 plan Task 1): Camel directions are checked against the vendored
# Camel catalog snapshot, which is CN2 Task 22's. Off by default, where the rule
# is a no-op; on before Task 22 lands, it refuses every Camel direction.
camel-catalog = []

[dependencies]
indexmap.workspace = true
jsonschema.workspace = true
# The connector SDK (CN2 OR-5), for the `Profile` type a `ConnectorContext`
# carries (CN2 Task 7, plan ruling R4.4): `loams-flow` depends on the SDK, never
# the reverse. Its own dependencies are already in fabric/Cargo.lock.
loams-connector-sdk = { path = "../loams-connector-sdk" }
loams-flow-proto = { path = "../loams-flow-proto" }
# `buffa` is the generated-code runtime of `loams-flow-proto` (see that crate's
# Cargo.toml): `connectrpc-build` 0.9 emits buffa messages, and an open-enum
# field is a `buffa::EnumValue<E>` wrapper rather than a bare `E`. Translating a
# manifest slug to a protobuf enum name and back means naming that wrapper, so
# `loams-flow` takes the same `buffa` version its codegen runs on. It is pinned
# inline rather than through `[workspace.dependencies]` because it is the proto
# crate's runtime, not a shared dependency — the split `loams-proto` makes for
# `buffa-types`.
buffa = "0.9.2"
# The connector SDK (CN2 Task 4): `metrics::InstanceMetrics` implements its
# `ConnectorObserver` hook, so a native connector's pipeline feeds the metric
# families and the Q359 activity counters (CN2 Task 24). The dependency runs
# this way only: the SDK never depends on `loams-flow` (R4.4).
loams-connector-sdk = { path = "../loams-connector-sdk" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
# `activity::ActivityPump::spawn`: the per-window timer (CN2 Task 24).
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true

[dev-dependencies]
# Paused-clock tests of the activity window, and the SDK pipeline that feeds
# the metrics (CN2 Task 24).
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
# `Registry`, `check_use` and the licence gate are exercised over the real
# `connectors/` tree, whose manifests carry semver `specVersion`s and the
# config schemas are compared as JSON.
semver.workspace = true
serde_json.workspace = true

[lints]
workspace = true
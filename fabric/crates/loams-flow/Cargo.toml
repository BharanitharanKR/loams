[package]
name = "loams-flow"
description = "Loams Flow's connector registry: the manifests of design §33 D352, their JSON Schema, the semantic rules and the 200-connector catalog."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Not published: the crate reads `connectors/registry/*.yaml`,
# `connectors/schema/connector.schema.json`, `connectors/registry/catalog.csv`
# and `connectors/licences.toml` from the repository at run time (design §33
# D352; D359's gate input), and a crate archive would not carry them.
publish = false

[dependencies]
# `SecretStore`'s async API and the SDK traits it implements (CN2 Task 25).
# 0.1.92 is already in fabric/Cargo.lock. MIT OR Apache-2.0.
async-trait = "0.1.89"
# A Kubernetes `Secret`'s `data` is base64 (CN2 Task 25, `KubeSecretStore`).
base64.workspace = true
bytes.workspace = true
http.workspace = true
indexmap.workspace = true
# `EgressPolicy`'s CIDRs (CN2 Shared contracts, Task 25). 2.12.2
# (2026-09-06), MIT OR Apache-2.0, no dependencies; the engine workspace
# already pins the same version.
ipnet = { version = "2.12.2", features = ["serde"] }
# The SDK's `Secret`, `SecretResolver`, `EgressCheck` and HTTP client, which
# the egress guard and the secret stores implement and use (CN2 Task 25; OR-5
# makes loams-flow the SDK's runtime).
loams-connector-sdk = { path = "../loams-connector-sdk" }
# `KubeSecretStore` trusts the cluster CA only. The SDK's rustls 0.23 with
# `ring`, already in fabric/Cargo.lock.
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
# Zeroes the secret bytes the stores read. 1.9.0 is already in the lock.
zeroize = "1.8"
jsonschema.workspace = true
loams-flow-proto = { path = "../loams-flow-proto" }
# `buffa` is the generated-code runtime of `loams-flow-proto` (see that crate's
# Cargo.toml): `connectrpc-build` 0.9 emits buffa messages, and an open-enum
# field is a `buffa::EnumValue<E>` wrapper rather than a bare `E`. Translating a
# manifest slug to a protobuf enum name and back means naming that wrapper, so
# `loams-flow` takes the same `buffa` version its codegen runs on. It is pinned
# inline rather than through `[workspace.dependencies]` because it is the proto
# crate's runtime, not a shared dependency — the split `loams-proto` makes for
# `buffa-types`.
buffa = "0.9.2"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `Registry`, `check_use` and the licence gate are exercised over the real
# `connectors/` tree, whose manifests carry semver `specVersion`s and the
# config schemas are compared as JSON.
semver.workspace = true
serde_json.workspace = true
# CN2 Task 25's egress, redirect and secret-store tests run local servers.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "fs", "sync"] }

[lints]
workspace = true
# Cassandra — P2 (§33 Appendix A.3), CN2 Task 14. The manifest Task 2 installs
# as connectors/registry/cassandra.yaml (ruling R14.1).
# Runtime: native Rust, loams-connector-kv over the `scylla` 1.9 driver (CQL
# native protocol v4), tested against real Apache Cassandra 5.
apiVersion: loams.flow/v1
kind: Connector
id: cassandra
name: Cassandra
specVersion: 0.2.0
category: nosql
priority: P2
starred: false
status: planned
runtime:
  kind: native
  ref: loams_connector_kv::cassandra::CassandraFactory
  version: "scylla 1.9.0"
licence:
  component: Apache-2.0
  dependencies:
    scylla: Apache-2.0
capabilities:
  source:                          # token-range splits, SELECT JSON a page at a time
    streaming: false
    batch: true
    cdc: false
    webhook: false
    resumable: true
    position: each token range's paging state
  sink:                            # INSERT … JSON … DEFAULT UNSET, DELETE … fromJson(?) on loamsop=d
    streaming: true
    batch: true
    transactional: false
    upsert: true
    delete: true
    idempotent: true              # an upsert by primary key leaves one row
  delivery: { source: effectively_once, sink: effectively_once }
  ordering: per_key
  formats: [json]
  schema: { registry: none, evolution: none }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull
auth: [none, basic]
config:
  $ref: schemas/cassandra.config.json
secrets: [password]
envelope:
  emits: io.loams.dev.flow.cassandra.document.v1
  consumes: "*"
  passthrough: false
  stable_ids: true
limits: {}
conformance: [contract, roundtrip, kill-restart, dup-check, backpressure, auth]
notes:
  - "Rows travel as JSON documents (SELECT JSON / INSERT JSON); the CQL-to-Arrow type table (CqlTypeMapper) is in the guide for the bulk path, which is not built (ruling R14.5)."
  - "PR CI's Cassandra 5 runs with AllowAllAuthenticator, so the auth suite runs `none`; basic (PasswordAuthenticator) is implemented and not yet exercised in CI (ruling R14.7)."
  - "TLS (the driver's rustls-023 feature) is not built (ruling R14.7)."
docs: docs/guides/connectors/cassandra.md

# The `fabric/` workspace: Loams Flow's event fabric and its connectors
# (design §32 D343, FL1 plan Task 1, CN1 plan Task 1). It is separate from the
# engine workspace at the repository root: the Fabric links Iggy and Fluss, and
# `loams-flow` links the connector stack, so neither belongs in the engine's
# default build.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["The Loams Authors"]

[workspace.dependencies]
anyhow = "1"
# Arrow 59, not 60: CN1 Ruling 4 established that `adbc_core` 0.24 constrains
# `arrow-array` to `>=58, <60`, so arrow 60 is out of the workspace. FL2's Tech
# Stack says 59 with the `ffi` feature, which agrees once the constraint is
# applied; `ffi` is what carries the Arrow C stream interface that
# `loams-chdb-sys`'s `chdb_query_arrow`/`chdb_arrow_scan` speak (FL2 Ruling 1,
# Task 1). Apache-2.0.
arrow = { version = "59", features = ["ffi"] }
# The House front reads chDB's `ArrowStream` output message by message, so
# `loams.house.v1`'s `ARROW_IPC` batches hold whole messages and `max_rows`
# cuts a record batch exactly (HS1 Task 8). Only the IPC, array and schema
# crates of the same 59 line, not the `arrow` umbrella: the front needs no CSV,
# JSON or FFI. Apache-2.0.
arrow-array = "59"
# The connector SDK's codecs (CN2 Task 5): offsets and validity buffers for
# nested arrays, and the CSV and NDJSON readers and writers that decode bytes
# straight to a `RecordBatch`. All three were already in fabric/Cargo.lock
# through the `arrow` umbrella. Apache-2.0.
arrow-buffer = "59"
arrow-csv = "59"
arrow-ipc = "59"
arrow-json = "59"
arrow-schema = "59"
# `bindgen` over the pinned `chdb.h` (FL2 Ruling 1). Task 0 measured that a
# hand-written prototype segfaults, so the bindings are generated from the
# header rather than written. 0.72 is the line the plan's Tech Stack names;
# 0.73.2 is out but 0.72.1 is the newest 0.72. Needs `libclang` at build time,
# as `loams-flow-proto` needs `protoc`. BSD-3-Clause, from its Cargo.toml and
# shipped LICENSE — not "MIT OR Apache-2.0", which is the common assumption and
# what an earlier draft of this comment claimed; crates.io reports
# `license = "BSD-3-Clause"` for 0.72.1, read 2026-10-04.
bindgen = "0.72"
# The cheap reference-counted byte buffers `QueryStream::next_chunk` returns,
# so streaming a result does not copy each block (FL2 Task 1). MIT.
bytes = { version = "1", features = ["serde"] }
# The `loams-fabric` command line (HS1 Task 7). 4.6.7 (2026-09-14) is the
# version the engine workspace locks. MIT OR Apache-2.0.
clap = { version = "4.6.7", features = ["derive"] }
# The generated `loams.flow.v1` types and, from CN1 Task 3, the connect-rust
# `FlowService` trait: connect-rust's code generator, as `loams-live-proto` does
# for `loams.live.v1` (R1 plan Task 7). CN1 Task 0 measured 0.9.1 as the version
# that builds alongside `prost` 0.14.
connectrpc-build = "0.9"
# The connect-rust runtime the House front serves `loams.house.v1` with (HS1
# Task 8): the `ConnectRpcService` its HTTP listener hands `/loams.house.v1.*`
# to, and with `client` the generated client the tests call it with. 0.9.1 is
# the version the engine workspace locks; its default features (gzip, zstd,
# json) are the Connect codecs a browser client may ask for. Apache-2.0.
connectrpc = "0.9.1"
# `tower::Service`, through which the House's HTTP listener calls connect-rust's
# `ConnectRpcService` (HS1 Task 8). 0.5.3 is already in the graph through
# connectrpc and is the engine's version. MIT.
tower = { version = "0.5", default-features = false }
# gzip: `build.rs` unpacks the libchdb tarball (FL2 Ruling 2), and Task 2's
# HTTP interface reads and writes gzip request bodies and responses. MIT OR
# Apache-2.0.
flate2 = "1"
# `Stream` for the House's server-streaming RPCs (HS1 Task 8); already in the
# graph through connectrpc. MIT OR Apache-2.0.
futures = "0.3"
indexmap = "2"
# The manifest schema validator (CN1 plan Task 1). The plan's Tech Stack says
# `jsonschema` 0.30+; Task 0 moved it to the current 0.58 line (MIT), whose API
# is unchanged for `validator_for` and `is_valid`. `default-features = false`
# drops the HTTP and file resolvers: `connectors/schema/connector.schema.json`
# has no external `$ref`, so the manifest validator never needs them, and an
# instance config's `$ref` is a repository path `loams-flow` resolves itself
# (D352).
jsonschema = { version = "0.58", default-features = false }
prost = "0.14"
# The `parquet` reader, which `select_one_in_every_format` uses to prove the
# Parquet bytes chDB wrote are a Parquet file and not merely non-empty
# (FL2 Task 1). Same 59 line as `arrow`, for the same reason. Apache-2.0.
parquet = "59"
# sha2 for the digest `build.rs` fails closed on (FL2 Ruling 2). MIT OR
# Apache-2.0.
sha2 = "0.10"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The House classifier (HS1 Task 4, FL2 Rulings 4 and 6): the statements Loams
# owns are parsed with sqlparser's ClickHouseDialect. 0.63.0 (2026-09-13) is HS1
# R0.7's pin. Apache-2.0.
sqlparser = "0.63"
# The House HTTP interface is served by hyper's HTTP/1.1 connection (HS1 Task 3
# review, decision 1; ruling R3.8): hyper owns request framing (Content-Length,
# chunked, HTTP/1.0, pipelining, Expect: 100-continue), with a streaming body of
# the House's own. Locked at hyper 1.11.1 and hyper-util 0.1.20, the versions
# the engine workspace locks (a fresh resolve picked 1.12.0 / 0.1.21, whose age
# could not be checked offline, so the lock was pinned back; fix round 2, N7).
# MIT.
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
# Basic credentials on the House HTTP interface. 0.22.1 is already in this
# workspace's lock. MIT OR Apache-2.0.
base64 = "0.22"
# zstd request and response bodies on the House HTTP interface. HS1 R0.7: 0.13.3
# because it is already in the graph (through parquet). MIT.
zstd = "0.13"
# `wait_end_of_query = 1` spools a result to an unlinked temporary file. MIT OR
# Apache-2.0.
tempfile = "3"
# The raw `fcntl`, `fstat` and `_exit` calls `loams-chdb-sys` makes for the House
# worker (HS1 Task 2 review I3, I4); already in the graph through tokio. MIT OR
# Apache-2.0.
libc = "0.2"
# The `hsw1` frame bodies between the House front and its workers (HS1 Task 2,
# §49 §4.2): a compact, schema-less serde format whose encoding of an enum is
# its variant index, so both ends must be built from the same `Frame`. 1.1.3
# (2025-07-24) is HS1 R0.7's pin and the root workspace's line. MIT OR
# Apache-2.0.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# The front's process control for workers (HS1 Task 2): `posix_spawn` with the
# worker's socket dup'ed to fd 3 and an empty environment, `SIGKILL`, and
# `waitid`/`waitpid` without `unsafe` in Loams code. 0.31.3 (2026-05-11) is
# HS1 R0.7's pin. MIT.
nix = { version = "0.31.3", default-features = false, features = ["process", "signal", "fs"] }
# Landlock for the House worker's sandbox (HS1 Task 6, §49 §13.2): file system,
# TCP and scope rules through the kernel's own ABI, with no `unsafe` in Loams.
# 0.4.7 (2026-07-27) is HS1 R0.7's pin; it knows Landlock ABI 9. MIT OR
# Apache-2.0.
landlock = "0.4.7"
# The House worker's seccomp filter (HS1 Task 6): compiles rules to BPF and
# installs them, safely. 0.5.0 (2025-03-07) is HS1 R0.7's pin. Apache-2.0 OR
# BSD-3-Clause.
seccompiler = "0.5.0"
# The property tests over the `hsw1` frames (HS1 Task 2). The root workspace's
# line. MIT OR Apache-2.0.
proptest = "1"
# serde_yaml is unmaintained; `serde_norway` is the maintained fork CN1 Task 0
# picked (plan "Rulings made during execution" row 1). Apache-2.0/MIT.
serde_norway = "0.9"
# The tar reader `build.rs` unpacks the libchdb release archive with, beside
# `flate2` (FL2 Ruling 2). MIT OR Apache-2.0.
tar = "0.4"
# tokio for the async side of `loams-chdb`: every FFI call an async caller
# makes runs through `tokio::task::spawn_blocking`, as FL2 Task 1's Semantics
# paragraph requires. Only the features the crate uses: the current-thread
# runtime and macros for its tests, `time` for the cancellation test's deadline
# and `sync` for the registry locks. MIT.
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# The `loams-fabric house --config` file (HS1 Task 7): `[house]` and its tables.
# 1.1.6 (2026-09-10) is the line the engine workspace locks. MIT OR Apache-2.0.
toml = "1.1.6"
thiserror = "2"
tracing = "0.1"
# Iceberg table metadata for the House's lake tables (HS1 Task 10, §49 §5): the
# spec types (schemas, partition specs, sort orders, table metadata), the
# metadata builder that applies a commit's updates, and the requirement checks.
# 0.10.1 (2026-08-01) is HS1 R0.7's pin. It brings arrow 58 beside the
# workspace's 59, so only `loams-house-lake` depends on it (R0.3); no default
# features (no storage backend: R1.6). Apache-2.0.
iceberg = { version = "0.10.1", default-features = false }
# The Loams House Rust engine (design §75, plan HE1; D1576): DataFusion 55.2.0
# (2026-10-07, past the 14-day rule on 2026-10-21) on the workspace's Arrow 59,
# with its sqlparser 0.62 used through `datafusion::sql::sqlparser` (R10.3).
# Default features minus `crypto_expressions` (the engine implements
# ClickHouse's hash functions itself); `recursive_protection` guards the
# planner against deeply nested untrusted SQL. Only the `loams-house-{sql,exec,
# iceberg,engine}` crates depend on it; the front never does
# (`engine_crates_stay_apart`). Apache-2.0.
datafusion = { version = "=55.2.0", default-features = false, features = [
    "compression",
    "datetime_expressions",
    "encoding_expressions",
    "nested_expressions",
    "parquet",
    "recursive_protection",
    "regex_expressions",
    "sql",
    "string_expressions",
    "unicode_expressions",
] }
# Iceberg for the Rust engine (D1576; plan HE1 R11.8, R11.9): Loams' fork
# ostrium-labs/iceberg-rust at the merge of fork PR #6 on `loams/row-delta`
# (deletion-vector reads and writes, RowDelta, row lineage; PR head 01243900c
# passed the fork's CI), on Arrow 59.2. Named `iceberg-engine` so it sits beside
# the 0.10.1 above until HE2 Task 60 retires that. No default features (no
# storage backend). Apache-2.0.
iceberg-engine = { package = "iceberg", git = "https://github.com/ostrium-labs/iceberg-rust", rev = "d0788551f83b2ef2018d28d60a859d6283345a3b", default-features = false }
# The House's TLS listener (HS1 Task 20, §49 §14): rustls 0.23 with the ring
# provider, through tokio-rustls 0.26, both already in this lockfile (through
# reqwest and the connectors) and in the engine workspace's. Apache-2.0/ISC/MIT.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# A `--single-node` House's self-signed certificate when none is configured (HS1
# Task 20): the engine workspace's pin and features (loams-pg-control).
# MIT OR Apache-2.0.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# The local catalog of `--single-node` (HS1 Task 10, §49 §17): one SQLite file
# whose metadata pointer is swapped with compare-and-set. 0.40.2 (2026-08-08) is
# HS1 R0.7's pin; `bundled` builds SQLite itself, so no system library is
# needed. MIT.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# The Iceberg REST catalog client (Lakekeeper, HS1 Task 10). 0.13.5 is already
# in the graph through `object_store`; no default features, so it adds no TLS
# stack of its own (an `https` catalog arrives with HS1 Task 20). MIT OR
# Apache-2.0.
reqwest = { version = "0.13", default-features = false }
# `HouseCatalog`'s async methods behind `dyn` (HS1 Task 10). 0.1.92 is already
# in the graph through iceberg. MIT OR Apache-2.0.
async-trait = "0.1"
# The blocking HTTP client `build.rs` fetches the libchdb release with, when
# `LIBCHDB_DIR` is unset (FL2 Ruling 2). 3.x is the current line; the crate is
# the only HTTP client a build may use, so it is deliberately small. MIT OR
# Apache-2.0.
ureq = "3"
# UUID v4 for the query ids `loams-chdb` generates per statement, which Task 2's
# `X-ClickHouse-Query-Id` header echoes and `KILL QUERY` names. MIT OR
# Apache-2.0.
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Mirrors the root workspace's `[profile.dev]` (CN1 plan Task 1: the Fabric
# workspace keeps the engine's debug settings so a `cargo build` in either tree
# produces comparable binaries).
[profile.dev]
debug = "line-tables-only"
